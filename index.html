<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oposición Correos · Plan de estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Plan: app de estudio diaria. Navegación inferior en móvil, lateral en escritorio.
   Tinta azul sobre papel frío; acento cobalto; naranja solo para la racha; matasellos para la cuenta atrás. */
:root{
  --paper:#f2f3f6;--card:#ffffff;--ink:#141a2c;--mut:#5c6378;--line:#dfe2ea;
  --acc:#2645d4;--acc-s:#e5e9fb;--flame:#ea7a12;--flame-s:#fdeedd;
  --ok:#14835a;--ok-s:#e0f3ea;--ko:#c0352b;--ko-s:#fbe8e6;--frost:#2f8fc8;--frost-s:#e2f1fa;
  --h0:#e6e8ee;--h1:#c9d2f6;--h2:#94a6ee;--h3:#5a73e0;--h4:#2645d4;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1220;--card:#181c2d;--ink:#e8eaf2;--mut:#9aa1b6;--line:#2a3045;
  --acc:#8aa2ff;--acc-s:#1f2847;--flame:#ff9a3d;--flame-s:#3a2614;
  --ok:#4fd197;--ok-s:#123326;--ko:#ff8a7e;--ko-s:#3a1a18;--frost:#6cc0f0;--frost-s:#132c3d;
  --h0:#23283b;--h1:#2b3866;--h2:#3e539a;--h3:#5f78d6;--h4:#8aa2ff;color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1220;--card:#181c2d;--ink:#e8eaf2;--mut:#9aa1b6;--line:#2a3045;
  --acc:#8aa2ff;--acc-s:#1f2847;--flame:#ff9a3d;--flame-s:#3a2614;
  --ok:#4fd197;--ok-s:#123326;--ko:#ff8a7e;--ko-s:#3a1a18;--frost:#6cc0f0;--frost-s:#132c3d;
  --h0:#23283b;--h1:#2b3866;--h2:#3e539a;--h3:#5f78d6;--h4:#8aa2ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
/* shell */
.shell{display:flex;min-height:100%}
nav.side{display:none}
main{flex:1;min-width:0;padding:16px 16px 96px;max-width:860px;margin:0 auto;width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--mut);font-size:11.5px;font-weight:600;padding:4px 0;border-radius:10px}
nav a svg{width:23px;height:23px}
nav a.on{color:var(--acc)}
@media (min-width:900px){
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:4px;width:232px;flex:none;position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:var(--card)}
  nav.side .brand{font-family:var(--display);font-weight:750;font-size:18px;padding:4px 10px 18px;line-height:1.2}
  nav.side .brand small{display:block;font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--mut)}
  nav.side a{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px}
  nav.side a.on{background:var(--acc-s)}
  nav.side .sidefoot{margin-top:auto;font-size:12.5px;color:var(--mut);padding:10px}
  main{padding:28px 32px 60px}
}
/* generic */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.top h1{font-size:26px;margin:0;line-height:1.15}
.top .sub{color:var(--mut);font-size:14px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.sec{font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700;margin:22px 2px 8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--acc);color:#fff;border:0;border-radius:11px;padding:10px 16px;font-weight:650;font-size:15px;cursor:pointer;text-decoration:none;min-height:42px}
:root[data-theme="dark"] .btn{color:#0d1430}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0d1430}}
.btn.soft{background:var(--acc-s);color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:14px;border-radius:9px}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--mut)}
.small{font-size:13.5px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--acc-s);color:var(--acc);white-space:nowrap}
.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.ko{background:var(--ko-s);color:var(--ko)}.pill.fl{background:var(--flame-s);color:var(--flame)}.pill.fr{background:var(--frost-s);color:var(--frost)}
.bar{height:8px;background:var(--h0);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.bar.ok i{background:var(--ok)}
input[type=date],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:90px;font-size:13px}
/* hoy hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.stamp{width:118px;height:118px;border-radius:50%;border:2.5px dashed var(--acc);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-7deg);color:var(--acc);position:relative;flex:none}
.stamp::after{content:"";position:absolute;inset:7px;border-radius:50%;border:1.5px solid var(--acc);opacity:.5}
.stamp b{font-family:var(--display);font-size:38px;line-height:1}
.stamp span{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--paper);border-radius:12px;padding:10px 10px 9px}
.kpi b{display:block;font-family:var(--display);font-size:24px;line-height:1.1}
.kpi span{font-size:12px;color:var(--mut);font-weight:600}
.kpi.fl b{color:var(--flame)}
.lvl{margin-top:12px}
.lvl .row{justify-content:space-between;font-size:13px;margin-bottom:5px}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;text-align:center;font-size:11px;color:var(--mut);font-weight:600}
.week i{display:block;height:28px;border-radius:8px;background:var(--h0);margin-top:3px;display:grid;place-items:center;font-style:normal;font-size:13px}
.week i.done{background:var(--flame);color:#fff}
.week i.frz{background:var(--frost);color:#fff}
.week i.today{outline:2px solid var(--acc);outline-offset:1px}
/* tasks */
.mission h2{font-size:20px;margin:2px 0 2px}
.phase{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.ph0,.ph1{background:var(--acc-s);color:var(--acc)}.ph2{background:var(--ok-s);color:var(--ok)}.ph3{background:var(--flame-s);color:var(--flame)}.ph4{background:var(--frost-s);color:var(--frost)}
.task{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.task:first-of-type{border-top:0}
.chk{flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chk svg{width:16px;height:16px}
.task .tx{flex:1;min-width:0}
.task .tx b{display:block;font-weight:650;font-size:15px;line-height:1.3}
.task .tx span{font-size:13px;color:var(--mut)}
.task.done .tx b{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1.5px}
.ring{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--h0) 0);display:grid;place-items:center;flex:none}
.ring b{width:42px;height:42px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:13px;font-weight:700}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:left;cursor:pointer}
.qa b{display:block;font-size:14px;font-weight:650;line-height:1.25}
.qa span{font-size:12px;color:var(--mut)}
@media (max-width:420px){.quick{grid-template-columns:1fr}.hero{grid-template-columns:1fr;justify-items:center}.hero .kpis{width:100%}}
.banner{border:1.5px solid var(--acc);background:var(--acc-s);border-radius:var(--r);padding:12px 14px;font-size:14.5px}
.banner .row{margin-top:8px}
/* plan */
.legend{display:flex;gap:8px;flex-wrap:wrap}
.wk{margin-top:14px}
.wk h3{font-size:13px;color:var(--mut);font-family:var(--body);font-weight:700;margin:0 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.day{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;border-left-width:4px;cursor:pointer;width:100%;text-align:left}
.day.p1,.day.p0{border-left-color:var(--acc)}.day.p2{border-left-color:var(--ok)}.day.p3{border-left-color:var(--flame)}.day.p4{border-left-color:var(--frost)}
.day.today{box-shadow:0 0 0 2px var(--acc)}
.day .dt{flex:none;width:44px;text-align:center}
.day .dt b{display:block;font-family:var(--display);font-size:20px;line-height:1}
.day .dt span{font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase}
.day .tx{flex:1;min-width:0}
.day .tx b{font-size:14.5px;font-weight:650}
.dots{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:3px;background:var(--h0)}
.dots i.d{background:var(--ok)}.dots i.late{background:var(--ko)}
.day .st{flex:none;align-self:center}
.dayx{padding:4px 12px 10px 12px;margin:-4px 0 8px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px}
/* temario */
.ses{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.lt{flex:none;width:40px;height:40px;border-radius:10px;background:var(--acc-s);color:var(--acc);display:grid;place-items:center;font-family:var(--display);font-weight:750;font-size:19px}
.ses .tx{flex:1;min-width:0}
.ses .tx b{display:block;font-size:14.5px;font-weight:650;line-height:1.3}
.ses .tx span{font-size:12.5px;color:var(--mut)}
.ses .bar{margin-top:6px;height:5px}
.segs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px;position:sticky;top:8px;z-index:5}
.segs a{flex:1;text-align:center;padding:8px;border-radius:8px;font-weight:650;font-size:14.5px;color:var(--mut);text-decoration:none}
.segs a.on{background:var(--acc-s);color:var(--acc)}
.toc{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.toc button{flex:none;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.md{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:6px 20px 18px;overflow-wrap:anywhere;line-height:1.6}
.md>*{max-width:68ch}
.md h2{font-size:20px;margin:24px 0 8px;padding-top:12px;border-top:1px solid var(--line)}
.md h2:first-child{border-top:0}
.md h3{font-size:16.5px;margin:18px 0 6px;color:var(--acc)}
.md ul,.md ol{padding-left:20px}.md li{margin:3px 0}
.md table{border-collapse:collapse;font-size:13.5px;display:block;overflow-x:auto;margin:10px 0;max-width:100%}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;min-width:84px}
.md th{background:var(--acc-s)}
.md strong{font-weight:700}
.clave{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.clave b{flex:none;font-family:var(--display);color:var(--acc);font-size:18px;width:24px}
.clave div{font-size:15px}
/* quiz */
.qz{max-width:680px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead button.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:8px;font-weight:600}
.qcard h2{font-family:var(--body);font-size:18px;font-weight:650;margin:0 0 16px;line-height:1.4;letter-spacing:0}
.opt{display:flex;gap:12px;width:100%;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:8px;font-size:15.5px;cursor:pointer;align-items:flex-start}
.opt .k{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--ok-s)}.opt.ok .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.ko{border-color:var(--ko);background:var(--ko-s)}.opt.ko .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.exp{border-radius:12px;padding:11px 13px;font-size:14.5px;margin:6px 0 12px}
.exp.ok{background:var(--ok-s)}.exp.ko{background:var(--ko-s)}
.exp b{display:block;margin-bottom:2px}
.confirm{background:var(--ko-s);border-radius:12px;padding:12px;margin-bottom:12px;font-size:14.5px}
.score{text-align:center}
.score .big{font-family:var(--display);font-size:56px;font-weight:750;line-height:1}
.gain{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.rev .it{border-top:1px solid var(--line);padding:10px 0;font-size:14px;text-align:left}
.rev .it b{display:block;font-weight:650;margin-bottom:3px}
.c-ok{color:var(--ok)}.c-ko{color:var(--ko)}
.sel{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0 12px}
@media (max-width:480px){.sel{grid-template-columns:repeat(4,1fr)}}
.sel button{border:1.5px solid var(--line);border-radius:9px;padding:8px 0;font-weight:700;cursor:pointer;background:var(--card)}
.sel button.on{border-color:var(--acc);background:var(--acc-s);color:var(--acc)}
.letters{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
@media (max-width:480px){.letters{grid-template-columns:repeat(4,1fr)}}
.letters button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0 6px;cursor:pointer;text-align:center}
.letters b{display:block;font-family:var(--display);font-size:18px}
.letters span{font-size:11.5px;color:var(--mut);font-weight:600}
.letters .good{border-color:var(--ok)}.letters .good span{color:var(--ok)}
/* progreso */
.heat{display:flex;gap:3px;overflow-x:auto;padding-bottom:4px}
.heat .col{display:flex;flex-direction:column;gap:3px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--h0);display:block}
.heat i.l1{background:var(--h1)}.heat i.l2{background:var(--h2)}.heat i.l3{background:var(--h3)}.heat i.l4{background:var(--h4)}
.heat i.cm{box-shadow:inset 0 0 0 2px var(--flame)}
.heat i.fz{background:var(--frost)}
.heat i.ex{background:var(--ko)}
.heat i.na{background:transparent}
.heat i.td{outline:2px solid var(--ink);outline-offset:0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card)}
.badge b{display:block;font-size:14px;font-weight:700}
.badge span{font-size:12px;color:var(--mut)}
.badge .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;margin-bottom:6px;background:var(--flame-s);color:var(--flame);font-weight:800;font-size:14px}
.badge.lock{opacity:.5}.badge.lock .ic{background:var(--h0);color:var(--mut)}
.mast{display:grid;grid-template-columns:28px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px}
.mast b{font-family:var(--display)}
.stat b{font-family:var(--display);font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--mut);font-weight:600}
/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:50;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px);pointer-events:none}
@media (min-width:900px){#toasts{bottom:24px}}
.toast{background:var(--ink);color:var(--paper);border-radius:12px;padding:11px 14px;font-size:14.5px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
.ans{border-radius:10px;padding:8px 11px;font-size:14.5px;margin-top:6px}
.ans span{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:1px}
.ans.ok{background:var(--ok-s)}.ans.ok span{color:var(--ok)}
.ans.ko{background:var(--ko-s)}.ans.ko span{color:var(--ko)}
.hist{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 6px;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.hist:first-child{border-top:0}
.hist:hover{background:var(--paper)}
.noteform{background:var(--acc-s);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.taskwrap{border-top:1px solid var(--line)}.taskwrap .task{border-top:0}
.sync{font-size:12.5px;color:var(--mut)}
</style>
</head>
<body>
<div class="shell">
  <nav class="side" id="side" aria-label="Menú principal"></nav>
  <main id="app"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Menú principal"></nav>
<div id="toasts" aria-live="polite"></div>

<script>
const DATA = [{"letra": "A", "titulo": "Productos y servicios postales: comunicación, financieros, publicidad, marketing directo, libros y publicaciones periódicas", "paginas": "1-106", "resumen": "## 1. Introducción\n- **Correos** presta el **SPU** en España, regulado por la **Ley 43/2010, de 30 de diciembre** (art. 1.3: envíos postales y **servicios de giro**).\n- **1999**: *Manual de productos y procedimientos* con **5 líneas**; después pasaron a **6** (se añade la telegráfica).\n\n## 2. Tablas de pesos y medidas (datos clave)\n\n| Producto | Peso máx. nacional | Peso máx. internacional |\n|---|---|---|\n| Normalizados / tarjeta postal | 20 g | 20 g |\n| Carta, certificada, libros, publicaciones | 2 kg | 2 kg |\n| Carta urgente | 500 g | — |\n| Certificada urgente, notificación, Publicorreo Premium | 2 kg | — |\n| Publibuzón, Publicorreo Plus | 100 g | — |\n| Publicorreo Óptimo | 800 g | — |\n| Cecogramas | 7 kg | 7 kg |\n| Valijas | 20 kg | — |\n\n- **Normalizada / tarjeta postal**: máx. **23,5 x 12 cm**, mín. **14 x 9 cm**, espesor **5 mm**.\n- **Medidas generales de carta**: sobre/caja **L + A + A = 90 cm** (mayor ≤ 60 cm); rollo **L + 2D = 104 cm** (mayor ≤ 90 cm). Mínimas **14 x 9 cm**; rollo **L + 2D = 17 cm**. Si es menor: **etiqueta de 10 x 7 cm**.\n- Desde el **1/1/2009**, **Andorra** es ámbito nacional (salvo **notificaciones**) y **Gibraltar** va en la **Zona 1**.\n\n## 3. Línea de comunicación\n**Zonas internacionales**: **Zona 1** Europa con Groenlandia (sin Albania, Armenia, Bosnia, Chipre, Georgia, Malta, Moldavia ni Rusia); **Zona 2** resto; **Zona 3** EE. UU., Canadá, Japón, **Rusia**, Australia y Nueva Zelanda.\n\n### 3.1.1. Carta ordinaria\n- Definida en el art. 13.2 A del **RD 1829/1999**. **SPU hasta 2 kg**; entrega en domicilio.\n- Sobre ni transparente ni **azul claro**; sello en el **ángulo superior derecho**.\n- **CN22 / CN23** (CN23 si supera **300 DEG**): envíos sin documentos de particulares a Canarias, Ceuta y Melilla, internacionales g, 189 x 250 mm, **seguro de 100 € no ampliable**, PEE 5.\n\n### 3.1.6. Carta urgente\n- Va al **buzón** (sin firma); etiqueta roja **arriba a la izquierda**. Las urgentes **internacionales** se eliminan el **01/01/2020**.\n- Nacional, **sin contrato**, **500 g**, espesor **10 mm**. Plazo: **1 día hábil** entre grandes poblaciones.\n\n### 3.1.7. Carta certificada urgente\n- **90 % en 1 día hábil**; bajo firma, M-4 y 15 días en lista. **2 kg**. Garantía tarifa x 10.\n- **Reclamación: 3 días a 4 meses**.\n\n### 3.1.8. Valijas\n- Solo **con contrato**; correo interno de empresas. **Unitoque** (entrega y recogida a la vez) y **bitoque**.\n- **20 kg**; **1 día hábil**. Precintos **amarillos** central → delegaciones y **rojos** delegaciones → central; previsión de **6 meses**. **4 zonas tarifarias**.\n- Internas de Correos: precinto **verde** hacia Sede Central, **azul** desde ella; Servicios Rurales con bolsas **rojas**.\n\n### 3.1.9. Cecograma\n- Envíos de personas ciegas con institutos reconocidos. **7 kg**. **Exento de franqueo** (art. 34.3 Ley 43/2010).\n\n### 3.1.10. Notificaciones\n- Solo entidades **administrativas y judiciales**. Dos intentos; luego M-4 y **7 días naturales** en lista.\n- Normativa: RD 1829/1999, **LOPJ 6/1985** y **Ley 39/2015**.\n- **Art. 42.2 Ley 39/2015**: recoge cualquier **mayor de 14 años**; segundo intento **en 3 días**, en otro turno y con **3 horas** de diferencia.\n- **Judiciales** (NC, NJ, NF): **60 minutos** de diferencia.\n- Ámbito **solo España (sin Andorra)**; 2 kg. PEE 5, 10 y 15 Postal.\n\n### 3.1.11. Envíos con tratamiento SICER\n- **Sistema de Información y Control de Envíos Registrados**; remesas masivas en **Centros de Admisión Masiva**.\n- Código de **23 caracteres**: 2 producto + 8 cliente + 12 envío + 1 control.\n- **C1**: 1 intento y 15 días. **C2**: 2 intentos y 7 días. **C5**: 2 intentos y 15 días. **1-0-B (EL)**: 1 intento de tarde, sin lista. **TB-2**: BBVA. **OB**: ordinario.\n- **NT, NS, NE, N3, 90**: 2 intentos y 7 días en lista; **ND** sin lista (buzón). **90** = **Agencia Tributaria** (no admite reenvíos ni el código 07). **N3**: tercer intento de tarde por la USE.\n\n### 3.1.12. Valor Filatélico\n- Se entrega como certificado (2 intentos y 15 días en lista). Admisión en **Madrid**; siglas **VF**.\n\n## 3.2. Servicios de telecomunicaciones\n\n### 3.2.1. Fax y burofax\n- **Fax**: nacional, inmediato. **Burofax**: envío urgente con entrega bajo firma y **validez legal**; la unidad gestora central está en **Madrid**. Un solo destinatario. El cliente no rellena impreso; firma la **carátula**.\n- Festivo en destino: \"**Advertido del posible retraso**\".\n- Dos intentos y **30 días naturales** en lista.\n\n- **Básico Plus**: remesas masivas con contrato, reparto por URO en D+1 (ficheros antes de las **21 h**). **Premium / Premium Plus / Online / Digital**: D+0 si hay USE y se admite antes de las **13:00** (salvo julio, agosto y septiembre). **Premium Digital**: tercer intento digital por SMS a los 7 días.\n- Custodia: **60 meses** incluidos, ampliable a **120 meses**. Copia certificada de un fax: solo en la imposición.\n- Mi Oficina: PDF hasta **100 páginas y 15 Mb** o fichero .txt con hasta **150 envíos**; app: **2 Mb**.\n- Garantía: devolución de la tarifa sin adicionales. Reclamación: **1 día a 6 meses**.\n\n### 3.2.2. Telegrama\n- Validez legal, entrega bajo firma, un destinatario. **Telebén**: admitido por teléfono (915 197 197 o 915 222 000).\n- Internacional: régimen **continental** (Europa, Turquía, Argelia, Egipto, Israel, Jordania, Líbano, Libia, Marruecos, Siria, Túnez) e **intercontinental**. Actualmente **no se presta** el internacional.\n- Plazo: D+0 si se admite antes de las **13:00** y hay USE; si no, D+1. Lista **30 días**.\n- Indicaciones: **SVH** (seguridad de la vida humana, prioridad absoluta), **ETAT** (Estado), **RCT** (Convenio de Ginebra), **OBS** (meteorología), **PC** (acuse de recibo).\n- Tarifa nacional: importe fijo + importe por cada **50 palabras** o fracción. Continental: por palabra sin mínimo + fijo; intercontinental: mínimo **7 palabras**. Unidad tasable internacional: **10 caracteres**.\n- Impreso **TG-1**. Reclamación nacional **2 días a 6 meses**; internacional **3 días a 4 meses**.\n- Códigos: OD, OL, C1, IO, **TS** (interior tasado), TC, TI.\n\n### 3.2.3. Télex\n- Servicio en desuso; Correos ofrece un **emulador** por software. Código de abonado: **5 cifras y 6 letras**. Transmisión inmediata.\n\n## 4. Línea financiera\n- Incluye envío y recepción de dinero, tarjetas, **Correos Pay** (antes **T€nvío**) y acuerdos bancarios.\n- El giro es servicio **complementario** (disp. final 3.ª Ley 43/2010), de interés económico general, sujeto a la **Ley 16/2009** de servicios de pago. **Exento de IVA**. Se aplica Prevención de Blanqueo de Capitales.\n\n### 4.1. Giro nacional\n- Modalidades: **inmediato** (metálico, disponible al instante), **ordinario** a domicilio (destinatario registrado en PBC), **OIC**, **envío a prisiones** (vía Correos Pay), **Correos Pay**, giro oficial.\n- Plazos: inmediato **5-15 minutos** con localizador de **7 caracteres** de **SEDI**; ordinario **3-5 días hábiles**; OIC/prisiones **3 días**.\n- En lista hasta el **día 25 del mes siguiente** al aviso.\n\n| Límite | Importe |\n|---|---|\n| OIC | 2499,99 € |\n| Ordinario domicilio/apartado | 499,99 € en metálico |\n| Inmediato | 999,99 € (incluidos derechos) |\n| Mínimo | 0,01 € |\n\n- Tarifas 2022: ordinario **12,10 € + 2 %**; OIC **3,05 € + 2 %**; inmediato **4,00 € + 2 %**.\n- SMS de comunicación privada de **140 caracteres** gratuito. Modificaciones mediante telegrama **TS**.\n- Reclamación: **10 días a 2 años**.\n\n### 4.2. Giro internacional (IFS)\n- Basado en **International Financial System** de la UPU. Código de seguridad de **6 a 10 caracteres**.\n- Grupos: 1 Portugal; 2 R. Dominicana, Argentina, Ecuador, Marruecos, Perú, Colombia, Paraguay (**tarifa plana 4,75 €**); 3 Uruguay y Chile; 4 Cuba; 5 Moldavia.\n- Disponible en **15 minutos**; validez 2 años, pero si no se cobra en **30 días** se bloquea y vuelve al remitente.\n- Máximo **999,99 €** por persona y día. Reclamación **3 días a 6 meses**.\n\n### 4.3. Western Union\n- Mayores de **18 años**, más de **190 países**, código **MTCN de 10 cifras**. No está en el SPU (no rige el límite de 2499,99 €).\n- **Will Call** (minutos), **Next Day** (día siguiente, más barato), **Direct to Bank** (máx. 3 días laborables), **WU Air** (app).\n- En el sistema **90 días**. Máximo **3000 €** por persona y día o trimestre (China y Nigeria 500 €, Colombia 750 €). Mensaje de hasta 10 palabras. España no admite pregunta de verificación. Tarjeta **My WU**.\n\n### 4.4. Correos Cash\n- Para clientes de varios bancos: ingresos (giro **OIC**), retiradas (**giro inmediato**) y cheques (nominativo y barrado). Protocolo de 2022 con **AEB, CECA y Unacc**.\n\n### 4.5. Tarjeta Correos Prepago Mastercard\n- Mayores de edad, residencia en zona **SEPA**, al instante en oficina; no nominativa (\"NO NECESITA IDENTIFICACIÓN\").\n- Emisión **6 €**. Recarga mínima **10 €**; efectivo máx. **999,99 €** por transacción, **1000 €/día** y **5000 €/mes**, saldo máx. 100.000 €; máx. **5 recargas al día**; IBAN virtual 5000 €.\n- Comisiones: **1,5 €** recarga en oficina; 2 € web/app; 1 € retirada en oficina; inactividad 1 €/mes tras 365 días.\n- Reintegro en oficina: **300 € por operación, 600 € al día**. Cajeros: 600 €/día, 1000 €/mes, 12.000 €/año.\n- Desistimiento de **14 días**. Incidencias vía **PoST**. Medidas 85,60 x 53,98 mm (ISO/IEC 7810 ID-1).\n- IBAN: cuota **2 €/mes**, transferencia de salida máx. **7500 €**. Hasta **3 tarjetas adicionales**; gestionar hasta 4 tarjetas por perfil.\n- **Ayudas Sociales** (p. ej., Bono Cultural Joven de 400 €).\n\n### 4.6. Tarjeta Más Cerca\n- Fidelización **gratuita**, nacional. Hasta **4 adicionales**; la del titular termina en múltiplo de 5.\n\n### 4.7. Tarjeta Correos Regalo\n- Prohibida a menores de 18. **Una única recarga de 20 a 150 €** (incluye **3 €** de coste). Validez **2 años**. No permite retirar efectivo.\n\n### 4.8. Correos Pay\n- Gestión de cobros para empresas y organismos; Correos es mero transmisor. Abono en **72 horas hábiles**.\n- **Básico** (2,95 €): empresas y autónomos, fichero txt, pago en metálico. **Premium** (1,95 €): ayuntamientos y organismos, pago con tarjeta, código de barras leído con pistola, cuadernos 57, 60 y 65.\n- El resguardo **no justifica la cancelación de la deuda**. Alta en IRIS: Gestión / Correos Pay / Alta de cliente.\n\n## 5. Soluciones de Marketing Directo\n- Antes Correos Directo o línea económica. **Publicidad directa** (RD 1829/1999): mensajes análogos, **más de 500 destinatarios**, sobre abierto y \"**P. D.**\" en la cubierta.\n\n### 5.1. Franqueo en destino (FD)\n- El contratante paga las respuestas; se reciben en un **apartado** específico. Cajetín con \"España\", cornamusa, \"Franqueo en destino\" y \"FD\" (52 x 22 mm o 19,8 x 22 mm). Barra azul **Pantone-541 C** o negra; peso máx. **2 kg**; solo con contrato. Llaveros con clave: se cobran como carta no normalizada.\n\n### 5.2. CCRI\n- Internacional, con contrato; máximo **250 g** (2 kg en algunos países). También **IBRS**. \"NO FRANQUEAR / NE PAS AFFRANCHIR\", \"RESPUESTA PAGADA\", \"POR AVIÓN\".\n\n### 5.3-5.7. Publicorreo y Publibuzón\n\n| Producto | Peso | Mínimo | Plazo | Notas |\n|---|---|---|---|---|\n| **Publibuzón** | 100 g | 100 ejemplares (paquetes de 25/50/100) | 2-6 días (D+4 en 90 %) | Sin dirección; relación por triplicado; no rollo |\n| **Publicorreo Internacional** | 100 g | 100 ejemplares | Europa 3-8 días | \"IMPRIMÉ\"; máx. 24,5 x 16,5 cm y 5 mm; antes Publicorreo Estándar (2020) |\n| **Publicorreo Premium** | 2 kg | 100 ejemplares | 2-4 días (D+4 en 90 %) | Mailing creativo; 19 tramos; zonas A y B |\n| **Publicorreo Óptimo** | 800 g | 100 ejemplares | 2-4 días | Automatizable; 15 tramos; no admite etiqueta 10 x 7 |\n| **Publicorreo Plus** | 100 g | 1000 destinatarios | 2-4 días | Con contrato; packs de 1000 a 10.000; B2B, B2C y fidelización |\n\n- **Zona A**: capitales, envíos locales y poblaciones de más de **50.000 habitantes**.\n\n### 5.8. Correos MKD\n- Plataforma de email/SMS masivo, prepago, **12 meses** para consumir el pack en máximo 3 envíos. Email: packs 5000-30.000; SMS: 1000-20.000.\n\n### 5.9. Correos Add, Data y Target\n- **Add**: normalización de direcciones (España y Portugal); respuesta 2/3/5 días. Incluye la **PRI** (recogida de información con la PDA del cartero), con capturas **Push** o **Pull**.\n- **Data**: alquiler de bases de datos; contratación anual.\n- **Target**: segmentación, geomarketing y calidad de datos; tarifa **por hora**; respuesta 2/4/7 días.\n\n### 5.10. Correos Sampling\n- Muestras gratuitas en buzón; influencers con más de **10.000 seguidores**.\n\n### 5.11. Publi City\n- Alquiler de la publicidad de los **carritos de reparto**. Carteles con **5 días hábiles** de antelación; reserva **10 días** antes. Mínimo **1 semana** (empezando en lunes). Cancelación: **20 %** con más de 30 días, **100 %** con menos, **0 %** el mismo día. Soporte de 32 x 43 cm; cartel **42 x 29,7 cm**, más de 180 g/m².\n\n## 6. Libros y publicaciones periódicas\n\n### 6.1. Libros\n- Remitidos por editoriales, distribuidores, librerías o centros de enseñanza; sin publicidad salvo la cubierta. Sin contrato ni mínimo.\n- Entrega a domicilio **hasta 500 g**; de 500 g a 2 kg, en oficina. Inscripción \"**Libro**\".\n- Código **OR** desde 2020: **23 dígitos**, Code 128 A o B, con **10 mm** de margen.\n- Plazo nacional 2-6 días (**95 % en 6 días**); Europa 6-8 días. **9 tramos** de peso.\n\n### 6.2. Programa Postlibris\n- **25 %** de bonificación en tarifa Libros nacional y **30 %** en Paq Estándar de hasta 20 kg con entrega en oficina.\n- Requiere **Tarjeta Más Cerca** y alta en epígrafes IAE del sector (modelo **036/037**). Solo admisión en oficina.\n\n### 6.3. Acuerdo con el Ministerio de Cultura y Deporte\n- Tarifa única para envíos de hasta **2 kg** con Paq Premium y Paq Retorno. Librería: al menos el **60 %** de su facturación en libros, **25 establecimientos o menos**, con tienda física. Excluye librerías online, de segunda mano, papelerías y editoriales.\n\n### 6.4. Publicaciones periódicas\n- Contenido variado; se excluyen monográficos, catálogos, guías y anuncios.\n- Requisitos: tirada mínima de **1000 ejemplares/año**, al menos **trimestral**, editada en España o la UE, paginada, con fecha y número, publicidad máx. **2/3** (máx. **20 %** de un mismo anunciante), depósito legal, remesas mínimas de **50**.\n- Buzón **hasta 800 g**; más peso, en oficina. Peso máx. 2 kg; plazo nacional **4 días en el 90 %**.\n- Sachettes: máx. **3** por publicación, **50 g** y **5 mm**.\n- **ORDCP**: \"ORDCP\" + CP + control; grado de clasificación **G2**.\n- Partidos políticos y sindicatos: **40 %** de bonificación si pesan **100 g** o menos, solo nacional.\n\n## Anexo I. Normalización\n- Normalizables: carta, tarjeta postal, carta certificada, certificada urgente, notificación, Publicorreo y Publibuzón.\n- Requisitos: rectangular; sobre blanco o claro (**no azul**); caracteres de **2 a 8 mm**; dimensiones de **14 x 9 a 23,5 x 12 cm**; espesor **5 mm**; peso **20 g**.\n\n## Claves para el examen\n- Carta, carta certificada, notificación, libros y publicaciones: **2 kg**; carta urgente **500 g**; cecograma **7 kg**; valija **20 kg**; normalizada **20 g**.\n- Plazo de carta: **93 % en D+3 y 99 % en D+5**; corte a las **14:30 / 16:00**.\n- Certificada: **15 días** en lista; reclamación nacional **7 días a 4 meses**; garantía **tarifa x 10** desde el 27/06/2021.\n- Valor declarado SPU hasta **3000 €**; reembolso máx. **2499,99 €** (OIC) o **499,99 €**.\n- Notificaciones: **7 días** en lista; segundo intento en **3 días** con **3 h** de diferencia (judiciales **60 min**); sin Andorra.\n- SICER: código de **23 caracteres**; C1 1-15, C2 2-7, C5 2-15; **90** = Agencia Tributaria.\n- Burofax y telegrama: **30 días** en lista; D+0 antes de las **13:00** con USE; custodia **60 meses** (hasta 120).\n- Giros: inmediato **999,99 €**, ordinario **499,99 €**, OIC **2499,99 €**; reclamación **10 días a 2 años**.\n- Western Union: **MTCN de 10 cifras**, **3000 €**, **90 días**; IFS: código de **6 a 10 caracteres**, **30 días**.\n- Prepago: emisión **6 €**, reintegro **300 €/operación y 600 €/día**; Regalo: **20-150 €**, coste 3 €, 2 años.\n- Publicidad directa: más de **500 destinatarios**; Publibuzón/Publicorreo **100 ejemplares**; Publicorreo Plus **1000**.\n- Postlibris **25 %**/**30 %**; publicaciones periódicas: **1000 ejemplares**, trimestral, remesas de **50**; partidos y sindicatos **40 %**.", "preguntas": [{"p": "¿Qué plazo de entrega se fija para el 93 % de las cartas ordinarias de ámbito nacional?", "o": ["Dos días hábiles (D+2)", "Tres días hábiles (D+3)", "Cinco días hábiles (D+5)", "Cuatro días hábiles (D+4)"], "c": 1, "e": "El 93 % de las cartas nacionales se entrega en D+3 y el 99 % en D+5.", "pag": 14}, {"p": "¿Hasta qué importe puede contratarse el valor declarado SPU en una carta certificada nacional?", "o": ["2499,99 euros", "1000 euros", "6000 euros", "3000 euros"], "c": 3, "e": "Entre los servicios adicionales nacionales figura el valor declarado SPU hasta 3000 euros.", "pag": 20}, {"p": "¿Cuál es el plazo para reclamar una carta certificada de ámbito nacional, contado desde su admisión?", "o": ["Mínimo 7 días naturales y máximo 4 meses", "Mínimo 15 días naturales y máximo 6 meses", "Mínimo 3 días naturales y máximo 4 meses", "Mínimo 10 días naturales y máximo 2 años"], "c": 0, "e": "En la carta certificada nacional se puede reclamar de 7 días naturales a 4 meses (internacional: de 15 días a 6 meses).", "pag": 22}, {"p": "La Carta Certificada Estándar de tarifa plana admite un peso máximo de:", "o": ["100 g, en un sobre de 189 x 250 mm", "20 g, en un sobre de 162 x 229 mm", "50 g, en un sobre de 162 x 229 mm", "500 g, en un sobre de 229 x 324 mm"], "c": 2, "e": "La Carta Certificada Estándar admite hasta 50 g en un sobre de 162 x 229 mm y circula con el código CD.", "pag": 23}, {"p": "En la Carta Certificada Prepagada Premium, el seguro (valor declarado) incluido es de:", "o": ["100 €, ampliable hasta 3000 €", "300 €, no ampliable", "100 €, no ampliable", "30 €, ampliable hasta 1000 €"], "c": 2, "e": "Incluye un seguro de 100 € que no se puede ampliar; en la Premium de tarifa plana, en cambio, sí se puede ampliar a 3000 €.", "pag": 24}, {"p": "¿Cuál es el peso máximo de la carta urgente?", "o": ["500 g", "2 kg", "1 kg", "100 g"], "c": 0, "e": "La carta urgente admite un peso de hasta 500 g.", "pag": 25}, {"p": "En el servicio de valijas, ¿de qué color son los precintos de las valijas que se envían desde la central a las delegaciones?", "o": ["Rojos", "Verdes", "Azules", "Amarillos"], "c": 3, "e": "Los precintos amarillos son para las valijas que van de la central a las delegaciones; los rojos, para las que van de las delegaciones a la central.", "pag": 29}, {"p": "¿Cuál es el peso máximo de un cecograma?", "o": ["2 kg", "7 kg", "5 kg", "10 kg"], "c": 1, "e": "El cecograma admite hasta 7 kg y está exento de franqueo.", "pag": 31}, {"p": "Según el art. 42.2 de la Ley 39/2015, el segundo intento de entrega de una notificación administrativa debe hacerse:", "o": ["En los tres días siguientes y con al menos tres horas de diferencia", "Al día siguiente y con al menos una hora de diferencia", "En los cinco días siguientes y en el mismo turno", "En los tres días siguientes y con 60 minutos de diferencia"], "c": 0, "e": "La ley exige repetir el intento en los tres días siguientes, en hora distinta y con al menos tres horas de diferencia entre intentos.", "pag": 32}, {"p": "El código de barras de los envíos con tratamiento SICER tiene:", "o": ["13 caracteres", "20 caracteres", "23 caracteres", "25 caracteres"], "c": 2, "e": "Tiene 23 caracteres: 2 de producto, 8 de cliente, 12 de identificación del envío y 1 de control.", "pag": 39}, {"p": "El certificado SICER C5 ofrece:", "o": ["Un intento de entrega y 15 días naturales en lista", "Dos intentos de entrega y 15 días naturales en lista", "Dos intentos de entrega y 7 días naturales en lista", "Un intento en turno de tarde y sin permanencia en lista"], "c": 1, "e": "C5 es el certificado informatizado 2-15: dos intentos a domicilio y 15 días naturales en lista.", "pag": 35}, {"p": "¿Durante cuántos días naturales permanece un burofax en lista?", "o": ["15 días", "7 días", "60 días", "30 días"], "c": 3, "e": "El plazo de permanencia en lista de un burofax es de 30 días naturales.", "pag": 43}, {"p": "¿Qué indicación de servicio lleva el telegrama relativo a la seguridad de la vida humana, que tiene prioridad absoluta?", "o": ["ETAT", "RCT", "OBS", "SVH"], "c": 3, "e": "SVH se usa para la seguridad de la vida humana y tiene prioridad absoluta de transmisión y entrega.", "pag": 47}, {"p": "¿Cuál es el límite del giro inmediato en oficina, incluidos el importe y sus derechos?", "o": ["999,99 € en metálico", "499,99 € en metálico", "2499,99 €", "3000 €"], "c": 0, "e": "El giro inmediato tiene un límite de 999,99 € en metálico, incluidos el importe y los derechos.", "pag": 53}, {"p": "¿Cuál es el plazo para reclamar un giro nacional, contado desde su admisión?", "o": ["De 3 días naturales a 6 meses", "De 10 días naturales a 2 años", "De 7 días naturales a 4 meses", "De 15 días naturales a 1 año"], "c": 1, "e": "Para reclamar un giro nacional hay un mínimo de 10 días naturales y un máximo de dos años.", "pag": 54}, {"p": "En el giro IFS, si el destinatario no cobra el dinero en 30 días naturales:", "o": ["Se ingresa en la cuenta del destinatario", "Pasa a lista hasta el día 25 del mes siguiente", "Se bloquea y se devuelve al remitente", "Se amplía de oficio el plazo a 90 días"], "c": 2, "e": "Aunque su validez es de dos años, si no se cobra en 30 días naturales se bloquea y vuelve al remitente.", "pag": 55}, {"p": "¿Cuántas cifras tiene el código MTCN de Western Union?", "o": ["Diez", "Siete", "Ocho", "Doce"], "c": 0, "e": "El MTCN (Money Transfer Control Number) tiene diez cifras.", "pag": 56}, {"p": "¿Cuál es el límite de reintegro de la Tarjeta Correos Prepago en una oficina de Correos?", "o": ["600 € por operación y 1000 € al día", "300 € por operación y 600 € al día", "300 € por operación y 1000 € al mes", "500 € por operación y 600 € al día"], "c": 1, "e": "En oficina se admiten dos retiradas al día de hasta 300 € cada una, con un máximo de 600 € diarios.", "pag": 62}, {"p": "La Tarjeta Correos Regalo admite:", "o": ["Varias recargas de entre 10 y 999,99 euros", "Una sola recarga inicial de entre 10 y 300 euros", "Varias recargas de hasta 150 euros al mes", "Una sola recarga inicial de entre 20 y 150 euros"], "c": 3, "e": "Solo admite la recarga inicial, de 20 a 150 €, de la que se descuentan 3 € de coste de la tarjeta.", "pag": 69}, {"p": "¿En qué plazo recibe el cliente de Correos Pay los pagos hechos por los usuarios?", "o": ["24 horas hábiles", "Cinco días hábiles", "72 horas hábiles", "15 minutos"], "c": 2, "e": "El cliente recibe los pagos en su cuenta en un plazo de 72 horas hábiles, sin coste para él.", "pag": 70}, {"p": "Según el RD 1829/1999, ¿a cuántos destinatarios como mínimo debe dirigirse un envío de publicidad directa?", "o": ["A más de 100", "A más de 500", "A más de 1000", "A más de 50"], "c": 1, "e": "Entre los requisitos de la publicidad directa está que se dirija a más de 500 destinatarios.", "pag": 71}, {"p": "¿Cuál es el peso máximo general de los envíos de CCRI?", "o": ["250 g, salvo los países que admiten hasta 2 kg", "100 g, salvo los países que admiten hasta 2 kg", "500 g en todos los países", "2 kg en todos los países"], "c": 0, "e": "Según el Convenio UPU el límite es de 250 g; algunos países europeos admiten hasta 2 kg.", "pag": 74}, {"p": "¿Qué depósito mínimo exige el Publibuzón por remesa?", "o": ["500 ejemplares", "50 ejemplares", "100 ejemplares", "1000 ejemplares"], "c": 2, "e": "Publibuzón exige un mínimo de 100 ejemplares por remesa, en paquetes de 25, 50 o 100.", "pag": 75}, {"p": "¿Cuál es el peso máximo por envío del Publicorreo Óptimo?", "o": ["2 kg", "100 g", "500 g", "800 g"], "c": 3, "e": "Publicorreo Óptimo admite un máximo de 800 g por envío.", "pag": 82}, {"p": "Señale la afirmación INCORRECTA sobre el Publicorreo Plus:", "o": ["Admite clientes sin contrato con un mínimo de 100 ejemplares", "Su peso máximo por envío es de 100 g", "Se contrata en paquetes de 1000 a 10.000 envíos", "No admite envíos más pequeños de 14 x 9 cm aunque lleven etiqueta"], "c": 0, "e": "Publicorreo Plus es solo para clientes con contrato y exige un mínimo de 1000 destinatarios por remesa.", "pag": 85}, {"p": "Si un anunciante anula Publi City con más de 30 días de antelación, debe pagar una indemnización de:", "o": ["El 100 % del importe contratado", "El 20 % del importe contratado", "El 50 % del importe contratado", "Nada, se le devuelve todo el importe"], "c": 1, "e": "Se aplica un 20 % con más de 30 días de antelación, un 100 % con menos de 30 días y nada si se anula el mismo día de la contratación.", "pag": 95}, {"p": "¿Hasta qué peso se entregan los envíos de la tarifa Libros en el domicilio del destinatario?", "o": ["Hasta 800 g", "Hasta 2 kg", "Hasta 100 g", "Hasta 500 g"], "c": 3, "e": "Se entregan en domicilio hasta 500 g; de 500 g a 2 kg, en oficina, salvo que se pague la entrega a domicilio.", "pag": 96}, {"p": "¿Qué bonificación ofrece el programa Postlibris en la tarifa Libros de ámbito nacional?", "o": ["30 %", "25 %", "40 %", "20 %"], "c": 1, "e": "Postlibris da un 25 % de bonificación en la tarifa Libros nacional y un 30 % en Paq Estándar.", "pag": 98}, {"p": "Para que una publicación se considere periódica debe tener una tirada mínima anual de:", "o": ["1000 ejemplares y periodicidad al menos trimestral", "500 ejemplares y periodicidad al menos mensual", "1000 ejemplares y periodicidad al menos semestral", "50 ejemplares y periodicidad al menos trimestral"], "c": 0, "e": "Se exige una tirada mínima de 1000 ejemplares al año y al menos cuatro números anuales.", "pag": 100}, {"p": "¿Qué bonificación tienen las publicaciones periódicas de partidos políticos y sindicatos?", "o": ["25 %, si el envío no supera 500 g y es nacional", "40 %, si el envío no supera 2 kg, en cualquier ámbito", "40 %, si el envío no supera 100 g y es nacional", "30 %, si el envío no supera 100 g y es nacional"], "c": 2, "e": "Tienen un 40 % sobre las tarifas vigentes si pesan hasta 100 g, solo en el ámbito nacional.", "pag": 104}, {"p": "¿Qué norma regula el servicio postal universal?", "o": ["Ley 39/2015, de 1 de octubre", "Ley 16/2009, de 13 de noviembre", "Ley 43/2010, de 30 de diciembre", "Ley 24/1998, de 13 de julio"], "c": 2, "e": "La norma reguladora del SPU es la Ley 43/2010, de 30 de diciembre.", "pag": 4}, {"p": "¿Cuántas líneas de productos agrupaba el Manual de productos y procedimientos publicado por Correos en 1999?", "o": ["Seis", "Cuatro", "Cinco", "Siete"], "c": 2, "e": "El manual de 1999 agrupaba cinco líneas; más tarde pasaron a ser seis.", "pag": 4}, {"p": "Según la tabla de pesos, ¿cuál es el peso máximo de Paq Today?", "o": ["5 kg (peso volumétrico 8 kg)", "2 kg (sin peso volumétrico)", "20 kg (peso volumétrico 50 kg)", "15 kg (peso volumétrico 30 kg)"], "c": 0, "e": "Paq Today admite hasta 5 kg, con un peso volumétrico de 8 kg.", "pag": 5}, {"p": "Desde el 1 de enero de 2009, a efectos internacionales, Gibraltar se incluye en:", "o": ["La Zona 2", "La Zona 3", "La Zona 1 (Europa)", "El ámbito nacional"], "c": 2, "e": "Gibraltar se incluye en la Zona 1, que corresponde a Europa; Andorra se incluye en el ámbito nacional.", "pag": 11}, {"p": "¿Qué precepto define la carta ordinaria?", "o": ["El art. 13.2 A del RD 1829/1999", "El art. 13.2 B del RD 1829/1999", "El art. 1.3 de la Ley 43/2010", "El art. 42.2 de la Ley 39/2015"], "c": 0, "e": "La definición de carta está en el art. 13.2 A del Reglamento de Prestación de los Servicios Postales (RD 1829/1999).", "pag": 12}, {"p": "¿Cuál de estos países queda EXCLUIDO de la Zona 1 internacional?", "o": ["Groenlandia", "Portugal", "Irlanda", "Malta"], "c": 3, "e": "La Zona 1 es Europa con Groenlandia, pero excluye a Albania, Armenia, Bosnia, Chipre, Georgia, Malta, Moldavia y Rusia.", "pag": 12}, {"p": "¿A partir de qué valor del contenido debe usarse el impreso CN23 en lugar del CN22?", "o": ["Cuando supere los 30 DEG", "Cuando supere los 500 DEG", "Cuando supere los 1000 DEG", "Cuando supere los 300 DEG"], "c": 3, "e": "Las cartas deben llevar CN22, o CN23 cuando el contenido supere los 300 DEG.", "pag": 13}, {"p": "¿Qué tarifa se aplica a una carta dirigida a una localidad francesa fronteriza situada a menos de 30 km del lugar de admisión?", "o": ["La tarifa internacional de Zona 1", "La tarifa internacional de Zona 2", "La tarifa nacional con un recargo del 30 %", "La tarifa nacional"], "c": 3, "e": "Si el destino es una localidad francesa fronteriza a no más de 30 km de la admisión, se franquea con la tarifa nacional.", "pag": 13}, {"p": "El sobre de una carta ordinaria NO puede ser:", "o": ["De color blanco", "De color azul claro", "De papel reciclado", "De tamaño normalizado"], "c": 1, "e": "Si es un sobre, no puede ser de plástico transparente ni de color azul claro.", "pag": 13}, {"p": "En la tarjeta postal, ¿qué parte se reserva para los datos del destinatario?", "o": ["La mitad izquierda del anverso", "La mitad derecha del reverso", "El tercio superior del anverso", "La mitad derecha del anverso"], "c": 3, "e": "Hay que reservar la mitad derecha del anverso para los datos del destinatario.", "pag": 15}, {"p": "En la Tarjeta Postal Prefranqueada, la tarifa A2 corresponde a:", "o": ["Franqueo nacional normalizado", "Franqueo nacional no normalizado", "Franqueo internacional de Zona 1", "Franqueo internacional de Zona 2"], "c": 1, "e": "A es nacional normalizado, A2 nacional no normalizado, B Zona 1, C Zona 2 y D Zona 3.", "pag": 17}, {"p": "Si no se puede entregar una carta certificada, ¿qué modelo de aviso se deja en el casillero del destinatario?", "o": ["M-4", "M-35", "CN07", "TG-1"], "c": 0, "e": "Se deja un aviso modelo M-4 para que el destinatario recoja el envío en la oficina indicada.", "pag": 18}, {"p": "¿En qué caso puede figurar un seudónimo en lugar de los datos del remitente de una carta certificada?", "o": ["En los certificados con valor declarado", "En los certificados dirigidos a la Administración", "En los certificados con aviso de recibo", "En los certificados dirigidos a concursos literarios"], "c": 3, "e": "Los datos del remitente son obligatorios salvo en los certificados para concursos literarios, aunque su nombre queda en IRIS.", "pag": 19}, {"p": "En la carta certificada con reembolso, si el dinero se devuelve al remitente en oficina o apartado, ¿cuál es el importe máximo?", "o": ["2499,99 €", "999,99 €", "300 €", "499,99 €"], "c": 3, "e": "El máximo es de 2499,99 € si se paga en cuenta (OIC), pero de 499,99 € si se devuelve en oficina o apartado.", "pag": 20}, {"p": "¿Qué indemnización corresponde por pérdida de una carta certificada internacional sin valor declarado?", "o": ["La tarifa abonada multiplicada por 10", "Una cantidad fija de 30 euros", "La tarifa ordinaria abonada más 30 DEG", "La tarifa abonada más 100 euros"], "c": 2, "e": "En el ámbito internacional se devuelve la tarifa ordinaria abonada más 30 DEG.", "pag": 21}, {"p": "¿Cuál es el plazo para reclamar una carta certificada urgente, contado desde su admisión?", "o": ["De 3 días naturales a 4 meses", "De 7 días naturales a 4 meses", "De 15 días naturales a 6 meses", "De 1 día natural a 6 meses"], "c": 0, "e": "En la carta certificada urgente el plazo de reclamación va de tres días naturales a cuatro meses.", "pag": 28}, {"p": "¿Con qué código circula la Carta Certificada Premium de tarifa plana?", "o": ["CD", "OB", "VF", "VD"], "c": 3, "e": "La Premium circula con los productos
