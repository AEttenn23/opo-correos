onal, crema.", "pag": 36}, {"p": "En una notificación 90 de la Agencia Tributaria, si el destinatario no quiere hacerse cargo, ¿qué código se marca?", "o": ["Nadie se hace cargo (07)", "Rehusado (02)", "Ausente (03)", "Desconocido (04)"], "c": 2, "e": "La Agencia Tributaria no admite el código 07, así que se marca Ausente (03).", "pag": 37}, {"p": "En la notificación N3, ¿quién hace el tercer intento de entrega en turno de tarde?", "o": ["La Unidad de Servicios Especiales (USE)", "La Unidad de Reparto Ordinario (URO)", "El Centro de Admisión Masiva", "La oficina de destino"], "c": 0, "e": "Tras los 7 días en lista, en capitales y grandes ciudades la USE hace un tercer intento por la tarde.", "pag": 38}, {"p": "Los envíos de Valor Filatélico se identifican con las siglas:", "o": ["VD", "FD", "PF", "VF"], "c": 3, "e": "Los envíos de Valor Filatélico, remitidos por el Servicio Filatélico y admitidos en Madrid, llevan las siglas VF.", "pag": 41}, {"p": "¿Cuándo se entrega en el mismo día un Burofax Premium dirigido a una localidad con USE?", "o": ["Si se admite antes de las 14:30 horas", "Si se admite antes de las 16:00 horas", "Si se admite antes de las 21:00 horas", "Si se admite antes de las 13:00 horas"], "c": 3, "e": "La entrega es en el día si va a una localidad con USE y se admite antes de las 13:00; si no, al día hábil siguiente.", "pag": 42}, {"p": "La custodia de 60 meses incluida en el burofax puede ampliarla el remitente, pagando un suplemento, hasta:", "o": ["90 meses", "120 meses", "180 meses", "240 meses"], "c": 1, "e": "La custodia de 60 meses se puede ampliar hasta 120 meses pagando un suplemento.", "pag": 44}, {"p": "Al enviar un burofax en PDF a través de Mi Oficina, ¿cuál es el máximo permitido?", "o": ["100 páginas y 15 Mb", "50 páginas y 10 Mb", "150 páginas y 20 Mb", "100 páginas y 2 Mb"], "c": 0, "e": "Desde Mi Oficina se admite un PDF de hasta 100 páginas y 15 Mb (en la app, hasta 2 Mb).", "pag": 45}, {"p": "¿Cuál es el plazo para reclamar un burofax nacional?", "o": ["De dos días a seis meses desde la admisión", "De tres días a cuatro meses desde la admisión", "De siete días a cuatro meses desde la admisión", "De un día a seis meses desde la admisión"], "c": 3, "e": "En caso de demora o pérdida, el burofax nacional se puede reclamar de un día a seis meses desde la admisión.", "pag": 46}, {"p": "¿Qué impreso de admisión rellena el remitente de un telegrama?", "o": ["M-4", "CN22", "TG-1", "M-35"], "c": 2, "e": "El remitente rellena el impreso de admisión TG-1, con sus datos, los del destinatario y el mensaje.", "pag": 49}, {"p": "En el ámbito nacional, la tarifa de un telegrama consta de un importe fijo más otro importe por cada:", "o": ["10 palabras o fracción", "25 palabras o fracción", "100 palabras o fracción", "50 palabras o fracción"], "c": 3, "e": "La tarifa nacional suma un importe fijo por telegrama y otro por cada 50 palabras o fracción.", "pag": 48}, {"p": "En los telegramas de régimen intercontinental, la tarifa se cobra por palabra con un mínimo de:", "o": ["Diez palabras", "Siete palabras", "Cinco palabras", "Quince palabras"], "c": 1, "e": "El régimen intercontinental cobra por palabra con un mínimo de siete; el continental, sin mínimo.", "pag": 48}, {"p": "¿Cómo es el código identificativo de un abonado al servicio Télex?", "o": ["Seis cifras y cinco letras", "Siete cifras y dos letras", "Cinco cifras y seis letras", "Ocho cifras y una letra"], "c": 2, "e": "Los abonados tienen un código de cinco cifras y seis letras; la última indica el país de origen.", "pag": 50}, {"p": "Según la Ley 43/2010, el servicio de giro debe prestarse conforme a la ley de servicios de pago, que es:", "o": ["La Ley 39/2015, de 1 de octubre", "La Ley 43/2010, de 30 de diciembre", "La Ley 16/2009, de 13 de noviembre", "La Ley 10/2010, de 28 de abril"], "c": 2, "e": "La disposición final tercera remite a la Ley 16/2009, de 13 de noviembre, de servicios de pago.", "pag": 51}, {"p": "Para cobrar un giro inmediato se presenta un localizador generado por SEDI de:", "o": ["Diez caracteres", "Seis caracteres", "Siete caracteres", "Doce caracteres"], "c": 2, "e": "El giro inmediato se entrega con el localizador de siete caracteres que genera SEDI en la admisión.", "pag": 52}, {"p": "¿Cuál es el plazo de entrega de un giro ordinario?", "o": ["Entre uno y dos días hábiles", "Entre cinco y 15 minutos", "Entre cinco y siete días hábiles", "Entre tres y cinco días hábiles"], "c": 3, "e": "El giro ordinario se entrega en un plazo de tres a cinco días hábiles.", "pag": 52}, {"p": "Si el destinatario de un giro ordinario está ausente, ¿hasta cuándo permanece el dinero en lista?", "o": ["Durante 15 días naturales desde el aviso", "Hasta el último día del mes del aviso", "Hasta el día 25 del mes siguiente a la fecha del aviso", "Durante 30 días naturales desde el aviso"], "c": 2, "e": "El dinero queda en lista hasta el día 25 del mes siguiente al aviso, o el siguiente día hábil si es festivo.", "pag": 52}, {"p": "Según las tarifas de 2022, ¿cuánto cuesta un giro OIC?", "o": ["12,10 € más el 2 % de la cantidad girada", "4,00 € más el 2 % de la cantidad girada", "3,05 € más el 2 % de la cantidad girada", "3,05 € más el 1 % de la cantidad girada"], "c": 2, "e": "El giro OIC cuesta 3,05 € más el 2 %; el ordinario, 12,10 € más el 2 %, y el inmediato, 4,00 € más el 2 %.", "pag": 53}, {"p": "En el giro IFS, ¿qué código recibe el remitente para comunicárselo al destinatario?", "o": ["Un código alfanumérico de seis a 10 caracteres", "Un localizador de siete caracteres", "Un MTCN de diez cifras", "Un código numérico de cuatro cifras"], "c": 0, "e": "En la admisión se entrega un código alfanumérico de seguridad de seis a 10 caracteres, sin el cual no se cobra el giro.", "pag": 54}, {"p": "¿Qué tarifa tiene el giro IFS a los países del Grupo 2 (República Dominicana, Argentina, Ecuador, etc.)?", "o": ["Una tarifa plana de 4,75 €", "10 € más el 1,75 %", "5 € más un porcentaje por tramos", "Una tarifa plana de 3,05 €"], "c": 0, "e": "Al Grupo 2 se aplica una tarifa plana de 4,75 € para cualquier importe entre 0,01 € y 999,99 €.", "pag": 55}, {"p": "¿Cuál es la cantidad máxima que se puede enviar por Western Union?", "o": ["2499,99 € por persona y día", "999,99 € por persona y día", "3000 € por persona y por día o trimestre natural", "6000 € por persona y mes"], "c": 2, "e": "El máximo es de 3000 € por persona y por día o trimestre natural, aunque algunos países fijan límites menores.", "pag": 57}, {"p": "¿Durante cuánto tiempo permanece en el sistema, a la espera de pago, una transferencia de Western Union?", "o": ["30 días naturales", "15 días naturales", "Dos años", "90 días naturales"], "c": 3, "e": "El dinero se mantiene en el sistema para su pago durante 90 días naturales.", "pag": 57}, {"p": "En Correos Cash, ¿qué requisito debe cumplir el cheque que se ingresa?", "o": ["Ser al portador y estar firmado en el anverso", "Ser nominativo y presentarlo solo su emisor", "Estar en cualquier divisa y conformado por el banco", "Ser nominativo y estar barrado en el anverso"], "c": 3, "e": "El cheque debe ser nominativo, nunca al portador, e ir barrado para ingreso en cuenta.", "pag": 59}, {"p": "¿Cuánto cuesta emitir una Tarjeta Correos Prepago Mastercard?", "o": ["3 € (IVA incluido)", "6 € (IVA incluido)", "1,50 € (IVA incluido)", "10 € (IVA incluido)"], "c": 1, "e": "La emisión, la tarjeta adicional o el reemplazo cuestan 6 € con IVA incluido.", "pag": 61}, {"p": "¿Cuál es el importe mínimo de recarga de la Tarjeta Correos Prepago?", "o": ["20 euros", "5 euros", "1,50 euros", "10 euros"], "c": 3, "e": "La recarga mínima es de 10 euros, con un máximo de cinco recargas al día.", "pag": 61}, {"p": "¿De cuántos días es el período de reflexión para devolver la Tarjeta Correos Prepago y recuperar su coste?", "o": ["14 días", "30 días", "7 días", "15 días"], "c": 0, "e": "Durante un período de reflexión de 14 días se reintegra el coste de la tarjeta.", "pag": 61}, {"p": "Sobre la Tarjeta Más Cerca, señale la afirmación CORRECTA:", "o": ["Permite hasta cuatro tarjetas adicionales gratuitas", "Tiene un coste de emisión de 6 €", "Permite retirar efectivo en cajeros", "La del titular acaba siempre en 01"], "c": 0, "e": "Es gratuita, se usa solo con Correos y admite hasta cuatro adicionales; la del titular acaba en múltiplo de 5.", "pag": 67}, {"p": "¿Cuál es la tarifa de la modalidad Premium de Correos Pay?", "o": ["2,95 €", "1,95 €", "3,05 €", "4,00 €"], "c": 1, "e": "La tarifa básica es de 2,95 € y la premium, de 1,95 €.", "pag": 70}, {"p": "Según el RD 1829/1999, ¿qué indicación debe figurar en la cubierta de un envío de publicidad directa?", "o": ["FD", "P. D.", "IMPRIMÉ", "CCRI"], "c": 1, "e": "Entre los requisitos de la publicidad directa está que figure \"P. D.\" en la cubierta.", "pag": 71}, {"p": "En el sobre de franqueo en destino, ¿de qué color es la barra vertical?", "o": ["Azul Pantone-541 C (opcional) o negro", "Rojo Pantone-185 C o negro", "Amarillo corporativo o gris", "Verde Pantone-355 C o negro"], "c": 0, "e": "La barra vertical es de color azul Pantone-541 C (opcional) o negro.", "pag": 73}, {"p": "¿Qué tarifa paga el titular del apartado FD al recibir un llavero extraviado con clave de identificación?", "o": ["La de una carta no normalizada", "La de una carta normalizada", "La de una tarjeta postal", "La de un paquete azul"], "c": 0, "e": "Los llaveros se entregan al titular del apartado previo pago de la tarifa de carta no normalizada.", "pag": 74}, {"p": "¿Con qué otro nombre se conoce el servicio CCRI en algunos países?", "o": ["International Business Response Service (IBRS)", "International Financial System (IFS)", "Money Transfer Control Number (MTCN)", "Single Euro Payments Area (SEPA)"], "c": 0, "e": "En algunos de esos países el servicio se denomina International Business Response Service (IBRS).", "pag": 74}, {"p": "En la admisión del Publibuzón, ¿qué debe entregar el cliente?", "o": ["Un impreso CN22 por cada paquete de 100 ejemplares", "Una relación por triplicado con peso, lugar y número de ejemplares", "Una relación por duplicado con los nombres de los destinatarios", "Un fichero .txt con las direcciones de reparto"], "c": 1, "e": "El cliente entrega una relación por triplicado con el peso unitario, el lugar de distribución y los ejemplares por zona.", "pag": 75}, {"p": "¿Qué inscripción debe figurar en la cubierta de un envío de Publicorreo Internacional?", "o": ["\"PUBLICORREO PREMIUM\"", "\"NE PAS AFFRANCHIR\"", "\"RESPUESTA PAGADA\"", "\"IMPRIMÉ\" o su equivalente en el idioma del país de destino"], "c": 3, "e": "En la cubierta debe figurar \"IMPRIMÉ\" o su equivalente en una lengua oficial del país de destino.", "pag": 78}, {"p": "¿Cuántos tramos de peso tiene la tarifa de Publicorreo Premium?", "o": ["19", "15", "9", "4"], "c": 0, "e": "Publicorreo Premium tiene 19 tramos de peso hasta 2 kg; Publicorreo Óptimo, 15 hasta 800 g.", "pag": 80}, {"p": "En Correos MKD, ¿de cuánto tiempo dispone el cliente para consumir los envíos del pack comprado?", "o": ["6 meses", "24 meses", "12 meses", "3 meses"], "c": 2, "e": "En la modalidad de prepago el cliente tiene 12 meses para consumir el pack, en un máximo de tres envíos.", "pag": 86}, {"p": "¿Cómo se cobra el servicio Correos Target?", "o": ["Por registro captado", "Por cada envío realizado", "Por hora de trabajo", "Con una cuota anual fija"], "c": 2, "e": "La tarifa de Correos Target se aplica por hora de trabajo.", "pag": 91}, {"p": "En Publi City, ¿qué tamaño debe tener el cartel publicitario?", "o": ["42 x 29,7 cm (aproximadamente A3)", "32 x 43 cm (aproximadamente A2)", "21 x 29,7 cm (aproximadamente A4)", "50 x 70 cm (formato póster)"], "c": 0, "e": "El cartel debe medir 42 x 29,7 cm y el soporte del carrito, 32 x 43 cm.", "pag": 95}, {"p": "¿Cómo es el código OR que deben llevar los envíos con tarifa Libros?", "o": ["23 dígitos en formato Code 128 A o B", "13 dígitos en formato EAN-13", "23 dígitos en formato QR", "20 dígitos en formato Code 39"], "c": 0, "e": "El código OR tiene 23 dígitos, formato Code 128 A o B, y va en el anverso con 10 mm de margen.", "pag": 96}, {"p": "¿Cuál es el compromiso de entrega nacional de los envíos de Libros?", "o": ["El 95 % en seis días hábiles", "El 90 % en cuatro días hábiles", "El 93 % en tres días hábiles", "El 99 % en cinco días hábiles"], "c": 0, "e": "Se entregan en dos a seis días hábiles, con el compromiso de entregar el 95 % en seis días.", "pag": 97}, {"p": "Para el acuerdo con el Ministerio de Cultura y Deporte, ¿qué parte de su facturación debe obtener una librería de la venta de libros?", "o": ["Al menos el 50 %", "Al menos el 75 %", "Al menos el 60 %", "Al menos el 25 %"], "c": 2, "e": "Se considera librería al establecimiento físico en el que la venta de libros supone al menos el 60 % de la facturación.", "pag": 99}, {"p": "En una publicación periódica, el contenido publicitario de cada ejemplar no puede superar:", "o": ["La mitad del total del contenido", "Dos tercios del total del contenido", "Un tercio del total del contenido", "El 20 % del total del contenido"], "c": 1, "e": "La publicidad no puede superar dos tercios del contenido, encartes incluidos, ni ser de un mismo anunciante en más del 20 %.", "pag": 101}, {"p": "Para que la correspondencia sea normalizada, ¿qué altura deben tener los caracteres de la dirección?", "o": ["Entre 1 y 5 mm", "Entre 3 y 10 mm", "Entre 2 y 8 mm", "Entre 5 y 12 mm"], "c": 2, "e": "La altura de los caracteres debe estar entre 2 y 8 mm, sin que se toquen ni se superpongan.", "pag": 105}]}, {"letra": "B", "titulo": "Paquetería nacional e internacional. Valores añadidos y servicios adicionales", "paginas": "107-232", "resumen": "## 1. Introducción\n\n- La paquetería es la línea **más estratégica** de Correos: soluciones para eCommerce en entregas **B2B** (empresa-empresa) y **B2C** (empresa-particular).\n\n## 2. Paquetería nacional\n\n### 2.1. Paquete Azul\n- Documentos o paquetes, con o sin valor comercial; circula **cerrado y certificado**, con seguimiento. Es **SPU** (hasta 20 kg) y por tanto **exento de IVA**.\n- **Un intento** de entrega bajo firma; después **15 días naturales** en oficina. Segundo intento **gratuito** por teléfono en localidades con **USE**.\n- Ámbito: España y Andorra. Peso real **20 kg**; volumétrico **50 kg** (167 kg/m³ = L×A×A/6000).\n- Medidas máx.: caja L+A+A = **200 cm** (lado mayor ≤ 100 cm); tubo L = 100 cm y D = 15 cm. Mín.: **14 × 9 cm**; rollo L+2D = 17 cm. Si es menor, etiqueta de **10 × 7 cm**.\n- Plazos: Península, Baleares, Ceuta y Melilla **3-5 días hábiles**; Canarias **8 días hábiles**.\n- Servicios: aviso de recibo, reembolso (máx. **2499,99 €**; **499,99 €** si se devuelve por giro), **valor declarado SPU hasta 3000 €**, PEE 5 Postal (5 años no ampliables), DUA.\n- Ya no se hacen contratos nuevos (solo clientes sin contrato). Una zona tarifaria y **seis tramos** de peso (hasta 1, 2, 5, 10, 15 y 20 kg).\n- Garantía por pérdida/deterioro: **tarifa × 4** + valor declarado (desde el 27/06/2021; antes 23,44 €). Reembolso perdido antes de entregar: tarifa × 4; ya entregado: importe del giro.\n- Reclamación: **mín. 10 días naturales, máx. 4 meses** desde la admisión.\n\n### 2.2. Paq Estándar (antes Paq 72)\n- Desde junio de 2017. \"**Envío responsable**\": no urgente, optimiza rutas y reduce emisiones. Enfocado a eCommerce.\n- Modalidades:\n\n| Código | Modalidad | Características |\n|---|---|---|\n| **PQ** | Domicilio | 2 intentos + 15 días en oficina; única para Portugal (sin lista, devolución en 7 días) |\n| **PS** | Oficina elegida | 15 días; segundo SMS/email a los 5 días |\n| **PR** | Oficina de referencia | 15 días; dos avisos |\n| **PY** | Citypaq | **5 días** en terminal y luego 15 días en oficina |\n\n- Ámbito: España, Andorra y **Portugal peninsular**. **No admite franqueo a máquina**.\n- Peso real **30 kg**; volumétrico hasta **60 kg** (con contrato parametrizable: 200, 167, 143 o 125 kg/m³ → divisores 5000, 6000, 7000, 8000).\n- Medidas: L+A+A = **210 cm**, lado mayor **120 cm**; tubo 120 cm × 30 cm D. Citypaq: **60×49×40** (pequeño) y **74×42×60** (grande). Mínimas **14,5 × 10 cm**.\n\n| Nivel | Lado mayor | Suma L+A+A |\n|---|---|---|\n| Estándar | 120 cm | 210 cm |\n| Extra | 170 cm | 270 cm |\n\n- Sobrecoste: una dimensión extra **35 %**; dos dimensiones extra **70 %**.\n- Plazo: **48-72 h**; +24 h a Canarias, Ceuta y Melilla; la tramitación aduanera (Andorra, Canarias, Ceuta, Melilla) no computa; devoluciones +24 h.\n- Horas límite (fuera de ellas +24 h):\n\n| Origen | Recogida | Admisión oficina/UAM |\n|---|---|---|\n| Madrid | 17:00 | 18:00 |\n| Álava, Albacete, Alicante, Asturias, Sevilla, Valencia, Zaragoza… | 16:00 | 17:00 |\n| Resto | 13:00 | 14:00 |\n\n- Portugal: solo valor declarado y trazabilidad/retorno de información. Citypaq: además gestión de estacionados.\n- **Con contrato**: seguro estándar (obligatorio salvo renuncia), seguro LCTTM (si tiene póliza propia), indemnización pactada, valor declarado hasta **6000 €**, reembolso solo en cuenta (máx. 2499,99 €), **PEE 5/10/15** Postal, EED, escaneo, expediciones (**10 bultos**), logística inversa, entrega con recogida, **APE**, **Correos Modify**, gestión de estacionados (ficheros, oficina virtual o **Siebel**).\n- **Sin contrato**: seguro LCTTM obligatorio salvo valor declarado (hasta 6000 €), reembolso por giro (**499,99 €**) o en cuenta (**2499,99 €**), PEE, EED; el destinatario modifica datos con **PIN** en Mi Oficina.\n- Garantías sin contrato: demora → devolución de tarifa; pérdida → LCTTM (**6,43 €/kg**) + tarifa; deterioro → LCTTM. Reclamación: demora **3-21 días** desde la entrega; deterioro **7 días naturales**; extravío **3 días a 1 año** desde la admisión.\n\n### 2.3. Paq Premium (antes Paq 48)\n- Urgente, bajo firma, entrega \"a medida\". Modalidades: **PK** domicilio (2 intentos + 15 días), **PL** oficina elegida, **PW** Citypaq (5 días + 15).\n- Mismo peso y medidas que Paq Estándar (30 kg real, 60 kg volumétrico, 210/120 cm, niveles extra y sobrecostes 35/70 %).\n- Plazo **24-48 h**; mismas horas límite y suplementos de plazo.\n- Extras con contrato: entrega en **fecha concertada**, **franja horaria**, plazo de permanencia en lista, **nº de intentos parametrizable**. Sin contrato: **aviso de recibo** y fecha concertada.\n- Garantía sin contrato: pérdida y deterioro según LCTTM con **mínimo 40 €**.\n\n#### 2.3.1. Paq Premium prepagado\n- Sobre plastificado de **38 × 31 cm**, tarifa única, sin servicios adicionales; individual o packs de **10 o 25**.\n- Hasta **350 g** (pérdida 30 €) y hasta **1 kg** (pérdida 40 €); demora: devolución de tarifa. En la web: \"Sobre bolsa prepagada Paq 48\". Se retirará al agotar stock (normativa de plásticos).\n\n### 2.4. Paq Ligero\n- Desde 2019. Menos de **2 kg**, **sin firma** (domicilio o buzón); si no se entrega, 15 días en oficina.\n- España y Andorra. Con contrato (prerregistro) o sin contrato (titulares **Tarjeta Más Cerca**).\n- Sin peso volumétrico; máx. **35 × 23 × 2 cm**, mín. 10 × 15 cm; no admite exceso de dimensiones.\n- Plazo 24-48 h en el **90 %** de los casos. **Sin garantía** por pérdida, robo o demora.\n\n### 2.5. Paq Retorno y Paq Retorno Premium\n- Logística inversa sin coste para el cliente final; complementan Paq Estándar, Premium y Today. Retorno Premium: solo **entrega con recogida**.\n- Casos: **LI** (Retorno Premium), **L3** (Paq Retorno con prerregistro), **SN** (sin prerregistro; el cliente trae la etiqueta impresa).\n- España y Andorra; 30 kg real / 60 kg volumétrico; solo **con contrato**; plazo 48-72 h; hora límite única **13:00 / 14:00**.\n- Validez del código configurable hasta **6 meses**; reembolso máx. **999,99 €**; valor declarado 6000 €. Garantías iguales al envío inicial salvo plazo.\n\n### 2.6. Paq Today\n- Desde 2016; hoy solo **con contrato** y admisión en **UAM/unidades de servicios especiales**, no en oficinas.\n- El más rápido: recogida y entrega **el mismo día** en capitales peninsulares, Baleares, Canarias y grandes poblaciones.\n- Peso real **5 kg**, volumétrico **8 kg**; máx. **39 × 39 × 29 cm**.\n- Primer intento de **15:00 a 21:00**; horas límite 13:00 (recogida) y 14:00 (admisión). Franjas solo de tarde (15-18 y 18-21). Una zona tarifaria.\n\n### 2.7. Correos Express en oficinas\n- Clientes sin contrato y siempre **portes pagados**. Productos: Paq 10, Paq 14, Paq 24 y tarifas planas.\n- Admisión antes de las **17:00** (capitales con turno de tarde) o **14:00** (resto); el día siguiente no debe ser festivo en destino. 15 días en oficina.\n- Medidas L+A+A **240 cm**, lado máx. 120 cm; mín. 15 × 10 cm. Peso **40 kg/bulto** (167 kg/m³); EquiPaq 24 **25 kg por maleta, máx. 5**; Paq Nieve **15 kg**.\n- Incluyen seguro básico, 2 intentos, recogida, tracking con **4 lecturas mínimas**, **LID** y **GPI**.\n- Adicionales: seguro hasta **3000 €**, reembolso **999,99 €**, expediciones **5 bultos / 100 kg**, RFID, entrega plus.\n- Garantías: demora **100 % del porte**; pérdida LCTTM 6,43 €/kg.\n\n| Producto | Entrega |\n|---|---|\n| **Paq 10** | Antes de las 10:00 del día laborable siguiente |\n| **Paq 14** | Antes de las 14:00 (Paq Empresa 14: B2B) |\n| **Paq 24** | Día siguiente; Ceuta, Melilla, Andorra y Gibraltar al 2º día; no Canarias (ePaq 24: B2C) |\n| **EquiPaq 24** | Maletas, día siguiente (Baleares 48 h) |\n\n- **Admisión en Canarias**: documentación (Paq 10, Paq 14, Canarias Express Docs), bajo valor (**< 22 €**) y alto valor (> 22 €). Canarias–Canarias: siempre Paq 24.\n- **Paq Nieve**: esquís/snowboard en embalaje especial (195 × 17 × 31 cm), máx. 15 kg. Paq Nieve 24 (48 h desde Baleares; La Molina 48 h); **Paq Nieve 10** solo particulares en **Sabiñánigo, Jaca y Granada**.\n\n## 3. Paquetería internacional\n\n| Producto | Sustituye a | Peso | Firma | Plazo Europa |\n|---|---|---|---|---|\n| **Paq Light Internacional** | CUI | 2 kg (sin volumétrico) | No | 3-5 días |\n| **PPIE** | — | 30 kg (SPU hasta 20) | Sí | 8-10 días hábiles |\n| **Paq Standard Int.** | PPI Prioritario | 30 kg | Sí | 4-8 días hábiles |\n| **Paq Premium Int.** | EMS / Postal Express | 30 kg | Sí | 4-8 días hábiles |\n\n### 3.1. Paquete Internacional EPG\n- **European Parcel Group**: operadores de **27 países**. Desde 2013 no se vende en oficinas; Correos distribuye lo que llega y gestiona la logística inversa (código **CZ** + 9 dígitos + **ES**; tramitado en **IRIS** como Paq Standard Internacional, sin cobro). No admitido en Canarias, Ceuta y Melilla.\n\n### 3.2. Paq Light Internacional\n- Entrega en buzón o domicilio, identificador de **13 caracteres**; no a lista ni apartado. Cinco zonas (EU1, EU2, AM, AS-OC, AF).\n- Medidas máx. L+A+A **90 cm** (lado 60 cm). Rusia desde 9 días; China desde 8. **Sin garantía**.\n\n### 3.3. PPIE\n- Certificado no urgente, red **UPU**, no a lista ni apartado. Zonas EU1-3, AM1-2, AS-OC1-2, AF.\n- Volumétrico 50 kg; L+A+A **200 cm** (lado **105 cm**). Aviso de recibo **CN07**, reembolso 500-3000 € según país, valor declarado SPU 3000 €.\n- Suplementos: EU3 y AS-OC2 +1 €/kg; AM2 +2 €/kg. Por encima de **20 kg** se aplican impuestos indirectos.\n- Pérdida: tarifa + **40 DEG + 4,5 DEG/kg** (1 DEG = 1,1964 € en 2022). Reclamación **25 días a 6 meses**.\n\n### 3.4. Paq Standard Internacional\n- A domicilio, bajo firma, no a lista ni apartado. EU3 y AS-OC2: +5 €/kg. Seguro hasta **3000 €**. Tramos de kilo en kilo.\n- Pérdida y deterioro: 40 DEG + 4,5 DEG/kg. Reclamación por extravío **15 días a 6 meses**.\n\n### 3.5. Paq Premium Internacional\n- Urgente, red **EMS**; admite apartado y lista. Datos en español e inglés. Si se admite tras las 14 h (capitales) o 13 h (resto), el plazo empieza al día siguiente.\n- Pérdida: tarifa + **52,98 €** fijos; deterioro máx. 52,98 €; demora: devolución de tarifa. Reclamación: extravío 7 días-4 meses; demora 7-21 días; deterioro 3 días-4 meses.\n\n### 3.6. Paq Return Internacional\n- Logística inversa para empresas con sede en España, **21 países europeos**, solo con contrato, 30 kg, L+A+A 190 cm. Plazo estimado 3-5 días sin compromiso; seguro opcional 3000 €; **sin indemnización por demora**.\n\n## 4. Tarifa Plana de Paquetería\n- Exclusiva de oficinas, precio fijo por embalaje sin importar el peso. **Siete embalajes universales** (sobres acolchados y rígidos grande/pequeño, cajas pequeña, mediana y grande).\n- Nacional: Paq Estándar (antes de 72 h), Paq Premium (48 h), **Paq Botella** (no Canarias), Paq 10, Paq 24, EquiPaq 24, Paq Nieve.\n- La **caja pequeña** (350×280×100 mm) no vale para Paq 10 y Paq 24. Paq Botella: cajas de 1, 2 o 3 botellas.\n- Paq Estándar/Premium/Botella: seguro **101 €** ampliable a 6000 €, reembolso máx. **200 €**. Productos CEX: seguro hasta 3000 €, reembolso 999,99 €.\n- Internacional: Zona A (UE, como Paq Standard) y Zona B (resto, como Paq Premium); seguro 3000 €. Tarifa Plana Internacional CEX: sobre (3 kg), cajas pequeña (5 kg), mediana (10 kg) y grande (15 kg); reembolso 999,99 €.\n\n## 5. Camino de Santiago\n- Web **www.elcaminoconcorreos.com**; tienda en **Correos Market**.\n- **Consigna** (Rúa do Franco 4, L-V 8:30-20:30): bicicleta **5 €/día**, mochila o maleta 3 €, bastón 1 €.\n- **Paq Bicicleta**: caja de **150 × 30 × 90 cm**, hasta **20 kg**. Nacional como Paq Estándar (Nacional, Baleares, Canarias, Roncesvalles), solo entrega en oficina elegida; 48 h capitales / 72 h resto; seguro **300 €** ampliable a 6000 €; lista 15 días ampliable a 20, 30 o 60. Internacional como PPIE (EPG), 8-10 días, seguro 300 € no ampliable.\n- **Paq Mochila**: equipaje en recepción antes de las **8:00**, entrega antes de las **14:30**; contratar antes de las **21 h** del día anterior; mayor de **18 años**; máx. **15 kg**; 210/120 cm. Todo el año Sarria–Santiago; 1 abril–31 octubre otros caminos. Descuentos: 1 €/etapa con 5+ etapas, 10 % Camino Francés o del Norte, 5 % grupos de 5+ mochilas. Etapas de 25 km a pie / 60 km en bici.\n- **Paq Peregrino**: tarifa plana como Paq Estándar en oficina elegida; pequeño **15 kg** y grande **25 kg**; seguro **101 €** no ampliable; 15 días gratis ampliables a 30, 45 o 75.\n- **Credencial**: más de **100 km a pie** o **200 km en bici**; al menos **dos sellos por día**. Credencial filatélica con 15 sellos; tarjeta del Camino portugués con 7 sellos (Tui-Santiago), sin sustituir a la credencial.\n\n## Anexo I. Valores añadidos y servicios adicionales\n\n### Seguros\n- **Seguro Estándar**: por defecto para clientes con contrato; **15 €/kg**, máx. **500 €** por envío; no acumulable.\n- **Seguro LCTTM** (Ley 15/2009): cobertura mínima legal; **1/3 del IPREM** (6,43 €/kg; 6,66 € en 2023), mínimo 40 € en Paq Premium.\n- **Valor Declarado de Paquetería** (antes Seguro a Todo Riesgo): nacional hasta **6000 €**, **1,5 %** (mín. 1,67 € sin contrato; 1,5 € con contrato). Internacional hasta **3000 €**, **1 %** (mín. 2,04 €).\n- **Indemnización pactada** (antes \"Autoseguro\"): prima fija para clientes con contrato.\n- **Valor Declarado SPU**: Carta Certificada, Paquete Azul, Carta Certificada Urgente y, en internacional, Carta Certificada y PPIE. **Mín. 6 € / máx. 3000 €** (RD 1829/1999), exento de IVA. Precinto **Secure Tape 820**; cajas de madera o metal de **8 mm**.\n\n### Preparación de envíos\n- **Expediciones** (solo contrato, no Portugal): Paq Estándar/Premium **10 bultos, 300 kg real / 600 kg volumétrico**; Paq Today **10 bultos, 50 / 80 kg**. Entrega completa o parcial. Códigos: expedición 16 dígitos, producto 23 dígitos. CEX: 5 bultos / 100 kg.\n- **Recogida a domicilio**: estándar (1-5 días/semana, máx. **250 kg**, 5 zonas) o especial (preaviso **24 h**, más de 250 kg).\n- **DUA**: exportación (factura por triplicado; Correos devuelve el **ejemplar 3**). Importación simplificada si particular y **≤ 150 €**; ordinaria si > 150 €. Desde 1/7/2021 se paga IVA en todas las compras de fuera de la UE (gestión 1,50 € en 2022). Ceuta paga **IPSI**; en Melilla Correos no interviene.\n- **DDP**: el vendedor paga los gastos aduaneros (Península/Baleares ↔ Canarias y Ceuta, declaración H7).\n\n### Distribución\n- **Notificaciones** (Ley 39/2015): 2.º intento en distinto turno, **3 horas** de diferencia, dentro de **3 días**; judiciales (LOPJ) 60 minutos. 7 días en lista.\n- **APE**: bloqueo del envío hasta orden de entrega o devolución (ejemplo de portabilidad móvil).\n- **Entrega con recogida**: usa Paq Retorno Premium.\n- **EED**: solo al destinatario (**mayor de 14 años**), sin autorizados, solo personas físicas. **Entrega en propia mano**: equivalente internacional.\n- **Fecha determinada**: Paq Premium a domicilio. **Franja horaria**: 9-12, 12-15, 15-18, 18-21.\n- **Correos Modify** (2019): el destinatario cambia fecha (7 días), dirección, oficina o Citypaq dentro de la provincia; guardar por vacaciones hasta **21 días**.\n- **Reembolso**: destinatario paga solo en metálico; mínimo 0,01 €.\n\n| Modalidad | Comisión | Mínimo | Máximo |\n|---|---|---|---|\n| Con contrato, ingreso en cuenta | 2,75 % | 1,75 € | 2499,99 € |\n| Sin contrato, ingreso en cuenta | 2,75 % | 2,50 € | 2499,99 € |\n| Sin contrato, giro | 6 % | 7,50 € | 499,99 € |\n\n- **Gestión de estacionados**: una sola vez, máx. **5 días naturales (120 h)**; no se contacta con el remitente, todo pasa por **SGIE**.\n- Alertas SMS/email: L-V 9-21 h y sábados 9-14 h. **Petición de devolución/modificación**: modelo **CN 17**; la reexpedición la pide el remitente y el reenvío el destinatario.\n- **Permanencia en lista**: 0, 5, 10, 20 días o libre. **Información de devoluciones**: código **OB** de 23 dígitos. **Intentos parametrizables**: de 1 a 3.\n\n### Constancia\n- **PC/PEF**: acuse de recibo de telegramas y prueba física de Burofax Premium.\n- **Aviso de recibo**: cartulina **rosa** (nacional, M-35 plus 1E/2E) y **salmón** (internacional, **CN07**).\n- **Certificaciones**: imposición, entrega, intento de entrega y copia certificada; solicitud hasta **6 meses**; en internacional solo de imposición.\n- **Custodia de burofax**: **60 meses**, ampliable a 120. **PEE** con **CSV**; PEE 5 Telegráficos y PEE 5 Postal (ampliable a 10/15, salvo Paquete Azul).\n\n## Anexo II. Correos Express (productos propios)\n- Cubicaje **200 kg/m³** (Islas Marítimo **333 kg/m³**); suplemento de **25 €** por exceso de peso o medidas (internacional **55 €**). Portes al contado máx. **30 €**.\n- Seguros: todo riesgo **1,5 %**, opcional plus **8 %**; reembolso máx. **999 €**, reintegro en 4-6 días laborables.\n- Islas Express (aéreo), Islas Marítimo (D+4-10), Islas Docs; valija bancaria (seguro 200 €, unitoque/bitoque), valija comercial (**10 kg**); Internacional Estándar (Europa, L+2A+2A = 300 cm) e Internacional Express (mundo, 65 kg por expedición).\n\n## Claves para el examen\n- Paquete Azul: SPU, 20 kg, un intento, tarifa × 4, reclamación 10 días-4 meses.\n- Paq Estándar 48-72 h y Paq Premium 24-48 h: 30 kg real, 210/120 cm, nivel extra 170/270 cm, sobrecoste 35 %/70 %.\n- Citypaq: 5 días en terminal + 15 en oficina; oficina: 15 días naturales.\n- Paq Ligero: 2 kg, 35×23×2 cm, sin firma ni garantía.\n- Paq Today: 5 kg/8 kg, mismo día, primer intento de 15 a 21 h, solo contrato.\n- Reembolso: 2499,99 € en cuenta, 499,99 € por giro; Paq Retorno y CEX 999,99 €; tarifa plana 200 €.\n- Seguro estándar 15 €/kg (máx. 500 €); LCTTM 6,43 €/kg; valor declarado 6000 € nacional / 3000 € internacional; VD SPU 6-3000 €.\n- Internacional: PPIE y Paq Standard 40 DEG + 4,5 DEG/kg; Paq Premium Int. 52,98 €.\n- Estacionados: máximo 120 horas, una sola vez.\n- EED: mayor de 14 años, solo personas físicas.\n- Custodia burofax 60 meses (hasta 120); certificaciones hasta 6 meses.\n- Paq Mochila: 15 kg, antes de las 8:00, entrega antes de las 14:30, contratar antes de las 21 h.", "preguntas": [{"p": "¿Hasta qué peso real admite el Paquete Azul?", "o": ["15 kg", "20 kg", "30 kg", "50 kg"], "c": 1, "e": "El Paquete Azul admite hasta 20 kg de peso real (50 kg volumétrico), límite del SPU.", "pag": 111}, {"p": "¿Cuál es el plazo para reclamar un P cita siempre el remitente", "La reexpedición solo es válida en el ámbito nacional", "La reexpedición la solicita el remitente y el reenvío el destinatario"], "c": 3, "e": "La reexpedición la pide el remitente (solo internacional) y el reenvío postal lo pide el destinatario.", "pag": 202}, {"p": "¿Qué valores de días en lista pueden fijarse en el prerregistro con el servicio de plazo de permanencia en lista?", "o": ["0, 5, 10 y 20 días, además de uno libre", "5, 15, 30 y 60 días", "0, 7, 15 y 30 días, además de uno libre", "10, 20, 30 y 45 días"], "c": 0, "e": "Los valores posibles son 0, 5, 10 y 20 días y uno libre; el 0 no vale para la entrega en oficina.", "pag": 203}, {"p": "Con el servicio de número de intentos de entrega parametrizable, ¿entre cuántos intentos puede elegir el cliente?", "o": ["Entre dos y cuatro", "Entre uno y tres", "Entre uno y dos", "Entre dos y cinco"], "c": 1, "e": "El cliente puede fijar entre uno y tres intentos de entrega a domicilio.", "pag": 205}, {"p": "¿De qué color es la cartulina del aviso de recibo en el ámbito nacional?", "o": ["Salmón", "Amarilla", "Rosa", "Azul"], "c": 2, "e": "La cartulina es de color rosa en el ámbito nacional y salmón en el internacional.", "pag": 206}, {"p": "¿Qué modelo nacional de aviso de recibo se usa en envíos con dos intentos de entrega (notificaciones)?", "o": ["M-35 plus 1E", "CN07", "M-35 plus N", "M-35 plus 2E"], "c": 3, "e": "M-35 plus 1E para un intento de entrega y M-35 plus 2E para dos intentos (notificaciones).", "pag": 207}, {"p": "¿Qué tipo de certificación puede emitirse para envíos de ámbito internacional?", "o": ["Solo la certificación de imposición", "La certificación de entrega", "La certificación de intento de entrega", "La copia certificada"], "c": 0, "e": "Para envíos internacionales solo se puede emitir certificación de imposición, que debe visarse en el consulado del país.", "pag": 209}, {"p": "¿Qué código acompaña a la prueba de entrega electrónica (PEE) para garantizar su integridad?", "o": ["Un código OB de 23 dígitos", "Un código seguro de verificación (CSV)", "Un código PIN de un solo uso", "Un código RFID"], "c": 1, "e": "La PEE va acompañada de un código seguro de verificación (CSV) firmado electrónicamente.", "pag": 210}, {"p": "En el servicio de retorno de información, ¿cuántos días después del depósito se detectan los envíos sin resultado informado?", "o": ["60 días naturales", "30 días naturales", "40 días naturales", "15 días naturales"], "c": 2, "e": "Tras 40 días naturales desde el depósito se detectan los envíos sin resultado y se pide información a las unidades.", "pag": 211}, {"p": "En los productos propios de Correos Express, ¿cuál es la cantidad máxima de los portes al contado pagados por el receptor?", "o": ["50 euros por envío", "25 euros por envío", "100 euros por envío", "30 euros por envío"], "c": 3, "e": "Los portes al contado pagados por el receptor tienen una cantidad máxima de 30 euros por envío.", "pag": 218}, {"p": "¿Qué peso máximo admite la valija comercial de Correos Express?", "o": ["10 kg por valija", "40 kg por valija", "25 kg por valija", "5 kg por valija"], "c": 0, "e": "La valija comercial admite 10 kg por valija; el exceso se factura aparte.", "pag": 230}, {"p": "¿Qué seguro básico incluye la valija bancaria de Correos Express?", "o": ["Hasta 3000 euros a todo riesgo", "Hasta 200 euros por reconstrucción de documentos", "Hasta 101 euros por pérdida", "6,43 € por kg según la LCTTM"], "c": 1, "e": "La valija bancaria incluye trazabilidad web y un seguro básico de hasta 200 euros para reconstruir documentos.", "pag": 228}]}, {"letra": "C", "titulo": "eCommerce y nuevas líneas de negocio", "paginas": "233-282", "resumen": "## 1. eCommerce\n\n- **Comercio electrónico**: distribución por Internet de servicios de marketing e información de productos/servicios; con Internet se añadieron la venta en red y los medios de pago electrónicos (tarjetas). Disponibilidad **24 h / 365 días**.\n- Clasificación según destinatario final:\n\n| Modalidad | Significado | Dato clave |\n|---|---|---|\n| **B2C** | Empresa → consumidor | La **más habitual** en Internet |\n| **B2B** | Empresa → empresa | Compraventa entre negocios |\n| **C2C** | Consumidor → consumidor | El que **más impulso** ha tenido con Internet |\n| **C2B** | Consumidor → empresa | La **menos habitual** |\n| **C2B2C** | Consumidor → empresa → consumidor | Dos consumidores intercambian bienes mediante una plataforma empresarial |\n\n### 1.1. Citypaq\n- Red de **terminales automatizados** para recibir y enviar paquetes **24 h / 365 días**. Ubicados en lugares de paso (estaciones, gasolineras, supermercados, centros comerciales) o restringidos (comunidades de vecinos).\n- Alta como usuario en la **web o app de Citypaq**; para cada envío/recogida se recibe un **código de barras y un código numérico**.\n- **No se admiten** envíos con pagos o trámites (gestión en entrega/admisión, **reembolso**, **pagos aduaneros**): se rehúsan y vuelven al remitente. También se devuelven los que llegan en mal estado.\n\n**Usos de las taquillas**\n- **Recogida de compras online**: el envío está en el hueco hasta **5 días naturales**, luego pasa a **lista 15 días naturales**; si no se retira, se devuelve.\n  - Tienda **asociada**: el comprador mete su usuario Citypaq y elige terminal; **no necesita registro**.\n  - Tienda **no asociada**: se usa la **\"Dirección de compras online\"** de la app/web; requiere **registro previo** y **Citypaq favorito**.\n- **Envío de Paq Premium o Paq Estándar** (usuarios registrados): Correos notifica taquilla y código; destino península, **Canarias y Baleares**; **no a Ceuta y Melilla** (trámites aduaneros).\n- **Devoluciones a tiendas con contrato**: la tienda da un código; al indicar medidas, Correos facilita taquilla y código.\n- **Depósito de paquetería nacional y devoluciones sin registro**, solo con el número de envío (desde **noviembre de 2021** en ciertas oficinas): pulsar \"Depositar\", escanear o teclear el número, **no hace falta imprimir etiqueta**, indicar tamaño de casillero, justificante por **email**. Se puede reservar casillero por anticipado.\n- En proyecto: recogida en autoservicio vía Citypaq en algunas oficinas.\n\n**Direcciones de compras online (apertura a terceros)**\n- Envíos operados íntegramente por Correos: **código de 8 letras** + usuario/nombre/apellidos, **CITYPAQ + dirección del Citypaq**, CP/población/provincia.\n- Envíos de otros operadores que deposita Correos por acuerdo: código de 8 letras + **PRIME + dirección de la unidad operativa asociada**.\n- Envíos depositados directamente por otros operadores con acuerdo: Correos solo **cede el espacio**.\n\n### 1.1.1. Modelos y formatos Citypaq\n\n| Modelo | Huecos | Tamaños | Configuración | Pantalla | Peso módulo | Conexión |\n|---|---|---|---|---|---|---|\n| **A) Reducido (interior)** | 6 por módulo, ampliable a 30 | 4 (S, M, L, XL), fondo 40 cm | 1 control + máx. 4 expansión | TFT **7''** | 78-82 kg | Módem **3G**, 220 V |\n| **B) Estándar >30 (exterior o interior)** | 8 a 20 por módulo | 5 (XS-XL), fondo 61 cm | 1 control + 2 exp. (mín.) a 15 exp. (máx.) | TFT **12''** | 114-197 kg | Router **4G** o fibra, 230 V ±10 % |\n| **C) Estándar >30 (solo interior)** | 3 a 22 por módulo | 5 (XS-XL) | 1 control + 2 exp. (mín.) a 10 exp. (máx.) | — | — | Router 4G o fibra, 230 V ±10 % |\n\n- Modelo A: S 10x24x40, M 10x49x40, L 20x49x40, XL 60x49x40 cm; anclaje opcional a suelo o pared; amarillo o imitación madera (brillo).\n- Modelos B y C: XS 8,5x19x61, S 8,5x44x61, M 18x44x61, L 37x44x61, XL 75x44x61 cm; anclaje opcional al suelo. B amarillo brillo o mate; C amarillo mate.\n- Comunes: chapa de acero de **1,5 mm**, apertura por **código 1D/2D** (p. ej. QR) o introducción manual, llave en cerradura oculta, cierres **antipalanca**.\n\n### 1.1.2. Ecosistema Citypaq\n- **Citypaq Points**: red **PUDO** (pick up, drop off) en lugares públicos o privados. Sirve a comercio B2C (con **Correos Modify**), devoluciones C2B, C2C, C2B2C, segunda mano y como **microhub** entre empresas (radio de **1 a 5 km**).\n- **Citypaq Services**: estafeta de paquetería para centros de trabajo y comunidades de propietarios. **Universalidad 100 %**: entrega toda la paquetería (de Correos o de otros operadores), salvo envíos con trámites aduaneros. **Suscripción anual renovable** según nº de huecos (incluye instalación, soporte y mantenimiento). Se aconseja **1 hueco por cada 30 usuarios**. Registro en app o **www.citypaq.es** y asociación de la taquilla → dirección propia **PRIME**.\n- **Citypaq Partners**: uso de la red por terceros. Tres casos:\n  1. **Click & Collect** (recogida en punto de venta):\n     - **Uso compartido**: lo comparten Correos, el punto de venta y otros operadores; pago por uso de hueco, caducidad **máx. 5 días**, reserva el **mismo día**.\n     - **Uso exclusivo**: solo personal del punto de venta; condiciones, caducidad y reserva flexibles.\n     - App Citypaq Partners en tres pasos: **elegir hueco** (5 tamaños), **reservar hueco** (referencia + teléfono del destinatario, al que llega el **PIN**), **depositar** (introducir PIN).\n     - Notificaciones al comprador: **disponible, recogida, caducada**.\n  2. **Entrega de operadores logísticos**: Correos no interviene en transporte ni entrega; se exime de responsabilidad por plazos si no hay huecos adecuados (responde el operador); si no se retira, avisa al operador.\n  3. **Intercambio de bienes** entre particulares (herramientas, llaves) o profesionales (repuestos, prensa).\n\n**Citypaq Garaje**\n- Entrega en el garaje del destinatario ausente. Requiere registro en Citypaq y dispositivo **HOMYHUB**; activar **\"Entrega Segura\"** en la app o en www.homyhub.com.\n- Requisitos: hasta **30 kg**; L+A+A = **210 cm** (o **270 cm** con dimensiones extra), dimensión mayor ≤ **170 cm**.\n- El destinatario responde del estado del garaje, desactiva la alarma e impide el acceso de mascotas. Puerta monitorizada y notificaciones al móvil.\n- Plazos garantizados cuentan desde la admisión en la red; fallos de HOMYHUB → el usuario contacta con el proveedor.\n\n### 1.2. Soluciones eCommerce\n- Antes **Comandia**: plataforma global de comercio electrónico para **empresarios y autónomos** con logística integrada de Correos.\n- En **2022**, dos plataformas logísticas: **Illescas** y **Sant Esteve Sesrovires** (almacenaje, preparación y personalización de pedidos).\n- Web **www.correosecommerce.com**. Servicios: para vender en Internet (**Crear App, Crear Tienda Online, Crear Web, Vender en Marketplaces, Cross-border eCommerce**) y para comercio local (**Local eCommerce y Showcase**).\n\n**Crear App**\n- Sin conocimientos técnicos: elegir diseño → elegir y personalizar módulos → probar en **Android, iOS o Windows**.\n- **Sin planes predefinidos**: presupuesto y contrato personalizados. Adicional: paquetes de **1.000, 5.000 o 25.000 notificaciones push**.\n- Ventajas: inmediatez, diferenciación, **app nativa** (no requiere web), app personalizada, formación continua, canal de atención.\n\n**Crear tienda online**\n- Plantillas o diseño personalizado (imagen de marca, adaptación móvil/tablet, **SEO**, alta de catálogo y newsletter, medios de pago, app y redes sociales).\n- Ventajas: paquetería integrada con Correos (documentación aduanera, etiquetas), plantillas **responsive**, formación, disponibilidad 24/365.\n\n| Plan tienda | Precio | Productos activos | Extras |\n|---|---|---|---|\n| **Free** | Gratis | Hasta **10** | Hosting ilimitado, paquetería nacional, dominio *mitienda.mycorreosecommerce.com*; se cancela si no se accede en **90 días** |\n| **Basic** | **19,95 €/mes** | Hasta **200** | Otro transportista, gestión aduanera, dominio propio |\n| **Premium** | **49,95 €/mes** | **Ilimitados** | Lo anterior + emails personalizados, paquetería internacional, **multidioma y multimoneda** |\n\n(Basic y Premium: un mes gratis con plan anual.)\n\n**Crear web**\n- Registro gratuito con nombre, email y contraseña. Permite personalizar, apps de eventos, reservas, foro, SEO.\n- **Free**: **una sola página**, duración ilimitada. **Basic**: **9,95 €/mes**, páginas ilimitadas, dominio propio, apps gratuitas y Themes (en preparación).\n\n**Vender en marketplaces**\n- Más de **50 plataformas** (Amazon, eBay, Tmall). Pasos: registro, configuración, información del producto, precio, publicación. Gestión centralizada de ventas y stock. El vendedor debe estar registrado antes en el marketplace.\n\n| Plan marketplaces | Precio | Productos | Pedidos | Paquetería |\n|---|---|---|---|---|\n| **Free** | Gratis | **5** en **2** marketplaces españoles | **10** | Nacional |\n| **Basic** | 19,95 €/mes | **50** en todos los españoles | **100** | Nacional |\n| **Premium** | 49,95 €/mes | Ilimitados, nacionales e internacionales | Ilimitados | Nacional e internacional + documentación aduanera |\n\n**Cross-border eCommerce**: estudios de mercado, envíos internacionales y marketing para expandirse fuera sin operación local.\n\n**Local eCommerce**: marketplace propio para empresas, ayuntamientos o asociaciones que impulsa el comercio local; integra paquetería de **Correos y Correos Express**; varios comercios en una compra.\n\n**Showcase**: escaparate virtual de las tiendas adheridas a \"Crear tienda online\".\n\n### 1.3. Correos Market\n- Marketplace para **productores locales y rurales**, creado en **2019** (www.market.correos.es).\n- Requiere el **sello de calidad Correos Market**: productos creados y elaborados en **España**, cumplimiento sanitario y laboral, materiales naturales, origen garantizado, productores dados de alta. Categorías: **alimentación, artesanía, bebidas, belleza, moda y textil**.\n- Productor: contrato de paquetería ventajoso; Correos cobra **comisión sobre el PVP**; sin inversión, permanencia ni mínimo de ventas. Etiquetas desde el área **Merchant** (BackOffice).\n- Correos cobra el **100 %** al comprador y liquida a los **30 días**; comisiones del **3 % al 15 %**.\n- El productor tiene **48 horas** para depositar (salvo recogida esporádica). Entrega en **máx. 3 días**.\n- Modalidad **Paq Premium** (domicilio, oficina o Citypaq), o **Paq Estándar** (envío responsable) o Correos Express.\n- **Envío gratis** a partir de **20 €**. Compra en web, app u oficinas; usuario con **Correos ID** o invitado; pago con tarjeta o **PayPal**.\n- Canarias, Ceuta y Melilla: posible trámite aduanero que paga el cliente en la entrega.\n- **Desistimiento**: **14 días naturales** en embalaje original, excepto alimentos y bienes precintados desprecintados.\n- Iniciativas: \"Mi nombre es La Palma\" con **World Central Kitchen** (sello de **2022** a José Andrés), Camino Inglés, Navarra. Publicidad en Instagram. En **2022** integra la Tienda Online de Correos.\n\n### 1.4. Portal de devoluciones 2.0\n- Logística inversa nacional e internacional (**Paq Retorno** y **Paq Return Internacional**). El destinatario pide al vendedor enlace e identificador.\n- Valores añadidos (solo nacionales): **embalaje, reembolso en la admisión y seguro**.\n- Caducidad del prerregistro configurable (solo nacional): **1 semana, 2 semanas, 1 mes o 3 meses**. Peso y medidas automáticos (solo nacional).\n- **Código de uso único**, muestra caducidad del depósito, envío de etiquetas por email.\n- Etiqueta en **tinta negra**, **10 x 15 cm**, sin arrugas, sin plastificar, una sola por paquete. Si no se imprime: anotar código de **23 dígitos**. En oficina se entrega **resguardo**.\n\n### 1.5. Integración en plataformas\n- **WooCommerce, Magento y Prestashop** (gratuitas, nacional e internacional).\n- Productos: **Paq Premium** y **Paq Estándar** (Citypaq, oficina o domicilio), **Paq Standard Internacional**, **Paq Light Internacional** (solo **Prestashop y WooCommerce**), **Paq Retorno**.\n- Funciones: elegir Citypaq u oficina, generar etiqueta, solicitar recogida, seguimiento, expediciones, **multitienda**, envíos a **Portugal** y aduanas.\n\n### 1.6. Soluciones de negocio\nEntregas a pequeño comercio, hostelería (última milla), supermercados online, almacén → tienda y mercado → tienda.\n\n#### 1.6.1. Paq Farma\n- Acuerdo con **FEFE** (más de **8000 farmacias**). Web paqfarma.correos.es. Solo **medicamentos sin receta** y parafarmacia, entrega a domicilio.\n- **Urbano** (> **50.000 hab.**): registro con nº cliente, contrato y dirección; entrega **mismo día o día siguiente**; se solicita recogida.\n- **Rural** (≤ 50.000 hab.): **recogida prefijada** varios días a la semana.\n\n#### 1.6.2. Correos Proximity\n- Comercio de proximidad; el comerciante mete los datos del destinatario → prerregistro y solicitud de recogida.\n- **Urbano** (capitales y poblaciones con **USE**): recogida mañana → entrega esa tarde (o misma mañana); tarde → mañana siguiente (o misma tarde).\n- **Rural**: recogida a primera hora del día siguiente con entrega por la mañana.\n- **Paq Today**: solicitud por la mañana, entrega por la tarde. **Paq Premium**: solicitud por la tarde, recogida a primera hora siguiente.\n- **Excluidos**: productos con temperatura controlada (→ Paq Frío) y turno nocturno. Incluidos: **OTC**, parafarmacia, ferretería, droguería, textil, electrodomésticos, papelería, menaje.\n\n#### 1.6.3. Solución SAC\n- Devolución en Citypaq, oficina o recogida a domicilio; cambio/sustitución (economía circular, trueque); **reparación con sustitución temporal**; intercambio de documentos para firma.\n- Adicionales: reembolso, gestión en entrega y admisión, **prueba de entrega electrónica**.\n\n#### 1.6.4. Gran Bulto\n- Con **GOI** (distribución de palés). Entrega el mismo día con franja horaria y valoración; seguimiento en tiempo real.\n- Servicios: **última milla de voluminosos**, **GOI instalaciones** (montaje, desmontaje, retirada a reciclaje), **instalaciones oficiales** (gama **marrón**: imagen y sonido; gama **blanca**: cocina, limpieza, frío, ventilación).\n- Contrato por duplicado; el cliente recibe **dos facturas** (Correos por comisión y GOI por el servicio); posventa exclusiva de GOI.\n\n#### 1.6.5. Correos Frío – Paq Frío\n- Envío a temperatura controlada (**frío pasivo**) con cajas isotermas sensorizadas y **datalogger**; flota con certificación **ATP**; tecnología **IoT** con alertas por SMS/email (hasta 5 días).\n- Puerta a puerta con recogida a domicilio; entrega siempre en domicilio indicado en **Mi Oficina**; el repartidor muestra el datalogger; la caja vuelve a Correos.\n- Rangos: **-20 ºC, 2-8 ºC, 15-25 ºC**, durante **48 h o hasta 120 h**. Piloto en el **Hospital Infanta Cristina** (Madrid).\n- Ámbito: origen península o Baleares; destino península, Baleares y **Andorra**. No Canarias, Ceuta, Melilla ni Portugal peninsular.\n\n| Zona | Ámbito |\n|---|---|\n| Zona 1 | Misma provincia |\n| Zona 2 | Provincias limítrofes |\n| Zona 3 | Intrapeninsular y Andorra |\n| Zona 4 | Baleares |\n\n- Plazo **24-48 h** (Paq Premium a domicilio PK); **2 intentos**, solo domicilio, **permanencia en lista cero**, devolución en **24 h**. Dirección de recogida no modificable.\n- Peso máx. **30 kg**; alimentación hasta **40 kg** (con embalaje y acumuladores). Cajas con certificación **ISTA** (Neopor, paneles VIP, acumuladores, datalogger con RFID).\n\n| Caja | Farmacia/salud (hasta 120 h) | Alimentación (hasta 48 h) |\n|---|---|---|\n| Pequeña | 36x36x37 cm; 4,57 l; 8,5 kg | 45x45x35 cm; 9,2 l; 9,7 kg |\n| Mediana | 42x43x43 cm; 11,69 l; 13,4 kg | 45x45x43 cm; 21,1 l; 14,2 kg |\n| Grande | 47x47x48 cm; 22,18 l; 17,9 kg | 68x49x44 cm; 52,2 l; 22,8 kg |\n\n- Salud: **RD 782/2013** y certificación **GDP**. Soluciones: **Cold Chain** (B2B, recogida y entrega en el día) y **Farmacia hospitalaria** (B2C al domicilio del paciente).\n- Alimentación: distribución mayorista B2B (**HORECA**), servicios de proximidad B2C (combinable con **Publibuzón** y **Publicity**), sector Gourmet/eCommerce (Correos Market; nacional, Portugal peninsular y Andorra).\n- **Servicios puntuales** (sin contrato) desde Mi Oficina: solo **2-8 ºC y 15-25 ºC**.\n- Valores añadidos: reembolso, **valor declarado hasta 6.000 €**, PEE, entrega exclusiva, franja horaria, intentos parametrizables, logística inversa, entrega por la tarde.\n\n| Garantía | Indemnización | Plazo de reclamación |\n|---|---|---|\n| Demora | Devolución de la tarifa (admisión antes de **16:00 h**) | 3 a **21 días** desde la entrega |\n| Deterioro | **6,43 €/kg**, mín. **40 €** (sin contrato) | **7 días naturales** desde la entrega |\n| Extravío | 6,43 €/kg + tarifa, mín. 40 € (o tarifa + valor declarado) | 3 días a **1 año** desde la admisión |\n\n- Según la **LCTTM**, 6,43 €/kg; envíos admitidos en 2021: **6,28 €**.\n\n#### 1.6.6. Servicio especial de paquetería (iPaq)\n- **2022**: recogida a domicilio para particulares que contratan **online** (web o Mi Oficina). Correos imprime la etiqueta. Máx. **20 kg**; inicialmente península y Baleares. También se puede depositar en oficina.\n- **2 intentos** bajo firma; si falla, aviso y **15 días** en oficina (+15 en iPaq Peregrino Oficina). Valor declarado hasta **6000 €**.\n- **iPaq Domicilio/Oficina**: estándar, **48-72 h**. **iPaq Plus**: urgente, **24-48 h** (Correos Modify en Plus Domicilio). **iPaq Peregrino** de 15 o 25 kg. Hora límite en origen **13 h**.\n\n| Tramo | Peso | Medidas |\n|---|---|---|\n| XS | 2 kg | 30x20x20 cm |\n| S | 5 kg | 35x35x24 cm |\n| M | 10 kg | 40x40x37 cm |\n| L | 20 kg | 55x55x39 cm |\n| Peregrino pequeño | 15 kg | 55x35x25 cm |\n| Peregrino grande | 25 kg | 55x60x39 cm |\n\nMedidas mínimas: 10 x 15 x 1 cm.\n\n#### 1.6.7. Correos Logística\n- **2022**, logística integral para **pymes y autónomos**: Correos Frío, venta sin comisiones en Correos Market, asesores, recepción, almacenaje, software de almacén, preparación, transporte (incluido gran bulto y transporte dedicado), trazabilidad, envíos XL y soluciones End to End con **Correos Cargo**. Campaña **#LaFuerzaDeUnPaís**.\n\n## 2. Acuerdos estratégicos y alianzas\n\n### 2.1. EPG e Interconnect\n- **EPG**: **27 países y 28 operadores**; fundado en **1996** por nueve países del norte de Europa, inicialmente **B2B**; hoy la mayor demanda es **B2C**.\n- Obligaciones: estándares de calidad, intercambio telemático y respuesta a reclamaciones en **máx. 48 h**.\n- Fórmula **D + n** (D = día de depósito; n = días hábiles):\n\n| Plazo | Destinos en España |\n|---|---|\n| D+1 | Principales ciudades peninsulares |\n| D+2 | Resto de península, Ceuta, Melilla y Palma de Mallorca |\n| D+3 | Resto de Baleares, Tenerife y Las Palmas de Gran Canaria |\n| D+4 | Resto de Canarias |\n\n- **Pagos por objetivos**; penalizaciones de hasta el **100 %** del envío. Reclamaciones por **Rugby** (24/365, respuesta < 48 h).\n- La **IPC** apoyó a EPG, pero desde **diciembre de 2021** **Interconnect** gestiona todo su tráfico: **34 operadores**; niveles **Premium** (firma, 30 kg), **Estándar** (seguimiento, 2 o 30 kg) y **Económico** (sin seguimiento, 2 kg). Correos lo distribuye sin comercializarlo, como Paq Light Internacional (hasta 2 kg, sin firma).\n\n### 2.2. KPG: Kahala Post Group\n- **11 operadores** (Australia, Canadá, Corea del Sur, China, España, EE. UU., Francia, Hong Kong, Japón, Reino Unido, Tailandia); 328 millones de puntos de entrega; ~**76 %** de los **EMS** que recibe Correos vienen de estos países.\n- **Calculador de garantías (GC)**, integrado en **IRIS**; si se incumple el plazo, se devuelve la **tarifa íntegra**.\n- Calidad EMS **95 %**: **D+3** intra Asia y **D+5** en cualquier CP, en tres etapas (*legs*). Controles semanales con **IRIS, SGIE, Mercurio y HUB Postal**.\n\n### 2.3. Alibaba (Aliexpress)\n- Acuerdo con **Cainiao** en **2015**; extendido a **Tmall Global** en **2016**.\n- Envíos por **Correos Economy** (ordinario, bajo valor) o **Paq Standard** (trazabilidad completa; < **14 días** en el **90 %** de los casos).\n- Tmall Global: solo empresas extranjeras; envíos a China por **EMS** (directo o marítimo con zona franca).\n- **2019**: nuevo acuerdo para pymes (Europa y Latinoamérica); **Aliexpress Business** (mercados chino y ruso).\n\n### 2.4. Amazon\n- Correos distribuye la paquetería de Amazon en España. Acuerdo de **diciembre de 2014**: recogida en oficina; identificación con documento y nº de seguimiento (se puede autorizar a tercero); permanencia **15 días**. Renovado en **2019** por 3 años; también Citypaq.\n- Red: ~**2400 oficinas**, más de **5000 Citypaq** y más de **30.000 carteros**.\n\n### 2.5. Wallapop\n- Más de 15 millones de usuarios. **Wallapop Envíos**: dinero retenido en **Wallapay**; el vendedor entrega en Correos en **5 días naturales**; llegada en < **48 h** con **Paq Premium**.\n- Incidencias: Gestión de Estacionados de **Mi Oficina**. Península y Baleares.\n- Máx. **30 kg**; L+A+A ≤ **210 cm**, lado mayor ≤ **120 cm**.\n\n### 2.6. Todocolección\n- Portal de Málaga (antigüedades, coleccionismo). Objetivo: **50 %** de sus envíos por Correos (más de 2 millones/año).\n- Tarifas de **Paq Estándar**; asegurado hasta **200 €** gratis; de 200 a 6000 €, suplemento **0,45 %** (mín. **2,42 €**).\n\n### 2.7. Portugal\n- **Correos Express Portugal** (2019): compra del **51 %** de **Rangel Expresso** por **11 millones €**; primera operación internacional; envíos en 24 h en la península. ~135 trabajadores, 11 instalaciones (+55 en España). Particulares 15 % frente a empresas 85 %.\n\n### 2.8. Vinted\n- **Envío estándar** (como Paq Estándar): código y etiqueta prerregistrada; pago con tarjeta, PayPal, Apple Pay o saldo Vinted; \"Marcar como enviado\" a los **3 días**; si no hay seguimiento en **4 días**, se cancela. Tasa de protección: **0,70 € + 5 %**.\n- **Envío personalizado**: otra mensajería o precio de envío superior.\n\n### 2.9. Correos Cargo\n- **2022**, transporte aéreo América Latina–Europa–Asia. Acuerdo con **Ávoris** (Grupo Barceló) y **Iberojet**: ruta **Madrid–Hong Kong**, Airbus A330 **\"Milana Bonita\"**, **50 toneladas**, 2 vuelos semanales (lunes y viernes); previsión de 3 aviones en 2024. Correos gestiona aduanas.\n\n## 3. Programas medioambientales\n\n### 3.1. Huella de carbono\n- Opción **\"neutro en carbono\"** (compensación de CO2, logotipo especial). Calculadora según **ISO 14040** y **PCR**; reparto a pie con cero emisiones; energía **100 % renovable**; La Hora del Planeta.\n- **Cumbre del Clima 2019**: Compromisos 2030 (neutro en carbono y **Residuo Cero**, **50 %** de la flota con tecnologías alternativas).\n- Iniciativas: **Protest Stamps**, **Redondeo Climático** (de **10 a 49 céntimos**, pago con tarjeta), \"No todo es urgente, cuidar el planeta sí\", **Green Postal Day** (IPC SMMS, 2019), campaña \"Difíciles de ver\".\n\n### 3.2. RAEE\n- Logística inversa de aparatos eléctricos y electrónicos: el consumidor entrega el aparato viejo al repartidor con el mismo embalaje o lo deposita en oficina o Citypaq privado.\n\n### 3.3. Proyecto CURMOS\n- **Correos Urban Mobile Sensor**: sensores en los carros de los carteros que miden la calidad del aire. **Málaga**: premio \"Ciudad Sostenible\" (Calidad del Aire) en **2018**.\n\n### 3.4. POSTLowCIT\n- Proyecto **CEF** de la Agencia Europea de Innovación: vehículos de energías alternativas. Tres partes: control de distribución, vehículos eléctricos/autogás y red más eficiente. **Premio Semana Española de la Movilidad Sostenible 2021**.\n\n### 3.5. Scoobic\n- Vehículo eléctrico de **Passion Motorbike Factory** (Sevilla), ganador del **Reto Lehnica 2018**. Filtra partículas; **1000 l y 750 kg**; se convierte en carretilla; **300 km** de autonomía.\n- **2021**: Correos se une a la **Alianza Europea de Baterías**. Piloto de carros asistidos con **Mooevo** (pusherboard) y Scoobic (patinete): 1 año, **48 unidades** en 7 localidades.\n- **2020**: tres ciclomotores isotérmicos para el Mercado Delicias de **Zaragoza** (1400 l, 100 km).\n\n### 3.6. NUUK CargoPro\n- Motos eléctricas **ciberseguras** (NUUK Mobility Solutions): **120 km** de autonomía, baúl de **180 l**, telemetría y geolocalización; test **Eurocybcar** (normativa UNECE/R155). A finales de 2022: **2700** vehículos ecológicos.\n\n## Claves para el examen\n- Citypaq: hueco **5 días naturales** + lista **15 días**; no admite reembolso, aduanas ni envíos a **Ceuta y Melilla**.\n- Modelos Citypaq: reducido **7''**, 4 tamaños, máx. 30 huecos; estándar **12''**, 5 tamaños (XS-XL); acero de 1,5 mm.\n- Citypaq Services: **1 hueco por cada 30 usuarios**, suscripción anual; Partners compartido: caducidad máx. **5 días**.\n- Citypaq Garaje: **HOMYHUB**, 30 kg, 210/270 cm, lado mayor 170 cm.\n- Tienda online: Free **10** productos (90 días sin acceso → baja), Basic **19,95 €** (200), Premium **49,95 €** (ilimitados). Crear web Basic **9,95 €**.\n- Correos Market (**2019**): envío gratis desde **20 €**, comisiones **3-15 %**, liquidación a 30 días, depósito en **48 h**, desistimiento **14 días**.\n- Portal de devoluciones: etiqueta **10x15 cm** en negro; código de **23 dígitos**.\n- Paq Farma: urbano > **50.000 hab.**; FEFE > 8000 farmacias.\n- Paq Frío: **-20 / 2-8 / 15-25 ºC**; 30 kg (alimentación 40 kg); lista cero, devolución en 24 h; deterioro **6,43 €/kg**, mín. 40 €.\n- iPaq: máx. **20 kg**; estándar 48-72 h, Plus 24-48 h; Peregrino **15/25 kg**.\n- EPG: reclamaciones en **48 h** (Rugby); D+1 a D+4. KPG: **11 operadores**, GC en **IRIS**.\n- Wallapop: 5 días para entregar, 30 kg, 210 cm/120 cm. Vinted: **0,70 € + 5 %**. Amazon: **15 días** en oficina.", "preguntas": [{"p": "¿Qué modalidad de comercio electrónico es la menos habitual en Internet?", "o": ["B2C (Business to Consumer)", "C2B (Consumer to Business)", "C2C (Consumer to Consumer)", "B2B (Business to Business)"], "c": 1, "e": "El temario indica que C2B es la modalidad menos habitual, frente a B2C, la más habitual.", "pag": 235}, {"p": "En la recogida de compras online en Citypaq, ¿cuánto tiempo permanece el envío en el hueco antes de pasar a lista?", "o": ["Hasta tres días naturales", "Hasta cinco días naturales", "Hasta siete días hábiles", "Hasta quince días naturales"], "c": 1, "e": "El envío permanece en el hueco hasta cinco días naturales y después pasa a lista durante 15 días naturales.", "pag": 236}, {"p": "¿A qué destino NO se permite enviar Paq Premium o Paq Estándar contratado desde Citypaq?", "o": ["Islas Canarias", "Islas Baleares", "Península", "Ceuta y Melilla"], "c": 3, "e": "No se permite a Ceuta y Melilla porque las taquillas no admiten mercancías sujetas a trámites o pagos aduaneros.", "pag": 236}, {"p": "¿Qué envíos destinados a Citypaq son rehusados por Correos y devueltos al remitente?", "o": ["Los Paq Premium dirigidos a Baleares", "Los que requieren reembolso o pagos aduaneros", "Los de tiendas no asociadas a Citypaq", "Las devoluciones de tiendas con contrato"], "c": 1, "e": "Correos no admite en Citypaq envíos que requieran pagos o trámites (reembolso, pagos aduaneros, gestión de entrega o admisión).", "pag": 236}, {"p": "Los envíos dirigidos a Citypaq llevan asociado un código de:", "o": ["Seis letras", "Ocho dígitos", "Diez caracteres alfanuméricos", "Ocho letras"], "c": 3, "e": "Tanto los envíos operados por Correos como los de otros operadores con acuerdo llevan un código Citypaq de ocho letras.", "pag": 237}, {"p": "¿De qué tamaño es la pantalla TFT del modelo reducido de Citypaq (de 6 a 30 huecos)?", "o": ["7 pulgadas", "10 pulgadas", "12 pulgadas", "15 pulgadas"], "c": 0, "e": "El modelo reducido dispone de una pantalla TFT de 7''; el estándar de más de 30 huecos la tiene de 12''.", "pag": 238}, {"p": "En Citypaq Services, ¿qué proporción de huecos se aconseja?", "o": ["Un hueco por cada 20 usuarios", "Un hueco por cada 30 usuarios", "Un hueco por cada 50 usuarios", "Un hueco por cada 15 usuarios"], "c": 1, "e": "Se aconseja un hueco por cada 30 usuarios (empleados, colaboradores o residentes) de la ubicación.", "pag": 241}, {"p": "En Citypaq Partners (Click & Collect), las taquillas de uso compartido tienen una caducidad máxima de:", "o": ["Cinco días", "Tres días", "Siete días", "Diez días"], "c": 0, "e": "En las taquillas de uso compartido se paga por uso de hueco con caducidad de máximo cinco días.", "pag": 241}, {"p": "¿Qué dispositivo debe tener instalado el cliente en su garaje para usar Citypaq Garaje?", "o": ["CITYHUB", "HOMYHUB", "SMARTPAQ", "GARAJEBOX"], "c": 1, "e": "El cliente debe registrarse en Citypaq y disponer de un dispositivo HOMYHUB instalado en el garaje.", "pag": 243}, {"p": "¿Con qué nombre se conocía anteriormente la plataforma Soluciones eCommerce de Correos?", "o": ["Comandia", "Showcase", "Local eCommerce", "Tienda Correos"], "c": 0, "e": "Soluciones eCommerce se conocía anteriormente como Comandia.", "pag": 244}, {"p": "¿Cuántos productos activos permite gestionar el plan FREE de Crear tienda online?", "o": ["Hasta 5", "Hasta 50", "Hasta 200", "Hasta 10"], "c": 3, "e": "El plan Free permite gestionar hasta 10 productos activos; el Basic, hasta 200.", "pag": 246}, {"p": "¿Cuál es la tarifa mensual del plan BASIC de Crear web?", "o": ["19,95 € al mes", "4,95 € al mes", "9,95 € al mes", "49,95 € al mes"], "c": 2, "e": "El plan Basic de Crear web cuesta 9,95 € al mes, con un mes gratis con pago anual.", "pag": 248}, {"p": "¿Qué ofrece el plan FREE de Vender en marketplaces?", "o": ["Publicar hasta 10 productos en 5 marketplaces españoles", "Publicar hasta 50 productos en todos los marketplaces españoles", "Publicar hasta 5 productos en 2 marketplaces españoles", "Publicar hasta 5 productos en marketplaces internacionales"], "c": 2, "e": "El plan Free permite publicar hasta cinco productos en dos marketplaces españoles y gestionar hasta 10 pedidos.", "pag": 249}, {"p": "En Correos Market, las comisiones que se liquidan al vendedor pueden oscilar entre:", "o": ["El 1 % y el 10 % de las ventas", "El 5 % y el 20 % de las ventas", "El 3 % y el 15 % de las ventas", "El 3 % y el 10 % de las ventas"], "c": 2, "e": "Correos liquida a los 30 días las comisiones, que según contrato oscilan entre el tres y el quince por ciento.", "pag": 252}, {"p": "Si en el Portal de devoluciones 2.0 no se puede imprimir la etiqueta, ¿qué debe anotarse?", "o": ["El código del envío de 13 dígitos", "El identificador de devolución de 16 dígitos", "El código de uso único de 8 letras", "El código del envío de 23 dígitos"], "c": 3, "e": "Si no se puede imprimir la etiqueta, deberá anotarse el código del envío de 23 dígitos.", "pag": 254}, {"p": "En la integración de Correos en plataformas de tiendas online, el Paq Light Internacional solo está disponible para:", "o": ["Prestashop y WooCommerce", "Magento y Prestashop", "WooCommerce y Magento", "Magento únicamente"], "c": 0, "e": "El texto precisa que Paq Light Internacional está disponible solo para Prestashop y WooCommerce.", "pag": 255}, {"p": "Para Paq Farma, se considera entorno urbano el de las farmacias con una población superior a:", "o": ["20.000 habitantes", "30.000 habitantes", "100.000 habitantes", "50.000 habitantes"], "c": 3, "e": "Entorno urbano: población superior a 50.000 habitantes; rural: igual o inferior a esa cifra.", "pag": 256}, {"p": "Señale qué producto NO está incluido en Correos Proximity:", "o": ["Medicamentos de venta libre (OTC)", "Productos de ferretería y droguería", "Productos que requieren temperatura controlada", "Menaje del hogar y papelería"], "c": 2, "e": "Los productos con temperatura controlada quedan fuera de Proximity; para ellos se creó el Paq Frío.", "pag": 257}, {"p": "¿Con qué empresa colabora Correos en el servicio Gran Bulto?", "o": ["GOI", "Cainiao", "Ávoris", "Rangel Expresso"], "c": 0, "e": "Correos colabora con GOI, empresa de distribución de palés, en el campo de los envíos voluminosos.", "pag": 258}, {"p": "¿Qué rangos de temperatura puede elegir el remitente en Correos Frío para el servicio de farmacia y salud?", "o": ["-18 ºC, entre 0 y 4 ºC o entre 10 y 20 ºC", "-20 ºC, entre 2 y 8 ºC o entre 15 y 25 ºC", "-20 ºC, entre 0 y 6 ºC o entre 15 y 20 ºC", "-10 ºC, entre 2 y 8 ºC o entre 18 y 25 ºC"], "c": 1, "e": "Los tres rangos son -20 ºC, entre 2 y 8 ºC y entre 15 y 25 ºC, con mantenimiento hasta 120 h.", "pag": 260}, {"p": "¿Qué ocurre con un envío de Paq Frío que no ha podido entregarse?", "o": ["Pasa a lista durante 7 días naturales", "Pasa a lista durante 15 días naturales", "No pasa a lista y se devuelve al remitente en 24 h", "Se deposita en el Citypaq más cercano 48 h"], "c": 2, "e": "El plazo de permanencia en lista es cero y se devuelve en 24 h para conservar la cadena de frío.", "pag": 260}, {"p": "¿Cuál es el peso máximo admitido en Paq Frío para servicios de alimentación, contando embalaje, acumuladores y producto?", "o": ["30 kg", "35 kg", "25 kg", "40 kg"], "c": 3, "e": "El peso máximo general es 30 kg, pero para alimentación se admite hasta 40 kg con embalaje, acumuladores y producto.", "pag": 260}, {"p": "En el servicio especial de paquetería (iPaq), ¿qué modalidad corresponde a envíos urgentes con entrega en 24-48 horas?", "o": ["iPaq Domicilio / iPaq Oficina", "iPaq Peregrino de 15 kg", "iPaq Peregrino de 25 kg", "iPaq Plus Domicilio / iPaq Plus Oficina"], "c": 3, "e": "iPaq Plus es la modalidad urgente (24-48 h); iPaq Domicilio/Oficina es la estándar (48-72 h).", "pag": 265}, {"p": "Según los plazos EPG en España, ¿a qué destinos corresponde D + 3?", "o": ["Principales ciudades peninsulares", "Resto de Baleares, Tenerife y Las Palmas de Gran Canaria", "Ceuta, Melilla y Palma de Mallorca", "Resto de las islas Canarias"], "c": 1, "e": "D + 3 se aplica al resto de Islas Baleares, Tenerife y Las Palmas de Gran Canaria.", "pag": 267}, {"p": "¿Cuántos operadores públicos postales forman Kahala Post Group?", "o": ["9", "27", "11", "34"], "c": 2, "e": "KPG está formado por 11 operadores públicos postales, entre ellos España.", "pag": 268}, {"p": "¿En qué año suscribieron Correos y Cainiao el acuerdo para acelerar las entregas de Aliexpress?", "o": ["2014", "2015", "2016", "2019"], "c": 1, "e": "El acuerdo de colaboración estratégica con Cainiao se firmó en 2015 y en 2016 se extendió a Tmall
