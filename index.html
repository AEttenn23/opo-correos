enero.", "pag": 393}, {"p": "Si un apartado no renovado no se ha dado de baja, IRIS lo da de baja por un proceso interno pasados:", "o": ["30 días desde la fecha de renovación", "44 días desde la fecha de renovación", "58 días desde la fecha de renovación", "60 días desde la fecha de renovación"], "c": 1, "e": "Si pasados los 44 días desde la fecha de renovación no se ha dado de baja, IRIS lo hará automáticamente.", "pag": 394}, {"p": "Cuando un apartado de Franqueo en Destino se da de baja por no haberse renovado a tiempo:", "o": ["Se devuelve la fianza íntegra tras liquidar los envíos pendientes", "Se devuelve el 50 % de la fianza al titular", "La fianza no se devuelve y Correos se la queda como compensación", "La fianza se traslada al siguiente titular del apartado"], "c": 2, "e": "La fianza no se devuelve: Correos se la queda como compensación por mantener activo el servicio.", "pag": 397}, {"p": "En el Reenvío postal contratado en oficina, IRIS no permite fijar una fecha de inicio posterior a:", "o": ["15 días", "60 días", "7 días", "30 días"], "c": 3, "e": "El plazo máximo para empezar a prestarse es de un mes; IRIS no permite inicio posterior a 30 días.", "pag": 399}, {"p": "En la modalidad de Reenvío postal por cambio de dirección definitivo, una vez transcurrido el período contratado:", "o": ["La correspondencia se devuelve al remitente", "La correspondencia se entrega en el domicilio inicial", "La correspondencia se deposita en un apartado postal", "El servicio se renueva automáticamente"], "c": 0, "e": "En el definitivo se devuelve al remitente; en el temporal se entrega de nuevo en el domicilio inicial.", "pag": 399}, {"p": "¿Cuántos titulares particulares pueden solicitar simultáneamente el Reenvío postal si comparten domicilio de origen y de reenvío?", "o": ["Hasta cinco", "Hasta seis", "Hasta cuatro", "Hasta dos"], "c": 1, "e": "Pueden solicitarlo hasta un máximo de seis titulares que compartan domicilio de origen y reenvío.", "pag": 399}, {"p": "Actualmente, ¿de qué organismos se excluyen expresamente las notificaciones del servicio de Reenvío postal?", "o": ["Seguridad Social y Ayuntamiento de Madrid", "DGT y Agencia Tributaria", "Agencia Tributaria y Ayuntamiento de Sabadell", "Juzgados y Ayuntamiento de Barcelona"], "c": 2, "e": "Se excluyen las notificaciones pactadas: actualmente las de la Agencia Tributaria y el Ayuntamiento de Sabadell.", "pag": 400}, {"p": "Respecto a la modificación de datos erróneos de un contrato de Reenvío postal, es correcto que:", "o": ["Todas las modificaciones tienen coste", "Puede modificarse la identidad de los titulares", "Solo puede hacerse en el mismo día de la contratación", "La primera modificación es gratuita"], "c": 3, "e": "Se pueden modificar datos que no afecten a la identidad de los titulares y la primera modificación es gratuita.", "pag": 401}, {"p": "¿Cuántas personas autorizadas pueden nombrarse como máximo por cada Buzón de vacaciones?", "o": ["Dos", "Tres", "Seis", "Una"], "c": 0, "e": "Como máximo se puede nombrar a dos personas autorizadas por buzón.", "pag": 403}, {"p": "Al finalizar el Buzón de vacaciones con modalidad de entrega a domicilio, si esta resulta fallida el envío permanece en la oficina:", "o": ["Hasta 7 días naturales", "Hasta 15 días naturales", "Hasta 30 días naturales", "Hasta 21 días naturales"], "c": 1, "e": "Se deja aviso de llegada y el envío permanece hasta 15 días naturales en la oficina.", "pag": 403}, {"p": "La anulación del Buzón de vacaciones con devolución íntegra del importe exige solicitarla:", "o": ["En cualquier oficina antes del inicio del servicio", "Hasta un día hábil antes del inicio en cualquier oficina", "El mismo día, antes del cierre contable, y en la misma oficina de contratación", "En la oficina de referencia durante la primera semana"], "c": 2, "e": "Es obligatorio solicitarla el mismo día (antes del cierre contable) y en la misma oficina de contratación.", "pag": 404}, {"p": "La certificación en la que se certifican la imposición y el texto remitido, aplicable a Telegrama y Burofax, es la:", "o": ["Certificación de imposición", "Certificación de entrega", "Certificación de intento de entrega", "Copia certificada"], "c": 3, "e": "La copia certificada certifica la imposición y el texto remitido; posterior a la admisión se llama certificación de contenido.", "pag": 406}, {"p": "Para que una certificación de un envío dirigido fuera de España sea válida, el cliente debe:", "o": ["Pedir que la visen en el consulado del país de destino en España", "Solicitar su apostilla en la Subdirección de Filatelia", "Enviarla a la UPU para su validación", "Solicitarla siempre a través de Mi Oficina"], "c": 0, "e": "Debe dirigirse al consulado del país de destino en España y solicitar que le visen la certificación.", "pag": 406}, {"p": "La certificación en Mercurio solo puede hacerla un usuario con el perfil especial de:", "o": ["Supervisor", "Certificador", "Jefe de equipo", "Administrador"], "c": 1, "e": "En Mercurio la certificación la realiza un usuario con el perfil especial de \"Certificador\".", "pag": 409}, {"p": "Si la documentación necesaria para emitir una certificación se encuentra en la Gerencia de Área o el almacén general, el plazo de entrega es de:", "o": ["Un día hábil", "Siete días hábiles", "Cuatro días hábiles", "Dos días hábiles"], "c": 2, "e": "Si la documentación está en otra dependencia, el plazo es de cuatro días hábiles.", "pag": 410}, {"p": "Los vales UPU canjeados en las oficinas se envían a final de mes para su control a:", "o": ["La Subdirección de Filatelia", "La Gerencia de Área", "La oficina internacional de la UPU", "El Almacén de Filatelia"], "c": 3, "e": "El director los almacena y se envían a final de mes al Almacén de Filatelia.", "pag": 412}, {"p": "La certificación de los embalajes de Correos que garantiza que el material procede de bosques gestionados de forma responsable es:", "o": ["FSC", "Ecolabel", "PEFC", "ISO 14001"], "c": 0, "e": "Las cajas cuentan con certificado FSC, que garantiza que el material procede de bosques gestionados responsablemente.", "pag": 413}, {"p": "La caja ecológica supergrande de Línea Bosques mide:", "o": ["500 x 300 x 300 mm", "590 x 390 x 390 mm", "390 x 280 x 190 mm", "720 x 390 x 390 mm"], "c": 1, "e": "La supergrande mide 590 x 390 x 390 mm, en cartón doble y con cierre de solapas clásicas.", "pag": 413}, {"p": "El pack postal papel de Correos contiene:", "o": ["Un pliego de burbujas de 100 x 60 cm y dos etiquetas", "Dos pliegos de Kraft de 100 x 60 cm y cuatro etiquetas", "Tres pliegos de Kraft de 100 x 70 cm, cinta adhesiva y cuatro etiquetas", "Tres pliegos de Kraft de 70 x 50 cm y dos etiquetas"], "c": 2, "e": "Incluye tres pliegos de papel Kraft de 100 x 70 cm, un rollo de cinta y cuatro etiquetas autoadhesivas.", "pag": 416}, {"p": "Respecto a los embalajes prefranqueados de Correos, es correcto que:", "o": ["El signo de franqueo tiene valor facial y caduca al año", "Solo pueden usarse para envíos internacionales", "Requieren completar el franqueo con sellos adicionales", "El signo de franqueo carece de valor facial y no tiene caducidad"], "c": 3, "e": "El signo de franqueo está preimpreso, carece de valor facial y no tiene caducidad.", "pag": 416}, {"p": "El sobre certificado prepagado con AR mide 135 x 150 mm y admite un peso de hasta:", "o": ["50 g", "20 g", "100 g", "200 g"], "c": 0, "e": "El certificado prepagado con AR admite hasta 50 g.", "pag": 417}, {"p": "¿Cómo se llama el portal de Correos donde se dan a conocer los productos filatélicos para coleccionistas?", "o": ["Filatelia más que coleccionismo", "El Rincón de Correos", "Sellos y mucho más", "Valores en el Tiempo"], "c": 1, "e": "El Rincón de Correos (filatelia.correos.es) da a conocer los productos para coleccionistas.", "pag": 418}, {"p": "Los Pliegos Premium se lanzaron el 6 de febrero de 2014 con la serie:", "o": ["Marca España", "Generaciones", "Arquitectura Rural", "Arquitectura Mudéjar"], "c": 2, "e": "La serie \"Arquitectura Rural\" supuso el lanzamiento de los pliegos premium el 6 de febrero de 2014.", "pag": 420}, {"p": "El libro que contiene todos los sellos de España y del correo español en Andorra emitidos en un año se denomina:", "o": ["Generaciones", "Sellos de película", "El Arte en los Sellos", "Valores en el Tiempo"], "c": 3, "e": "El libro de emisiones anuales se denomina Valores en el Tiempo.", "pag": 421}, {"p": "Señale la afirmación INCORRECTA sobre las pruebas de artista:", "o": ["Son válidas para el franqueo por su alto valor filatélico", "Son impresiones calcográficas previas a la impresión de algunos sellos", "Su tirada es muy reducida", "Permiten al grabador comprobar la exactitud del grabado"], "c": 0, "e": "Las pruebas de artista no son válidas para el franqueo, aunque tienen alto valor filatélico.", "pag": 422}, {"p": "¿Cuál es el número máximo de etiquetas ATM por sesión de la máquina?", "o": ["500", "875", "1000", "750"], "c": 1, "e": "La secuencia impresa indica el número de etiqueta dentro de la sesión, con un máximo de 875 etiquetas.", "pag": 423}, {"p": "Cualquier persona puede adquirir las etiquetas ATM emitidas a lo largo del año mediante pedido por un importe no superior a:", "o": ["50 € más gastos de envío", "100 € con gastos de envío incluidos", "100 € más gastos de envío", "300 € más gastos de envío"], "c": 2, "e": "Se piden en pedidos.atm@correos.com por un importe no superior a 100 € más gastos de envío.", "pag": 423}, {"p": "En una oficina postal temporal, el servicio lo presta un empleado durante un máximo de:", "o": ["Tres horas al día", "Seis horas al día", "Diez horas al día", "Ocho horas al día"], "c": 3, "e": "En las oficinas postales temporales el empleado presta servicio un máximo de ocho horas al día.", "pag": 424}, {"p": "Los matasellos de primer día de circulación permanecen en las oficinas designadas durante:", "o": ["30 días naturales", "15 días naturales", "60 días naturales", "Tres meses"], "c": 0, "e": "Se usan el primer día de puesta en circulación, con permanencia de 30 días naturales en las oficinas designadas.", "pag": 426}, {"p": "La cancelación de sobres conmemorativos con fines filatélicos fuera de las oficinas temporales es gratuita cuando el pedido es de:", "o": ["Menos de 100 unidades", "Menos de 50 unidades", "Menos de 25 unidades", "Menos de 20 unidades"], "c": 1, "e": "Es gratuita por debajo de 50 unidades; por encima se fija un precio por unidad.", "pag": 426}, {"p": "Los matasellos postales especiales, operados por personal ajeno a Correos, deben ser autorizados por:", "o": ["La Dirección Comercial", "El jefe de sector", "La Subdirección de Filatelia", "La Gerencia de Área"], "c": 2, "e": "Los matasellos especiales deben ser autorizados por la Subdirección de Filatelia.", "pag": 425}, {"p": "¿Qué blíster de sellos se comercializa con la Tarifa A?", "o": ["Pack de 5 sellos", "Pack de 25 sellos", "Pack de 10 sellos", "Pack de 50 sellos"], "c": 3, "e": "Existe el pack de 50 sellos Tarifa A (carta normalizada España).", "pag": 426}, {"p": "Las monedas de coleccionismo de capitales de provincia y ciudades autónomas que vende Correos son:", "o": ["52 monedas de plata de 5 € de valor facial", "50 monedas de plata de 10 € de valor facial", "52 monedas de oro de 20 € de valor facial", "17 monedas de plata de 5 € de valor facial"], "c": 0, "e": "Son 52 monedas de plata con valor facial de 5 €, facilitadas por la FNMT.", "pag": 427}, {"p": "En la venta de productos mediante reembolso, el pedido se da de alta en IRIS como:", "o": ["Paq Estándar contrarreembolso", "Paq Premium contrarreembolso", "Carta certificada con reembolso", "Paquete Azul contrarreembolso"], "c": 1, "e": "Una vez vendidos y embalados los productos con la factura, se da de alta como Paq Premium contrarreembolso.", "pag": 428}]}, {"letra": "F", "titulo": "Procesos operativos de admisión (I)", "paginas": "431-518", "resumen": "## 1. Envíos postales y circuito general de la correspondencia\n\n### Circuito general de la correspondencia (CGC)\n- **CGC**: conjunto de procesos que recorren los envíos desde que salen del remitente hasta que llegan al destinatario.\n- Normativa: **Ley 43/2010**, de 30 de diciembre (servicio postal universal) y **RD 1829/1999**, de 3 de diciembre (Reglamento de prestación de servicios postales).\n- Fases: **recogida, admisión, clasificación, tratamiento, curso, transporte, distribución** (por los **ACR**, Agentes de Clasificación y Reparto) y **entrega**. La Ley 43/2010 cita como proceso postal: recogida, admisión, clasificación, transporte, distribución y entrega.\n- **Admisión**: el operador recibe el envío y responde de él hasta su entrega o devolución. El envío es **propiedad del remitente** hasta que lo recibe el destinatario; puede recuperarlo o cambiar la dirección previo pago, salvo imposibilidad material.\n- En poblaciones sin oficina, la admisión puede hacerla el **personal de reparto**, informando a los vecinos de su horario de paso.\n- Dimensiones admisibles: las fijadas por normas de la **UPU** (art. 23 Ley 43/2010).\n- **Remitente**: persona física, jurídica o entidad sin personalidad de quien proceden los envíos. Origen = dirección de remite; si no consta, residencia (física) o domicilio social (jurídica).\n- Envíos internacionales: **una sola dirección de retorno en España**; prohibido admitir correspondencia internacional con retorno en un país distinto al de los signos de franqueo (si se depositan en buzón, se declaran **sobrantes**).\n- Obligaciones del operador designado (art. 23): al menos **una recogida todos los días laborables (L-V)**, incluso en zonas rurales; cobertura y accesibilidad adecuadas (también personas con discapacidad o movilidad reducida); no denegar envíos que cumplan requisitos y paguen el precio.\n\n### Modalidades de admisión y tipos de oficina\n- **Personalizada**: envíos que requieren recibo justificativo o que no caben en buzón (CAM, oficinas, servicios móviles, punto predefinido).\n- **No personalizada**: envíos sin recibo, franqueados y que caben en buzón.\n\n| Horario | Franja |\n|---|---|\n| Completo/ininterrumpido (urbano) | L-V 8:30 a 20:30 |\n| De mañana (pequeñas poblaciones/rural) | L-V 8:30 a 14:30 |\n| Centros comerciales | Hasta las 22:00, L-S y festivos de apertura |\n\n- Más de **2300 oficinas**. Telegramas, fax y burofax solo en oficinas informatizadas; **Western Union** solo en informatizadas; la **Tarjeta Correos Prepago** requiere equipo informático.\n- **Oficinas técnicas**: informatizadas, catálogo completo. **Auxiliares o rurales**: no informatizadas, dependen de una técnica, atendidas por cartero rural; amplían servicios con **HERA** (PDA); algunas sin local admiten \"al paso\". **Mixtas**: oficina + unidad de reparto. **Satélite**: informatizadas, en otro lugar, actúan como ventanilla de la principal (**oficina continente**).\n- Otros centros: **CAM** en Madrid y Barcelona; **18 CTA**, CTP, CTL y centro internacional en Barajas; más de **1700 URO** y casi cien **USE**.\n\n### 1.1. Objetos prohibidos y de circulación restringida\n- Prohibidos por seguridad, sanidad pública, utilidad general y protección del SPU (art. 15 RD 1829/1999). Art. 16 enumera, entre otros: productos en régimen de reserva sin autorización; opio, cocaína y estupefacientes (salvo fines medicinales con autorización sanitaria); envolturas que vulneren derechos fundamentales; armas (con excepciones); explosivos, inflamables y peligrosos (salvo biológicas perecederas entre laboratorios reconocidos y radiactivas de expedidores autorizados); **animales vivos** sin autorización; objetos delictivos o peligrosos para empleados; prohibidos en destino o en España.\n- Otras reglas: **baterías de litio** sueltas prohibidas por vía aérea (sí instaladas en equipo); **aerosoles nunca por vía aérea**; **restos o cenizas humanas prohibidos**; en internacional aéreo, comprobar prohibiciones del país y de la Unidad Internacional.\n\n### 1.1.1. Armas\n- Pueden circular sin guía (RD 137/1993, mod. RD 976/2011): carabinas y pistolas de aire/gas no asimiladas a escopetas, armas blancas no prohibidas, cuchillos/machetes militares o imitaciones, arcos y fusiles de pesca submarina, revólveres/pistolas detonadoras y lanzabengalas.\n- Prohibidas: armas de fuego y las de aire/gas con energía en boca **> 24,2 julios**.\n- Solo pueden remitirlas **fabricantes, distribuidoras o comercializadoras con contrato** (instrucción de 1 de junio de 2012); contenido visible en el embalaje; siempre **registradas**.\n\n### 1.1.2. y 1.1.3. Comprobación y procedimiento\n- Sospecha en origen: se pide al remitente que lo abra; si se niega, **no se admite**. Si ya salió: en destino se cita al destinatario para abrirlo; si se niega, no se entrega y se notifica a la **Secretaría General de Comunicaciones**. Igual para buzones.\n- Art. 19 RD 1829/1999: animales dañinos → autoridad correspondiente; **armas de fuego no permitidas → Guardia Civil**; explosivos/inflamables → autoridad competente; objetos constitutivos de delito → **autoridad judicial**; restos humanos → **Fuerzas y Cuerpos de Seguridad** (e informar al remitente). Sin trato específico: se devuelven a origen; si no se retiran, **sobrantes**.\n\n### 1.2. Mercancías peligrosas\n- Riesgo para salud, propiedad, seguridad o medio ambiente; especialmente en transporte aéreo.\n- No admitidas: explosivos (petardos, bengalas), gases comprimidos (butano, aerosoles, extintores), líquidos inflamables (perfumes inflamables, pinturas al óleo), sustancias inflamables (cerillas, carbones), oxidantes, tóxicas e infecciosas, radiactivas (detectores de humo), corrosivos (baterías húmedas, termómetros de mercurio), otros (productos magnetizados, baterías de litio, motores, hielo seco).\n- Normas: **UPU** y **OACI**. Admisibles: muestras de pacientes; sustancias infecciosas **categoría B (ONU3373)**, instrucción de embalaje **650**; material radiactivo ≤ **1/10** de la tabla 2-15; baterías instaladas en equipos:\n\n| Tipo | Límite por bulto | ONU / Instrucción |\n|---|---|---|\n| Ion litio en equipo | 4 pilas (≤ 20 Wh) o 2 baterías (≤ 100 Wh) | ONU 3481 / 967 |\n| Metal litio en equipo | 4 pilas (≤ 1 g) o 2 baterías (≤ 2 g) | ONU 3091 / 970 |\n\n- Admisión: el remitente declara y embala; el empleado pregunta el contenido, entrega **folleto informativo**, verifica país de destino y embalaje (BOE nº 71, 24/03/2014). No se admite embalaje reutilizado con marcas de mercancía peligrosa.\n- Deben admitirse como **envío registrado**. En **IRIS**: \"S\" = solo registrado; \"N\" = cualquier envío. El cliente firma en tableta; documentación aduanera **CN23** (fuera de la UE) o Etiqueta Comercial con Declaración de Contenido.\n- Identificación: **etiqueta verde redonda**, cursados separados.\n- Tratamiento (Unidad de Operaciones Internacionales): autorizadas → readmisión en **OCA3**; no autorizadas → carta automática de devolución; envíos **opacos** = alto riesgo (**HRCM**), reescaneo con **ETD** y perros **EDD**.\n\n### 1.3. Sistemas de franqueo y pago alternativo\n- Medios de franqueo (art. 3 Ley 43/2010): sellos, sobres/tarjetas con signos estampados, impresiones de máquinas de franquear y estampillas. Pagos alternativos: diferido, en destino y prepago (art. 36).\n- Admitidos hoy: franqueo concertado, a máquina, pagado, vales respuesta, sellos, estampillas, franqueo en destino y CCRI.\n\n#### Franqueo concertado\n- Para **publicaciones periódicas** autorizadas por la sede central; envíos ordinarios. Cubierta con \"Franqueo concertado\", nº de autorización y remitente. Depósito en la oficina del domicilio del editor o jefatura zonal; **albarán por duplicado**; facturación **mensual**.\n\n#### Franqueo a máquina\n- Máquinas digitales autorizadas; válido para todo tipo de envíos. Etiqueta o faja si no cabe la impresión (excluida la correspondencia asegurada).\n- Solo correspondencia propia, salvo **hoteles** (huéspedes), empresas (filiales indicando el nexo), publicidad directa (clientes, con nombre de la empresa) y oficinas con máquinas públicas.\n- Inspección **al menos una vez al año**. Indicia: máximo **dos marcas**, **color azul**, con **código 2D**; datos obligatorios: logotipo, producto, fecha, código país, oficina, código de máquina, contador, nube de puntos e importe.\n- Inutilización por inactividad o **12 meses** sin uso. **No se depositan en buzones**; albarán por duplicado por máquina.\n- Rechazo: fecha distinta (tolerancia **24 h** con estampación adicional de **0 €**), insuficiencia no abonada, **más de dos estampaciones**, marca ilegible, centro distinto, mal acondicionado.\n- Incidencias: insuficiencia → sellos del cliente o efectivo, ingreso, impresión adicional o Tarjeta Más Cerca (la oficina no vende sellos para completar); exceso → renunciar o franqueo inutilizado; **estampaciones no utilizadas** → devolución solicitada en **24 h**, con deducción del **10 %**, mediante escrito.\n\n#### Franqueo pagado\n- Para grandes clientes con contrato. Cartas ordinarias y certificadas, urgentes nacionales, notificaciones, Publibuzón y Publicorreo.\n- Cajetín de **50 x 20 mm** en ángulo superior derecho con cornamusa, \"España\", \"Franqueo Pagado\" y categoría (cartas o PD) en 7 mm. Remitente arriba a la izquierda. Depósito en **CAM** con albarán por duplicado.\n\n#### Vales respuesta (IRC)\n- Emitidos por la Oficina Internacional de la UPU; se **canjean solo por sellos**. En 2022: venta **3,15 €** (IVA 21 %), canje **1,75 €** (exento). Se envían a fin de mes en Paq Premium al Almacén de Filatelia (Madrid). Ruta: IRIS>>Admisión>>Venta de productos. Hoy **solo se canjean**, no se venden.\n\n#### Sellos\n- Medida general **40,9 x 28,8 mm**; fabricados por la **FNMT-RCM**; fila horizontal de 74 x 40 mm en el ángulo superior derecho. Viñetas benéficas requieren autorización y nunca llevan \"Correos\" o \"España\".\n- Emisión autorizada por resolución conjunta de subsecretarios; **Comisión Filatélica del Estado** (órgano consultivo). Programa anual: máximo **90 emisiones** salvo decisión del presidente (RD 1637/2011).\n\n#### Estampillas\n- Etiquetas autoadhesivas de máquinas estampilladoras; en desuso (SSRR y auxiliares). Comprobar nº de máquina; si son pocos envíos, fotocopiar y cursar informando a la **Jefatura de Red de Oficinas**; si son muchos, consultar antes de admitir.\n\n### 1.4. Insuficiencia de franqueo\n- Control en admisión (lo de buzón, en el **CTA**). En oficina o CAM: **no se admite** hasta completar el franqueo.\n- Buzón **con remitente**: etiqueta **T1**, importe = **doble de la insuficiencia**.\n  - **Hasta 100 g**: etiqueta **T-2 R** y devolución inmediata al remitente.\n  - **Más de 100 g**: aviso **T-3**; plazo de **10 días hábiles** para subsanar; aviso por la oficina más cercana el primer día hábil siguiente.\n  - **Más de 25 envíos** de un mismo remitente: como si superasen 100 g (T-3).\n- **Sin remitente**: T1 + etiqueta **T-2D**; se entrega al destinatario como ordinario sin cobro (pago voluntario en oficina). Internacional: T1 con fracción.\n- Envíos registrados admitidos en ventanilla no circulan tasados: responde el empleado que admite.\n\n### 1.5. Medios de pago en oficina\n- Efectivo, transferencia/ingreso, tarjeta y Tarjeta Más Cerca.\n- **Efectivo**: desde el **11/07/2021** (Ley 11/2021) prohibido para importes iguales o superiores a **999,99 €**. Excluidos: recibos de algunas entidades, DGT, Correos Pay Premium, Correos Cash, Giros OIC, reembolsos OIC y Western Union (límite **3000 €**).\n- **Tarjeta**: sin importe mínimo. Excluidos: recargas Telecor, Prepago Mastercard y Más Cerca, Giro (salvo **Correos Pay Premium**), Western Union, cobro de recibos y todo lo cobrado en **SGIE** (reembolsos, aduanas, factaje). Dispositivo: **pinpad**. Contactless sin PIN hasta **20 €** (temporalmente 50 €). Tarjeta de firma: la oficina guarda el ticket firmado. Devolución en la misma tarjeta; tras **dos intentos** fallidos, devolución manual por Finanzas.\n\n### 1.5.3. Tarjeta Más Cerca\n- Fidelización y recargable; no sirve para envío de dinero, reembolso, cobro de recibos ni su propia recarga.\n- Titular + **hasta 4 adicionales gratuitas**; titulares terminan en **múltiplos de 5**. Un DOI solo puede ser titular de un contrato.\n- Prepago: entorno cerrado, sin disposición de efectivo. La tarjeta solo contiene el número en código de barras.\n- Recarga: mínimo **1 €**, máximo **2499 €**. Límite diario: entero y **múltiplo de 5**.\n- Pago: DOI precedido de **ES**; la bolsa se paga entera.\n- Factura mensual el día 1; bonificación del **3 %** (paquetería nacional), vales de **5 €**, caducidad **90 días**, código **V001**.\n\n### 1.5.4. Transferencia\n- Resguardo validado y sellado, con fecha anterior; si la oficina no tiene cuenta, se usa la de la Intervención (IRIS>>Gestión>>Gestión de caja>>Intervención).\n\n### 1.6. Facturas\n- Obligatoria (RD 1619/2012) por importes **superiores a 400 €** (impuestos incluidos); factura simplificada hasta 400 €. Solo vía **IRIS**. Auxiliares y SSRR facturan a través de su oficina técnica (nombre, domicilio fiscal y NIF), el mismo día.\n- **Correctivas**: desde **SGTC**; generan **nota de abono** (negativa) y factura correctiva; el NIF no se cambia en oficina (área de Facturación).\n- **Extranjeros**: código ISO del país UE o **OT** si no es UE.\n- **Recapitulativas**: siempre a posteriori; tickets del **mismo mes y año**, antigüedad máxima **un año**, misma **zona impositiva** y no facturados antes.\n\n### 1.7. Venta y devolución de productos\n- Productos propios/terceros y **no valorados** (de proveedores).\n- Venta desde IRIS>>Admisión>>Venta de productos o **carrito** (\"venta de impulso\"); el carrito no vende **sellos, cupones ONCE ni lotería**. Vales Más Cerca incompatibles con promociones.\n- **Devolución**: máximo **15 días naturales**, misma oficina, ticket original y embalaje intacto. Librería: solo el mismo día (Ley de Propiedad Intelectual).\n\n### 1.8. Cierre de ventanilla\n- **Liquidación parcial**: si el cajón supera **400 €** (IRIS>>Gestión>>Gestión de Caja>>Liquidación parcial).\n- **Cierre de caja**: introducir importes de SGIE, Telecor y **WUPOS**; el \"metálico final\" se entrega al responsable.\n\n## 2. Formas de admisión de envíos\n- Puntos de acceso a la red postal: CAM, oficinas, estafetas y buzones. Alternativas: buzones, recogida a domicilio, oficinas auxiliares y SSRR, oficinas (prerregistro, formulario online, Drop & Go, Citypaq) y admisión masiva.\n\n### 2.1. Recogida en buzones\n- Cerca de **22.000 buzones** (CNMC: 24.731 en 2019; 36.693 en 2015). Solo envíos ordinarios.\n- Hora final: L-V **17:00** (jefaturas y oficinas de mañana y tarde) o **14:00** (oficinas de mañana); sábados **13:00**; domingos sin servicio.\n- Control con **Marabú 2**: una saca por buzón, se retira aunque esté vacía, lectura de códigos de buzón y saca. Lo recogido no se contabiliza; va al CTA sin matasellar en bandejas **A** (normalizado) y **B** (no normalizado). Urgentes de buzón: no tienen seguimiento.\n\n### 2.2. Recogida a domicilio\n- Para clientes con contrato; depende de la **Subdirección de Distribución**. Aplicaciones: **SGIE** y **PDA**.\n- **Estándar**: hasta **250 kg** y un palé europeo; mañana (9 a 14 h) o tarde (desde 14 h, solo **zonas 1 y 2**).\n\n| Zona | Ámbito | Turno |\n|---|---|---|\n| 1 | Urbana capital | Mañana y tarde |\n| 2 | Polígono cercano a capital | Mañana y tarde |\n| 3 | Urbana fuera de capital > 50.000 hab. | Mañana |\n| 4 | Urbana fuera de capital < 50.000 hab. | Mañana |\n| 5 | Rural | Mañana |\n\n- **Especial**: más de 250 kg; esporádica con **preaviso de 24 h**. Palé europeo: 1.288 x 800 mm.\n- Requisitos: direcciones claras, **albarán GANES** (uno por recogida esporádica), separación por producto.\n- Hojas de ruta archivadas **seis meses**. Esporádicas: impreso **SR**; claves de liquidación (concertada, anulada, reencaminada, etc.). Envío con SR y prerregistro: admisible con **HERA** sin pasar por IRIS.\n\n### 2.2.2. Servicio especial de paquetería\n- Particulares, contratación online; Península y Baleares hasta **20 kg**: **iPaq** (48/72 h), **iPaq Plus** (24/48 h, con Correos Modify), **iPaq Peregrino** (48/72 h).\n- Dos intentos; **15 días** en oficina (30 para Peregrino). Valor declarado hasta **6.000 €**. Hora límite **13:00**.\n\n| Tramo | Peso | Medidas |\n|---|---|---|\n| XS | 2 kg | 30x20x20 cm |\n| S | 5 kg | 35x35x24 cm |\n| M | 10 kg | 40x40x37 cm |\n| L | 20 kg | 55x55x39 cm |\n| Peregrino pequeño | 15 kg | 55x35x25 cm |\n| Peregrino grande | 25 kg | 55x60x39 cm |\n\n### 2.2.3. Correos Frío\n- Caja isoterma (pequeña, mediana, grande) dentro de caja de cartón; peso máximo **30 kg**; rangos -20º, 2-8 ºC y 15-25 ºC. Control con **Data Logger**; etiqueta de retorno **L3**; liquidación en PDA (Talos). Laboratorios: agrupación con código **Minerva**.\n\n### 2.3. Prerregistro en Mi Oficina\n- Con o sin contrato. Correspondencia (NV, NF, CX, UL, RV) y paquetería. Sin contrato pagan al prerregistrar (tarjeta o PayPal).\n- Margen del **5 %** en peso o dimensiones modificable en IRIS.\n\n### 2.4. Formulario online y Drop & Go\n- Solo pago en oficina (no clientes con contrato). Referencia de hasta **15** caracteres; máximo **100 destinatarios** por lista; código **FO**; caducidad **15 días**.\n- **Servicio sin espera (Drop & Go)**: requiere Tarjeta Más Cerca con prepago y check activado en SGTC; código **DG**; turno priorizado.\n- **Citypaq en oficina**: paquetería prerregistrada con email del remitente; **diez minutos** para depositar o recoger; incidencias al **CAU**.\n\n### 2.5. Oficinas auxiliares y servicios rurales\n- Rural **Tipo I** (integrado), **Tipo II** (lista propia), **Tipo III** (diferido, vía enlace).\n- Con HERA: admisión nacional, prerregistrados, venta, billetes, recibos, Correos Cash, DGT, voto por correo, leads. No pueden: **Western Union**, telegramas, burofax, internacionales.\n- Sin HERA: formularios **M11A** (nacional) y **M11i** (internacional). Con HERA: códigos temporales impresos desde SGIE (máximo **6 páginas, 96 códigos**).\n\n### 2.5.1. Operativa con HERA\n- **Correos Cash**: siempre en oficina auxiliar; cliente digital (QR, **7 días**) o no digital (solo Banco Santander). Reintegro desde el siguiente día hábil (Giro inmediato, sin PBC). Ingreso: **Giro OIC** (con PBC). Domicilio Santander: hasta **499,99 €**.\n- **DGT**: duplicado de permiso y distintivo medioambiental (entrega desde el día siguiente).\n- **Voto por correo**: DNI, pasaporte o permiso de conducir original (no necesariamente en vigor).\n\n### 2.5.2. Operativa sin HERA\n- **CN23** para Ceuta, Melilla, Andorra o Canarias. Certificadas múltiples: etiquetas **CD**, **VD** y **CU**.\n- Internacional: **CN22** hasta **300 €**; **CN23** por encima.\n- **Giros rurales**: formulario provisional por duplicado; sin PBC solo envío inmediato; liquidación diaria con la oficina técnica.\n\n## Claves para el examen\n- Horario completo L-V **8:30-20:30**; de mañana **8:30-14:30**; centros comerciales hasta **22:00**.\n- Armas de aire prohibidas si superan **24,2 julios**; armas de fuego no permitidas → **Guardia Civil**.\n- Mercancías peligrosas: **etiqueta verde redonda**, siempre **registrado**.\n- Máquina de franquear: máximo **2 marcas azules**, **12 meses** de inactividad, devolución con **10 %** de deducción.\n- Insuficiencia en buzón: **doble**; **100 g** (T-2 R/T-3); **10 días hábiles**; **más de 25 envíos**.\n- Western Union **3000 €**; efectivo limitado a **999,99 €**.\n- Más Cerca: **4 adicionales**, recarga **1-2499 €**, bonificación **3 %**.\n- Factura obligatoria **> 400 €**; devoluciones **15 días naturales**; liquidación parcial **> 400 €**.\n- Recogida estándar **250 kg**; tarde solo **zonas 1 y 2**; hojas de ruta **6 meses**.\n- Servicio especial de paquetería: **20 kg** y valor declarado **6.000 €**; Correos Frío **30 kg**.\n- Códigos: **FO**, **DG**; caducidad **15 días**; Citypaq **10 minutos**; HERA **96 códigos**.\n- CN22 hasta **300 €**; Correos Cash digital **7 días**; giro a domicilio **499,99 €**.", "preguntas": [{"p": "¿Cuál es el horario de las oficinas de horario completo o ininterrumpido?", "o": ["De lunes a viernes de 8:30 a 14:30", "De lunes a viernes de 9:00 a 21:00", "De lunes a viernes de 8:30 a 20:30", "De lunes a sábado de 8:00 a 20:00"], "c": 2, "e": "Las oficinas de horario completo en zonas urbanas abren de lunes a viernes de 8:30 a 20:30.", "pag": 436}, {"p": "No pueden circular por Correos las armas accionadas por aire u otro gas comprimido cuando la energía cinética del proyectil en boca excede de:", "o": ["24,2 julios", "20,4 julios", "42,2 julios", "12,2 julios"], "c": 0, "e": "Quedan excluidas las armas de aire o gas comprimido cuya energía en boca exceda de 24,2 julios.", "pag": 440}, {"p": "Según el art. 19 del RD 1829/1999, los objetos relacionados con armas de fuego no permitidas se entregan a:", "o": ["La autoridad judicial competente", "La Guardia Civil", "La Secretaría General de Comunicaciones", "La Policía Local"], "c": 1, "e": "El reglamento establece que los objetos relacionados con armas de fuego no permitidas se entregan a la Guardia Civil.", "pag": 440}, {"p": "¿Cuántas pilas o baterías de ion litio instaladas en un equipo (ONU 3481) pueden ir como máximo en un solo bulto?", "o": ["2 pilas (≤ 20 Wh) o 4 baterías (≤ 100 Wh)", "4 pilas (≤ 1 g) o 2 baterías (≤ 2 g)", "6 pilas (≤ 20 Wh) o 3 baterías (≤ 100 Wh)", "4 pilas (≤ 20 Wh) o 2 baterías (≤ 100 Wh)"], "c": 3, "e": "Para ion litio instaladas en equipo se admiten como máximo 4 pilas de hasta 20 Wh o 2 baterías de hasta 100 Wh (instrucción 967).", "pag": 443}, {"p": "Los envíos que contienen mercancías peligrosas admisibles se identifican mediante:", "o": ["Una etiqueta verde redonda", "Una etiqueta roja triangular", "Una etiqueta naranja cuadrada", "Una etiqueta amarilla rectangular"], "c": 0, "e": "Se identifican con una etiqueta verde redonda y se cursan separados del resto.", "pag": 445}, {"p": "Al admitir un envío, si en IRIS se marca \"S\" en la pregunta sobre mercancías peligrosas:", "o": ["Solo se puede admitir como envío ordinario", "Se bloquea la admisión de cualquier envío", "Se debe admitir obligatoriamente como urgente", "Solo se puede admitir como envío registrado"], "c": 3, "e": "Marcando \"S\" el envío solo puede admitirse como registrado; con \"N\" se permite cualquier tipo de envío.", "pag": 444}, {"p": "Cuando el titular de una máquina de franquear solicita la devolución de estampaciones no utilizadas, con carácter general se deduce en concepto de gestión:", "o": ["El 5 % del importe inutilizado", "El 10 % del importe inutilizado", "El 15 % del importe inutilizado", "El 20 % del importe inutilizado"], "c": 1, "e": "La devolución, pedida en las 24 horas siguientes, lleva una deducción general del 10 % del importe.", "pag": 450}, {"p": "¿Cuál es el valor de canje de un vale respuesta internacional (2022)?", "o": ["1,75 €, exento de IVA", "3,15 €, IVA incluido", "1,50 €, exento de IVA", "2,10 €, IVA incluido"], "c": 0, "e": "En 2022 el precio de venta era 3,15 € y el valor de canje 1,75 €, exento de IVA.", "pag": 451}, {"p": "En un envío con remitente insuficientemente franqueado depositado en un buzón, la tarifa que se indica en la etiqueta T1 es:", "o": ["El importe exacto de la insuficiencia", "El doble de la insuficiencia", "El triple de la insuficiencia", "La insuficiencia más un 10 %"], "c": 1, "e": "La etiqueta T1 indica la cantidad a abonar, que es el doble de la insuficiencia.", "pag": 455}, {"p": "En envíos de más de 100 g insuficientemente franqueados, el aviso T-3 advierte que el envío se devolverá si no se subsana en:", "o": ["5 días hábiles", "10 días hábiles", "15 días naturales", "30 días naturales"], "c": 1, "e": "Transcurridos 10 días hábiles desde la fecha del aviso sin subsanar, se devuelve el envío.", "pag": 456}, {"p": "Los envíos insuficientemente franqueados de un mismo remitente se tratan como si superasen los 100 g cuando su número es superior a:", "o": ["10 envíos", "50 envíos", "100 envíos", "25 envíos"], "c": 3, "e": "Con más de 25 envíos de un mismo remitente, con independencia de su peso, se elabora el aviso T-3.", "pag": 456}, {"p": "¿Cuál es el límite máximo de transferencia para las operaciones de Western Union pagadas en efectivo?", "o": ["1000 €", "2500 €", "3000 €", "6000 €"], "c": 2, "e": "Western Union está excluida de la limitación general del efectivo, pero mantiene un límite máximo de 3000 €.", "pag": 458}, {"p": "¿Cuál de los siguientes servicios SÍ admite el pago con tarjeta de crédito o débito en IRIS?", "o": ["Recargas de la tarjeta Más Cerca", "Western Union", "Cobro de recibos", "Correos Pay Premium"], "c": 3, "e": "El servicio de Giro está excluido del pago con tarjeta salvo Correos Pay Premium, que sí lo admite.", "pag": 459}, {"p": "La recarga máxima permitida en la Tarjeta Más Cerca es de:", "o": ["999 €", "2499 €", "1500 €", "3000 €"], "c": 1, "e": "La recarga mínima es de 1 € y la máxima de 2499 €.", "pag": 463}, {"p": "Además de la tarjeta titular, ¿cuántas tarjetas adicionales gratuitas puede tener un contrato de Tarjeta Más Cerca?", "o": ["Hasta dos", "Hasta tres", "Hasta cinco", "Hasta cuatro"], "c": 3, "e": "Habrá obligatoriamente una tarjeta titular y hasta cuatro adicionales de forma gratuita.", "pag": 462}, {"p": "Según el RD 1619/2012, Correos debe emitir factura de forma obligatoria por ventas o servicios propios cuando el importe:", "o": ["Supera los 300 €, sin impuestos", "Supera los 1000 €, impuestos incluidos", "Supera los 500 €, sin impuestos", "Supera los 400 €, impuestos incluidos"], "c": 3, "e": "La factura es obligatoria cuando se superan los 400 € (impuestos incluidos); por debajo basta la simplificada.", "pag": 465}, {"p": "Señale la afirmación INCORRECTA sobre las facturas recapitulativas:", "o": ["Los tickets deben ser del mismo mes y año", "Los tickets deben pertenecer a la misma zona impositiva", "Pueden emitirse en el mismo momento de la compra", "Un mismo ticket no puede incluirse en más de una factura"], "c": 2, "e": "Las recapitulativas se emiten siempre a posteriori, nunca en el momento de la compra.", "pag": 467}, {"p": "¿Cuál es el plazo máximo para devolver un producto comprado en una oficina de Correos (salvo librería)?", "o": ["15 días naturales", "7 días naturales", "10 días hábiles", "30 días naturales"], "c": 0, "e": "Se permite la devolución si no han pasado más de 15 días naturales desde la compra, en la misma oficina y con ticket.", "pag": 471}, {"p": "En el servicio de recogida a domicilio estándar, el turno de tarde solo se presta en:", "o": ["Las zonas tarifarias 1, 2 y 3", "La zona tarifaria 1", "Las zonas tarifarias 1 y 2", "Las zonas tarifarias 3, 4 y 5"], "c": 2, "e": "El servicio de recogida de tarde solo se presta en las zonas tarifarias 1 y 2.", "pag": 477}, {"p": "La modalidad estándar de recogida a domicilio admite por recogida un máximo de:", "o": ["100 kg y el volumen de dos bandejas tipo B", "500 kg y el volumen de dos palés europeos", "1000 kg y el volumen de un palé europeo", "250 kg y el volumen de un palé europeo"], "c": 3, "e": "La recogida estándar admite hasta 250 kg y el volumen de un palé europeo del mismo peso.", "pag": 477}, {"p": "Las incidencias y observaciones de la hoja de ruta de recogidas deben archivarse durante:", "o": ["Tres meses", "Un año", "Seis meses", "Dos años"], "c": 2, "e": "Las incidencias y observaciones de la hoja de ruta se archivan durante seis meses.", "pag": 481}, {"p": "En el Servicio Especial de Paquetería, el valor declarado de paquetería puede añadirse hasta un máximo de:", "o": ["3.000 euros", "6.000 euros", "1.500 euros", "10.000 euros"], "c": 1, "e": "El servicio permite añadir valor declarado de paquetería hasta 6.000 euros.", "pag": 484}, {"p": "En Correos Frío, el peso real del envío (caja + contenido) no puede superar:", "o": ["30 kg", "20 kg", "25 kg", "40 kg"], "c": 0, "e": "El peso real del envío, caja más contenido, no puede superar en ningún caso los 30 kg.", "pag": 486}, {"p": "En la admisión de un envío prerregistrado en Mi Oficina, IRIS permite modificar el peso y admitir el envío si la discrepancia es de hasta:", "o": ["Un 2 %", "Un 10 %", "Un 5 %", "Un 15 %"], "c": 2, "e": "Con un margen del 5 % sobre el peso indicado, IRIS permite cambiar el dato y admitir el envío.", "pag": 490}, {"p": "En el servicio sin espera (Drop & Go), el código que emite el sistema al finalizar la remesa comienza por:", "o": ["DG", "FO", "FA", "SE"], "c": 0, "e": "En lugar del habitual FO/FA, el sistema emite un código que comienza por DG.", "pag": 494}, {"p": "En la admisión por Citypaq en oficina, ¿de cuánto tiempo se dispone para realizar el depósito con el mismo código?", "o": ["Diez minutos", "Cinco minutos", "Quince minutos", "Treinta minutos"], "c": 0, "e": "Se disponen de diez minutos para depositar el envío con el mismo código, por si hay cierre accidental o cancelación.", "pag": 497}, {"p": "¿Cuántos códigos temporales de admisión pueden imprimirse como máximo desde SGIE>>Configuración para los servicios rurales con HERA?", "o": ["48 códigos (3 páginas)", "100 códigos (5 páginas)", "96 códigos (6 páginas)", "120 códigos (8 páginas)"], "c": 2, "e": "Pueden imprimirse hasta seis páginas, con un total de 96 códigos.", "pag": 500}, {"p": "¿Cuál de los siguientes servicios NO pueden prestar los servicios rurales y oficinas auxiliares?", "o": ["Trámites de la DGT", "Western Union", "Solicitud de voto por correo", "Venta de billetes y entradas"], "c": 1, "e": "Western Union no puede prestarse en SSRR porque no se pueden cumplir los plazos de entrega.", "pag": 499}, {"p": "En Correos Cash, un cliente digital que ha solicitado un reintegro en la app de su banco dispone para retirar el importe de:", "o": ["Siete días", "Tres días", "Quince días", "Treinta días"], "c": 0, "e": "El cliente digital tiene siete días desde la solicitud en la aplicación; después caduca.", "pag": 508}, {"p": "En la preadmisión sin HERA de una carta certificada internacional que no contiene documentos, se usa el impreso CN22 cuando su valor es:", "o": ["Igual o inferior a 150 euros", "Igual o inferior a 300 euros", "Superior a 300 euros", "Igual o inferior a 1000 euros"], "c": 1, "e": "Se usa CN22 para valores iguales o inferiores a 300 euros y CN23 para valores superiores.", "pag": 515}, {"p": "¿Qué norma regula todas las operaciones del circuito general de la correspondencia junto con el RD 1829/1999?", "o": ["Ley 24/1998, de 13 de julio", "Ley 11/2021, de 9 de julio", "Ley 43/2010, de 30 de diciembre", "Ley 39/2015, de 1 de octubre"], "c": 2, "e": "Las operaciones del CGC se regulan en la Ley 43/2010, de 30 de diciembre, del servicio postal universal.", "pag": 434}, {"p": "En el circuito general de la correspondencia, la fase de distribución la realizan en los locales de destino los:", "o": ["ATP (Agentes de Tratamiento Postal)", "CAM (Centros de Admisión Masiva)", "ACR (Agentes de Clasificación y Reparto)", "USE (Unidades de Servicios Especiales)"], "c": 2, "e": "La distribución la llevan a cabo los ACR, Agentes de Clasificación y Reparto.", "pag": 434}, {"p": "Un envío internacional con dirección de retorno de un país distinto al de los signos de franqueo depositado en un buzón:", "o": ["Se cursa a destino como correo ordinario", "Se devuelve a la dirección de retorno indicada", "Se entrega en la oficina más próxima al remitente", "No se cursa a destino y se declara sobrante"], "c": 3, "e": "Si se depositan en buzones, estos envíos no se cursan a destino y se declaran sobrantes.", "pag": 435}, {"p": "Según el art. 23 de la Ley 43/2010, el operador designado debe realizar en los puntos de acceso a la red postal:", "o": ["Al menos dos recogidas diarias de lunes a sábado", "Al menos una recogida todos los días laborables, de lunes a viernes", "Una recogida en días alternos en zonas rurales", "Al menos una recogida diaria, incluidos los domingos"], "c": 1, "e": "Debe realizar al menos una recogida todos los días laborables de lunes a viernes, incluso en zonas rurales.", "pag": 435}, {"p": "La admisión no personalizada se da en los envíos que:", "o": ["Necesitan recibo justificativo de su admisión", "Se depositan en los centros de admisión masiva", "No necesitan recibo justificativo y caben en los buzones", "Por sus dimensiones no pueden depositarse en buzones"], "c": 2, "e": "La admisión no personalizada corresponde a envíos sin recibo justificativo que, franqueados, caben en buzones.", "pag": 436}, {"p": "¿Con cuántas oficinas cuenta Correos en España según el temario?", "o": ["Más de 1700", "Cerca de 22.000", "Más de 3500", "Más de 2300"], "c": 3, "e": "Correos cuenta con más de 2300 oficinas en España.", "pag": 436}, {"p": "¿Cómo se denominan las oficinas técnicas que tienen una oficina satélite a su cargo?", "o": ["Oficinas continente", "Oficinas mixtas", "Oficinas liquidadoras", "Oficinas principales"], "c": 0, "e": "Las oficinas técnicas con una satélite a su cargo se denominan oficinas continente.", "pag": 438}, {"p": "¿Cuántos centros de tratamiento automatizados (CTA) tiene Correos?", "o": ["12", "24", "36", "18"], "c": 3, "e": "Correos cuenta con 18 centros de tratamiento automatizados.", "pag": 438}, {"p": "Señale la afirmación INCORRECTA sobre la circulación de objetos por Correos:", "o": ["Las baterías de litio sueltas no pueden ir por vía aérea", "Los envíos con restos o cenizas humanas están prohibidos", "Los aerosoles pueden circular por vía aérea bien embalados", "Las baterías de litio instaladas en un equipo sí pueden circular"], "c": 2, "e": "El texto indica que los aerosoles nunca pueden circular por vía aérea.", "pag": 439}, {"p": "Si un envío sospechoso ya ha salido de origen y el destinatario se niega a abrirlo en la oficina de destino:", "o": ["Se entrega igualmente previa firma del destinatario", "No se entrega y se notifica a la Secretaría General de Comunicaciones", "Se devuelve al remitente como sobrante", "Se entrega a la Guardia Civil para su apertura"], "c": 1, "e": "Si el destinatario se niega, no se le entrega y se notifica a la Secretaría General de Comunicaciones para que resuelva.", "pag": 440}, {"p": "¿Quién puede remitir por Correos envíos que contengan armas permitidas?", "o": ["Cualquier particular con licencia de armas en vigor", "Solo las Fuerzas y Cuerpos de Seguridad del Estado", "Solo empresas fabricantes, distribuidoras o comercializadoras con contrato", "Cualquier cliente que declare el contenido en la cubierta"], "c": 2, "e": "Solo pueden remitirlos empresas fabricantes, distribuidoras o comercializadoras, previo contrato con Correos.", "pag": 440}, {"p": "Los objetos prohibidos cuya circulación sea constitutiva de delito se enviarán a:", "o": ["La Secretaría General de Comunicaciones", "La autoridad judicial competente o sus agentes", "La oficina de origen para su devolución", "La Jefatura de Red de Oficinas"], "c": 1, "e": "Los objetos cuya circulación es constitutiva de delito se envían a la autoridad judicial competente o a sus agentes.", "pag": 441}, {"p": "¿Qué organismos establecen las normas para el transporte de mercancías peligrosas?", "o": ["La CNMC y la UPU", "La OACI y la DGT", "La UPU y la OACI", "El Ministerio de Transportes y la CNMC"], "c": 2, "e": "La UPU y la Organización de Aviación Civil Internacional (OACI) establecen estas normas.", "pag": 443}, {"p": "Las baterías de metal litio no recargables instaladas en un equipo se rigen por:", "o": ["ONU 3481 e instrucción de embalaje 967", "ONU 3091 e instrucción de embalaje 970", "ONU 3373 e instrucción de embalaje 650", "ONU 3090 e instrucción de embalaje 968"], "c": 1, "e": "Para metal litio instaladas en equipo se aplica ONU 3091 según la instrucción de embalaje 970.", "pag": 443}, {"p": "En la admisión de mercancías peligrosas dirigidas fuera de la UE, la documentación aduanera que se imprime es:", "o": ["El CN22", "El M11A", "El CP71", "El CN23"], "c": 3, "e": "Se imprime el CN23 si va dirigido fuera de la UE, o la Etiqueta Comercial con Declaración de Contenido.", "pag": 444}, {"p": "En el tratamiento de envíos opacos, el segundo escaneo se realiza con un equipo de detección de explosivos denominado:", "o": ["EDD", "ETD", "HRCM", "OCA3"], "c": 1, "e": "Los envíos de alto riesgo (HRCM) se escanean por segunda vez con un ETD y los inspeccionan perros EDD.", "pag": 445}, {"p": "Las mercancías peligrosas autorizadas detectadas por la Unidad de Operaciones Internacionales se readmiten y reasignan en:", "o": ["SGIE", "IRIS", "Minerva", "OCA3"], "c": 3, "e": "Las mercancías autorizadas se readmiten y reasignan en OCA3 indicando que contienen mercancías peligrosas.", "pag": 445}, {"p": "¿Con qué periodicidad se factura el franqueo concertado?", "o": ["Mensual", "Semanal", "Trimestral", "Anual"], "c": 0, "e": "Al depósito se adjunta albarán por duplicado y cuenta con facturación mensual.", "pag": 446}, {"p": "¿Cuál de los siguientes titulares de máquina de franquear puede franquear correspondencia ajena?", "o": ["Los hoteles, la de sus huéspedes", "Las comunidades de vecinos, la de sus vecinos", "Las gestorías, la de sus clientes particulares", "Los colegios, la de las familias de alumnos"], "c": 0, "e": "Los hoteles pueden franquear la correspondencia de sus huéspedes como excepción.", "pag": 447}, {"p": "¿Cuántas marcas de franqueo a máquina puede llevar como máximo un envío?", "o": ["Una", "Dos", "Tres", "Cuatro"], "c": 1, "e": "Puede haber como máximo dos marcas por envío; con más de dos se puede rechazar la admisión.", "pag": 448}, {"p": "En el franqueo a máquina, se admiten como excepción envíos con la fecha de la marca retrasada siempre que:", "o": ["El retraso sea de hasta 48 horas y se abone un recargo", "El retraso sea de hasta 72 horas y lo autorice el director", "El retraso sea de hasta 24 horas y lleven estampación adicional de 0 €", "El retraso sea de hasta 24 horas y se adhiera un sello genérico"], "c": 2, "e": "Se admiten envíos con retraso de hasta 24 horas si se presentan con una estampación adicional de cero euros.", "pag": 449}, {"p": "Con carácter general, la medida de los sellos de Correos es:", "o": ["74 x 40 mm", "50 x 20 mm", "38,8 x 26,9 mm", "40,9 x 28,8 mm"], "c": 3, "e": "La medida general de los sellos es 40,9 x 28,8 mm.", "pag": 452}, {"p": "Según el RD 1637/2011, el número anual de emisiones de sellos no superará, salvo decisión del presidente:", "o": ["60", "120", "50", "90"], "c": 3, "e": "El número anual de emisiones no superará los 90, salvo que lo decida el presidente.", "pag": 453}, {"p": "Si un cliente deposita un número elevado de envíos franqueados con estampillas, antes de admitirlos se informa a:", "o": ["La Secretaría General de Comunicaciones", "El jefe de la unidad de reparto", "El área de Facturación", "El responsable de la Jefatura de Red de Oficinas"], "c": 3, "e": "Con un número alto de envíos, antes de su admisión se pone en conocimiento del responsable de la Jefatura de Red de Oficinas.", "pag": 454}, {"p": "A los envíos de hasta 100 g con remitente insuficientemente franqueados depositados en buzón se les anexa en el reverso la etiqueta:", "o": ["T-3", "T-2 R", "T-2D", "T1"], "c": 1, "e": "En envíos de hasta 100 g se anexa en el reverso la etiqueta T-2 R y se devuelven al remitente.", "pag": 455}, {"p": "Los envíos sin remitente insuficientemente franqueados se entregan al destinatario:", "o": ["Como correo ordinario, sin cobrar ningún importe en la entrega", "Previo pago del doble de la insuficiencia en la entrega", "Solo en oficina, tras abonar la insuficiencia", "Previo pago de la insuficiencia más un recargo fijo"], "c": 0, "e": "Se entregan como ordinario sin cobro; el destinatario acude voluntariamente a la oficina a pagar.", "pag": 457}, {"p": "¿Desde qué fecha se prohíbe pagar en efectivo operaciones de importe igual o superior a 999,99 €?", "o": ["Desde el 11 de julio de 2021", "Desde el 1 de enero de 2021", "Desde el 9 de julio de 2020", "Desde el 1 de junio de 2022"], "c": 0, "e": "La prohibición rige desde el 11 de julio de 2021, con la entrada en vigor de la Ley 11/2021.", "pag": 458}, {"p": "En la Tarjeta Más Cerca, ¿cómo se distinguen las tarjetas titulares de las adicionales?", "o": ["Las titulares acaban siempre en número par", "Las adicionales acaban siempre en múltiplos de cinco", "Las adicionales llevan el nombre del empleado", "Las titulares acaban siempre en múltiplos de cinco"], "c": 3, "e": "Las tarjetas de los titulares acaban siempre en múltiplos de cinco (00, 05, 10...).", "pag": 462}, {"p": "¿Qué caducidad tienen los cupones descuento de bonificación de la Tarjeta Más Cerca?", "o": ["30 días", "90 días", "60 días", "180 días"], "c": 1, "e": "Los cupones descuento de 5 € tienen una caducidad de 90 días.", "pag": 464}, {"p": "Al emitir una factura a un cliente extranjero de un país no perteneciente a la UE, se utiliza el código:", "o": ["EX", "OT", "UE", "NC"], "c": 1, "e": "Si el país es de la UE se indica su código ISO; en caso contrario se utiliza el código OT.", "pag": 467}, {"p": "Cualquier modificación de datos de una factura mediante el botón \"Factura correctiva\" genera:", "o": ["Una nota de abono en negativo y una factura correctiva", "Una única factura correctiva que anula la original", "Una factura recapitulativa y un ticket nuevo", "Una nota de abono y una factura simplificada"], "c": 0, "e": "Se generan dos documentos: una nota de abono con signo negativo y una factura correctiva con los datos modificados.", "pag": 467}, {"p": "¿Cuál de los siguientes productos NO se puede vender desde el carrito de compra (venta de impulso)?", "o": ["Los embalajes", "La lotería", "Los sobres", "El merchandising"], "c": 1, "e": "Desde el carrito no se pueden vender sellos, cupones preimpresos de la ONCE ni lotería.", "pag": 470}, {"p": "Los productos de librería, según la Ley de Propiedad Intelectual, solo pueden devolverse:", "o": ["En los 7 días naturales siguientes", "El mismo día de su compra", "En los 15 días naturales siguientes", "En las 48 horas siguientes"], "c": 1, "e": "Los productos de librería no se pueden devolver en un día distinto al de su compra.", "pag": 471}, {"p": "En el cierre de caja, para las operaciones Western Union se introduce el saldo neto que refleja el informe de:", "o": ["WUPOS", "Telecor", "SGIE", "Mercurio"], "c": 0, "e": "Para Western Union se introduce el saldo neto entre pagos y envíos del informe de WUPOS.", "pag": 473}, {"p": "¿Cuántos buzones aproximadamente tiene desplegados Correos en toda la geografía española según el temario?", "o": ["Cerca de 22.000", "Más de 36.000", "Cerca de 12.000", "Más de 50.000"], "c": 0, "e": "La sociedad postal tiene desplegados cerca de 22.000 buzones de diferentes formatos.", "pag": 474}, {"p": "Con carácter general, ¿hasta qué hora se recogen los buzones los sábados en jefaturas provinciales, administraciones y oficinas técnicas?", "o": ["13:00 horas", "14:00 horas", "12:00 horas", "17:00 horas"], "c": 0, "e": "Los sábados la hora final de recogida es las 13:00 horas.", "pag": 474}, {"p": "¿Qué programa utiliza Correos para controlar el horario de recogida de buzones mediante lectores ópticos?", "o": ["Talos", "Mercurio", "Marabú 2", "Minerva"], "c": 2, "e": "El horario de recogida se controla mediante lectores ópticos de códigos de barras con el programa Marabú 2.", "pag": 475}, {"p": "Si entre los envíos de buzón hay uno urgente debidamente franqueado, la parte derecha de su etiqueta:", "o": ["Se destruye y el envío no tiene seguimiento", "Se envía por correo al remitente", "Se archiva en el CTA durante seis meses", "Se adhiere al reverso del envío"], "c": 0, "e": "La parte derecha de la etiqueta se destruye; no puede realizarse el seguimiento del envío.", "pag": 476}, {"p": "¿De qué unidad depende el servicio de recogida a domicilio?", "o": ["De la Subdirección de Distribución", "De la Subdirección de Red de Oficinas", "De la Dirección Comercial", "De la Unidad de Operaciones Internacionales"], "c": 0, "e": "El servicio de recogida a domicilio depende de la Subdirección de Distribución.", "pag": 477}, {"p": "Las recogidas esporádicas de la modalidad especial se solicitan a los servicios comerciales con un preaviso de:", "o": ["48 horas", "24 horas", "12 horas", "72 horas"], "c": 1, "e": "Son recogidas esporádicas solicitadas con un preaviso de 24 horas.", "pag": 478}, {"p": "¿Qué dimensiones tiene el palé europeo según el temario?", "o": ["1.288 x 800 mm", "1.200 x 1.000 mm", "1.000 x 800 mm", "1.288 x 1.000 mm"], "c": 0, "e": "El palé europeo tiene unas dimensiones de 1.288 x 800 mm.", "pag": 478}, {"p": "En las recogidas a domicilio, los envíos deben presentarse con el albarán:", "o": ["M11A", "SR", "GANES", "CN23"], "c": 2, "e": "Uno de los requisitos es presentar los envíos con el albarán GANES.", "pag": 478}, {"p": "En las recogidas esporádicas, las solicitudes llegan por el buzón electrónico de SGIE y generan el impreso:", "o": ["SR (solicitud de recogida)", "GANES (albarán de entrega)", "M11A (formulario de admisión)", "T-3 (aviso de recogida)"], "c": 0, "e": "Las solicitudes generan el impreso SR, que incluye los datos de la recogida y un código de barras.", "pag": 481}, {"p": "Cuando llega la anulación de una solicitud de recogida, se liquida en SGIE con la clave:", "o": ["Sin envíos/ya recogido/no preparado", "Necesidad de nuevo intento de recogida", "Cliente no quiere servicio de recogida/anulada", "Mal encaminamiento/error de encaminamiento"], "c": 2, "e": "La anulación se liquida con la clave \"Cliente no quiere servicio de recogida/anulada\" y no se saca a reparto.", "pag": 482}, {"p": "Si una recogida se liquida como \"Dirección incorrecta\" y no es posible contactar con el cliente:", "o": ["La recogida queda en depósito en SGIE", "Se intenta en el siguiente turno", "Se reencamina a otra unidad", "La recogida se da por finalizada"], "c": 3, "e": "Si no es posible contactar con el cliente, al liquidar por esta opción la recogida se da por finalizada.", "pag": 483}, {"p": "El Servicio Especial de Paquetería admite envíos con destino Península y Baleares de hasta:", "o": ["10 kg", "25 kg", "20 kg", "30 kg"], "c": 2, "e": "Este servicio admite envíos con destino a cualquier punto de la Península y Baleares hasta 20 kg.", "pag": 484}, {"p": "En el Servicio Especial de Paquetería, si no se realiza la entrega, el plazo para retirar en oficina un iPaq Peregrino es de:", "o": ["Hasta 15 días", "Hasta 7 días", "Hasta 45 días", "Hasta 30 días"], "c": 3, "e": "El plazo general es de 15 días, ampliable a 30 días para el iPaq Peregrino.", "pag": 484}, {"p": "¿Qué producto del Servicio Especial de Paquetería ofrece entrega urgente en 24/48 h con Correos Modify incluido?", "o": ["iPaq Domicilio con recogida", "iPaq Plus Domicilio con recogida", "iPaq Peregrino", "Paq Premium Oficina"], "c": 1, "e": "El iPaq Plus Domicilio con recogida ofrece entrega urgente en 24/48 h con Correos Modify incluido.", "pag": 485}, {"p": "En el Servicio Especial de Paquetería, la hora límite de admisión en origen es:", "o": ["Las 14:00 horas", "Las 12:00 horas", "Las 13:00 horas", "Las 17:00 horas"], "c": 2, "e": "Los plazos de admisión tienen como hora límite en origen las 13:00; después, el plazo empieza al día siguiente.", "pag": 485}, {"p": "¿Cuál de los siguientes NO es un rango de temperatura disponible en Correos Frío?", "o": ["Entre 30 ºC y 40 ºC", "-20 ºC", "Entre 2 ºC y 8 ºC", "Entre 15 ºC y 25 ºC"], "c": 0, "e": "Los rangos disponibles son -20º, entre 2 y 8 ºC y entre 15 y 25 ºC.", "pag": 486}, {"p": "En Correos Frío, la etiqueta de retorno que se usa en destino para devolver la caja isoterma es la:", "o": ["PK", "SR", "CD", "L3"], "c": 3, "e": "El packing list incluye la etiqueta de retorno L3 para la devolución de la caja isoterma.", "pag": 486}, {"p": "En el prerregistro de Mi Oficina, las notificaciones judiciales se identifican con las siglas:", "o": ["NV", "CX", "NF", "RV"], "c": 2, "e": "Las notificaciones judiciales se identifican como NF; las administrativas como NV.", "pag": 488}, {"p": "Los clientes particulares o sin contrato que prerregistran un envío en Mi Oficina deben pagarlo:", "o": ["En la oficina al depositar el envío", "Mediante factura mensual a final de mes", "En el momento del prerregistro con tarjeta o PayPal", "Contra reembolso al destinatario"], "c": 2, "e": "Deben abonarlo en el mismo momento del prerregistro mediante tarjeta de débito, crédito o PayPal.", "pag": 490}, {"p": "Los envíos pregrabados mediante el formulario online de la web de Correos:", "o": ["Solo pueden usarlos clientes con contrato", "No son válidos para clientes con contrato", "Se pagan con franqueo pagado", "Se pagan con máquina de franquear"], "c": 1, "e": "Son envíos de pago en oficina, por lo que no son válidos para clientes con contrato.", "pag": 491}, {"p": "El código que se genera al pregrabar envíos con el formulario online para presentarlos en oficina empieza por:", "o": ["FO", "DG", "PK", "SR"], "c": 0, "e": "Al continuar se genera el código del envío para presentarlo en oficina, que empieza por FO.", "pag": 492}, {"p": "Una vez admitidos los envíos pregrabados, el formulario puede recuperarse desde Mercurio en la opción:", "o": ["Consulta pregrabados", "Gestión de caja", "Admisión de Citypaq", "Reimpresión de ticket"], "c": 0, "e": "Desde Mercurio, en \"Consulta pregrabados\", introduciendo el código aportado por el cliente.", "pag": 494}, {"p": "¿Qué ventaja tiene el cliente que utiliza el servicio sin espera (Drop & Go) en la red de oficinas?", "o": ["Descuento del 3 % en el envío", "Turno priorizado", "Recogida gratuita a domicilio", "Seguro de valor declarado incluido"], "c": 1, "e": "Puede disfrutar del turno priorizado obteniendo un código para el gestor de turnos.", "pag": 495}, {"p": "La admisión por Citypaq en oficina de Correos solo es posible para:", "o": ["Cartas certificadas pregrabadas con código FO", "Paquetería prerregistrada que contenga el email del remitente", "Cualquier paquete con franqueo pagado", "Paquetería internacional con CN23 adjunto"], "c": 1, "e": "Solo es posible para envíos de paquetería prerregistrados que contengan la dirección de email del remitente.", "pag": 496}, {"p": "La oficina rural que actúa como una sección más de la unidad de distribución de la que depende es:", "o": ["Rural Tipo I o rural integrado", "Rural Tipo II o con lista propia", "Rural Tipo III o rural diferido", "Oficina satélite"], "c": 0, "e": "El rural Tipo I o integrado actúa como una sección más de la unidad de distribución de la que depende.", "pag": 498}, {"p": "Los servicios rurales que realizan la admisión con formulario preimpreso usan para envíos nacionales el modelo:", "o": ["M11A", "M11i", "CN22", "SV"], "c": 0, "e": "Para envíos nacionales se usa el modelo M11A y para internacionales el M11i.", "pag": 499}, {"p": "Con la aplicación HERA solo podrán admitirse envíos:", "o": ["Internacionales dentro de la Unión Europea", "Con destino a Canarias, Ceuta y Melilla", "Con origen y destino en el mismo ámbito impositivo", "De paquetería de más de 20 kg"], "c": 2, "e": "Con HERA solo podrán admitirse envíos con origen y destino en el mismo ámbito impositivo.", "pag": 500}, {"p": "En HERA, ¿cuál de las siguientes operaciones subidas a bolsa NO se puede anular?", "o": ["Venta de productos", "Cobro de recibos", "Solicitud de duplicado de permiso de circulación", "Venta de billetes y entradas"], "c": 2, "e": "La solicitud de duplicado de permiso de circulación no se puede anular.", "pag": 503}, {"p": "En la solicitud del distintivo medioambiental desde HERA, la fecha de entrega al cliente será:", "o": ["En el mismo día de la solicitud", "A los 10 días hábiles de la solicitud", "Siempre a partir del día siguiente a la solicitud", "Cuando lo envíe directamente la DGT"], "c": 2, "e": "La fecha de entrega concertada siempre será a partir del día siguiente de la solicitud.", "pag": 506}, {"p": "En Correos Cash, la opción de cliente no digital (sin app pero con tarjeta bancaria) está disponible solo para clientes de:", "o": ["Ibercaja", "Banco Mediolanum", "Cualquier entidad con acuerdo", "Banco Santander"], "c": 3, "e": "La opción de cliente no digital solo está disponible para clientes del Banco de Santander.", "pag": 507}, {"p": "El producto de Correos que soporta la retirada de efectivo de Correos Cash en oficina rural es:", "o": ["El Giro OIC", "El Giro inmediato", "Correos Pay Premium", "El reembolso OIC"], "c": 1, "e": "El producto que soporta el reintegro es el Giro inmediato (giro a domicilio para clientes de Santander).", "pag": 508}, {"p": "El ingreso de efectivo mediante Correos Cash en un servicio rural se asienta en el producto:", "o": ["Giro inmediato", "Giro OIC (Orden de Ingreso en Cuenta)", "Giro ordinario a domicilio", "Western Union"], "c": 1, "e": "El servicio de ingreso se asienta en el Giro OIC y conlleva medidas de prevención del blanqueo de capitales.", "pag": 511}, {"p": "Para la solicitud de voto por correo, el documento de identidad aportado por el cliente debe ser:", "o": ["Original y en vigor", "Fotocopia compulsada", "Resguardo de denuncia si se ha perdido", "Original, no necesariamente en vigor"], "c": 3, "e": "Debe ser original, no necesariamente en vigor, y no se aceptan resguardos de denuncia por pérdida o robo.", "pag": 513}, {"p": "Si una incidencia con HERA impide tramitar la solicitud de voto por correo, la admisión puede hacerse con:", "o": ["Un formulario M11i autocopiativo", "Una etiqueta CD de certificado", "Un código temporal FO", "Una etiqueta preimpresa SV adherida al sobre"], "c": 3, "e": "En caso de incidencia con HERA, la admisión se realiza con una etiqueta preimpresa SV adherida al sobre.", "pag": 513}, {"p": "Al finalizar el proceso de captación de leads en la PDA, se sube a bolsa:", "o": ["El importe de la comisión pactada", "El importe del primer servicio contratado", "Un importe fijo de 1 €", "Un importe de 0"], "c": 3, "e": "Al finalizar el proceso se sube a bolsa un importe de \"0\" que se tramita como cualquier otra compra.", "pag": 514}, {"p": "En la admisión de giros en servicios rurales, si el destinatario no figura de alta en la base de datos de prevención de blanqueo de capitales:", "o": ["No se puede admitir el giro en ningún caso", "Debe presentarse la declaración DAE Rurales", "Solo se admite como Giro OIC", "Solo se permite la modalidad de envío de dinero inmediato"], "c": 3, "e": "El sistema solo permite la admisión en la modalidad de envío de dinero inmediato.", "pag": 517}]}, {"letra": "G", "titulo": "Procesos operativos de admisión (II)", "paginas": "519-640", "resumen": "## 1. IRIS\n- **IRIS** (Información de Recursos Informáticos y Sistemas): aplicación de Correos para la **admisión de envíos** en oficinas y en unidades de admisión masiva. Versión actual **6.0** (IRIS 6).\n- Usuarios asignados obligatoriamente a una oficina o unidad. Acceso con **usuario corporativo C + 6 dígitos** (C123456) y contraseña; privilegios desde el apartado **Gestión**.\n- Siempre comprobar peso y medidas; no se admiten objetos prohibidos ni mercancías peligrosas no autorizadas.\n- Todo envío debe llevar **una única dirección de retorno en España**.\n\n## 2. Admisión en oficina de cartas y documentos\n- Formas: **unitaria**, **múltiple**, **pregrabados** y **con albarán**.\n- Ruta: IRIS>>Admisión>>Envíos postales, pestaña **Cartas**. Campos clave:\n  - **Peso** en gramos (balanza **Epelsa**); check \"No normaliz.\" para cartas ≤ 20 g no normalizadas.\n  - **Ámbito**: Península y Baleares, Canarias, Ceuta y Melilla.\n  - **Código postal**: obligatorio en **certificadas** y en **ordinarias de más de 250 g**.\n  - País (por defecto ESP), mercancía peligrosa (pegatina **redonda verde**, se cursa registrado y separado).\n- Las cartas **urgentes solo existen en ámbito nacional**.\n\n### 2.1. Carta ordinaria nacional e internacional\n- Etiqueta de franqueo en **ángulo superior derecho**.\n\n| Caso | Etiqueta |\n|---|---|\n| Unitaria ≤ 30 envíos mismo peso (< 250 g) | Pequeña **10 x 3,8 cm** |\n| Remesa > 30 mismo peso | Sin etiqueta: \"Admisión masiva, solo envíos del mismo peso\" |\n| Nacional > 250 g | Admisión unitaria, mediana **10 x 6 cm** con código de barras |\n| UE / terceros países (documentos) > 250 g | Mediana con código **ORD** |\n| Terceros países con **mercancías** | Grande **14,5 x 10 cm**, código **US** con **CN22** incorporado |\n\n- Remesas sin etiquetar: se cancelan en oficina o se envían al CTA en bandeja \"**Sin cancelar**\" con listado de envíos ordinarios no etiquetados.\n\n### 2.2. Carta ordinaria urgente nacional\n- Ruta …>>Cartas>>Urgente. Etiqueta identificada por la letra **U**, con código de barras para trazabilidad.\n- En oficinas auxiliares y servicio rural: etiqueta preimpresa \"Carta Urgente Nacional\" en **ángulo superior izquierdo**; la parte derecha se entrega al cliente.\n\n### 2.3. Carta certificada nacional e internacional\n- Ya no se exige el **M11A** (nacional) ni **M11i** (internacional): los datos se graban en IRIS. En servicios rurales sí se rellenan y se introduce su número de referencia.\n- Sobres sin cinta adhesiva ni señales de manipulación; datos no a lápiz; remitente obligatorio salvo **concursos artísticos o literarios** (\"ocultar datos del remitente\").\n- **Pregrabados**: código del formulario online, envíos ordenados por CP de menor a mayor; AR con **M35 plus** (nacional) o **CN07** (internacional). Datos obligatorios en amarillo/naranja. \"Fijar Datos Remitente/Destinatario\".\n- Resguardo firmado en **tableta**, por email por defecto. \"Franqueo inicial unitario\" descuenta sellos ya adheridos.\n\n| Etiqueta nacional | Uso |\n|---|---|\n| Pequeña 10 x 3,8, **C**, código **CD** | Hasta 250 g |\n| **C AR** / **C PEE** | Con aviso de recibo / prueba de entrega electrónica |\n| Grande 14,5 x 10, código CD | > 250 g, contra reembolso o VD |\n| Código **VD** | Valor declarado |\n\n- Internacional: < 250 g etiqueta pequeña letra **R**, código **RF**; > 250 g etiqueta grande.\n\n**Admisión múltiple (por relación)**: obligatoria con **más de 30 envíos**, recomendable desde 3-4; **solo nacional**. Impreso por duplicado (Conecta). Etiquetas **amarillas preimpresas CD** en **ángulo superior izquierdo**. Admisión uno a uno o **por rango** (CP correlativos). El cliente firma el condicionado del reverso; un ejemplar para el cliente y otro se archiva.\n\n**Contra reembolso**: tipos Pago en Cuenta, en Domicilio o en Apartado; etiqueta grande con la palabra **Reembolso**. Internacional: etiqueta naranja **CN29** (R-1 Remboursement), etiqueta RF y **MP1 bis (TFP3)** en bolsa transparente.\n\n**Valor declarado**: nacional, etiqueta VD (unitaria en ángulo superior derecho; múltiple preimpresa en el izquierdo). Internacional: etiqueta **V (código VV)**, no admite admisión múltiple. VD + reembolso nacional: etiqueta grande VD.\n- Precintado por el cliente: sobre con **Secure Tape 820** o bramante y **cinco lacres**; caja de metal o madera (**mín. 8 mm**) con **cuatro lacres**.\n- No precintado: sobre del cliente revisado; si no ofrece garantías, sobre **Segurimini** (ya no se comercializa pero sigue en manuales) o embalajes de Correos.\n\n**Aviso de recibo**: nacional, dos etiquetas (carta y **M-35** en el reverso); internacional, una etiqueta en el **CN07**.\n\n### 2.4. Carta Certificada Tarifa Plana\n- Solo **nacional**; modalidades **Estándar** y **Premium** (incluye **PEE 5**, requiere email). Opcionales: reembolso, PEE 10/15, **VD hasta 3.000 €**. Siempre etiqueta grande 14,5 x 10.\n- A zonas con régimen fiscal diferente: solo documentos.\n\n### 2.5. Carta Certificada Prepagada Premium\n- Primero venta (Venta de productos, \"**CCPREPREM**\"); luego admisión marcando \"Prepagado\"; importe en bolsa **0,00 €**. Contenido **máximo 100 g**. PEE 5 ampliable a 10 o 15 años.\n\n### 2.6. Carta Certificada Urgente Nacional\n- Opción \"Urg. Certificada\"; etiqueta **CU** (unitaria en ángulo superior derecho; múltiple preimpresa en el izquierdo).\n\n### 2.7. Notificaciones\n- Carta certificada nacional con valor añadido \"notificación\", con AR de notificación o PEE; **dos intentos de entrega**; avisada en oficina **7 días naturales**, luego devolución.\n- Múltiple o con contrato: etiqueta **NA** (administrativa) o **NJ** (judicial); con contrato se presenta albarán.\n- Solo las oficinas con **unidad de admisión masiva** admiten envíos de operadores postales/consolidadoras con acuerdo previo; factura siempre a favor del remitente. Si se pide factura a otro o tique, se admiten como **certificada con AR**, nunca como notificación.\n\n### 2.8. Documentación aduanera de cartas\n- Sujetas: desde Península/Baleares a Canarias, Ceuta, Melilla y países no UE; desde Ceuta, Melilla, Andorra y Canarias a fuera de su territorio.\n- Contenido no documental: **CN22** (relación/albarán) o **CN23** (unitaria; IRIS lo imprime siempre). Más de **300 DEG (= 300 €)** → CN23.\n- Número tarifario **TARIC** de **seis cifras**. CN23 por duplicado, firmado, en bolsa transparente. A la UE: etiqueta comercial con declaración de contenido.\n\n### 2.9. Procedimiento administrativo\n- Para cartas certificadas (urgente, ordinaria, tarifa plana, prepagada premium); la tarifa depende de destino, peso y tamaño.\n- Destinos: AGE, CC. AA., entidades locales y entidades de derecho público (incluye **colegios profesionales**). Base: **art. 16 de la Ley 39/2015**.\n- **Sobre abierto**; el empleado consigna oficina, fecha, lugar, **hora y minuto** en la cabecera de la primera hoja y en el resguardo; puede sellar la copia previa comparación; **el remitente cierra el sobre** en presencia del empleado.\n- Un envío por documento principal; quien firma debe coincidir con el remitente. También válido para representaciones diplomáticas españolas; a organismos internacionales sin garantía de eficacia legal.\n\n## 3. Admisión en oficina de paquetería\n- Ruta Inicio>>Admisión>>Envíos postales>>Paquetes; medidas para el **peso volumétrico** (si difiere, se cobra por él).\n- Nacional: Paquete Azul, Paq Ligero, Paq Estándar, Paq Premium, Paq Retorno y Paq Retorno Premium. Internacional: Paq Premium Internacional, Paq Standard Internacional, Paquete Postal Internacional Económico y Paq Light Internacional.\n\n### 3.1. Etiquetas\n- Nacional **14,5 x 10 cm**; internacional **10 x 14,5** (Paq Light Internacional usa 14,5 x 10). Código de **23 caracteres** nacional y Paq Return Internacional; **13** internacional. Los dos primeros identifican el producto.\n\n| Producto | Código |\n|---|---|\n| Paquete Azul | PA |\n| Paq Ligero / devuelto | PH / DH |\n| Paq Today domicilio | PD |\n| Paq Estándar domicilio / of. referencia / of. elegida | PQ / PR / PS |\n| Paq Premium domicilio / of. elegida | PK / PL |\n| Paq Retorno con / sin prerregistro / Premium | L3 / SN / LI |\n| Paquete Internacional Económico / con VD | CC / CV |\n| Paq Light Internacional | LX |\n| Paq Standard Internacional / Premium Internacional | CP / EJ |\n| EPG Logística inversa / Paq Return Internacional | CZ / EG |\n\n### 3.2-3.3. Paquete Azul y Paq Premium\n- Paq Premium: pestañas Valores añadidos, Datos destinatario/remitente (teléfono **obligatorio en entrega en oficina**) y Contenido.\n- **Prepagado**: sobre pequeño hasta **350 g** o grande hasta **1 kg**. **Embalaje tarifa plana** (\"Pack libre servicio\"): seguro ampliable a **6.000 €**, reembolso hasta **200 €**.\n- Cliente con contrato: franqueo pagado, bolsa a **0 €** pero se completa el cobro.\n\n### 3.4. Paq Estándar\n- **Postlibris**: solo oficinas, clientes sin contrato, nacional; requiere **Tarjeta Más Cerca**; circula como Paq Estándar oficina elegida (**PS**). En devolución se cobra de nuevo sin servicios adicionales.\n- **Paq Bicicleta**: venta de caja (**Cajabicl**), peso hasta **20.000 g**; tarifas: nacional, Baleares, Roncesvalles, Canarias.\n\n### 3.5-3.7. Paq Today, Paq Ligero y expediciones\n- Paq Today: entrega **15:00-21:00**. Centralizado: recogida hasta 13:00, admisión en CAM hasta 14:00, capitales de provincia. Descentralizado: recogida por la USE hasta 14:00. \"**Aguas abajo**\": operadores privados entregan a Correos para la distribución.\n- Paq Ligero: en oficinas solo clientes de **Tarjeta Más Cerca**; con contrato solo prerregistro.\n- Expediciones (multibulto, contrato, domicilio): admisión unitaria; entrega **completa** o **parcial**; prerregistro en Mi Oficina, ficheros, Webservices o **GECO**. Bultos faltantes: plazo de **3 días**.\n\n### 3.8. Logística inversa\n- Devoluciones particular-empresa con **pago diferido** a cargo del cliente con contrato. Tipos: prerregistrados **LI/L3**, sin prerregistro **SN** y **EPG**. Paq Return Internacional no se admite en oficinas.\n- **EPG** (código **CZ** + 9 dígitos + ES): prerregistrado, antes de **30 días** desde la etiqueta; CN23 fuera UE; no se cobra; Paq Standard Internacional; solo en oficina (no UAM); no se admite en Ceuta, Melilla y Canarias; **no se reetiqueta**.\n\n### 3.9. Paquetería internacional\n- No urgente: Paq Standard o Paquete Internacional Económico; urgente: Paq Premium Internacional. Países **KAHALA**: CP correcto o **00000**. Teléfono del receptor obligatorio.\n- **Paq Bicicleta Internacional**: tarifa plana a países EPG (Portugal o resto).\n- **Paq Libre Servicio Internacional**: precio cerrado por embalaje; Zona A (UE, Standard) y Zona B (resto, Premium); caja pequeña, mediana, grande y sobre acolchado grande.\n- **Paq Light Internacional**: urgente, poco valor, **hasta 2 kg**, sin firma (sin garantía por extravío); CN22 ≤ 300 € o CN23 > 300 €.\n\n### 3.10. Documentación aduanera\n- CN23 por duplicado; **DUA** en ciertos comerciales; CN22 en admisión por relación; **TFP3** en reembolso (PPIE); certificados especiales (sanitario, **Soivre**, fitosanitario...).\n- **ICS2**: normativa UE de seguridad en importación desde el **15/03/2021**; intercambio electrónico entre operadores desde el **1/01/2021**.\n\n## 4. Correos Express (CEX)\n- Acceso: IRIS>>Llamadas a sistemas externos. Productos: Paq 10, 14, 24, tarifa plana, EquiPaq 24, Paq Nieve, Canarias Express.\n- Peso introducido manualmente (no Epelsa). Email del remitente obligatorio. Entrega en apartado, **centro penitenciario** o domicilio. No aparece en la tableta: reconfirmar datos. Etiquetas 14,5 x 10; no queda copia en oficina.\n- **EquiPaq 24**: hasta **5 maletas de 25 kg**. **Paq Nieve**: esquís/snowboard, ida y vuelta.\n- Logística inversa CEX: sin servicios adicionales; solo se modifica peso y bultos.\n- Tarifa plana internacional: fuera UE, NIF/pasaporte; Chile **RUT**, Argentina **CUIT/CUIL**, Perú y Ecuador **RUC**, Turquía **VAT**; cuatro copias de declaración de valor.\n- Curso: oficinas de tarde (admisión antes de **17:00**) recoge CEX; capital con horario de mañana (hasta **14:00**) recoge antes de 15:00; resto, ruta provincial. Tras la \"hora de calidad\": entrega el **segundo día hábil**.\n\n## 5. Telecomunicaciones\n### 5.1. Fax y Burofax\n- Ruta IRIS>>Admisión>>Burofax/Fax; solo **ámbito nacional**. Festivo en destino: \"Advertido del Posible Retraso\". Un burofax, un destinatario.\n- **Burofax Premium**: custodia ampliable a **120 meses**, PEE o PEF; con contrato, pago diferido.\n- **Burofax Premium Plus**: solo sin contrato; incluye copia certificada, custodia **60 meses** y PEF/PEE.\n- **Fax**: solo copia certificada (en la imposición); transmisión antes de entregar el recibo.\n- Carátula con código **NB**. Modificación en IRIS>>Gestión>>Mantenimiento>>Fax. Mal estado: a riesgo del expedidor (**RE**).\n- Burofax se transmite al servidor **26 666** o **914 188 428**. Sin conexión: dos intentos más cada **10 minutos**. Documentación guardada **una semana natural**.\n\n### 5.2. Telegramas\n- Impreso **TG-1**; un solo destinatario. Datos del remitente solo se transmiten si van en el texto.\n- No cuentan acentos ni diéresis; CP no se contabiliza en régimen interior. **Unidad tasable**: hasta **10 caracteres**.\n- Modalidades nacionales: **OD, OL, TS**; internacio
