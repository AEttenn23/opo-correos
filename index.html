iseñó el vehículo eléctrico Scoobic?", "o": ["NUUK Mobility Solutions", "Passion Motorbike Factory", "Mooevo", "GOI"], "c": 1, "e": "Scoobic fue diseñado por la empresa sevillana Passion Motorbike Factory.", "pag": 280}, {"p": "¿Qué capacidad de carga y autonomía tiene el Scoobic?", "o": ["1400 l y 750 kg, con 100 km de autonomía", "1000 l y 750 kg, con 300 km de autonomía", "1000 l y 500 kg, con 120 km de autonomía", "750 l y 1000 kg, con 300 km de autonomía"], "c": 1, "e": "Scoobic tiene una capacidad de 1000 l y 750 kg y 300 km de autonomía.", "pag": 280}, {"p": "En el piloto de carros de reparto asistidos, ¿qué aporta Mooevo?", "o": ["Un patinete eléctrico", "Un ciclomotor isotérmico de tres ruedas", "Una moto eléctrica cibersegura", "Una plataforma equilibrada llamada pusherboard"], "c": 3, "e": "Mooevo utiliza una plataforma equilibrada llamada pusherboard; Scoobic contribuye con un patinete eléctrico.", "pag": 280}, {"p": "¿Qué autonomía máxima y capacidad de baúl tienen las motos NUUK CargoPro?", "o": ["300 km y baúl de hasta 100 litros", "120 km y baúl de hasta 180 litros", "100 km y baúl de hasta 140 litros", "150 km y baúl de hasta 120 litros"], "c": 1, "e": "Las motos tienen una autonomía máxima de 120 km y pueden incorporar un baúl de hasta 180 litros.", "pag": 281}]}, {"letra": "D", "titulo": "Diversificación. Servicios en oficinas de Correos", "paginas": "283-354", "resumen": "## 1. Diversificación: marco general\n\n- **Plataforma de Servicios al Ciudadano**: nuevos canales con organismos oficiales (renovar documentación, distintivos DGT, comunicarse con la Administración).\n\n## 1.1. Cobro de recibos\n\n### Requisitos generales\n- Recibos **no domiciliados**, en **todas las oficinas informatizadas**, en puestos de admisión y en horario establecido, de forma **universal** (aunque el ámbito no coincida con el de la empresa emisora).\n- Entrega **inmediata** al cobro (vía electrónica).\n- Pago **exclusivamente en metálico** (no tarjeta, transferencia ni ingreso en cuenta).\n- Importe máximo **999,99 €**, salvo **multas de tráfico**, **UCI**, **Cofidis**, **WiZink Bank** y **Citibank**.\n- Solo por **IRIS**, nunca manual: si IRIS no funciona, no se presta el servicio.\n- Problemas técnicos → **CAU**. Información sobre el recibo → entidad emisora.\n- **No se anula en oficina** una vez aceptado: se escanea el recibo a cobro.recibos@correos.com y se envía por correo postal a la **Subdirección de Red de Oficinas** la \"Certificación para Anulación de Recibo\" (Conecta) con el justificante original.\n- Ruta: **IRIS>>Admisión>>Cobro de recibos**.\n\n### Modalidades\n| Modalidad | Funcionamiento | Empresas |\n|---|---|---|\n| **Con aviso de pago** | Recibo con código de barras, importe y fecha límite | Con o sin comisión de gestión para el cliente |\n| **Sin aviso de pago** | El cliente da referencia e importe, sin recibo | WiZink Bank, Endesa, Línea Directa, Citibank |\n\n### Con aviso de pago\n- Código de barras siempre con **lector óptico**; si falla, se prueba en otro puesto; si tampoco, se devuelve al cliente.\n- Tras \"Aceptar\": \"Ahora debe solicitar el dinero al cliente\". **No se imprime resguardo sin cobrar**. Justificante por email o impreso.\n- Sin comisión: se imprime código empresa, oficina, **Codired**, fecha y \"Pagado Correos\". Con comisión: solo resguardo/email; importe y comisión desglosados en ticket.\n- Cobro con \"Cobrar bolsa\"; ticket por máquina **Epelsa**.\n- **Pago fraccionado** (Endesa, WiZink): mismo código de barras; la primera vez IRIS asigna **0**; si se repite, aviso y se indica el número de fracción.\n\n### Sanciones de tráfico\n- Multas DGT = como recibo con aviso de pago. Con notificación o boletín de denuncia (Guardia Civil). Se lee el código **más pequeño, arriba a la derecha** (nº expediente).\n- Se introduce cuantía (sin descuentos ni recargos) y fecha de denuncia. Puede pagar **persona distinta** al sancionado, identificándose con documento oficial.\n- Se cobra lo que indique IRIS (**multa + tasas + derechos de giro**); el empleado no puede modificarlo. Si el cliente no está conforme, se devuelve la notificación.\n- Justificante validado mecánicamente, **sin sello**.\n- Anulación: **mismo día** y **misma oficina**; el original se archiva con el anulado.\n\n### ITP de vehículos y sin aviso de pago\n- Desde **2022**, acuerdos con Agencias Tributarias de **Cataluña y Andalucía**: pago del ITP de vehículos usados aportando DNI, ficha técnica, contrato de compraventa y permiso de circulación.\n- Sin aviso de pago: **IRIS>>Admisión>>Cobro de recibos>>Sin aviso de pago**; solo empresas del listado.\n  - **Línea Directa**: número de póliza.\n  - **Endesa**: nº de contrato o DOI y \"Consultar\".\n  - **Citibank**: CCC sin los 4 primeros dígitos (**0122** por defecto) + importe.\n  - **WiZink**: número de cuenta corriente.\n- Más de 999,99 € (casos permitidos): escanear DOI y grabar número y nombre completo.\n- No se admite **tarjeta** ni se emite **factura**.\n- Mantenimiento: **IRIS>>Gestión>>Mantenimiento>>Cobro de recibos** (anular multa y reimprimir el mismo día; días anteriores solo consulta).\n\n### 1.1.1. Portal de Servicios al Ciudadano\n- **AT Cataluña**: pago ITP. **AT Andalucía**: ITP, certificados (ingreso, deuda, patrimonio) y pago de impuestos.\n\n## 1.2. Servicios en colaboración con la DGT\n\n### 1.2.1. Distintivo ambiental\n- Identifica el vehículo por contaminación y fecha de matriculación. **4 modelos** de pegatina por color; **8 modelos** vendibles en oficina según categoría y tipo.\n- Diámetro: **97 mm** (vehículos y furgonetas), **87 mm** (motocicletas).\n- Documentación original (sin guardar copia): **permiso de circulación** + documento identificativo del titular o autorizado.\n- Ruta: **IRIS>>Admisión>>Solicitudes DGT>>Impresión Distintivo Medioambiental**. Vehículo no categorizado → DGT.\n- Se imprime con el logo DGT entrando primero; se imprimen los datos del vehículo.\n- Máximo **15 distintivos/año** por matrícula en oficina; más → DGT presencial.\n- **Correos Market**: entrega en domicilio, oficina o Citypaq en **48/72 h**; adjuntar una única imagen/documento (.pdf, .jpg, .jpeg, .gif, .png).\n- Reparto: aplicación **HERA** de la PDA; en unidad rural, la oficina técnica recibe email con código de un solo uso.\n- Incidencias:\n  - Sin stock: disponible en **3-4 días**; el jefe de sector lo envía por **Paq Premium**; entrada en **SGIE**.\n  - No impreso y no deteriorado: reimpresión gratuita con misma numeración (**IRIS>>Gestión>>Solicitudes DGT>>Reimpresión/Anulación Distintivos**), hasta **15 reimpresiones** además de la inicial.\n  - Impresión fallida e inutilizado: anulación por el jefe **el mismo día de la venta** y destrucción segura.\n  - Listado DGT distintivos MA: estados **Anulado, Erróneo, Inactivo, Activo**.\n- Devolución: **Paq Estándar** a FNMT-RCM (Madrid), referencia \"Distintivos ambientales\"; no se admiten con grapas, clips o arrugados.\n\n### 1.2.2. Duplicado del permiso de circulación\n- Solo por **extravío, deterioro o sustracción del permiso** (no del vehículo); otros motivos → Delegación/Jefatura Provincial de Tráfico.\n- Ruta: **IRIS>>Admisión>>Solicitudes DGT>>Duplicado Permiso Circulación** (matrícula sin guiones ni puntos, documento del titular).\n- Documentación original y en vigor (fotocopias compulsadas):\n\n| Titular / solicitante | Documentación |\n|---|---|\n| Persona física titular | DOI |\n| Persona jurídica (representante/autorizado) | Tarjeta de identificación fiscal + DOI del representante |\n| Persona física con autorizado | DOI del autorizado + DOI del titular |\n\n- DOI válidos: DNI o pasaporte, permiso de conducir español, permiso de residencia (no comunitarios), documento + inscripción en Registro Central de Extranjeros (comunitarios).\n- Firma en tableta; enviada a Tráfico ya **no se anula**.\n- **Autorización Provisional de Circulación**: válida **90 días naturales**; incluye nº prerregistro y **CSV** para descargar en correos.es/DGT.\n- Ticket con dos conceptos: **código de servicio** (tasa DGT, exenta de IVA) y **duplicado DGT** (gestión Correos, con IVA; admite factura completa).\n- Reimpresión: misma oficina y mismo día.\n\n### 1.2.3. Informe de vehículos\n- Ruta **Admisión>>Solicitudes DGT>>Informe de vehículos**; entrega **inmediata**.\n- **Informe técnico completo**: datos administrativos, titular, municipio, historial **ITV**, kilómetros, nº titulares, **EuroNCAP**. Requiere datos del solicitante y del vehículo (matrícula, bastidor, **NIVE**).\n- **Informe de titularidad** (\"Vehículos a mi nombre\"): vehículos activos a nombre del interesado; **no por persona autorizada**.\n- Aceptado en tableta, no se cancela. Un único ejemplar original; no queda copia en oficina.\n- Cobro: servicio Correos (con IVA) + tasa DGT (exenta, CIF DGT).\n\n### 1.2.4. Cambio de titularidad (comprador)\n- Ruta **IRIS>>Admisión>>Solicitudes DGT>>Cambio de Titularidad de vehículos**.\n- **No tramitable en Correos**: cambio de servicio, **renting**, **donación o sucesión**, cotitulares (vendedor), transmisión Ceuta/Melilla/Canarias ↔ Península/Baleares, adjudicación judicial o subasta, compraventa en posesión.\n- Acreditación: autónomo (nº factura + **IAE**), empresa (nº factura), particular (contrato + CP para ver si precisa **CET**).\n- Entre particulares: justificante del ITP (**modelo 620 o 621**) con **CET**, salvo **La Rioja y Murcia**. Sin obligación de ITP → no tramitable en Correos.\n- Vendedor autónomo/empresa: no hay ITP; factura con IVA.\n- Respuesta: **No tramitable** (ofrecer informe de vehículo) o **Tramitable**.\n- Documentación: permiso de circulación, factura/contrato, DOI del solicitante (empadronamiento **< 3 meses** si cambia domicilio), fotocopia DOI vendedor. Escaneo con **GESCAN**.\n- APC de **90 días**. **No se anula**; reimpresión mismo día y oficina.\n- Solo oficinas habilitadas, solo entre particulares y sin representación.\n\n### 1.2.5. Notificación de venta (vendedor)\n- Ruta **IRIS>>Admisión>>Solicitudes DGT>>Notificación de venta**. Mismos supuestos excluidos y mismo esquema; se aporta fotocopia del DOI del **comprador**. No anulable.\n\n### 1.2.6. Balizas V16\n- Desde el **1 de julio de 2022**; marca **Sostraffic**, homologada por el **LCOE**; visible a **más de 1 km**; batería LiPo de **más de 2 horas**, USB, imanes de neodimio.\n\n## 1.3. ORVE (Oficina de Registro Virtual)\n- Acuerdo con el **MINHAP**: registro electrónico con organismos adheridos.\n- Documentos: **A4**, sueltos, bordes lisos; no electrónicos (USB/CD van por certificado); no desencuadernar; no digitalizar papel cebolla o cartón; todo lo aportado se considera original.\n- Clasificación: **copia electrónica auténtica** (original cotejado), **copia** (no se garantiza original), **copia original** (físico por correo postal).\n- Ilegible → certificado administrativo.\n- Admisión: **IRIS>>Admisión>>Otros servicios>>Registro digital**, escaneo con **GESCAN**.\n\n| Límite ORVE | Valor |\n|---|---|\n| Documentos por envío | Máximo **5** |\n| Tamaño por documento | **10 MB** (~40 páginas o 20 hojas) |\n| Conjunto | **15 MB** |\n| Campo \"Resumen\" | **80 caracteres** |\n\n- Cotejo visual riguroso (se da fe de copia literal). Cobro y después envío desde **Llamadas a sistemas externos>>Servicios Digitales>>ORVE** (\"Autentica\").\n- Organismo desconocido → superior jerárquico u **órgano raíz**.\n- Parte física → certificado; su número en \"Número de Transporte\" (Información Complementaria).\n- Más de 40 páginas (o 20 a doble cara): dividir y usar **\"Replicar\"** + \"No añadir\"; en Resumen se cita el registro anterior.\n- Pendientes de envío: se muestran hasta **3 meses** (\"Antiguos\" para más). Duplicados por pulsar varias veces \"Enviar\" → anular.\n- **SIR** no permite anular registros enviados. Destino solo rechaza: documentación errónea, administración no integrada en SIR o destino desconocido; nunca por incompetencia de la unidad.\n- Carpeta enviados/rechazados: **Replicar, Reenviar, Rectificar, Marcar como leído**.\n- El director comprueba a diario que \"Pendientes de envío\" quede a **cero**.\n- Rechazo por fallo de la oficina: Atención al cliente contacta **2 días** y, si no, **burofax**.\n\n### Certificado Electrónico Cualificado de Representación\n- Para personas jurídicas o entidades sin personalidad jurídica (**no persona física**).\n- DOI escaneado **a color**, resto en escala de grises.\n- Destino: **AEAT** (no FNMT); **DIR3 EA0028512**; Asunto \"CERTIFICADOS FNMT\".\n- Rechazo: persona física, administrador único o solidario, empleado público, o documentación incompleta.\n\n## 1.4. Buzón Digital\n- Envío digital a empresas con contrato con Correos; acceso en IRIS por **Servicios Digitales>>Buzón Digital**; primero \"Abrir el condicionado\".\n- Hasta **25 hojas** por documento, **25 documentos/mes**, máximo **300 MB**.\n- Anulación solo en los **5 minutos** siguientes (\"Historial de envíos\" > \"Cancelar\").\n- Sin contrato (antes **Mi Buzón**): con **Correos ID**, **2 GB** gratis; **Premium** hasta **10 GB**. Firma electrónica, comunicaciones certificadas y **Pendrive en Cloud**.\n\n## 1.5. Pago de lotería\n- Se pagan **Sorteo de Oro** y **Navidad de Cruz Roja** y boletos **ONCE**. Correos es el **único punto de pago** de participaciones premiadas.\n- Ruta **IRIS>>Admisión>>Pago Premios** (por defecto, ONCE). Lectura siempre con pistola.\n\n| Premio | ONCE | Cruz Roja |\n|---|---|---|\n| ≤ 1.000 € | Metálico u OIC | Metálico u OIC |\n| > 1.000 € y < 2.000 € | Abono en cuenta obligatorio | Transferencia |\n| ≥ 2.000 € | Requiere **autorización** | Transferencia |\n\n- ≥ 1.000 €: la oficina guarda copia del cupón. Envío mensual a la Administración postal provincial; boletos ONCE < 2.000 € se guardan **5 meses**.\n\n## 1.6. Pago de premios Cruz Roja\n- ≤ 1.000 €: metálico o giro de ingreso en cuenta (gastos descontados; dos formularios firmados).\n- > 1.000 €: solo transferencia; firma en tableta.\n- Boletos cruzados con \"Pagado\", guardados hasta fin del mes de cierre del plazo y luego a **\"Papelote\"**.\n- Correos colabora con el Sorteo del Oro desde **1994**.\n\n## 1.7. ONCE\n\n### Pago de premios\n- < 2.000 €: sin autorización. Metálico con **NIP**, se valida el cupón (CODIRED, importe, fecha); **no anulable**. Cuenta: **24 dígitos con IBAN**; no aplica PBC.\n- ≥ 2.000 €: no se pagan, se tramita documentación por duplicado: Solicitud EECC, datos por perceptor, Consentimiento expreso, Nota informativa. Ruta **IRIS>>Admisión>>ONCE>>Solicitud de pago**; cuenta errónea en rojo. Se escanea y envía a la ONCE.\n- Boletos ≥ 2.000 € archivados hasta orden de remisión; se inutilizan con sello de fechas; devolución por **logística inversa L3**.\n- Carpeta \"Premios ONCE\": **5 meses**.\n\n### Venta electrónica\n- Desde finales de **mayo de 2017**. No a **menores de 18**; máximo **2.499,99 €** por venta; cobro antes de confirmar; sin devolución salvo fallo técnico o error.\n- Productos: extraordinarios preimpresos; juegos cupón (Cuponazo, Sueldazo, extraordinarios); juegos activos (SuperOnce, Triplex, Eurojackpot, Mi día); **Rascas**.\n\n| Rasca | Precio | Boletos/libro |\n|---|---|---|\n| Mini Buzón | 1 € | 100 |\n| El Buzón | 3 € | 50 |\n| Gran Buzón | 5 € | 30 |\n| x10 | 2 € | 50 |\n| x20 | 5 € | 30 |\n| Megamillonario | 10 € | 15 |\n| Rasca de Navidad | 5 € | 30 |\n\n- Aplicación **HERMES**; incidencias: **ATENEO** (917939704, de **8 a 22 h**).\n- Recepción en Paq Estándar al director, alta en SGIE; se lee un código por libro; pulsar \"Finalizar\"; la sesión expira en **3 minutos**.\n- Electrónica: confirmar antes de **1 minuto** o hay descuadres. \"Sorteo en curso\" impide vender.\n- Anulación Extra, Cuponazo, Sueldazo: **2 minutos**; después, o productos activos, llamar al 917939704.\n\n### Gestión de vendedores\n- Operaciones hasta las **18:00**; recogida de cupones el día asignado (generalmente **miércoles**).\n- Albarán dado de alta el mismo día; \"Código no existe\" → reintentar más tarde.\n- Liquidación: nunca por importe inferior al solicitado; error al alza → incidencias.once@correos.com. \"Vendedor de baja\" → CAU.\n- No se canjean premios **< 200 €** en la liquidación. Sin entregas parciales.\n- \"Resumen Liquidación Vendedor ONCE\" archivado **5 meses**.\n- Autorización **ordinaria** (del vendedor) o **extraordinaria** (ONCE; solo entrega de paquetes).\n- No retirados: devolución el **día siguiente hábil** por L3.\n\n## 1.8. Entradas, viajes y Caja Regalo Sorpresa\n- Rutas: **Ocio y loterías>>Entradas y viajes** u **Otros Servicios>>Venta de Entradas**; web entradas.correos.es.\n- Gestiona **Viajes Trenpy (Happytren)**: contrato directo con el cliente.\n- Pago en efectivo o tarjeta. Cancelación de entrada impresa: misma oficina, antes de **24 horas**. Evento cancelado: no se devuelve en oficina (910 374 278).\n- **Waynabox**: viaje sorpresa a Europa, vuelos y **2 noches**. Tipo A (Madrid, Barcelona) **299 €**; Tipo B (Alicante, Málaga, Valencia, Palma) **399 €**; Tipo C (Sevilla, Bilbao) **499 €**. Envío por Paq Estándar: **3 €**.\n\n## 1.9. Suministros\n\n### Telefonía\n- **O2** (Telefónica): **Telefonía>>O2**; contrato por duplicado (cliente y O2), sin copia en oficina; bolsa a cero; domiciliación; SIM en **24-48 h** por **Paq Premium**. Copia a **Tuenti Technologies**.\n- **Correos Telecom**: fibra, internet y móvil; permanencia **24 meses**; cobertura en cobertura.correostelecom.es (Chrome o Edge); contrato PDF editable, dos copias; envío a **AVATEL** por Paq Estándar.\n- **Telecor**: recargas (Recargar, Consultar, Anular, Reimprimir); no sube a bolsa; copia a destrucción. Tarjetas recargables: **5 a 150 €**, 9 primeros dígitos del PIN.\n- **Paysafecard**: PIN de **16 dígitos**; valores **10, 25, 50 y 100 €**; hasta **10 cupones** (1.000 € registrados / 50 € sin registro); mantenimiento de **3 €/mes** desde el séptimo mes; sin anulaciones.\n\n### Electricidad y gas\n- **Naturgy** (2021): más de 1.000 oficinas, **30 %** de descuento; SMS; bolsa a 0 €.\n- **Repsol**: luz 100 % renovable, hasta 150 € en carburante y 80 € en **Waylet**; inició en 300 oficinas.\n\n## 1.10. Tarjetas Gift Card\n- Ruta **Ocio y loterías>>Giftcards**. Dos tickets: factura simplificada y activación (con PIN).\n- Devolución en **15 días** desde activación con ticket y Rasca intacto; **Opensport 20 PIN** no admite devolución.\n- **Money 4U**: canje de código por dinero.\n\n## 1.11. Cesión de espacios\n- Horarios: 8:30-20:30 urbanas; hasta 14:30 rurales; hasta 22:00 centros comerciales.\n- Venta sin stock con comisión; cartelería **64 x 86 cm**.\n- Pantallas: interior **12 h**, exterior **14 h**; **1.000 pantallas en 450 oficinas**; slots de **10 segundos** en ciclo de **2 minutos**, máximo **4 slots**. Bonos mensuales o de 15 días. Solicitud con **3 días hábiles** de antelación.\n- Cajeros: **1.500** (1.200 en oficinas y 300 en localidades rurales de 500-3.000 habitantes).\n\n## 1.12. Captación de clientes\n- **Repsol** (Energía>>Repsol) y **AXA** (Seguros>>AXA; 2022, inicio en **125 oficinas**). SMS al cliente; bolsa a cero con caja abierta.\n\n## 1.13. Correos Market\n- Ruta **Admisiones terceros>>Correos Market**; nunca entrar en \"Tienda Correos\". Teléfono móvil obligatorio.\n- Dos copias firmadas; copia escaneada a validaciones@correos.com. Factura: el vendedor (market@correos.com).\n- Sin confirmar: \"Cancelar\". Confirmada: en la web durante **la hora siguiente**; después, market@correos.com.\n\n## 1.14. Correos - Banco Santander (Correos Cash)\n- Solo el **titular**; no terceros.\n\n| Servicio | Importe |\n|---|---|\n| Retirada | 10 - 2.500 € |\n| Ingreso | 10 - 2.500 € |\n| Entrega a domicilio | 10 - 500 € (comisión **6 €**) |\n\n- Canal digital: QR válido **7 días**; 1 operación/día y 3 en 7 días.\n- **2 operaciones gratis/mes** sin sucursal Santander; si no, **1,30 €** retirada y **1,80 €** ingreso.\n- Domicilio: **1-3 días hábiles**; ausente: **18 días** para retirar.\n\n## 1.15. Correos Cultura\n- Abono de **Abonoteatro**: **49,90 €** + 3,50 €/entrada; **365 días**; cine de lunes a jueves.\n- Devolución: **15 días** si no está registrado; en oficina dentro de **1 hora**.\n\n## 1.16. Paq Mochila\n- Pago con código del presupuesto en **Admisiones terceros>>Camino de Santiago**; anulable el **mismo día y oficina** (\"Devolver importe\").\n\n## Claves para el examen\n- Cobro de recibos: solo **metálico**, solo por **IRIS**, máximo **999,99 €**.\n- Multas DGT: anulación **mismo día y misma oficina**; justificante sin sello.\n- Distintivo: **97 mm / 87 mm**; máximo **15/año** por matrícula.\n- APC: **90 días naturales**; duplicado solo por extravío, deterioro o sustracción del permiso.\n- Cambio de titularidad: excluidos renting, donación/sucesión y subasta; **CET** salvo La Rioja y Murcia.\n- ORVE: **5 docs**, **10 MB**, **15 MB**; Resumen de **80 caracteres**.\n- Buzón Digital: anulación en **5 minutos**; 2 GB gratis / 10 GB Premium.\n- ONCE: ≤1.000 € metálico; 1.000-1.999,99 € cuenta; ≥2.000 € autorización; venta máx **2.499,99 €**; anulación en **2 minutos**.\n- Vendedores ONCE: hasta las **18:00**; no premios < 200 € en liquidación; archivo **5 meses**.\n- Waynabox: **299 / 399 / 499 €**; entradas: cancelación antes de **24 h**.\n- Gift Card: devolución en **15 días**; Correos Market: anulación en **1 hora**.\n- Santander: retirada/ingreso 10-2.500 €; domicilio 10-500 € (6 €); **18 días** para retirar.", "preguntas": [{"p": "¿Cuál es el importe máximo general para el cobro de recibos en oficinas de Correos?", "o": ["499,99 €", "999,99 €", "1.499,99 €", "2.499,99 €"], "c": 1, "e": "El importe máximo es 999,99 €, salvo multas de tráfico, UCI, Cofidis, WiZink Bank y Citibank.", "pag": 285}, {"p": "La anulación del cobro de una multa de tráfico en oficina es posible:", "o": ["Dentro de las 24 horas siguientes en cualquier oficina", "Dentro de los cinco días hábiles siguientes en la misma oficina", "Nunca, ya que debe solicitarse a la DGT", "Si se cobró ese mismo día y se tramita en la oficina donde se cobró"], "c": 3, "e": "El cobro de una multa se puede anular siempre que se haya cobrado ese mismo día y en la oficina donde se cobró.", "pag": 289}, {"p": "En el cobro sin aviso de pago de recibos de Citibank, ¿qué cuatro primeros dígitos del CCC figuran por defecto?", "o": ["0122", "0049", "0182", "0075"], "c": 0, "e": "Se introduce el CCC del cliente excepto los cuatro primeros dígitos, que figuran por defecto (0122).", "pag": 290}, {"p": "¿Qué diámetro tiene el distintivo ambiental de la DGT para motocicletas?", "o": ["77 mm", "97 mm", "87 mm", "107 mm"], "c": 2, "e": "Los distintivos miden 97 mm para vehículos y furgonetas y 87 mm para motocicletas.", "pag": 293}, {"p": "¿Cuántos distintivos ambientales pueden confeccionarse como máximo en oficina para una misma matrícula en un año?", "o": ["5", "10", "15", "20"], "c": 2, "e": "En la oficina se pueden confeccionar hasta 15 distintivos al año por matrícula; para más hay que acudir a la DGT.", "pag": 294}, {"p": "¿Cuál de los siguientes motivos NO permite tramitar en Correos el duplicado del permiso de circulación?", "o": ["Sustracción del vehículo", "Extravío del permiso", "Deterioro del permiso", "Sustracción del permiso"], "c": 0, "e": "El duplicado se tramita por extravío, deterioro o sustracción del permiso, no del vehículo.", "pag": 296}, {"p": "¿Durante cuánto tiempo es válida la Autorización Provisional de Circulación del duplicado del permiso?", "o": ["30 días naturales", "60 días hábiles", "180 días naturales", "90 días naturales"], "c": 3, "e": "La Autorización Provisional de Circulación es válida durante 90 días naturales desde su expedición.", "pag": 298}, {"p": "Respecto al informe de titularidad del vehículo (\"Vehículos a mi nombre\"), señale la afirmación correcta:", "o": ["Incluye el historial de ITV y la puntuación EuroNCAP", "No se puede solicitar por persona autorizada", "Su plazo de entrega es de 48 horas", "Solo puede solicitarlo una persona jurídica"], "c": 1, "e": "En el informe de titularidad, los datos del solicitante no pueden ser de persona autorizada.", "pag": 299}, {"p": "¿Cuál de los siguientes supuestos impide tramitar el cambio de titularidad de un vehículo en Correos?", "o": ["Cambio de titularidad por donación o sucesión", "Compraventa entre particulares con CET", "Comprador con domicilio distinto al de su DOI", "Pago del ITP en una oficina de Correos"], "c": 0, "e": "Entre los supuestos no tramitables están el renting, la donación o sucesión y la adjudicación judicial o subasta.", "pag": 300}, {"p": "¿En qué comunidades no es necesario aportar el CET porque la Oficina Liquidadora lo comunica telemáticamente a Tráfico?", "o": ["Cataluña y Andalucía", "Aragón y Navarra", "La Rioja y Murcia", "Madrid y Valencia"], "c": 2, "e": "Sin CET no puede cambiarse la titularidad, excepto en La Rioja y Murcia.", "pag": 301}, {"p": "En ORVE, ¿cuál es el tamaño máximo del conjunto de documentos de un envío?", "o": ["10 MB", "15 MB", "25 MB", "300 MB"], "c": 1, "e": "Cada documento no puede exceder 10 MB y el conjunto no excederá los 15 MB.", "pag": 305}, {"p": "¿Cuántos caracteres como máximo admite el campo obligatorio \"Resumen\" en ORVE?", "o": ["50", "100", "160", "80"], "c": 3, "e": "El campo \"Resumen\" no puede sobrepasar los 80 caracteres.", "pag": 306}, {"p": "En ORVE, cuando lo que se digitaliza es un original cotejado por el empleado de Correos, el documento se clasifica como:", "o": ["Copia", "Copia original", "Copia compulsada digital", "Copia electrónica auténtica"], "c": 3, "e": "La copia electrónica auténtica es la digitalización de un original cotejado por el empleado.", "pag": 304}, {"p": "¿A qué destino se envía en ORVE la solicitud de Certificado Electrónico Cualificado de Representación?", "o": ["A la FNMT", "A la AEAT", "Al MINHAP", "A la Tesorería General de la Seguridad Social"], "c": 1, "e": "El destino es la AEAT (DIR3 EA0028512), puesto que no se envía a la FNMT.", "pag": 311}, {"p": "¿En qué plazo puede anularse un envío a Buzón Digital admitido en oficina?", "o": ["Durante la hora siguiente a su admisión", "Hasta el cierre de caja del mismo día", "Durante los cinco minutos siguientes a su admisión", "Durante las 24 horas siguientes"], "c": 2, "e": "La anulación solo es posible durante los cinco minutos siguientes a su admisión.", "pag": 312}, {"p": "Un cliente presenta un boleto de la ONCE premiado con 1.500 €. ¿Cómo se abona?", "o": ["Obligatoriamente mediante abono en cuenta", "En metálico con cargo a la caja de la oficina", "Requiere autorización previa de la ONCE", "En metálico o abono en cuenta a elección del cliente"], "c": 0, "e": "Los premios superiores a 1.000 € y hasta 1.999,99 € se abonan obligatoriamente en cuenta, descontando gastos.", "pag": 316}, {"p": "¿Cuál es el importe máximo de una venta de productos ONCE en oficina?", "o": ["999,99 €", "2.499,99 €", "1.999,99 €", "2.999,99 €"], "c": 1, "e": "El importe de una venta será como máximo de 2.499,99 €.", "pag": 320}, {"p": "¿Qué precio y cuántos boletos por libro tiene el rasca \"El Gran Buzón\"?", "o": ["5 euros, libros de 30 boletos", "3 euros, libros de 50 boletos", "1 euro, libros de 100 boletos", "10 euros, libros de 15 boletos"], "c": 0, "e": "El Gran Buzón cuesta 5 euros y viene en libros de 30 boletos.", "pag": 321}, {"p": "¿De cuánto tiempo dispone el empleado para anular cupones Extra, Cuponazo y Sueldazo desde la venta?", "o": ["Un minuto", "Cinco minutos", "Quince minutos", "Dos minutos"], "c": 3, "e": "Ante fallo técnico o error, hay dos minutos desde la venta para anular cupones Extra, Cuponazo y Sueldazo.", "pag": 325}, {"p": "¿Hasta qué hora pueden realizarse las operaciones de gestión de vendedores de la ONCE?", "o": ["Hasta las 14:30 horas", "Hasta las 20:30 horas", "Hasta las 18:00 horas", "Hasta el cierre de caja"], "c": 2, "e": "Las operaciones pueden hacerse hasta las 18:00; después solo se pueden hacer consultas.", "pag": 326}, {"p": "En la liquidación de un vendedor ONCE, ¿qué boletos premiados no puede incluir para su canje?", "o": ["Los premiados con menos de 1.000 €", "Los premiados con 2.000 € o más", "Los premiados con menos de 200 €", "Los premiados con menos de 50 €"], "c": 2, "e": "No puede incluir boletos premiados inferiores a 200 €, que liquida en sus terminales.", "pag": 327}, {"p": "¿Cuál es el precio de la Caja Regalo Sorpresa Waynabox con salida desde Málaga?", "o": ["299 €", "449 €", "499 €", "399 €"], "c": 3, "e": "El tipo B (Alicante, Málaga, Valencia y Palma) cuesta 399 €.", "pag": 333}, {"p": "Una entrada ya impresa puede anularse en la misma oficina:", "o": ["Antes de que transcurran 24 horas desde la compra", "Hasta el día anterior al evento", "Dentro de los 15 días siguientes", "Solo si se cancela el evento"], "c": 0, "e": "Puede anularse en la misma oficina antes de que transcurran 24 horas desde la adquisición.", "pag": 332}, {"p": "¿Qué permanencia conlleva la contratación de los servicios de Correos Telecom?", "o": ["6 meses", "24 meses", "12 meses", "18 meses"], "c": 1, "e": "Su contratación conlleva una permanencia de 24 meses.", "pag": 336}, {"p": "¿Cuántos dígitos tiene el código PIN de un cupón Paysafecard?", "o": ["16", "9", "12", "20"], "c": 0, "e": "Paysafecard es un código PIN de 16 dígitos.", "pag": 338}, {"p": "¿En qué plazo puede devolverse y anularse una tarjeta Gift Card en la oficina?", "o": ["En las 24 horas siguientes", "En los 15 días siguientes a su activación", "En los 7 días siguientes", "En los 30 días siguientes"], "c": 1, "e": "Se puede devolver en los 15 días siguientes a su activación con el ticket y el Rasca intacto.", "pag": 340}, {"p": "¿Con qué antelación mínima debe tramitarse la solicitud de publicidad en pantallas de oficinas?", "o": ["Un día hábil", "Cinco días naturales", "Tres días hábiles", "Quince días naturales"], "c": 2, "e": "El plazo requerido es de al menos tres días hábiles antes del inicio del contrato.", "pag": 345}, {"p": "Una operación de Correos Market ya confirmada puede anularse en oficina:", "o": ["Desde IRIS hasta el cierre de caja", "Durante las 24 horas siguientes, desde IRIS", "Durante los 15 días siguientes", "Durante la hora siguiente a su confirmación, desde la web"], "c": 3, "e": "Debe anularse en la web de Correos Market en la hora siguiente; no se puede cancelar en IRIS.", "pag": 351}, {"p": "¿Entre qué importes puede solicitarse la entrega de efectivo a domicilio de Correos Cash para clientes del Banco Santander?", "o": ["Entre 10 y 2.500 euros", "Entre 10 y 500 euros", "Entre 50 y 1.000 euros", "Entre 20 y 300 euros"], "c": 1, "e": "La entrega a domicilio va de 10 a 500 euros como máximo.", "pag": 351}, {"p": "¿Qué validez tiene el abono Correos Cultura desde la fecha de registro?", "o": ["365 días", "90 días", "180 días", "24 meses"], "c": 0, "e": "Desde la fecha de registro tiene una validez de 365 días.", "pag": 353}, {"p": "¿A dónde se remiten los problemas técnicos que surjan en el cobro de recibos?", "o": ["Al Centro de Atención al Usuario (CAU)", "A la Subdirección de Red de Oficinas", "A la empresa emisora del recibo", "Al jefe de sector de la oficina"], "c": 0, "e": "Los problemas técnicos en el cobro de recibos se remiten al CAU de Correos.", "pag": 286}, {"p": "¿Cuál de estas empresas NO figura entre las citadas con acuerdo para el cobro de recibos sin aviso de pago?", "o": ["WiZink Bank", "Endesa", "Línea Directa Aseguradora", "Cofidis"], "c": 3, "e": "Las empresas citadas para la modalidad sin aviso de pago son WiZink Bank, Endesa, Línea Directa Aseguradora y Citibank.", "pag": 286}, {"p": "En un recibo con pago fraccionado introducido por primera vez, ¿qué número asigna IRIS por defecto?", "o": ["0", "1", "99", "El de la fecha de pago"], "c": 0, "e": "La aplicación asigna el número 0 por defecto cuando se introduce por primera vez el recibo.", "pag": 288}, {"p": "En el cobro de una multa de la DGT, ¿qué código de barras debe leerse?", "o": ["El más grande, situado en la parte inferior de la denuncia", "El que figura junto a la matrícula del vehículo", "El más pequeño, arriba a la derecha, que coincide con el número de expediente", "Cualquiera de ellos, ya que contienen los mismos datos"], "c": 2, "e": "Debe leerse el que coincide con el número de expediente, un código más pequeño en la parte superior derecha.", "pag": 288}, {"p": "El importe final que IRIS muestra al cobrar una multa de tráfico corresponde a:", "o": ["Importe de la multa + tasas + derechos de giro", "Importe de la multa + IVA", "Importe de la multa sin descuentos ni recargos", "Importe de la multa + comisión de Correos + IVA"], "c": 0, "e": "El importe corresponde a multa + tasas + derechos de giro, y el empleado no puede modificarlo.", "pag": 289}, {"p": "Para cobrar sin aviso de pago un recibo de Línea Directa Aseguradora, el trabajador debe introducir:", "o": ["El número de contrato o el DOI", "El número de póliza", "El código de cuenta del cliente (CCC)", "El número de cuenta corriente"], "c": 1, "e": "Para Línea Directa se introduce el número de póliza para que IRIS muestre la cantidad a cobrar.", "pag": 290}, {"p": "En septiembre de 2022 Correos anunció un convenio con el Gobierno de Aragón para el pago de sus impuestos mediante:", "o": ["Correos Cash", "Giro inmediato", "Correos Pay", "Buzón Digital"], "c": 2, "e": "El convenio permite el pago de impuestos con Correos Pay en oficinas y a través de carteros rurales.", "pag": 292}, {"p": "Atendiendo a categorías y tipologías de vehículos, ¿cuántos modelos de distintivo ambiental pueden venderse en una oficina de Correos?", "o": ["Cuatro", "Ocho", "Seis", "Diez"], "c": 1, "e": "La DGT tiene cuatro modelos de pegatina, pero en oficina pueden venderse ocho modelos según categoría y tipo de vehículo.", "pag": 292}, {"p": "Si en la oficina no queda el distintivo necesario, el jefe de sector lo cursa de forma urgente mediante:", "o": ["Paq Premium", "Paq Estándar", "Carta certificada urgente", "Valija interna"], "c": 0, "e": "El jefe de sector cursa los distintivos de forma urgente mediante Paq Premium desde la oficina principal.", "pag": 294}, {"p": "¿Con qué aplicación de la PDA puede el personal de reparto prestar el servicio de distintivo ambiental?", "o": ["HERMES", "SGIE", "GESCAN", "HERA"], "c": 3, "e": "Este servicio puede prestarse por el personal de reparto mediante la aplicación HERA de la PDA.", "pag": 294}, {"p": "En el listado de operaciones de distintivos DGT, el estado \"Erróneo\" corresponde a:", "o": ["Un distintivo anulado", "Un distintivo confeccionado correctamente", "El evento de alta de un distintivo que ha sido reimpreso", "Un distintivo pendiente de recibir en la oficina"], "c": 2, "e": "Erróneo es el evento de alta de un distintivo que ha sido reimpreso.", "pag": 295}, {"p": "Si la impresión del distintivo es fallida y queda inutilizado, ¿quién y cuándo debe anularlo?", "o": ["El empleado que lo vendió, en las 24 horas siguientes", "El jefe de sector, al final del mes", "El jefe de la oficina, el mismo día de su venta", "La DGT, previa comunicación por email"], "c": 2, "e": "El jefe de la oficina debe proceder a su anulación el mismo día de su venta.", "pag": 295}, {"p": "Para el duplicado del permiso de circulación de un vehículo cuyo titular es persona jurídica, debe presentarse:", "o": ["Tarjeta de identificación fiscal y DOI del representante autorizado", "Solo el DOI del representante autorizado", "Escritura de constitución y DOI del titular", "Certificado del registro mercantil y permiso de conducir"], "c": 0, "e": "Si el titular es persona jurídica se presenta la tarjeta de identificación fiscal y el DOI del representante autorizado.", "pag": 297}, {"p": "En el ticket del duplicado del permiso de circulación, el concepto \"código de servicio\" corresponde a:", "o": ["Los gastos de gestión de Correos, sujetos a IVA", "La tasa de la DGT, exenta de IVA", "El coste del envío del permiso al domicilio", "La comisión del banco por el pago"], "c": 1, "e": "El código de servicio istro Virtual (ORVE) funciona gracias al acuerdo de colaboración de Correos con:", "o": ["La Agencia Estatal de Administración Tributaria", "La Fábrica Nacional de Moneda y Timbre", "El Ministerio de Hacienda y Administraciones Públicas (MINHAP)", "El Ministerio del Interior"], "c": 2, "e": "ORVE surge del acuerdo de colaboración de Correos y el MINHAP.", "pag": 304}, {"p": "Si un cliente presenta en ORVE documentos en formato electrónico (USB, CD):", "o": ["Se envían por correo postal mediante certificado que contenga el dispositivo", "Se copian al equipo de la oficina y se adjuntan en ORVE", "Se imprimen y después se digitalizan con GESCAN", "Se rechazan y se remite al cliente a la sede electrónica"], "c": 0, "e": "No se admiten documentos electrónicos; se envían por certificado con el USB, CD o dispositivo aportado.", "pag": 304}, {"p": "En ORVE, la documentación física enviada sin digitalización como correo postal se clasifica como:", "o": ["Copia", "Copia original", "Copia electrónica auténtica", "Copia simple"], "c": 1, "e": "Copia original: se envía la documentación física sin digitalización como correo postal.", "pag": 304}, {"p": "¿Cuántos documentos como máximo pueden incluirse en un envío de registro digital ORVE?", "o": ["Tres", "Cinco", "Diez", "Veinticinco"], "c": 1, "e": "Como máximo cinco documentos por envío; no hay límite de páginas, pero sí de megas.", "pag": 305}, {"p": "Cuando parte de la documentación ORVE se envía físicamente por certificado, su número se indica en la casilla:", "o": ["\"Número de Transporte\" de la pantalla \"Información Complementaria\"", "\"Resumen\" de la pantalla principal", "\"Asunto y Expone y Solicita\"", "\"Anexos\" de la carpeta Escáner/ORVE"], "c": 0, "e": "El número de certificado se informa en la casilla \"Número de Transporte\" de \"Información Complementaria\".", "pag": 306}, {"p": "Al consultar en ORVE los registros pendientes de envío, el sistema muestra por defecto envíos con una antigüedad máxima de:", "o": jetas al almacén", "La anulación de la activación"], "c": 0, "e": "Money 4U consiste en el canje de un código de promoción por dinero.", "pag": 342}, {"p": "¿Cuál es la ruta para la venta de tarjetas Gift Card?", "o": ["IRIS>>Admisión>>Venta de productos>>Giftcards", "IRIS>>Llamadas a sistemas externos>>Ocio y loterías>>Giftcards", "IRIS>>Admisión>>Otros servicios>>Giftcards", "IRIS>>Llamadas a sistemas externos>>Admisiones terceros>>Giftcards"], "c": 1, "e": "Su venta no se hace desde \"Venta de productos\", sino desde Ocio y loterías>>Giftcards.", "pag": 340}, {"p": "¿Qué medidas estándar tiene la cartelería contratable en la cesión de espacios?", "o": ["70 x 120 cm", "50 x 70 cm", "64 x 86 cm", "100 x 300 cm"], "c": 2, "e": "La cartelería en el interior o exterior de la oficina tiene medidas estándar de 64 x 86 cm.", "pag": 343}, {"p": "¿Durante cuántas horas se emite la publicidad en las pantallas exteriores de las oficinas?", "o": ["14 horas, de 08:00 a 22:00", "12 horas, de 08:30 a 20:30", "10 horas, de 09:00 a 19:00", "24 horas"], "c": 0, "e": "En pantallas exteriores el tiempo de emisión es de 14 horas, de 08:00 a 22:00.", "pag": 343}, {"p": "¿Cuántos slots o repeticiones como máximo pueden suscribirse por pantalla en el ciclo de dos minutos?", "o": ["Dos", "Cuatro", "Seis", "Doce"], "c": 1, "e": "Se puede suscribir hasta un máximo de cuatro slots en el ciclo de dos minutos para cada pantalla.", "pag": 344}, {"p": "¿A qué resolución debe ajustarse el contenido de las pantallas verticales de 55\"?", "o": ["1152 x 768 píxeles", "1920 x 1080 píxeles", "768 x 1152 píxeles", "1080 x 1920 píxeles"], "c": 3, "e": "Las pantallas verticales de 55\" requieren contenidos de 1080 x 1920 píxeles.", "pag": 344}, {"p": "Del proyecto de 1.500 cajeros automáticos, ¿cuántos se instalarán en localidades rurales sin oficina bancaria?", "o": ["200", "500", "300", "1.200"], "c": 2, "e": "1.200 se ubicarán en oficinas y los 300 restantes en localidades rurales de 500 a 3.000 habitantes.", "pag": 346}, {"p": "¿En cuántas oficinas comenzó a implantarse el acuerdo de Correos con AXA de 2022?", "o": ["300", "450", "125", "1.000"], "c": 2, "e": "Comienza a implantarse en 125 oficinas de Aragón, País Vasco, La Rioja y Cataluña.", "pag": 347}, {"p": "Al acceder a Correos Market desde IRIS para vender en oficina, ¿qué pestaña no debe usarse nunca?", "o": ["\"Tienda Correos\"", "\"Ir al producto\"", "\"Añadir al carrito\"", "\"Observaciones\""], "c": 0, "e": "Una vez registrado, nunca debe accederse a la pestaña \"Tienda Correos\".", "pag": 349}, {"p": "¿A qué dirección se envía la copia escaneada de los documentos firmados en una venta de Correos Market?", "o": ["validaciones@correos.com", "market@correos.com", "cobro.recibos@correos.com", "control.productos@correos.com"], "c": 0, "e": "Los originales firmados se conservan en la oficina y se envía copia escaneada a validaciones@correos.com.", "pag": 350}, {"p": "¿Qué comisión aplica el Banco Santander por la entrega de efectivo a domicilio?", "o": ["Tres euros", "Seis euros", "1,80 euros", "1,30 euros"], "c": 1, "e": "La entidad financiera aplica una comisión de seis euros por este servicio.", "pag": 352}, {"p": "Superado el límite de operaciones gratuitas de Correos Cash, ¿qué comisiones se aplican?", "o": ["1,80 € por retirada y 1,30 € por ingreso", "1,30 € por retirada y 1,80 € por ingreso", "1,50 € por cualquier operación", "2 € por retirada y 3 € por ingreso"], "c": 1, "e": "Las comisiones son de 1,30 euros para retirada y 1,80 euros para ingresos.", "pag": 352}, {"p": "Si el cliente está ausente en la entrega de efectivo a domicilio, ¿de qué plazo dispone para retirarlo en oficina?", "o": ["15 días desde el aviso", "18 días desde que se confirmó la solicitud", "7 días naturales desde el aviso", "30 días desde la solicitud"], "c": 1, "e": "Correos deja aviso y otorga 18 días desde que se confirmó la solicitud.", "pag": 352}, {"p": "¿En qué plazo puede devolverse el abono Correos Cultura en la oficina donde se adquirió, si no se ha registrado?", "o": ["15 días desde la adquisición", "7 días desde la adquisición", "30 días desde la adquisición", "48 horas desde la adquisición"], "c": 0, "e": "El cliente dispone de 15 días desde la adquisición para su devolución, siempre que no lo haya registrado.", "pag": 353}, {"p": "El pago de Paq Mochila en oficina puede anularse:", "o": ["El mismo día y en la misma oficina, con la opción \"Devolver importe\"", "En las 24 horas siguientes en cualquier oficina", "Durante la hora siguiente desde la web de Correos Market", "No se puede anular una vez cobrado"], "c": 0, "e": "Se puede anular el mismo día y en la misma oficina, con \"Devolver importe\".", "pag": 354}]}, {"letra": "E", "titulo": "Diversificación. Filatelia y otros servicios en oficinas", "paginas": "355-430", "resumen": "## 1. Soluciones digitales\n\nLa digitalización aporta a las empresas **mejor experiencia de compra** (oferta 365 días y comunicación personalizada), **mejor imagen y reputación online** y **más productividad**. Claves de la estrategia móvil: **movilidad web**, **presencia en redes** y **aplicaciones de empresa**. La transformación digital de Correos abarca la **Oficina Virtual**, las **apps móviles**, la **comunicación multicanal** y la **cultura digital y tecnológica**.\n\n### 1.1. Aplicaciones asociadas a productos y servicios\n\n**App Tarjeta Prepago**\n- Tarjeta **Mastercard** prepago, no asociada a cuenta corriente; solo se dispone del dinero cargado.\n- Gratuita (Android/iOS). Permite consultar saldo y movimientos, recargar, enviar dinero a otras tarjetas Correos Prepago, consultar PIN y bloquear/desbloquear.\n- Integrada en **Google Pay y Apple Pay**: en **2018** fue la primera tarjeta prepago para pagos con móvil.\n- Para empresas: monedero digital con **IBAN propio**, recargable por transferencia a la Cuenta Correos; los empleados adjuntan recibos y piden recargas.\n\n**App Correos** (gratuita; acceso con **Correos ID**)\n- Búsqueda de envíos, oficinas, Citypaq, buzones y códigos postales.\n- **Paqbook**: seguimiento como destinatario de envíos \"en proceso\" o \"finalizados\" en los **últimos 20 días**.\n- Realizar un envío: envío sencillo (sobre, caja o tubo), envíos pregrabados y **Burofax online con PDF de máximo 2 MB**.\n- Códigos a tramitar, Histórico (incluye Burofax online con fecha, tique, PDF y PEE).\n- **Aduanas**: trámites para envíos de valor intrínseco **hasta 150 €** sin otros trámites ni impuestos especiales.\n- Citypaq (asume los servicios de la App Citypaq, que se cierra).\n- **Cita previa**: confirmación con un **código de nueve dígitos** para el dispensador de turnos.\n- Tarjeta **Más Cerca** escaneada en el móvil.\n- Pagos **solo con tarjeta bancaria**; notificaciones push de estado y comerciales.\n- Ganó en **2020** la tercera edición de los **Premios Nacionales de Tecnología Siglo XXI**.\n\n**Otras apps**\n- **App Citypaq**: seguimiento, aviso por SMS/email, código de apertura. Pasos: registro, asociar perfil a un dispositivo, elegir dónde recoger (código de máquina si es de comunidad de vecinos, mapa si es de zona de paso). Desde **noviembre 2022** avisa de su traslado a la App Correos.\n- **App Sellos RA Correos**: sellos de realidad aumentada, Hoja Bloque y **Libro Anual**.\n- **App Correos Market**: desde **noviembre de 2021**.\n\n**Web app Correos Modify** (site *responsive*) para destinatarios de **Paq Estándar y Paq Premium**. Iconos **naranja** (cambio permitido) o **gris** (no permitido). Modificaciones posibles:\n\n| Opción | Condiciones |\n|---|---|\n| Fecha y franja | Dentro de los **7 días naturales** siguientes al SMS/email; solo fecha posterior; la fecha es comprometida, la hora no |\n| Nueva dirección | En la **misma provincia** |\n| Oficina | Misma provincia; permanencia **15 días** por defecto |\n| Citypaq público o privado | Misma provincia (privado: introducir su código) |\n| Notas de entrega | Las ve el repartidor en la **PDA** |\n| Guardar por vacaciones | Hasta **21 días** en la oficina de referencia |\n\n- SGIE pide **reetiquetar** el envío modificado (salvo notas). Con el envío **en reparto** ya no se puede modificar.\n\n### 1.2. Comunicación multicanal\n\n- Tres vertientes: **blog corporativo, canales sociales y página web**.\n- Teléfonos de Atención al Cliente: **902 197 197, 900 400 004 y 915 197 197**; email **atcliente@correos.com**.\n- **Blog**: complementa la web; existe el **blog de eCommerce**.\n- **Redes**: Facebook (\"Me gusta\"), Instagram (\"Seguir\", etiquetas), LinkedIn (\"Seguir\"), Twitter (perfil **@CorreosAtiende** para consultas), YouTube (\"Suscribirme\"); presencia incipiente en Pinterest y TikTok.\n- **Web**: renovada en **2016**; tecnología **Adobe**; idiomas cooficiales e inglés.\n- **Agente virtual** (lanzado como **Sara**; ahora imagen masculina o femenina): hasta **100 caracteres** de palabras clave; menú \"Particular\"/\"Empresa\".\n- Enlaces: Mi Oficina (telegramas, cartas, burofax: Correos imprime, ensobra y entrega), Correos Market, Prepago, filatelia (\"Filatelia más que coleccionismo\", \"Tu sello\"), redes.\n- Web corporativa **correos.com**: Grupo Correos; Personas y talento (\"Jóvenes talentos #Comenzar\"); Sala de prensa (desde 2018); **Transparencia** (Ley **19/2013**, de 9 de diciembre); Sostenibilidad (Negocio responsable, Relación con la Comunidad, Gestión sostenible); Perfil del contratante (Portal de Licitación Electrónica de Sistemas Dinámicos); **Voto por correo** (solo activo en periodos electorales).\n- Más buscado: localizador de oficinas/buzones/Citypaq, **localizador de envíos** (6 idiomas: castellano, gallego, catalán, euskera, valenciano e inglés), códigos postales, cita previa (no en todas las oficinas; desde app o Mi Oficina).\n- **Imagen corporativa 2019**: mantiene cornamusa, corona y amarillo; elimina el nombre \"Correos\"; respeta el diseño de **1977** de **José María Cruz Novillo**, nombrado **séptimo Cartero Honorario**.\n\n### 1.3. Oficina Virtual: Mi Oficina\n\n- Disponible **24 h / 7 días**; principal portal de contratación online. Alta **gratuita**, sin contrato.\n- \"Gestiona tus envíos\": seguimiento, completar/anular, incidencias. \"Realiza tus envíos\": documentos, paquetes, **ADO** (albaranes y depósitos online), recogida y aduanas, filatelia, trazabilidad.\n- **Correos ID**: identidad única; registro con email o teléfono y contraseña; código de verificación por correo o SMS.\n\n#### 1.3.1. Burofax Premium Digital\n- Se registra en el **Canal Masivo** mediante ficheros **SFTP/FTP** con el campo \"Entrega digital\".\n- Añade un **tercer intento digital** si fallan los dos físicos. Obligatorio el **teléfono** del destinatario; email opcional.\n- Si no se recoge en oficina, a los **siete días** se envía un SMS; el destinatario pide código y descarga el burofax, generándose certificación de entrega digital. Si se entrega físicamente, se genera la PEE y no hay entrega digital.\n\n#### 1.3.2. Burofax Premium Online\n- Entrega fehaciente, siempre bajo firma. Pasos: **Inicio, Envíos, Resumen, Pago, Confirmación**.\n- PDF: **máximo 100 páginas y 15 MB**, nombre de menos de **80 caracteres**, márgenes de al menos **1 cm**, tamaño ≤ **DIN A4**.\n- Un destinatario por burofax; varios burofaxes: uno a uno, fichero (**máx. 150 destinatarios**) o reutilizando.\n- Adicionales: acuse de recibo, PEE telegráfico, **custodia de 120 meses**, copia certificada.\n- Pago con tarjeta o **PayPal**, o contra contrato.\n\n#### 1.3.3. Correo digital – Carta digital\n- Cartas ordinarias y certificadas, nacionales e internacionales; no requiere alta previa en Mi Oficina.\n- Texto de hasta **20 páginas** o PDF de **no más de 1 MB** y DIN A4; blanco y negro o color; certificada nacional puede llevar PEE.\n- Destinatarios: uno a uno, reutilizando o fichero **TXT de máx. 150**.\n- Impresión a una cara, DIN A4 de **80 g**, **1200 ppp color / 300 ppp B/N**.\n\n| Hojas (con carátula) | Sobre |\n|---|---|\n| 1 a 6 | **C5** (162 x 229 mm) |\n| 7 a 20 | **C4** (229 x 324 mm) |\n\n- Tarifa por tramos: 1, 2-3, 4-6, 7-14 y más de 14 hojas, más el franqueo.\n\n#### 1.3.4. Tu Sello\n- Regulado por la **Resolución conjunta de 18 de julio de 2014** (modifica la de 20 de diciembre de 2006). Ámbito de pedido **nacional**.\n- Inscripciones: \"España\", \"Tu Sello\", \"Correos\" y valor de franqueo.\n\n| Letra | Equivalencia |\n|---|---|\n| A | Carta normalizada nacional hasta 20 g |\n| A2 | Carta no normalizada hasta 20 g o de 20 a 50 g, nacional |\n| B | Normalizada hasta 20 g Europa (Zona 1, incl. Groenlandia; excl. Albania, Armenia, Bosnia, Chipre, Georgia, Malta, Moldavia y Rusia) |\n| C | Normalizada hasta 20 g resto de países (Zona 2) |\n| D | Normalizada hasta 20 g EEUU, Canadá, Japón, Australia, Rusia y Nueva Zelanda (Zona 3) |\n\n- Valor de franqueo **indefinido**.\n- Imágenes: en sentido positivo; **no personas vivas** (salvo Jefe del Estado, Familia Real o personas de relevancia notoria) excepto en la **viñeta**; nada polémico ni ilegal; propiedad del solicitante; Correos puede rechazar devolviendo el importe íntegro.\n\n| Formato | Pliego | Medidas |\n|---|---|---|\n| Clásico | **25** sellos | 28,8 x 40,9 mm |\n| Panorámico | **15** sellos | 60 x 25 mm |\n| Con viñeta | **20** sellos | 45 x 28 mm total (sello 28 x 26) |\n\n- Todos autoadhesivos, tarifas A, A2, B, C y D; fabricados en la **FNMT-Real Casa de la Moneda**; offset azul **Pantone 541C**; dentado 13¾; texto de hasta **35 caracteres** y fecha entre 1990 y 2099; imagen **300 dpi JPG, máx. 0,5 MB**; tirada ilimitada.\n- Pedido mínimo **un pliego** (descuento desde el segundo); máximo **3000 € IVA incluido**. Sin cancelación ni devolución tras pagar.\n- Plazo máximo **30 días naturales** (normal: 5 a 7 días laborables); envío por **Paq Premium**.\n\n### 1.4. Cultura digital y tecnológica\n- **Soy Digital** (desde **2016**) en el Campus Virtual: áreas **Cultura, Personas, Procesos y Herramientas**; puntos, ranking y diploma.\n- Modelo **70-20-10**: 70 % en el puesto, 20 % entornos colaborativos, 10 % formación formal.\n- Premio **Best Digital Transformation Enterprise** (2021).\n\n### 1.5. Otros servicios digitales\n- **Tarjetas de realidad aumentada**: postales **prepagadas** con 3D y vídeo; enlazan a la tienda online.\n- **Embalajes de realidad aumentada**: con webcam, imprimiendo el logo de Correos, indica la caja idónea.\n- **Correos Market** (fusionada con la tienda online en **2022**): envío gratis **desde 20 €**.\n\n| Entrega | Estándar | Premium |\n|---|---|---|\n| Oficina | 1,30 € | 2,30 € |\n| Domicilio / Citypaq | 2,99 € | 3,99 € |\n\n### 1.6. Drones\n- **2015, Sotres (Asturias)**: hexacóptero guiado por GPS, **25 minutos** de autonomía, hasta **1,5 kg**, vientos de **40 km/h**.\n- **2018, Lugo**: dron avanzado (medicamentos, instrumental médico).\n\n## 2. Otros servicios de oficina\n\n### 2.1. Apartados postales\n- Dirección postal exclusiva en oficina (número o serie alfanumérica); en el casillero solo figura el número. Ámbito **exclusivamente nacional**.\n- Tipos: **postales/particulares, 24/7 y Franqueo en Destino (FD/CCRI)** (este sin casillero).\n- Desde el **15 de junio de 2015** la vigencia es de fecha a fecha.\n- Pago: metálico, tarjeta bancaria, tarjeta Más Cerca o diferido (contrato).\n\n| Tipo | Duración | Titulares | Otros |\n|---|---|---|---|\n| Postal | Trimestral o anual | Hasta **5 (1+4)** y **3 autorizados**, mayores de 18 | Certificados solo a titular/autorizados |\n| 24/7 | **Mes, trimestre o año** | — | Numeración **VS**; tallas S/M/L/XL (39 x 60 x 8,5/17/34/51 cm); admite Paq Premium y Estándar; tarjeta y llave |\n| FD / CCRI | FD trimestral o anual; **CCRI solo anual** | **Un titular** | Solo cartas y tarjetas; **fianza 40 %** del franqueo mensual previsto |\n\n- FD/CCRI: aportar **dos sobres** iguales a los que se usarán; la fianza se ajusta si se supera en más del **50 %** la previsión.\n- En 24/7, si no se firma el albarán, se considera entregado al ponerlo a disposición.\n\n#### 2.1.1. Contratación\n- Titularidad **secreta**; edad mínima **18 años** (salvo emancipado).\n- Impresos: **Anexo 1a** (particulares), **Anexo 1b** (otros titulares), impreso **24/7**, **Anexo II** (FD); en Conecta.\n- Sin enmiendas ni tachaduras. Mensuales y trimestrales **no se renuevan**.\n- Persona física: DOI original; jurídica: CIF/escritura o certificación del Registro Mercantil; organismo público: sello, nombramiento, capacidad y CIF. No se guardan copias.\n- **SMS gratuito** por envío registrado (móvil grabado en **IRIS**; oficina informatizada).\n- Alta en **IRIS>>Admisión>>Apartados>>Contratación**. Postales y 24/7 se vuelcan a **SGIE** por la noche; FD/CCRI no.\n- Una llave para el titular y otra en la oficina. Apartado especial **000000 Cartas Urgentes Ordinarias Recibidas** (lo gestiona el jefe de sector sin SIGUA).\n\n#### 2.1.2. Incidencias\n- Mismo día: \"**Suprimir**\" (importe a bolsa). Días posteriores: \"**Baja**\" y nueva alta con check \"**Inicialización**\" (no sube a bolsa).\n\n#### 2.1.3. Renovación\n- Solo los **anuales**. Antes del 15/06/2015: del **16 de diciembre al 30 de enero**. Después: **15 días antes hasta 30 días después** de la caducidad.\n- Avisos IRIS a los **14 y 5 días**; baja automática a los **44 días**.\n- Modalidades: **pago al contado**, **pago diferido** (automático) y **domiciliación bancaria** (solicitud escrita). Tras la orden al banco, **58 días** sin modificaciones; si el banco rechaza, **30 días** para renovar o dar de baja.\n\n#### 2.1.4. Baja\n- A petición del primer titular (sin devolución, salvo la fianza FD) o por no renovar (la fianza FD **no se devuelve**). Botones \"Baja\" (dos copias) o \"Baja no renovado\". Cambiar la cerradura.\n\n### 2.2. Reenvío postal\n- Particulares y empresas; ámbito **nacional e internacional**; también en Correos Market. Formulario en Conecta.\n- Duración: **1, 2 o 6 meses** (combinables, no a la vez). Efectivo como mínimo **un día hábil** después; inicio máximo **30 días**; online, **una semana** de antelación.\n- Modalidades: **definitivo** (al acabar, devolución al remitente) y **temporal** (vuelve al domicilio inicial).\n- Particulares: hasta **seis titulares**; empresas: una por servicio.\n- Plazo nacional: 1 día (misma localidad) a 3 días (otra provincia).\n- Excluidos: notificaciones pactadas (AEAT, Ayto. de Sabadell), giros y telegráficos, productos solo nacionales al extranjero, certificados con AR al extranjero, envíos a apartado FD (solo a otro FD). La urgente pierde ese carácter.\n- **Anulación**: mismo día y oficina, con devolución. **Cancelación**: sin devolución. **Modificación**: primera gratuita.\n\n### 2.3. Buzón de vacaciones\n- Nacional; SMS gratuito por certificado. Duración **1 a 14 semanas**; contratación desde **dos meses antes** hasta un día hábil antes (online, una semana).\n- Final: entrega a domicilio o recogida en oficina. Hasta **6 titulares** particulares; empresas un buzón; máximo **2 autorizados**.\n- Sobres colectores con código de **tres dígitos**: empieza por **0 (URO)** o **1 (USE)**.\n- Entrega a domicilio fallida: **15 días naturales** en oficina.\n- Anulación (mismo día, devolución íntegra), cancelación (sin devolución), modificación.\n\n### 2.4. Certificaciones\n- Solo para **envíos registrados**. Plazo general de solicitud: **seis meses** (Burofax Premium/Premium Plus: periodo de custodia).\n- Tipos: **imposición** (nacional e internacional), **entrega**, **intento de entrega** y **copia certificada** (Telegrama y Burofax; posterior a la admisión se llama **certificación de contenido**).\n- Internacional: solo imposición o copia certificada; visado en el **consulado** del país de destino.\n- Solicitan: remitente, destinatario (envío \"Entregado\") y autorizados judicial o por poder.\n- Giros/Western Union: email a envio.dinero@correos.com; WU con Codired **9116298**.\n- Emisión: **Mercurio** (perfil \"Certificador\"), **IRIS** (imposición/intento), **SICER** (Anexo 1).\n\n| Situación de la documentación | Plazo de entrega |\n|---|---|\n| En la oficina | **1 día hábil** |\n| Otra dependencia | **4 días hábiles** |\n| Otra oficina | **7 días hábiles** |\n\n### 2.5. Canje de vales UPU\n- Emitidos por la oficina internacional de la UPU; también **IRC / Coupon-Réponse International**. Se canjean **solo por sellos** al valor del franqueo mínimo de carta normalizada al país de compra. Botón \"UPU\" en IRIS; se envían a fin de mes al **Almacén de Filatelia**.\n\n### 2.6. Embalajes\n- **Línea Bosques** (antes Línea Verde): **5 céntimos** con **WWF**: 2 reforestación, 2 protección de ecosistemas, 1 prevención de incendios. Certificados **FSC**, **PEFC**, **Ecolabel**.\n- Cajas ecológicas: supergrande 590 x 390 x 390, grande+ 500 x 300 x 300, grande 390 x 280 x 190, mediana 317 x 215 x 125, pequeña 240 x 170 x 87 mm.\n- Especiales: botellas (1, 2 o 3), trapecio (720 x 70 mm), bicicleta (150 x 30 x 90 cm).\n- Prefranqueados: sin valor facial ni caducidad.\n\n| Prepagado certificado | Peso máx. |\n|---|---|\n| Certificado con AR | 50 g |\n| Acolchado / semirrígido pequeño | 200 g |\n| Acolchado / semirrígido grande | 500 g |\n| Caja pequeña / mediana / grande | 1 / 3 / **7 kg** |\n| Bolsa Paq Premium | 350 g o 1 kg |\n\n### 2.7. Filatelia\n- Abono gratuito en oficina o Mi Oficina; pago siempre **previo** al envío; sellos a **valor facial**. Boletín trimestral \"Sellos y mucho más\". Portal **El Rincón de Correos**.\n- **Emisiones**: sellos, hoja bloque (permite personajes vivos en el entorno), mini pliego, **pliegos Premium** (**12 a 20 sellos**; primera serie \"Arquitectura Rural\", 6/02/2014), carné.\n- **Tarjetas prefranqueadas**: A, A2, B, C y D.\n- **Sobres primer día**: pequeño 170 x 105, mediano 229 x 162, grande 250 x 190, extragrande 297 x 210 mm.\n- Libro anual **Valores en el Tiempo**; carpetas **Generaciones**; carpetas de **cinco grabados** (23 x 28 cm).\n- **Pruebas de artista**: calcográficas, no válidas para franqueo.\n- **Etiquetas ATM**: recuperadas en **2016** (tarifas A, A2, B, C); hoy en Conde de Peñalver 19 bis; pedidos hasta **100 €**; máx. **875 etiquetas por sesión**.\n- **Oficinas temporales**: filatélicas (máx. **3 h/día**) y postales temporales (máx. **8 h/día**); tarifas distintas para FESOFI/ANFIL.\n- **Matasellos**: conmemorativos y postales (especiales, operativos, primer día y presentación, con **30 días naturales** en oficina). Cancelación de menos de **50 unidades** gratuita.\n- **Blíster**: packs de 5 (B, C) y 50 (A, B). Tarifa D aún no disponible.\n\n### 2.8 a 2.10. Merchandising, productos de otras entidades y reembolso\n- **52 monedas de plata de 5 €** de capitales (tirada 15.000-25.000); UNICEF (más de **700 oficinas**); \"Un juguete una ilusión\" (desde **2000**); Lotería Cruz Roja.\n- Venta por reembolso: \"Hoja de solicitud de venta a domicilio\"; se envía como **Paq Premium contrarreembolso**; factura por duplicado; documentación de la **serie 0**.\n\n## Claves para el examen\n\n- Paqbook: últimos **20 días**; Burofax en App Correos: PDF **2 MB**; Aduanas: hasta **150 €**; cita previa: código de **9 dígitos**.\n- Correos Modify: **7 días** naturales, misma provincia, oficina **15 días**, guardar por vacaciones **21 días**.\n- Burofax Premium Online: PDF **100 páginas / 15 MB**, **150** destinatarios, custodia **120 meses**. Carta digital: **20 páginas** o PDF **1 MB**.\n- Tu Sello: pliegos **25 / 15 / 20**; máximo **3000 €**; plazo **30 días**; imagen **300 dpi, 0,5 MB**.\n- Apartados: **5 titulares (1+4) y 3 autorizados**; 24/7 con prefijo **VS**; fianza FD **40 %**; CCRI solo anual.\n- Renovación: **15 días antes y 30 después**; baja automática a los **44 días**; domiciliación: **58 días** sin cambios.\n- Reenvío: **1, 2 o 6 meses**, hasta **6 titulares**; anulación solo el mismo día y oficina.\n- Buzón de vacaciones: **1 a 14 semanas**, **2 autorizados**, código **0 URO / 1 USE**.\n- Certificaciones: solicitud en **6 meses**; entrega en **1 / 4 / 7 días hábiles**.\n- Línea Bosques: **5 céntimos** (2+2+1) con WWF.\n- Pliegos Premium **12-20 sellos**; oficinas filatélicas **3 h** y postales temporales **8 h**; cancelación gratuita por debajo de **50** unidades.\n- Drones: Sotres **2015**, **1,5 kg**, **25 min**.", "preguntas": [{"p": "En la App Correos, la sección Paqbook permite al destinatario seguir los envíos en curso o entregados durante los últimos:", "o": ["20 días", "15 días", "30 días", "10 días"], "c": 0, "e": "Paqbook muestra los envíos en proceso o finalizados de los últimos 20 días.", "pag": 360}, {"p": "¿Hasta qué valor intrínseco permite la App Correos realizar los trámites de Aduanas para recibir un envío?", "o": ["120 euros", "150 euros", "200 euros", "300 euros"], "c": 1, "e": "El apartado Aduanas sirve para envíos de valor intrínseco de hasta 150 euros sin otros trámites ni impuestos especiales.", "pag": 360}, {"p": "Con Correos Modify, el destinatario puede elegir una nueva fecha de entrega dentro de:", "o": ["Los cinco días hábiles siguientes a la llegada del SMS/email", "Los diez días naturales siguientes a la llegada del SMS/email", "Los siete días naturales siguientes a la llegada del SMS/email", "Los quince días naturales siguientes a la llegada del SMS/email"], "c": 2, "e": "Puede elegirse entre los siete días naturales siguientes al de llegada del SMS o email.", "pag": 364}, {"p": "La opción \"Guardar por vacaciones\" de Correos Modify permite guardar el envío hasta:", "o": ["15 días", "14 días", "30 días", "21 días"], "c": 3, "e": "El envío puede guardarse hasta 21 días en la oficina de referencia.", "pag": 365}, {"p": "En el Burofax Premium Digital, si el destinatario no ha recogido el burofax en la oficina, se le envía un SMS para generar la entrega digital a los:", "o": ["Siete días", "Tres días", "Quince días", "Diez días"], "c": 0, "e": "A los siete días sin recogida se envía un SMS para que descargue el burofax de forma digital.", "pag": 372}, {"p": "El documento PDF adjunto a un Burofax Premium Online pue nvíos a recibir en un mes", "El 40 % del franqueo de los envíos a recibir en un trimestre", "El 25 % del franqueo de los envíos a recibir en un año"], "c": 1, "e": "La fianza es el 40 % del franqueo de los envíos previstos en un mes.", "pag": 389}, {"p": "Para un apartado anual contratado después del 15 de junio de 2015, el plazo de renovación va desde:", "o": ["30 días antes hasta 15 días después de la fecha de caducidad", "El 16 de diciembre hasta el 30 de enero", "15 días antes hasta 30 días después de la fecha de caducidad", "14 días antes hasta 44 días después de la fecha de caducidad"], "c": 2, "e": "La fecha de renovación es la de contratación más un año, con plazo desde 15 días antes hasta 30 después.", "pag": 393}, {"p": "En los apartados con pago domiciliado, desde la fecha de renovación no pueden realizarse modificaciones (salvo rechazo del cargo) durante:", "o": ["44 días", "30 días", "60 días", "58 días"], "c": 3, "e": "Durante los 58 días siguientes a la fecha de renovación no se pueden hacer bajas, cambios de forma de pago, etc.", "pag": 396}, {"p": "¿Por qué periodos puede contratarse el servicio de Reenvío postal?", "o": ["Uno, dos o seis meses", "Uno, tres o seis meses", "Uno, tres o doce meses", "Una a catorce semanas"], "c": 0, "e": "La duración es de uno, dos o seis meses, combinables para obtener otros plazos.", "pag": 398}, {"p": "En el Reenvío postal, la anulación del contrato con devolución del importe:", "o": ["Puede hacerse en cualquier oficina mientras no haya empezado el servicio", "Solo puede hacerse el mismo día de la contratación y en la misma oficina del alta", "Puede hacerse en cualquier momento, devolviendo la parte proporcional", "Solo puede hacerse un día hábil después de la contratación"], "c": 1, "e": "La anulación solo se realiza el mismo día y en la misma oficina; la cancelación no implica devolución.", "pag": 400}, {"p": "¿Cuál es la duración mínima y máxima del Buzón de vacaciones?", "o": ["Una semana y 6 meses", "Dos semanas y 12 semanas", "Una semana y 14 semanas", "Un mes y 3 meses"], "c": 2, "e": "Se contrata por semanas, con un mínimo de una y un máximo de 14.", "pag": 402}, {"p": "El código de los sobres colectores del Buzón de vacaciones comienza por 1 cuando:", "o": ["Se trata de una URO", "El titular es una empresa", "La modalidad es de entrega a domicilio", "Se trata de una USE"], "c": 3, "e": "El código tiene tres dígitos y empieza por 0 si es una URO o por 1 si es una USE.", "pag": 403}, {"p": "Con carácter general, el plazo para solicitar una certificación sobre un envío registrado es de:", "o": ["Seis meses", "Un año", "Tres meses", "120 meses"], "c": 0, "e": "Coincide con la permanencia de la documentación, por lo general seis meses (salvo Burofax Premium y Premium Plus).", "pag": 405}, {"p": "Si para emitir una certificación hay que remitir la solicitud a otra oficina, el plazo de entrega es de:", "o": ["Cuatro días hábiles", "Siete días hábiles", "Un día hábil", "Diez días hábiles"], "c": 1, "e": "Es de un día hábil si la documentación está en la oficina, cuatro en otra dependencia y siete si va a otra oficina.", "pag": 410}, {"p": "El precio de canje de un vale UPU equivale al:", "o": ["Franqueo mínimo de una carta certificada dirigida al país donde se canjea el vale", "Valor facial impreso en el vale en la moneda del país de canje", "Franqueo mínimo de una carta ordinaria normalizada dirigida al país donde se adquirió el vale", "Franqueo de una carta normalizada nacional de hasta 20 g (tarifa A)"], "c": 2, "e": "Se canjea por el franqueo mínimo de carta ordinaria normalizada (tarifa de serie básica) al país de adquisición.", "pag": 412}, {"p": "De los cinco céntimos que destina cada embalaje Línea Bosques a proyectos con WWF España, ¿cuánto va a la prevención de incendios?", "o": ["Dos céntimos", "Tres céntimos", "Cinco céntimos", "Un céntimo"], "c": 3, "e": "Dos céntimos van a reforestación, dos a protección de ecosistemas y uno a prevención de incendios.", "pag": ión de los Premios Nacionales de Innovación Postal", "El premio a la mejor app de la Unión Postal Universal"], "c": 0, "e": "La app ganó en 2020 la tercera edición de los Premios Nacionales de Tecnología Siglo XXI.", "pag": 361}, {"p": "En Correos Modify, los cambios que el remitente ha autorizado aparecen en el dispositivo con iconos de color:", "o": ["Verde si está permitido y rojo si no lo está", "Anaranjado si está permitido y gris si no lo está", "Amarillo si está permitido y gris si no lo está", "Azul si está permitido y rojo si no lo está"], "c": 1, "e": "Los iconos son anaranjados si el cambio está permitido y grises si no lo está.", "pag": 363}, {"p": "Correos Modify está dirigida a los destinatarios de envíos de:", "o": ["Paq Ligero y Paq Today", "Paquete Azul y Paq Estándar", "Paq Estándar y Paq Premium", "Paq Premium y Paq Retorno"], "c": 2, "e": "Permite a los destinatarios de Paq Estándar y Paq Premium gestionar la entrega de sus envíos.", "pag": 363}, {"p": "Si con Correos Modify el destinatario elige recibir el envío en una oficina, este permanece en ella por defecto:", "o": ["7 días, salvo otro plazo elegido por el remitente", "21 días, salvo otro plazo elegido por el destinatario", "30 días, salvo otro plazo elegido por el destinatario", "15 días, salvo otro plazo elegido por el remitente"], "c": 3, "e": "El envío permanece 15 días por defecto, salvo que el remitente haya optado por otro plazo en el prerregistro.", "pag": 364}, {"p": "Señale la afirmación INCORRECTA sobre Correos Modify:", "o": ["Permite cambiar la dirección de entrega a cualquier provincia", "Solo se puede modificar la fecha si la nueva es posterior", "Las notas de entrega las ve el repartidor en la PDA", "Una vez en reparto no pueden hacerse modificaciones"], "c": 0, "e": "La nueva dirección de entrega debe estar en la misma provincia.", "pag": 364}, {"p": "¿Cómo se denomina el perfil de Twitter de Correos dedicado a responder las consultas de los usuarios?", "o": ["@CorreosAyuda", "@CorreosAtiende", "@CorreosResponde", "@CorreosCliente"], "c": 1, "e": "Correos cuenta con @CorreosAtiende para dar respuesta a las consultas de los usuarios.", "pag": 367}, {"p": "El agente virtual de la web de Correos se lanzó inicialmente con el nombre de:", "o": ["Clara", "Lucía", "Sara", "Paula"], "c": 2, "e": "La herramienta se lanzó como Sara, aunque ahora la imagen puede ser masculina o femenina.", "pag": 369}, {"p": "¿Cuántos caracteres puede introducir el usuario para consultar al agente virtual de la web de Correos?", "o": ["Hasta 150", "Hasta 80", "Hasta 250", "Hasta 100"], "c": 3, "e": "Para introducir las palabras clave dispone de hasta 100 caracteres.", "pag": 369}, {"p": "El apartado Transparencia de la web corporativa de Correos se crea al amparo de la:", "o": ["Ley 19/2013, de 9 de diciembre", "Ley 43/2010, de 30 de diciembre", "Ley 39/2015, de 1 de octubre", "Ley 3/2018, de 5 de diciembre"], "c": 0, "e": "Se crea al amparo de la Ley 19/2013 de transparencia, acceso a la información pública y buen gobierno.", "pag": 370}, {"p": "El diseño original del logotipo de Correos de 1977, respetado en la imagen corporativa de 2019, fue creado por:", "o": ["Javier Mariscal, nombrado quinto Cartero Honorario", "José María Cruz Novillo, nombrado séptimo Cartero Honorario", "José María Cruz Novillo, nombrado primer Cartero Honorario", "Alberto Corazón, nombrado séptimo Cartero Honorario"], "c": 1, "e": "El diseño de 1977 es de José María Cruz Novillo, nombrado séptimo Cartero Honorario.", "pag": 371}, {"p": "En la Oficina Virtual, la opción ADO permite:", "o": ["Gestionar la admisión de documentos oficiales", "Acceder a la aduana digital online", "Gestionar albaranes y depósitos online", "Archivar documentos originales"], "c": 2, "e": "Dentro de \"Realiza tus envíos\" se accede a ADO para gestionar albaranes y depósitos online.", "pag": 372}, {"p": "El Burofax Premium Digital se registra en:", "o": ["La oficina postal mediante IRIS con la opción Entrega digital", "La App Correos adjuntando un PDF de máximo 2 MB", "El portal eDocumento mediante formulario web", "El Canal Masivo de la Oficina Virtual mediante ficheros SFTP/FTP"], "c": 3, "e": "Se registra en el Canal Masivo de la Oficina Virtual con ficheros SFTP/FTP que contienen el campo Entrega digital.", "pag": 372}, {"p": "¿Qué dato del destinatario es obligatorio en el Burofax Premium Digital?", "o": ["El número de teléfono", "El correo electrónico", "El NIF", "El número de cliente"], "c": 0, "e": "Es obligatorio el teléfono del destinatario y, de forma opcional, su correo electrónico.", "pag": 372}, {"p": "Entre los servicios adicionales que el remitente puede añadir al Burofax Premium Online figura la custodia de:", "o": ["60 meses", "120 meses", "24 meses", "6 meses"], "c": 1, "e": "Puede añadir acuse de recibo, PEE telegráfico, custodia de 120 meses y copia certificada.", "pag": 376}, {"p": "En el Burofax Premium Online, el nombre del archivo PDF y los márgenes del documento deben cumplir:", "o": ["Menos de 50 caracteres y márgenes de al menos dos centímetros", "Menos de 100 caracteres y márgenes de al menos medio centímetro", "Menos de 80 caracteres y márgenes de al menos un centímetro", "Menos de 35 caracteres y márgenes de al menos un centímetro"], "c": 2, "e": "El nombre del archivo debe tener menos de 80 caracteres y los márgenes al menos un centímetro.", "pag": 375}, {"p": "La emisión de sellos personalizados (Tu Sello) está regulada por la Resolución conjunta de las Subsecretarías de Fomento y de Hacienda de:", "o": ["20 de diciembre de 2006", "15 de junio de 2015", "9 de diciembre de 2013", "18 de julio de 2014"], "c": 3, "e": "La Resolución conjunta de 18 de julio de 2014 modifica la de 20 de diciembre de 2006.", "pag": 379}, {"p": "En Tu Sello, la letra D equivale a la tarifa de cartas normalizadas de hasta 20 g con destino a:", "o": ["EEUU, Canadá, Japón, Australia, Rusia y Nueva Zelanda", "Europa, incluida Groenlandia (Zona 1)", "El resto de países no incluidos en las zonas 1 y 3", "Andorra, Portugal y Francia"], "c": 0, "e": "La letra D corresponde a la Zona 3: EEUU, Canadá, Japón, Australia, Rusia y Nueva Zelanda.", "pag": 379}, {"p": "El sello personalizado con viñeta se presenta en pliegos de:", "o": ["25 sellos", "20 sellos", "15 sellos", "10 sellos"], "c": 1, "e": "El sello con viñeta es autoadhesivo y se vende en pliegos de 20 sellos.", "pag": 381}, {"p": "Las imágenes enviadas para Tu Sello deben tener una definición mínima y un tamaño máximo de:", "o": ["150 dpi en JPG y 1 MB", "300 dpi en PNG y 2 MB", "300 dpi en JPG y 0,5 MB", "600 dpi en JPG y 0,5 MB"], "c": 2, "e": "La definición mínima es de 300 dpi en JPG y el tamaño máximo de 0,5 MB (500 KB).", "pag": 381}, {"p": "Una vez aprobada la solicitud de Tu Sello, Correos envía los sellos al domicilio del cliente mediante:", "o": ["Carta certificada", "Paq Estándar", "Paquete Azul", "Paq Premium"], "c": 3, "e": "Correos imprime los sellos y los envía a través de un Paq Premium en el plazo máximo de un mes.", "pag": 382}, {"p": "El programa Soy Digital, disponible desde 2016 en el Campus Virtual, organiza sus contenidos en las áreas de:", "o": ["Cultura, Personas, Procesos y Herramientas", "Cultura, Clientes, Productos y Herramientas", "Personas, Tecnología, Procesos y Ventas", "Cultura, Personas, Productos y Liderazgo"], "c": 0, "e": "Los contenidos se basan en cuatro áreas: Cultura, Personas, Procesos y Herramientas.", "pag": 383}, {"p": "Si un pedido de Correos Market no alcanza el importe para envío gratuito, la entrega en oficina como Paq Estándar cuesta:", "o": ["2,30 euros", "1,30 euros", "2,99 euros", "3,99 euros"], "c": 1, "e": "El transporte cuesta 1,30 € en oficina como Paq Estándar y 2,30 € como Paq Premium.", "pag": 384}, {"p": "Los primeros drones de reparto de Correos, probados en Sotres en 2015, tenían una autonomía de vuelo de:", "o": ["40 minutos", "15 minutos", "25 minutos", "60 minutos"], "c": 2, "e": "Tenían 25 minutos de autonomía y aguantaban vientos de 40 km/h.", "pag": 385}, {"p": "¿Cuál de los siguientes tipos de apartado NO dispone de casillero accesible al cliente?", "o": ["Apartado postal particular", "Apartado 24/7", "Apartado postal con titulares adicionales", "Franqueo en destino (FD/CCRI)"], "c": 3, "e": "Correos oferta apartados particulares, 24/7 y FD/CCRI; en este último no hay casillero accesible.", "pag": 386}, {"p": "En un apartado 24/7, si el destinatario no cumplimenta el albarán de entrega de un Paq Premium:", "o": ["Se entiende entregado en la fecha y hora de su puesta a disposición", "El envío se devuelve al remitente a los 15 días", "Se deja tarjeta de aviso para recogida en ventanilla", "El envío pasa a lista en la oficina durante 7 días"], "c": 0, "e": "Si no se cumplimenta el albarán, se entiende entregado en la fecha y hora de puesta a disposición en el apartado.", "pag": 388}, {"p": "¿Por qué periodo puede contratarse un apartado CCRI?", "o": ["Trimestral o anual", "Solo por período anual", "Mensual, trimestral o anual", "Solo por período trimestral"], "c": 1, "e": "El FD puede contratarse trimestral o anualmente, mientras que el CCRI solo por período anual.", "pag": 388}, {"p": "Para suscribir un apartado de Franqueo en Destino o CCRI, además de la documentación general, el cliente debe entregar:", "o": ["Un modelo de etiqueta homologada por la UPU", "Una fianza equivalente al franqueo de un año", "Dos sobres iguales a los que se usarán en los envíos", "El contrato firmado con la Dirección Comercial"], "c": 2, "e": "Debe entregar dos sobres iguales a los que se usarán, para comprobar que cumplen las características exigidas.", "pag": 389}, {"p": "La garantía de un apartado FD puede ajustarse en la renovación si las previsiones mensuales de envíos se superan de forma permanente en más del:", "o": ["40 %", "25 %", "100 %", "50 %"], "c": 3, "e": "Si se supera en más del 50 % la previsión de forma permanente, puede ajustarse la garantía en la renovación.", "pag": 389}, {"p": "Respecto a la renovación de los apartados según su duración, es correcto que:", "o": ["Los mensuales y trimestrales no admiten renovación y se dan de baja automáticamente", "Los trimestrales se renuevan automáticamente por otro trimestre", "Los mensuales 24/7 se renuevan con domiciliación bancaria", "Todos los apartados pueden renovarse en el plazo de 30 días"], "c": 0, "e": "Los apartados mensuales y trimestrales no admiten renovación y se dan de baja automáticamente al concluir.", "pag": 390}, {"p": "Al grabar en IRIS los datos de los apartados, ¿cuáles NO se vuelcan en SGIE?", "o": ["Los de los apartados 24/7", "Los de los apartados FD o CCRI", "Los de los apartados postales particulares", "Los de los titulares adicionales"], "c": 1, "e": "Los datos de FD o CCRI no pasan a SGIE porque en ellos solo se recibe correo ordinario.", "pag": 391}, {"p": "¿Qué apartado especial existe en todas las oficinas y no debe darse de baja?", "o": ["999999 Envíos Rehusados Pendientes", "000001 Notificaciones Administrativas", "000000 Cartas Urgentes Ordinarias Recibidas", "VS000 Paquetería Pendiente de Entrega"], "c": 2, "e": "En todas las oficinas existe el apartado 000000 Cartas Urgentes Ordinarias Recibidas.", "pag": 392}, {"p": "Si un cliente detecta días después de la contratación que el apartado asignado no es el deseado, para dar de alta el correcto sin subir importe a bolsa se activa el check:", "o": ["Suprimir", "Sincronizar", "Reimprimir", "Inicialización"], "c": 3, "e": "Se da de baja el apartado erróneo y se tramita el alta del correcto activando el check Inicialización.", "pag": 393}, {"p": "Los apartados anuales contratados antes del 15 de junio de 2015 tienen un plazo de renovación común que va:", "o": ["Del 16 de diciembre al 30 de enero", "Del 1 de diciembre al 31 de enero", "Del 15 de diciembre al 15 de enero", "Del 16 de noviembre al 30 de diciembre"], "c": 0, "e": "Su vigencia es el año natural y el plazo de renovación va del 16 de diciembre al 30 de
