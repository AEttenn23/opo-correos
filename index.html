], "c": 2, "e": "El responsable establece su perfil «Flota-RESPUNIDAD» a través de SIGUA.", "pag": 1017}, {"p": "Para acceder a Hera, el usuario debe iniciar sesión en:", "o": ["SIGUA, y tener perfil de administrador", "IRIS, y tener la caja abierta", "ASA, y tener un codired de admisión correcto", "Talina, y tener un CODIRED de distribución"], "c": 2, "e": "Debe iniciar sesión en ASA y tener codired de admisión correcto.", "pag": 1017}, {"p": "Con la función «Localizador» de Hera, el envío se puede consultar en:", "o": ["MERCURIO", "Minerva", "SGIE", "IRIS"], "c": 0, "e": "El botón de consulta del Localizador consulta el envío en MERCURIO.", "pag": 1018}, {"p": "En Hera, los envíos sin prerregistro no pueden admitirse, salvo:", "o": ["Los que contengan votos emitidos, que se admiten de forma manual", "Las cartas certificadas de franqueo pagado", "Los paquetes con valor declarado", "Las notificaciones administrativas"], "c": 0, "e": "Excepción: envíos con votos emitidos, cuya admisión continúa de forma manual.", "pag": 1020}, {"p": "En la Correos App, el Burofax online permite adjuntar un PDF de un tamaño máximo de:", "o": ["5 MB", "2 MB", "1 MB", "10 MB"], "c": 1, "e": "Se puede enviar Burofax online adjuntando un PDF de máximo 2 MB.", "pag": 1021}, {"p": "En el apartado Aduanas de la Correos App se pueden tramitar envíos cuyo valor intrínseco sea de hasta:", "o": ["150 euros", "22 euros", "300 euros", "1.000 euros"], "c": 0, "e": "Envíos con valor intrínseco de hasta 150 euros sin otros trámites o impuestos especiales.", "pag": 1022}, {"p": "Al pedir cita previa en la Correos App, el usuario recibe como confirmación un código de:", "o": ["Seis dígitos", "Ocho dígitos", "Nueve dígitos", "Cuatro dígitos"], "c": 2, "e": "Recibe un código de nueve dígitos para el dispensador de turnos.", "pag": 1022}, {"p": "¿Desde qué fecha muestra la App Citypaq el aviso de que sus servicios pasarán a la App de Correos?", "o": ["Noviembre de 2022", "Enero de 2023", "Junio de 2022", "Noviembre de 2021"], "c": 0, "e": "Con fecha noviembre 2022 la app muestra ese aviso.", "pag": 1023}, {"p": "La estructura jerárquica del SIE para unidades de distribución cuenta con:", "o": ["Cinco niveles de gestión", "Seis niveles de gestión", "Siete niveles de gestión", "Cuatro niveles de gestión"], "c": 1, "e": "La estructura tiene seis niveles de gestión jerárquicamente ordenados.", "pag": 1026}, {"p": "En el nivel Zonal del SIE se contemplan:", "o": ["Siete zonas territoriales", "Cinco zonas territoriales", "Nueve zonas territoriales", "Seis zonas territoriales"], "c": 0, "e": "El nivel Zonal se corresponde con siete zonas territoriales.", "pag": 1026}, {"p": "Para estimar envíos en SIE, media bandeja de tipo A corresponde aproximadamente a:", "o": ["85 envíos", "255 envíos", "170 envíos", "120 envíos"], "c": 2, "e": "½ de bandeja tipo A corresponde aproximadamente a 170 envíos.", "pag": 1028}, {"p": "¿Cuáles son las horas límite para volcar los datos a SIE en las unidades de distribución?", "o": ["10 horas en turno de mañana y 17 horas en turno de tarde", "12 horas en turno de mañana y 19 horas en turno de tarde", "11 horas en turno de mañana y 20 horas en turno de tarde", "11 horas en turno de mañana y 18 horas en turno de tarde"], "c": 3, "e": "Las horas límite son las 11 h (mañana) o las 18 h (tarde).", "pag": 1029}, {"p": "En SIE, el volumen que sale a reparto se obtiene aplicando el balance:", "o": ["Entrada + Salida = Pendiente del día anterior + Pendiente de hoy", "Entrada − Malo = Salida + Pendiente del día anterior", "Pendiente del día anterior + Entrada = Salida + Pendiente de hoy", "Pendiente de hoy + Entrada = Salida + Pendiente del día anterior"], "c": 2, "e": "Balance: Pendiente del día anterior + Entrada = Salida + Pendiente de hoy.", "pag": 1029}, {"p": "En las oficinas, la información estadística de SIE se graba:", "o": ["Una vez a la semana, el lunes", "Antes de las 11 horas del mismo día", "En el mismo día o antes de que acabe la primera hora del siguiente día laboral", "Al cierre de caja de IRIS de cada día"], "c": 2, "e": "Se obtiene una vez al día y se graba el mismo día o antes de finalizar la primera hora del día laboral siguiente.", "pag": 1031}, {"p": "En las oficinas, se accede a la grabación de datos en SIE a través de:", "o": ["Conecta >> Aplicaciones >> SIE >> Distribución", "IRIS >> Llamadas a sistemas externos >> Estadística", "SGIE >> Control/Consultas >> Estadística", "Minerva >> Cuadros de mando"], "c": 1, "e": "El acceso en oficinas sigue la ruta IRIS >> Llamadas a sistemas externos >> Estadística.", "pag": 1032}]}, {"letra": "L", "titulo": "Atención al cliente y calidad. Protocolos de ventas", "paginas": "1035-1102", "resumen": "## 1. El cliente: atención y calidad\n\n### 1.1. Tareas previas a la apertura\n- Cada día, antes de abrir: comprobar **vestíbulo y cartelería** en buen estado y que hay **folletos** suficientes.\n- Cartel visible sobre la existencia de **hojas de reclamaciones OMIC** (Oficina Municipal de Información al Consumidor); si no hay en papel, se descargan de la web del **ayuntamiento o comunidad autónoma**.\n- Cartel con **código escaneable** desde el móvil para consultar tarifas.\n- Si hay gestor de turnos (**QUENDA**), revisar la carga del **rollo de papel**.\n\n### 1.2. Atención telefónica\n- Identificar la oficina al responder y contestar **antes del cuarto tono**.\n- Si se está atendiendo a alguien: disculparse, identificar a quien llama, comprometerse a devolver la llamada y seguir con el cliente presencial.\n- Si se desvía la llamada, indicar al compañero **nombre del cliente y motivo**.\n- **Grados de escucha**:\n\n| Grado | Rasgo |\n|---|---|\n| Superficial | Asiente y repite palabras, imitando el contenido |\n| Participativa | Parafrasea con sus propias palabras |\n| Emocional | Se centra en los sentimientos (palabras y lenguaje no verbal) |\n| Atenta | Parafrasea reflejando sentimientos: une participativa y emocional |\n| Completa | Quien escucha \"desaparece\"; total aceptación y comprensión |\n\n- Factores de la comunicación telefónica: **personales**, **contextuales** y **del canal**.\n\n### 1.3. Atención en oficinas\n- Modelo **\"Tu Correos\"**, implantado en **2016**: nueva oferta, venta autoservicio, admisión con **tabletas digitales** y asesoramiento personalizado.\n- Pautas clave:\n  - Trato personalizado, cortés, de **usted**, con contacto visual; responder en el idioma del cliente si se conoce; explicar el argot postal.\n  - No abandonar la ventanilla; si es imprescindible, disculparse y explicar si la espera será breve.\n  - No opinar ni crear controversia; no apoyar codos; **distancia aprox. de medio metro**; nunca comer o beber atendiendo.\n  - Tono de voz que no permita a otros enterarse del asunto.\n  - Identificar el perfil del cliente para **venta cruzada**; facilitar rotuladores, bolígrafos y cinta de precintar.\n  - Antes de despedir, preguntar si necesita otro servicio.\n\n### 1.4. Gestor de turnos (Quenda)\n- Objetivo del área de oficinas: atender al **72 % de los clientes en 5 minutos**.\n- Acceso con usuario y clave corporativa; se elige el **número de puesto** (lista que puede limitar el administrador).\n- Botón **\"Llamar\"**: aparece en la pantalla de la sala y por megafonía (si activa). Sin selección previa se llama al que **más tiempo lleva esperando**; el administrador puede fijar prioridades.\n- Opciones: **Finalizar y pausa**, **Finalizar y Llamar**, **No acude**, **Volver a llamar en pantalla** (una vez por cita).\n- **Reenvío de turnos**: a otro puesto/servicio sin perder prioridad por hora de llegada.\n- **Rellamada automática** (botón verde, sin nadie esperando): llama al primero que saque ticket; tras usarse se deshabilita, pero puede reactivarse **sin límite**.\n\n### 1.5. Reclamaciones y solicitudes\n- Cliente muy exaltado: atenderlo en **zona privada** y remitirlo al director o responsable.\n- Si es el director y el tema es de distribución: intentar resolver por teléfono con el **jefe de Distribución**.\n- **Nunca**: contradecir, intentar convencer de su error, desviar la responsabilidad ni mencionar la estructura interna, no hacerse responsable, desvalorizar Correos, tomárselo como ataque personal.\n- **Sí**: no interrumpir, resumir y situar el problema en su dimensión real, consultar trazabilidad, disculparse, informar de vías (oficina, web, teléfono) y despedir amablemente.\n- **Siebel** sustituyó a **Quorum**. Antes las reclamaciones llevaban referencia por **\"R\"**; ahora son **\"solicitudes\"** con referencia que empieza por **\"1\"**:\n  - **Incidencia**: busca solución a un problema.\n  - **Reclamación**: además quiere dejar constancia formal de su descontento. Los formularios **OMIC/CCAA** siempre se dan de alta como **reclamación**.\n\n| Tipo de solicitud | Plazo máximo | Plazo medio orientativo (2021) |\n|---|---|---|\n| Envíos nacionales | 1 mes | 10 días |\n| Envíos internacionales | 2 meses (según país y UPU) | 20 días |\n| Servicios de Correos | 1 mes | 10 días |\n| Consultas web / redes sociales | 20 días | 1 día |\n| Pago de indemnización | 1 mes desde la resolución | 1 semana |\n\n#### 1.5.1. Acceso a Siebel\n- Ruta: **IRIS >> Llamadas a Sistemas Externos >> Todas >> Reclamaciones**.\n- \"Nueva solicitud\": se graba el documento (**NIF, CIF, NIE o pasaporte**), el código de cliente si tiene contrato o, si no, el **teléfono**.\n- Cliente nuevo: obligatorios tipo y nº de DOI, nombre y apellidos; si es **CIF**, todos los campos de Contacto.\n- **Método de respuesta**: correo electrónico (por defecto), correo ordinario (resguardo impreso) o \"Ninguno\" (**no disponible en oficinas**).\n- De un cliente registrado solo se pueden modificar **dirección y correo electrónico**.\n- Idiomas de respuesta: castellano, inglés, gallego, euskera, valenciano o catalán.\n\n#### 1.5.2. Tipo de solicitud\n- **Con número de envío**: se introduce el código (en expediciones, el de la expedición: **solicitud única** para todos los bultos). Se muestra la trazabilidad y se graban uno o varios motivos (icono **\"+\"**), p. ej. roto, tarde, no ha llegado, aduana o voto por correo (solo en campaña).\n- **Tipo de solicitante**: a través de **Mercurio** se determina si es remitente, destinatario o **plataforma** (p. ej. Packlink o Wallapop). Si faltan datos: remitente, destinatario, otro, representante legal o tutor.\n- Los campos faltantes aparecen en **\"Errores de carga\"**; botones Validar, Copiar en todos, Cambiar registros y Seleccionar todos.\n- Si el plazo de reclamación está agotado o no ha comenzado, salta una **alerta**.\n- **Correos Express**: se toman teléfono y email y se traslada a la filial; información en correosexpress.com, **900 122 333** o @Cex_responde.\n- **Sin número de envío**: se elige servicio y motivo (Reparto, Oficinas, Western Union, Citypaq, **Paq Mochila (solo con contrato)**, etc.).\n- **OMIC**: se entrega la hoja vigente descargada de la web del ayuntamiento/CCAA (retirar las obsoletas; dudas a la **Jefatura de Red del Área**). Tiene **tres copias** (cliente, administración y Correos); el cliente se lleva las dos primeras y la presenta él a la administración. Alta: siempre \"Reclamación\", \"Sin número de envío\", servicio y motivo **\"OMIC\"**, y el texto encabezado con \"OMIC\". Se anexa el formulario escaneado (o después desde **Anexos > Nuevo archivo**). Responde al cliente la CCAA u organismo, salvo en **Andalucía**, donde responde Correos.\n\n#### 1.5.3. Final del alta\n- El cliente firma la Protección de Datos en la **tableta digitalizadora** (\"Guardar firma\").\n- Aparece el estado (**\"resuelta\" o \"en investigación\"**) y la referencia; se puede cambiar método de respuesta, dirección y email.\n- Si está \"Resuelta\" y el cliente no está conforme: marcar **\"Deseo añadir más información…\"** (queda en \"Comunicaciones del cliente\").\n- **\"Finalizar e imprimir\"** lleva al resguardo; para imprimirlo, pulsar sobre la referencia (PDF).\n\n#### 1.5.4. Informes y notificaciones\n- Llegan al **buzón de correo de la oficina y a Siebel**.\n- **Notificaciones**: informan; no requieren respuesta salvo criterio del responsable.\n- **Informes**: deben responderse en **3 días**; si no, segunda petición automática con copia al **responsable de área**.\n\n#### 1.5.5. Alegaciones\n- El responsable de oficina puede alegar (p. ej. error de imputación). **Solo una alegación por solicitud** y de inmediato.\n- Niveles: actuación sobre la causa, sobre el cliente (disculpas; reflejar en el informe) y **análisis mensual** por el equipo directivo, registrado en acta y en el **archivo ISO electrónico**.\n\n#### 1.5.6. Plazos de reclamación y garantías (sin contrato)\n- Se comprueba en una pantalla de cálculo de plazos; los plazos se cuentan **desde la admisión en días naturales** (en Paq Premium Internacional, la demora desde la entrega).\n\n| Nacional | Mín. | Máx. | Deterioro/extravío | Demora |\n|---|---|---|---|---|\n| Carta certificada | 7 días | 4 meses | Tarifa × 10 | — |\n| Carta cert. urgente | 3 días | 4 meses | Tarifa × 10 | — |\n| Paquete Azul | 10 días | 4 meses | Tarifa × 4 | — |\n| Paq Estándar | 3 días | Demora 21 d; pérdida 1 año; deterioro 7 d tras entrega | Seguro LCTTM (6,43 €/kg) | Tarifa abonada |\n| Paq Premium | 3 días | Igual que Paq Estándar | LCTTM, mínimo 40 € | Tarifa abonada |\n| Paq Premium prepagado | 3 | 1 año | 30 € (350 g) / 40 € (1 kg) | Tarifa abonada |\n| Giro nacional | 10 días | 2 años | Cantidad girada | Tarifa abonada |\n| Telegrama | 2 días | 6 meses | Tarifa abonada | Tarifa abonada |\n| Burofax | 1 día | 6 meses | Tarifa abonada | Tarifa abonada |\n\n| Internacional | Mín. | Máx. | Deterioro/extravío |\n|---|---|---|---|\n| Carta certificada | 15 días | 6 meses | Tarifa ordinaria + 30 DEG |\n| Paq Premium Int. | Demora 7 d / pérdida 7 d / deterioro 3 d | Demora 21 d / pérdida 4 m / deterioro 4 m | Tarifa + 52,98 € |\n| Paq Standard Int. | 15 días | 6 meses | Pérdida: tarifa + 40 DEG + 4,5 DEG/kg |\n| PPIE (solo extravío) | 25 días | 6 meses | Tarifa + 40 DEG + 4,5 DEG/kg |\n| Telegrama / Burofax | 3 días | 4 meses | Tarifa abonada |\n| Giro IFS (UPU) | 3 días | 6 meses | — (demora: tarifa) |\n| Western Union | 1 día | 30 días | — (demora: tarifa) |\n\n- **1 DEG (2022) = 1,1964 €**. Los clientes con contrato se rigen por su contrato.\n\n## 2. Calidad en Correos\n- La calidad abarca toda la actividad y depende de compromisos con empleados, clientes, entorno y sociedad. Base: **eficiencia** (lograr el objetivo con el mínimo de recursos).\n\n### 2.1. Calidad total\n- Modelo de gestión: dar al cliente lo que necesita, cuando lo necesita y a precio competitivo; \"**último peldaño**\" de la calidad.\n- Principios: responsabilidad individual, **cliente interno**, prevención, mejora continua, satisfacer en **calidad, coste y plazo**.\n\n### 2.2. Calidad en los servicios\n- Percepción = servicio recibido frente a **expectativas**. El cliente ve la empresa como una unidad.\n- Valor fundamental de Correos: **vocación por el cliente**.\n- Claves: responsabilizarse sin derivar al superior, anteponer el servicio a la gestión administrativa, cumplir lo prometido.\n\n### 2.3. Mejora continua y gestión de la calidad (SGC)\n#### Ciclo de Deming (PDCA)\n| Fase | Contenido |\n|---|---|\n| P – Planificar | Analiza causas y busca soluciones |\n| D – Hacer | Implanta lo planificado |\n| C – Controlar | Comprueba eficacia (indicadores, auditorías, ISC) |\n| A – Actuar | Mejora hasta lograr objetivos |\n- Indicadores **mensuales**: desviaciones, incidencias, **ISC** y recomendaciones de Auditoría Interna.\n\n#### Medida de la calidad\n- **Cinco subsistemas**: Oficinas, Centros de tratamiento, Oficina de cambio internacional, **Correos Frío** y Atención al cliente.\n- Medición externa: **ISO y AENOR** (ISO 9001:2015 e ISO 14001:2015).\n- **Área de Control** + **AUDINTER**: Plan Anual de Auditorías. Visitas **anuales en CT** y **cuatrienales** en el resto.\n- **ISO**: sede en **Ginebra**, fundada en **1946**; **AENOR** la representa en España.\n- Renovadas con AENOR en **2022 (vigentes hasta 2024)**:\n  - **ISO 9001:2015** – gestión de calidad (oficinas, CTA, oficina de cambio internacional, atención al cliente).\n  - **ISO 14001:2015** – gestión ambiental (CTA, CTP y oficinas principales).\n  - **ISO 27001** – seguridad de la información (web y **Mi Oficina**).\n  - También protocolos COVID-19 y prevención de riesgos laborales.\n- Normas voluntarias: **UNE-EN 13850** (plazo extremo a extremo, correo prioritario), **UNE-CEN/TR 15472** (plazo de paquetes con seguimiento), **UNE-EN 14012** (reclamaciones e indemnizaciones), **UNE-ISO 10002** (quejas), **UNE-EN ISO 14064-1** (GEI) y **GHG Protocol** (CO2).\n\n#### Modelo EFQM\n- **9 criterios** en dos bloques: **Agentes facilitadores** (5: liderazgo, procesos, estrategia, personas, recursos y alianzas) y **Resultados** (4: clientes, personas, sociedad y resultados clave).\n- Evaluación con matriz **REDER** (Resultados, Enfoque, Despliegue, Evaluación y Revisión). Norma general: **50 % / 50 %**.\n- **AUDINTER**: cuestionario de **700 puntos** (adaptado a 1000 en oficinas y CTA). Sello EFQM válido **2 años**.\n\n| Modelo adaptado | Total | Agentes | Resultados |\n|---|---|---|---|\n| URO y USE/URP (no certificadas ISO; basado en 5S) | 700 | 70 % (490) | 30 % (210) |\n| Centros de tratamiento | 1000 | 55 % (550) | 45 % (450) |\n| Oficinas | 1000 | 50 % (500) | 50 % (500) |\n\n- URO/USE: Liderazgo 18 %, RR. HH. 10 %, recursos materiales y 5S 14 %, procesos 28 %, resultados 30 %; incluye el **Plan Limbo** de limpieza de bolsas de reparto.\n\n### 2.4. LEAN y NPS\n- **LEAN**: filosofía centrada en las personas que elimina lo superfluo (analizar, detectar, proponer, implantar, cuantificar).\n- **NPS** (índice neto de recomendación): mide cuánto recomendarían a Correos.\n\n### 2.5. Las 5S de Toyota (en reparto desde **2012**)\n| Término | Significado |\n|---|---|\n| Seiri | Clasificación |\n| Seiton | Orden |\n| Seiso | Limpieza |\n| Seiketsu | Estandarización |\n| Shitsuke | Autodisciplina |\n\n### 2.6. Indicadores de procesos (Red de Oficinas 2022)\n| Indicador | Valor de referencia |\n|---|---|\n| Admisión digitalizada enviada por email | 54 % |\n| Clientes esperando menos de 5 min (TMO = TME + TMA) | 75 % |\n| Admisión digitalizada con firma en tableta (excluye albaranes) | 90 % |\n- Índice de recomendación 2021: **+13,3** (mejora de 5 puntos): promotores (9-10) menos detractores (<6). Se valora el **IECO**.\n\n## 3. Resultados de la calidad: medición y controles\n- **Calidad en plazo**: fórmula **D+x** (D = depósito; x = días laborables). Depósito tras la última recogida cuenta como el siguiente día de recogida.\n- **End to end / Q-RFID**: en **18 CTA**, 5000 etiquetas pasivas, 1900 antenas, más de 330 lectores; software **middleware**; unos **500 puntos** en CT y unos **30** centros de admisión masiva. Datos almacenados en **COCAL**.\n- **SPEX**: medición continua de **Carta ordinaria y Publicorreo**; verificado conforme a **UNE-EN 13850**, lo que permite a la **CNMC** usar sus resultados.\n- **Mercurio** (Track&Trace, envíos registrados) en migración a **Minerva**.\n- **COCAL**: analiza la calidad; informes al **Comité de Calidad** (Subdirección de Organización); empresa externa **TNS**.\n- **Portal de calidad** (motor de cálculo), **Observatorio de calidad** (paquetería en picos como Navidad o Black Friday; informes cada hora) y **Portal de procesos**.\n\n## 4. Objetivos de calidad\n| Producto (RD 1829/1999, mod. RD 503/2007) | D+3 | D+5 |\n|---|---|---|\n| Cartas y tarjetas postales hasta 2 kg | 93 % | 99 % |\n| Paquetes postales (10 kg; 20 kg desde Ley 43/2010) | 80 % | 95 % |\n| Giros nacionales (fuera del SPU desde 1-1-2011) | 95 % | 99 % |\n- Desviación negativa: **minoración** de la financiación pública del SPU.\n- 1.er trimestre 2022: 94,96 % cartas ordinarias y 93,33 % certificadas en ≤3 días; 89,62 % Paquete Azul.\n- **Intracomunitario** (Directiva 97/67/CE, mod. 2008/06/CE): **D+3 85 %**, **D+5 97 %**.\n- **IPC** (1989, 25 operadores, 80 % del tráfico mundial); Correos en el acuerdo desde **2012**. Importación: **D+1 90 %**, **D+2 97,5 %** (ponderado 95 %); exportación: **D+1 80 %**. Medición **UNEX** (mensual); la UPU usa el **GMS**. Leg 1 = exportación hasta CTI Barajas; Leg 3 = importación hasta la entrega.\n\n## 5. Premios a empleados\n- Ganadores seleccionados en **marzo** sobre el año anterior.\n- **Artemisa** (2015): actividad comercial; categorías mejores prácticas (nota mínima **8,5** por semestre) y mejor **ISC**; trofeo y regalo corporativo.\n- **Atenea**: personas, equipos y buenas prácticas (salud, diversidad, formación, transformación digital…).\n- **Compromiso Ambiental**: equipos de **máximo 5 personas**, al menos 50 % del edificio, mínimo **4 reuniones** al año, metodología PDCA; categorías A (CTA), B (jefaturas y edificios singulares), C (oficinas y reparto).\n- **Premio Nacional a la Excelencia** (Liga de la Excelencia): evaluado con **Audinter**, segunda quincena de marzo.\n- **Repartiendo Solidaridad** (2018): trofeo y donación de **1.000 €** a una fundación. Regalos para fijos con **10 meses** en la unidad y eventuales con **6 meses**.\n\n## 6. Venta\n- **Tipos**: minorista/mayorista; en tienda, **fría** (producto no demandado), ambulante, ferias, a domicilio (demandada), mailing, telemarketing, televenta, catálogo, online, vending. Presenciales frente a no presenciales.\n- **Fases**: **prospección** (identificar, calificar, listar), acercamiento previo o \"preentrada\", presentación (características, ventajas, beneficios), negociación, cierre (puede darse incluso al principio) y **posventa** (clave para fidelizar).\n- Preparación: conocer el producto y detectar necesidades; no criticar a la competencia; ante precio alto, calidad, inversión y facilidades de pago.\n- **Clientes**: actuales (activos/inactivos; frecuencia; volumen; **complacidos** superan expectativas, **satisfechos** coinciden, **insatisfechos** por debajo; influyentes) y potenciales.\n- Elementos imprescindibles: calidad, precio, marca y publicidad.\n- Aptitudes del comunicador: **asertividad** (punto medio entre agresividad y pasividad), **empatía**, **persuasión**, **inteligencia emocional**; feedback, voz, sonrisa y comunicación no verbal.\n\n## 7. Fidelización\n- Se mide con el **% de clientes que repiten compra** sobre el total.\n- Estrategias: descuentos por volumen, tarjetas cliente. El asesor se centra en **rapidez, asesoramiento y trato**.\n- Dar lo que corresponde \"y algo más\".\n- **CRM**: Customer Relationship Management.\n\n## Claves para el examen\n- Teléfono: contestar **antes del cuarto tono**. Quenda: **72 % en 5 minutos**.\n- Siebel sustituyó a Quorum; referencia de solicitudes por **\"1\"**; OMIC siempre como **reclamación**, sin número de envío.\n- Plazos máximos de respuesta: nacionales **1 mes**, internacionales **2 meses**, consultas **20 días**; indemnización **1 mes**.\n- OMIC: **3 copias**; en **Andalucía** responde Correos.\n- Informes de Siebel: responder en **3 días**; una sola alegación por solicitud.\n- Carta certificada: tarifa × 10; Paquete Azul: tarifa × 4; **1 DEG = 1,1964 €**.\n- EFQM: 9 criterios; URO/USE 70/30 sobre 700; CT 55/45 y oficinas 50/50 sobre 1000; sello válido 2 años.\n- ISO 9001 calidad, 14001 ambiental, 27001 seguridad de la información; AENOR representa a ISO en España.\n- Indicadores oficinas: 54 % email, 75 % espera < 5 min, 90 % firma en tableta.\n- Q-RFID en **18 CTA**; SPEX verificado por UNE-EN 13850 y usado por la CNMC.\n- SPU: cartas D+3 93 % / D+5 99 %; intracomunitario D+3 85 % / D+5 97 %; IPC importación D+1 90 %.\n- 5S: Seiri, Seiton, Seiso, Seiketsu (estandarización), Shitsuke (autodisciplina).", "preguntas": [{"p": "Según el protocolo de atención telefónica, ¿antes de qué tono debe intentar contestarse el teléfono en la oficina?", "o": ["Antes del segundo tono", "Antes del cuarto tono", "Antes del tercer tono", "Antes del quinto tono"], "c": 1, "e": "El texto indica que hay que intentar contestar antes del cuarto tono.", "pag": 1038}, {"p": "¿Qué objetivo tiene marcado el área de oficinas con el gestor de turnos?", "o": ["Atender al 75 % de los clientes en cinco minutos", "Atender al 72 % de los clientes en cinco minutos", "Atender al 72 % de los clientes en diez minutos", "Atender al 90 % de los clientes en cinco minutos"], "c": 1, "e": "El objetivo fijado es atender al 72 % de los clientes en un tiempo estimado de cinco minutos.", "pag": 1041}, {"p": "En la versión posterior de Siebel, las solicitudes se registran con una referencia que empieza por:", "o": ["\"R\"", "\"S\"", "\"0\"", "\"1\""], "c": 3, "e": "Las antiguas reclamaciones con referencia \"R\" pasan a ser solicitudes con referencia que empieza por \"1\".", "pag": 1044}, {"p": "Los formularios OMIC/CCAA presentados por el cliente se dan de alta en Siebel siempre como:", "o": ["Incidencia", "Reclamación", "Consulta", "Sugerencia"], "c": 1, "e": "El texto señala que los formularios OMIC/CCAA siempre se darán de alta como reclamación.", "pag": 1044}, {"p": "¿Cuál es el plazo máximo de respuesta a incidencias o reclamaciones sobre envíos internacionales?", "o": ["1 mes", "20 días", "3 meses", "2 meses"], "c": 3, "e": "Para envíos internacionales el plazo máximo es de 2 meses, según país y normativa UPU.", "pag": 1044}, {"p": "¿Cuál es el plazo máximo para el pago de una indemnización?", "o": ["1 mes desde la resolución de la incidencia o reclamación", "1 semana desde la resolución de la incidencia o reclamación", "2 meses desde la admisión del envío", "20 días desde la presentación de la solicitud"], "c": 0, "e": "El plazo máximo de pago es de 1 mes desde la resolución (el medio orientativo es 1 semana).", "pag": 1044}, {"p": "Respecto a los formularios de reclamación OMIC, señale la afirmación correcta:", "o": ["Tienen dos copias y Correos remite una de ellas a la administración", "Tienen tres copias y el cliente se encarga de hacer llegar la suya a la administración", "Tienen tres copias y Correos remite la de la administración al ayuntamiento", "Tienen cuatro copias, una de ellas destinada a la Jefatura de Red"], "c": 1, "e": "Hay copia para cliente, administración y Correos; las dos primeras se entregan al cliente, que la hace llegar a la administración.", "pag": 1050}, {"p": "¿En qué comunidad autónoma es Correos quien responde al cliente una vez tramitada la queja OMIC?", "o": ["Andalucía", "Cataluña", "Comunidad de Madrid", "Galicia"], "c": 0, "e": "Responde la comunidad u organismo oficial, salvo en Andalucía, donde responde Correos.", "pag": 1051}, {"p": "Las Peticiones de Informe recibidas en la oficina a través de Siebel deben responderse en un plazo de:", "o": ["Cinco días", "Tres días", "Diez días", "Veinticuatro horas"], "c": 1, "e": "Los informes deben responderse necesariamente en tres días; si no, se genera una segunda petición con copia al responsable de área.", "pag": 1052}, {"p": "¿Cuántas alegaciones puede presentar el responsable de oficina sobre una misma Solicitud?", "o": ["Solo una", "Dos", "Tres", "Ilimitadas dentro del plazo"], "c": 0, "e": "El texto indica que solo puede realizarse una alegación por Solicitud y debe tratarse de inmediato.", "pag": 1052}, {"p": "¿Qué indemnización corresponde, sin contrato, por deterioro o extravío de un Paquete Azul?", "o": ["Tarifa abonada x 10", "Tarifa abonada x 2", "Tarifa abonada + 30 DEG", "Tarifa abonada x 4"], "c": 3, "e": "En la tabla de garantías el Paquete Azul se indemniza con la tarifa abonada multiplicada por 4.", "pag": 1055}, {"p": "¿Cuál es el valor de un DEG (Derecho Especial de Giro) para 2022 según el temario?", "o": ["1,2964 €", "1,1694 €", "1,1964 €", "1,9641 €"], "c": 2, "e": "El texto fija el valor de un DEG para 2022 en 1,1964 €.", "pag": 1056}, {"p": "En el ciclo de Deming (PDCA), la fase que comprueba la eficacia del plan mediante indicadores, auditorías o ISC es:", "o": ["D (do, hacer)", "A (act, actuar)", "C (check, controlar)", "P (plan, planificar)"], "c": 2, "e": "La fase C (controlar) comprueba la eficacia del plan con indicadores, auditorías, ISC, etc.", "pag": 1061}, {"p": "Señale cuál NO es uno de los cinco subsistemas de gestión de la calidad de Correos:", "o": ["Correos Frío", "Atención al cliente", "Unidades de reparto", "Centros de tratamiento"], "c": 2, "e": "Los cinco subsistemas son Oficinas, Centros de tratamiento, Oficina de cambio internacional, Correos Frío y Atención al cliente.", "pag": 1061}, {"p": "La norma UNE-EN ISO 27001 aplicada por Correos se refiere a:", "o": ["Gestión medioambiental y de residuos", "Gestión de la calidad de la red de oficinas", "Tratamiento de las quejas de los clientes", "Seguridad de la información de la web y Mi Oficina"], "c": 3, "e": "La ISO 27001 trata la seguridad y gestión de sistemas de información, aplicable a la web y a Mi Oficina.", "pag": 1063}, {"p": "En el modelo EFQM adaptado a unidades de reparto URO y USE/URP, ¿cómo se reparten los 700 puntos?", "o": ["70 % agentes facilitadores y 30 % resultados", "50 % agentes facilitadores y 50 % resultados", "55 % agentes facilitadores y 45 % resultados", "60 % agentes facilitadores y 40 % resultados"], "c": 0, "e": "Este modelo asigna un 70 % (490 puntos) a agentes y un 30 % (210 puntos) a resultados.", "pag": 1066}, {"p": "¿Qué validez tiene el sello de excelencia EFQM?", "o": ["Un año", "Tres años", "Cuatro años", "Dos años"], "c": 3, "e": "El texto indica que el sello de excelencia EFQM tiene una validez de dos años.", "pag": 1065}, {"p": "Dentro de las 5S de Toyota, el principio Seiketsu corresponde a:", "o": ["Clasificación", "Orden", "Estandarización", "Autodisciplina"], "c": 2, "e": "Seiketsu es la estandarización: señalar anomalías para prevenir el desorden y la suciedad.", "pag": 1072}, {"p": "¿Cuál es el valor de referencia del indicador de admisión digitalizada con firma en tableta en la Red de Oficinas 2022?", "o": ["90 %", "54 %", "75 %", "85 %"], "c": 0, "e": "La tabla de indicadores fija un valor de referencia del 90 % para la admisión con firma en tableta.", "pag": 1073}, {"p": "¿En cuántos CTA se ha instalado el sistema Q-RFID?", "o": ["30", "18", "25", "15"], "c": 1, "e": "El proyecto Q-RFID se ha instalado en los 18 CTA dotados del software específico.", "pag": 1074}, {"p": "El sistema SPEX ha sido verificado conforme a la norma:", "o": ["UNE-EN 14012", "UNE-ISO 10002", "UNE-EN 13850", "UNE-CEN/TR 15472"], "c": 2, "e": "SPEX se verificó conforme a la UNE-EN 13850, lo que permite a la CNMC usar sus resultados.", "pag": 1076}, {"p": "Según el RD 1829/1999, ¿qué porcentaje de cartas y tarjetas postales de hasta 2 kg debe entregarse en D+3?", "o": ["80 %", "95 %", "99 %", "93 %"], "c": 3, "e": "La tabla de objetivos del SPU fija un 93 % en D+3 y un 99 % en D+5 para cartas y tarjetas.", "pag": 1078}, {"p": "Para el correo prioritario internacional de importación, el objetivo en D+1 es:", "o": ["El 80 % de los envíos", "El 97,5 % de los envíos", "El 85 % de los envíos", "El 90 % de los envíos"], "c": 3, "e": "El objetivo de importación es D+1 en el 90 % y D+2 en el 97,5 % de los envíos.", "pag": 1081}, {"p": "¿Qué nota mínima de evaluación de auditoría por semestre se exige en el Premio Artemisa a las mejores prácticas en el trabajo diario?", "o": ["8", "8,5", "9", "7,5"], "c": 1, "e": "Tanto en el primer como en el segundo semestre la nota mínima es 8,5.", "pag": 1082}, {"p": "En el Premio Compromiso Ambiental, el equipo ganador debe estar compuesto por:", "o": ["Un máximo de cuatro personas", "Un mínimo de cinco personas", "Un máximo de cinco personas", "Un máximo de diez personas"], "c": 2, "e": "El equipo debe tener un máximo de cinco personas, con al menos el 50 % destinado en el edificio.", "pag": 1085}, {"p": "¿De qué importe es la donación que Correos destina a una fundación en el Premio Nacional Repartiendo Solidaridad?", "o": ["500 euros", "1.000 euros", "2.000 euros", "1.500 euros"], "c": 1, "e": "El premio incluye proponer una fundación sin ánimo de lucro a la que Correos dona 1.000 euros.", "pag": 1088}, {"p": "La venta personal domiciliaria de un producto que no ha sido demandado por el comprador se denomina:", "o": ["Venta fría", "Venta a domicilio", "Venta ambulante", "Televenta"], "c": 0, "e": "La venta fría consiste en vender un producto no demandado por el comprador; la venta a domicilio sí es demandada.", "pag": 1091}, {"p": "¿Cuál es la primera fase del proceso de venta?", "o": ["Prospección", "Acercamiento previo", "Presentación del mensaje", "Negociación"], "c": 0, "e": "El texto señala que la prospección es la primera fase, con la identificación de clientes potenciales.", "pag": 1093}, {"p": "Según el grado de satisfacción, ¿cómo se denomina al cliente que percibe que la atención y el producto han coincidido con sus expectativas?", "o": ["Cliente satisfecho", "Cliente complacido", "Cliente influyente", "Cliente activo"], "c": 0, "e": "El satisfecho es aquel cuyas expectativas coinciden con lo recibido; el complacido las ve superadas.", "pag": 1096}, {"p": "¿En qué tres factores debe enfocar su actuación el asesor comercial para fidelizar al cliente?", "o": ["Precio, marca y publicidad", "Empatía, persuasión y asertividad", "Rapidez, asesoramiento y trato", "Prospección, cierre y posventa"], "c": 2, "e": "El texto indica que el asesor debe centrarse en la rapidez, el asesoramiento y el trato.", "pag": 1099}, {"p": "Antes de la apertura, si la oficina dispone de gestor de turnos, hay que comprobar la carga del rollo de papel de:", "o": ["Siebel", "IRIS", "Mercurio", "QUENDA"], "c": 3, "e": "El texto indica que si la oficina dispone de gestor de turnos (QUENDA) hay que comprobar la carga del rollo de papel.", "pag": 1038}, {"p": "¿Qué grado de escucha se caracteriza porque el receptor reformula el mensaje con sus propias palabras?", "o": ["Escucha superficial", "Escucha emocional", "Escucha participativa", "Escucha completa"], "c": 2, "e": "En la escucha participativa el receptor parafrasea el mensaje y lo reformula con sus propias palabras.", "pag": 1038}, {"p": "El grado de escucha en el que quien escucha \"desaparece\" y permanece en total aceptación y comprensión es la:", "o": ["Escucha completa", "Escucha atenta", "Escucha participativa", "Escucha emocional"], "c": 0, "e": "En la escucha completa solo existe quien comunica; el otro permanece en total aceptación y comprensión.", "pag": 1039}, {"p": "Señale cuál de las siguientes NO es una ventaja de la comunicación telefónica según el temario:", "o": ["La rapidez", "La instantaneidad", "La facilidad de contacto", "Que es un medio limitado"], "c": 3, "e": "Ser un medio limitado figura entre las desventajas; rapidez, instantaneidad y facilidad de contacto son ventajas.", "pag": 1039}, {"p": "Si un cliente se dirige al empleado en un idioma concreto, el empleado debe:", "o": ["Contestarle siempre en castellano", "Derivarlo al director de la oficina", "Contestarle en ese mismo idioma, siempre que lo conozca", "Pedirle que lo acompañe un intérprete"], "c": 2, "e": "Cuando el cliente se dirija en un idioma concreto, se le contesta en el mismo siempre que se conozca.", "pag": 1040}, {"p": "En el gestor de turnos, la opción \"No acude\":", "o": ["Pone fin a la cita actual informando de que nadie ha acudido", "Repite la llamada en pantalla una vez por cita", "Reenvía la cita a otro puesto o servicio", "Activa la rellamada automática del sistema"], "c": 0, "e": "\"No acude\" pone fin a la cita actual, informando de que nadie ha acudido a esa llamada.", "pag": 1042}, {"p": "Con la función \"Reenvío de turnos\" del gestor de turnos, el cliente:", "o": ["Debe coger un nuevo turno del dispensador", "No pierde la prioridad por su hora de llegada", "Pasa a ser atendido en primer lugar", "Pierde la prioridad y pasa al final de la cola"], "c": 1, "e": "El reenvío permite pasar la cita a otro puesto o servicio sin coger otro turno, sin perder la prioridad por hora de llegada.", "pag": 1042}, {"p": "Una vez efectuada la primera rellamada automática en el gestor de turnos:", "o": ["Se deshabilita, pero puede volver a activarse sin limitación", "Queda activa de forma permanente", "Solo puede volver a activarla el administrador", "Puede reactivarse un máximo de tres veces"], "c": 0, "e": "Tras la primera rellamada la función se deshabilita automáticamente, pero el usuario puede reactivarla cuantas veces quiera.", "pag": 1042}, {"p": "Si un cliente que reclama se muestra muy exaltado, el empleado debe:", "o": ["Pedirle que vuelva otro día más tranquilo", "Avisar a seguridad y suspender la atención", "Atenderlo en ventanilla y entregarle la hoja OMIC", "Atenderlo en una zona privada y remitirlo al director o responsable"], "c": 3, "e": "Se le atiende en una zona privada y se le remite al director o responsable para buscar una solución.", "pag": 1042}, {"p": "Señale cuál de las siguientes acciones NUNCA debe realizar el empleado ante una reclamación:", "o": ["Pedir disculpas por los errores cometidos", "Mencionar la estructura interna de Correos", "Comprobar el envío en los sistemas de trazabilidad", "Agradecer al cliente su esfuerzo"], "c": 1, "e": "Desviar la responsabilidad y mencionar la estructura interna de Correos figura entre lo que nunca debe hacerse.", "pag": 1043}, {"p": "¿Qué programa de gestión de reclamaciones fue sustituido por Siebel?", "o": ["Quorum", "Quenda", "Mercurio", "AUDINTER"], "c": 0, "e": "El texto indica que Siebel es el programa que sustituyó a Quorum.", "pag": 1044}, {"p": "Cuando el cliente únicamente busca solución a un problema con un producto o servicio, la solicitud se registra como:", "o": ["Reclamación", "Consulta", "Incidencia", "Alegación"], "c": 2, "e": "Las incidencias corresponden al cliente que busca solución a un problema; la reclamación añade la queja formal.", "pag": 1044}, {"p": "¿Cuál es el plazo máximo de respuesta a las consultas realizadas por la web?", "o": ["10 días", "20 días", "1 mes", "2 meses"], "c": 1, "e": "Para consultas por la web el plazo máximo es de 20 días, con un medio orientativo de 1 día.", "pag": 1044}, {"p": "¿Cuál es la ruta de acceso a la aplicación de reclamaciones (Siebel)?", "o": ["IRIS>>Atención al cliente>>Siebel>>Solicitudes", "Intranet>>Calidad>>Todas>>Reclamaciones", "IRIS>>Consultas>>Sistemas Internos>>Reclamaciones", "IRIS>>Llamadas a Sistemas Externos>>Todas>>Reclamaciones"], "c": 3, "e": "Se accede por IRIS>>Llamadas a Sistemas Externos>>Todas>>Reclamaciones.", "pag": 1045}, {"p": "En \"Método de respuesta preferido\", la opción \"Ninguno\":", "o": ["Es la que aparece por defecto", "Implica entregar el resguardo impreso", "No está disponible en oficinas", "Solo se usa para clientes con contrato"], "c": 2, "e": "La opción \"Ninguno\" no está disponible en oficinas; por defecto aparece \"Correo electrónico\".", "pag": 1045}, {"p": "De un cliente ya registrado en la base de datos de Siebel, ¿qué datos pueden modificarse?", "o": ["La dirección y el correo electrónico", "El DOI y el nombre", "El teléfono y el código de cliente", "Solo el método de respuesta"], "c": 0, "e": "De todos los datos registrados es posible modificar la dirección y el correo electrónico.", "pag": 1045}, {"p": "En una solicitud con número de envío referida a una expedición:", "o": ["Se genera una solicitud por cada bulto", "Solo se reclama el primer bulto de la expedición", "Se genera una solicitud única para todos los bultos", "Debe tramitarse siempre como sin número de envío"], "c": 2, "e": "En las expediciones se informa su código y se genera una solicitud única para los bultos que la componen.", "pag": 1046}, {"p": "En las altas de solicitudes de envíos con seguimiento, ¿qué aplicación obtiene los datos para determinar si el cliente es remitente, destinatario o plataforma?", "o": ["COCAL", "Mercurio", "Quenda", "SPEX"], "c": 1, "e": "A través de Mercurio la aplicación obtiene los datos y determina el tipo de solicitante.", "pag": 1047}, {"p": "Las dudas sobre los formularios OMIC deben consultarse con:", "o": ["La Jefatura de Red del Área", "El Servicio de Atención al Cliente", "La Subdirección de Organización", "El jefe de Distribución"], "c": 0, "e": "El texto indica que cualquier duda al respecto debe consultarse con la Jefatura de Red del Área.", "pag": 1050}, {"p": "Si en el alta el cliente no está conforme con una solicitud \"Resuelta\" y quiere más investigación, la nueva información queda guardada en la pestaña:", "o": ["Anexos", "Notificaciones pendientes", "Comunicaciones del cliente", "Errores de carga"], "c": 2, "e": "Se marca la casilla de añadir más información y esta queda guardada en la pestaña \"Comunicaciones del cliente\".", "pag": 1051}, {"p": "Si una Petición de Informe no se responde en plazo, el sistema:", "o": ["Genera una segunda petición automática con copia al responsable de área", "Cierra la solicitud como resuelta", "Imputa la solicitud a otra oficina", "Envía la solicitud directamente al cliente"], "c": 0, "e": "Sin respuesta en tres días, se genera una segunda petición automática con copia al responsable de área.", "pag": 1052}, {"p": "¿Cuál es el plazo mínimo para formalizar una reclamación de una carta certificada nacional?", "o": ["3 días naturales", "10 días naturales", "15 días naturales", "7 días naturales"], "c": 3, "e": "En la tabla nacional, la carta certificada tiene un plazo mínimo de 7 días naturales y máximo de 4 meses.", "pag": 1055}, {"p": "¿Cuál es el plazo máximo para reclamar un giro nacional?", "o": ["1 año", "2 años", "6 meses", "4 meses"], "c": 1, "e": "El giro nacional tiene un plazo mínimo de 10 días naturales y máximo de 2 años.", "pag": 1055}, {"p": "¿Cuál es la indemnización mínima por deterioro o extravío del Paq Premium nacional sin contrato?", "o": ["30 €", "52,98 €", "6,43 €", "40 €"], "c": 3, "e": "Sin contrato se indemniza la cantidad del seguro LCTTM, con un mínimo de 40 €.", "pag": 1055}, {"p": "¿Cuál es el plazo máximo para formalizar una reclamación de Western Union?", "o": ["6 meses", "4 meses", "1 año", "30 días"], "c": 3, "e": "En la tabla internacional, Western Union tiene un mínimo de 1 día y un máximo de 30 días.", "pag": 1056}, {"p": "Con carácter general, el cómputo de los plazos para formalizar una reclamación comienza:", "o": ["Desde la fecha de entrega, en días hábiles", "Desde la fecha de entrega, en días naturales", "Desde la fecha de admisión, en días hábiles", "Desde la fecha de admisión del envío, en días naturales"], "c": 3, "e": "Los plazos cuentan desde la admisión y en días naturales; en la demora del Paq Premium Internacional se usa la fecha de entrega.", "pag": 1056}, {"p": "Según el temario, la eficiencia se define como:", "o": ["La capacidad de alcanzar un objetivo con el mínimo uso posible de recursos", "La capacidad de alcanzar todos los objetivos sin importar los recursos", "El grado de satisfacción final del cliente", "El cumplimiento de los plazos de entrega"], "c": 0, "e": "Por eficiencia se entiende alcanzar un objetivo fijado con el mínimo uso posible de los recursos disponibles.", "pag": 1058}, {"p": "¿Qué modelo de gestión se considera el último peldaño en el concepto de calidad?", "o": ["El modelo EFQM", "La metodología LEAN", "La calidad total", "El ciclo de Deming"], "c": 2, "e": "La calidad total comprende todas las actividades y personas y se considera el último peldaño de la calidad.", "pag": 1058}, {"p": "¿Cuál es el valor fundamental de Correos según el temario?", "o": ["La eficiencia de los procesos", "La innovación tecnológica", "La vocación por el cliente", "La rentabilidad económica"], "c": 2, "e": "El texto señala que el valor fundamental de Correos es la vocación por el cliente.", "pag": 1059}, {"p": "¿Con qué periodicidad visitan los auditores internos de Correos los centros de tratamiento?", "o": ["Bienal", "Cuatrienal", "Anual", "Semestral"], "c": 2, "e": "Los auditores visitan los CT por ciclos anuales y el resto de centros por ciclos cuatrienales.", "pag": 1062}, {"p": "La International Organization for Standarization (ISO) tiene su sede en:", "o": ["Bruselas, y fue fundada en 1946", "Ginebra, y fue fundada en 1956", "Ginebra, y fue fundada en 1946", "París, y fue fundada en 1964"], "c": 2, "e": "ISO es un organismo con sede en Ginebra fundado en 1946.", "pag": 1062}, {"p": "Las normas ISO renovadas por Correos con AENOR en 2022 están vigentes hasta:", "o": ["2024", "2023", "2025", "2026"], "c": 0, "e": "Las normas ISO renovadas en 2022 son vigentes hasta 2024.", "pag": 1062}, {"p": "La norma UNE-EN ISO 14001:2015 se refiere a:", "o": ["Seguridad de los sistemas de información", "Gestión medioambiental y gestión de residuos", "Medición de reclamaciones e indemnizaciones", "Tratamiento de quejas de los clientes"], "c": 1, "e": "La ISO 14001 contiene las normas de gestión medioambiental y gestión de residuos.", "pag": 1063}, {"p": "¿Qué norma adoptada voluntariamente por Correos se ocupa de la medición de las reclamaciones y de los procedimientos de indemnización?", "o": ["UNE-EN 13850", "UNE-EN 14012", "UNE-CEN/TR 15472", "UNE-ISO 10002"], "c": 1, "e": "La UNE-EN 14012 trata la medición de las reclamaciones y de los procedimientos de indemnización.", "pag": 1063}, {"p": "¿Cuántos criterios comprende el bloque de \"Resultados\" del modelo EFQM?", "o": ["Cinco", "Tres", "Nueve", "Cuatro"], "c": 3, "e": "Resultados abarca cuatro criterios: clientes, personas, sociedad y resultados clave; los agentes facilitadores son cinco.", "pag": 1064}, {"p": "En la matriz REDER, la letra D corresponde a:", "o": ["Despliegue", "Desarrollo", "Diagnóstico", "Dirección"], "c": 0, "e": "D es Despliegue: cómo una organización implanta el enfoque.", "pag": 1065}, {"p": "El cuestionario de la herramienta AUDINTER tiene un valor total de:", "o": ["1000 puntos", "700 puntos", "500 puntos", "900 puntos"], "c": 1, "e": "AUDINTER es un cuestionario de 700 puntos, aunque se ha adaptado al modelo de 1000 para oficinas y CTA.", "pag": 1065}, {"p": "En el modelo EFQM adaptado a centros de tratamiento, ¿cómo se reparten los 1000 puntos?", "o": ["50 % agentes facilitadores y 50 % resultados", "70 % agentes facilitadores y 30 % resultados", "45 % agentes facilitadores y 55 % resultados", "55 % agentes facilitadores y 45 % resultados"], "c": 3, "e": "Para centros de tratamiento se asigna un 55 % a los agentes facilitadores y un 45 % a los resultados.", "pag": 1067}, {"p": "En el modelo EFQM de unidades de reparto, el \"Plan Limbo\" se refiere a:", "o": ["La limpieza de las bolsas de reparto", "La limpieza de los cascos", "El mantenimiento preventivo de vehículos", "El reciclado de papel y residuos"], "c": 0, "e": "Entre las manifestaciones de recursos materiales y 5S figura el Plan Limbo de limpieza de bolsas de reparto.", "pag": 1067}, {"p": "Dentro de las 5S de Toyota, \"Seiri\" significa:", "o": ["Orden", "Clasificación", "Limpieza", "Estandarización"], "c": 1, "e": "Seiri es la clasificación: separar lo innecesario y eliminar lo inútil del espacio de trabajo.", "pag": 1072}, {"p": "¿Cuál es el valor de referencia del indicador de admisión digitalizada enviada por correo electrónico?", "o": ["54 %", "75 %", "90 %", "45 %"], "c": 0, "e": "La tabla de indicadores de la Red de Oficinas 2022 fija un 54 % para este indicador.", "pag": 1073}, {"p": "En el índice de recomendación, ¿qué clientes se consideran \"promotores\"?", "o": ["Los que otorgan 9 y 10 puntos sobre 10", "Los que otorgan 8, 9 y 10 puntos sobre 10", "Los que otorgan 7 o más puntos sobre 10", "Los que otorgan 10 puntos sobre 10"], "c": 0, "e": "Promotores son los clientes que otorgan 9 y 10 puntos; detractores, los que puntúan por debajo de 6.", "pag": 1073}, {"p": "En la fórmula D+x para fijar plazos de entrega, la \"x\" corresponde a:", "o": ["Los días naturales desde el depósito hasta la entrega", "Los días laborables desde la admisión hasta la clasificación", "Los días laborables desde el depósito hasta la entrega", "El número de centros por los q áxima producción (Navidad, Black Friday…), con informes cada hora.", "pag": 1077}, {"p": "¿Desde qué fecha el giro deja de considerarse un producto del SPU?", "o": ["1 de enero de 2010", "1 de enero de 2012", "1 de enero de 2011", "1 de enero de 2007"], "c": 2, "e": "Desde el 1 de enero de 2011 el giro pasa a considerarse un servicio financiero complementario.", "pag": 1078}, {"p": "Según la Directiva Postal para el correo transfronterizo intracomunitario, el objetivo en D+3 es del:", "o": ["93 % de los envíos", "80 % de los envíos", "85 % de los envíos", "97 % de los envíos"], "c": 2, "e": "La Directiva fija D+3 para el 85 % y D+5 para el 97 % de los envíos.", "pag": 1079}, {"p": "¿Desde qué año forma parte Correos del acuerdo de la IPC?", "o": ["2012", "1989", "2008", "2016"], "c": 0, "e": "El texto señala que Correos forma parte de este acuerdo desde 2012.", "pag": 1081}, {"p": "¿Cómo se denomina el estudio de medición de calidad que realiza la UPU?", "o": ["UNEX", "SPEX", "REIMS", "Global Monitoring System (GMS)"], "c": 3, "e": "La IPC realiza el estudio UNEX, mientras que la UPU realiza el Global Monitoring System (GMS).", "pag": 1081}, {"p": "¿En qué mes se seleccionan los ganadores de cada categoría de los premios a empleados?", "o": ["Enero", "Junio", "Marzo", "Diciembre"], "c": 2, "e": "Para todos los premios, en marzo se seleccionan los ganadores del periodo 1 de enero a 31 de diciembre del año anterior.", "pag": 1082}, {"p": "¿En qué año se creó el Premio Artemisa?", "o": ["2018", "2015", "2012", "2021"], "c": 1, "e": "El Premio Artemisa se creó en 2015 y celebró su quinta edición en 2021.", "pag": 1082}, {"p": "En el Premio Compromiso Ambiental, ¿cuántas veces como mínimo debe reunirse el equipo en el periodo de trabajo?", "o": ["Dos veces (una por semestre)", "Cuatro veces (una por trimestre)", "Seis veces (una cada dos meses)", "Doce veces (una al mes)"], "c": 1, "e": "Deben reunirse un mínimo de cuatro veces entre el 1 de enero y el 31 de diciembre, u
