o del comprador previamente demandada por él.", "pag": 1092}, {"p": "Señale cuál de las siguientes es una venta NO presencial:", "o": ["Televenta", "Venta ambulante", "Venta fría", "Venta en ferias y promociones"], "c": 0, "e": "La televenta figura entre las ventas no presenciales; las otras tres son presenciales.", "pag": 1093}, {"p": "Dentro de la fase de prospección, la calificación de los clientes se realiza en función de:", "o": ["Su potencial de compra", "Su edad y estado civil", "Su grado de satisfacción", "Su frecuencia de compra"], "c": 0, "e": "La calificación se hace según el potencial de compra (autoridad para decidir, capacidad económica, disposición…).", "pag": 1093}, {"p": "Respecto a la fase de cierre de la venta, el temario señala que:", "o": ["Debe dejarse siempre para el final de la presentación", "Solo puede realizarse tras la fase de posventa", "Debe producirse antes de la negociación", "Puede cerrarse incluso al principio de la presentación"], "c": 3, "e": "En la actualidad el cierre ya no se deja para el final y puede cerrarse incluso al principio.", "pag": 1094}, {"p": "Ante un producto con un precio elevado, el vendedor debe recurrir a estrategias como:", "o": ["La calidad, la inversión y las facilidades de pago", "Criticar el precio de la competencia", "Ofrecer siempre un descuento inmediato", "Insistir en la urgencia de la compra"], "c": 0, "e": "El texto indica recurrir a la calidad, la inversión y las facilidades de pago.", "pag": 1095}, {"p": "Los clientes que perciben que la atención, el producto y el servicio han superado sus expectativas son los:", "o": ["Clientes satisfechos", "Clientes complacidos", "Clientes influyentes", "Clientes activos"], "c": 1, "e": "Los complacidos perciben que se han superado sus expectativas; los satisfechos, que han coincidido.", "pag": 1096}, {"p": "Las características de un producto constituidas por el uso o disfrute que se le da son las:", "o": ["Tangibles", "Psicológicas", "Técnicas", "Funcionales"], "c": 1, "e": "El consumidor distingue características tangibles, psicológicas (uso o disfrute) y técnicas.", "pag": 1096}, {"p": "¿Qué aptitud del buen comunicador se sitúa en un punto intermedio entre la agresividad y la pasividad?", "o": ["Empatía", "Persuasión", "Inteligencia emocional", "Asertividad"], "c": 3, "e": "La asertividad se sitúa en un punto intermedio entre la agresividad y la pasividad.", "pag": 1097}, {"p": "¿Cómo se mide el grado de fidelización de los clientes?", "o": ["Con el número de reclamaciones recibidas al año", "Con el porcentaje de clientes que repiten compra sobre el total", "Con el índice neto de recomendación (NPS)", "Con el volumen medio de compra por cliente"], "c": 1, "e": "El grado de fidelización se mide con el porcentaje de clientes que repiten compra sobre el total de clientes.", "pag": 1099}]}, {"letra": "M", "titulo": "Correos: marco legal, organización y estrategia. Organismos reguladores", "paginas": "1103-1194", "resumen": "## 1. Marco normativo postal\n\n### 1.1. Ley 43/2010 (Ley Postal): datos generales\n- Publicada en el **BOE el 31/12/2010**; en vigor desde el **1 de enero de 2011** (día siguiente a su publicación) y vigente hoy.\n- Estructura: **preámbulo, 7 títulos, 68 artículos, 10 disposiciones adicionales, 1 transitoria, 1 derogatoria y 7 finales**.\n- **Deroga y sustituye a la Ley 24/1998**, de 13 de julio. Transpone la **Directiva 2008/6/CE** (debía hacerse antes del 31/12/2010).\n- Las funciones de la **Comisión Nacional del Sector Postal (CNSP)** las asume la **CNMC** (Ley 3/2013, de 4 de junio). Las referencias al Ministerio de Fomento se entienden hechas al **Ministerio de Transportes, Movilidad y Agenda Urbana (MITMA)**, y las de Economía y Hacienda a **Hacienda y Función Pública**.\n\n### Objeto y ámbito (art. 1 y 4)\n- Objeto: garantizar el **SPU**, satisfacer las necesidades de comunicación postal en España y con el extranjero y asegurar la **libre competencia**.\n- Se rigen por la ley: los servicios de **recogida, admisión, clasificación, transporte, distribución y entrega** de envíos postales y los **servicios de giro**. Ojo: por la **disposición final tercera**, el **giro no es producto SPU**, sino **servicio complementario** (servicio financiero de interés económico general prestado por el operador designado, directamente o mediante terceros).\n- **Excluidos (art. 4)**: servicios en **régimen de autoprestación** (los presta el propio remitente o un tercero que actúa en exclusiva para él y cubre todo el proceso postal) y los **envíos sin dirección postal** del destinatario.\n\n### Naturaleza y definiciones (art. 2 y 3)\n- Los servicios postales son **servicios de interés económico general** prestados en **libre competencia**. Están sujetos a obligaciones de servicio público los del SPU encomendados al operador designado y los impuestos a titulares de autorizaciones singulares.\n- **Envío postal**: objeto expedido a la dirección indicada por el remitente; incluye correspondencia, publicidad directa, libros, catálogos, diarios, publicaciones periódicas y paquetes con o sin valor comercial, **cualquiera que sea su peso**. Dimensiones mínimas y máximas: las de la **UPU**. No son envío postal los de objetos prohibidos.\n- **Envío de correspondencia**: comunicación escrita en soporte físico. **No** lo son la publicidad directa, libros, catálogos, diarios ni publicaciones periódicas.\n- **Certificado**: pago a tanto alzado, **garantía fija** contra pérdida, robo o deterioro y prueba de depósito/entrega a petición.\n- **Valor declarado**: asegura el envío por el valor que declara el remitente.\n- **Correo transfronterizo**: origen o destino en otro Estado de la UE o país tercero.\n- **Medios de franqueo**: sellos (solo el operador designado los usa **con efecto liberatorio**), sobres, tarjetas y cartas-sobres preestampados, impresiones de máquinas de franquear y estampillas de distribuidoras automáticas.\n- **Operador postal**: presta servicios postales (se excluye al tercero en autoprestación). **Operador designado**: el encargado por el Estado del SPU.\n- **Puntos de acceso**: centros de admisión masiva, oficinas, estafetas y buzones.\n- **Autoridad Nacional de Reglamentación**: Gobierno, órganos superiores y directivos de Fomento (MITMA) y CNSP (CNMC).\n\n### Derechos de los usuarios (Título II, art. 5-19)\n| Art. | Derecho | Claves |\n|---|---|---|\n| 5 | Secreto de las comunicaciones | Arts. 18.3 y 55.2 CE y 579 LECrim; no se dan datos de existencia, clase, remitente, destinatario |\n| 6 | Inviolabilidad | Deber de fidelidad; solo se detienen/abren por **resolución judicial motivada**; inspección limitada a reconocimiento externo, visual o por máquinas; destrucción inmediata de imágenes |\n| 7 | Protección de datos | Hoy **LO 3/2018 (LOPDGDD)**, que deroga la LO 15/1999 |\n| 8 | SPU de calidad | Permanente, en todo el territorio, precios asequibles |\n| 9 | Información | Condiciones de acceso, precio, calidad, indemnizaciones y plazo |\n| 10 | Reclamación | Procedimientos sencillos, **gratuitos**; resolución en **1 mes** |\n| 11 | Denuncia | Por incumplir arts. 9 y 10, ante la CNSP |\n| 12 | Indemnización | Certificados (cantidad predeterminada) y VD (proporcional); salvo fuerza mayor |\n| 13 | Propiedad | El envío es del **remitente** hasta que llega al destinatario |\n| 14 | Escritos a las AAPP | **Solo en oficinas del operador designado**; mismos efectos que el registro |\n| 15 | Identificación del operador | En la cubierta, con la fecha |\n| 16 | Prueba de depósito y entrega | En certificados, a petición y previo pago, con fecha y hora |\n| 17 | Reexpedición y rehúse | Rehúse **antes de abrir**; el remitente puede pedir devolución o abandono |\n| 18 | Envíos no entregados | Reglas reglamentarias (averiguación, depósito, destrucción) |\n| 19 | Personas con discapacidad | Ley 51/2003; eliminación de barreras y webs accesibles |\n\n- **Controversias**: los usuarios pueden acudir a las **Juntas Arbitrales de Consumo** (RDL 1/2007) o, si no lo han hecho, a la CNSP: reclamación en **1 mes** desde la respuesta del operador (o fin del plazo) y resolución en **3 meses máximo**. Gratuito, aunque se pueden repercutir gastos si hay mala fe o temeridad. Cabe **recurso contencioso-administrativo**.\n- La cuantía mínima y máxima de indemnización y de aseguramiento en VD la fija **orden ministerial** (Fomento/MITMA).\n\n### Servicio postal universal (Título III)\n- **Concepto (art. 20)**: servicios de calidad determinada, en régimen ordinario y permanente, en todo el territorio y a precio asequible.\n- **Ámbito (art. 21)**: envíos nacionales y transfronterizos ordinarios de **cartas y tarjetas postales hasta 2 kg** y **paquetes hasta 20 kg**, más los servicios de **certificado y valor declarado**. Publicidad directa, libros, catálogos y publicaciones periódicas se admiten en régimen SPU si usan esas modalidades.\n- **Principios (art. 22)**: **equidad, no discriminación, continuidad, buena fe y adaptación** a las necesidades de los usuarios. La continuidad solo se interrumpe por fuerza mayor y previa comunicación a la CNSP (que puede denegarla).\n- Prestación conforme al **Plan de Prestación** (aprobado por el Gobierno) y al **contrato regulador** (contrato administrativo especial), previo informe de CNSP y Consejo Superior Postal.\n- **Presunción de veracidad y fehaciencia** del operador designado en notificaciones administrativas y judiciales (físicas y telemáticas). Las de otros operadores surten efecto según el derecho común.\n- El Gobierno puede imponer **obligaciones adicionales** (cohesión, educación, protección civil, procesos electorales, seguridad pública o defensa), siempre **compensadas**.\n- **Recogida (art. 23)**: al menos **una recogida todos los días laborables, de lunes a viernes**, incluso en zonas rurales. **Entrega (art. 24)**: al menos todos los días laborables de lunes a viernes; a persona autorizada del mismo domicilio salvo oposición escrita del destinatario.\n\n### Operador designado\n- **Disposición adicional primera**: la **Sociedad Estatal Correos y Telégrafos, S.A.** es operador designado durante **15 años** desde la entrada en vigor de la ley; firma un **contrato regulador por periodos quinquenales** con Economía y Hacienda y Fomento.\n- Pasados 15 años se podrá designar a **una o varias empresas** (también por elementos o por territorios), con transparencia, no discriminación y proporcionalidad.\n- Exento de tributos ligados al SPU **salvo el Impuesto sobre Sociedades**.\n\n### Coste y financiación (art. 26-32)\n- **Contabilidad analítica** y **cuentas separadas** (al menos una por servicio SPU). Los demás operadores en el ámbito SPU: contabilidad separada de ingresos y auditoría (Ley 19/1988).\n- **Coste neto**: diferencia entre operar con y sin obligaciones de servicio público; lo verifica **anualmente** la CNSP.\n- **Carga financiera injusta**: la determina la CNSP previo informe preceptivo de Economía y Hacienda.\n- **Fondo de financiación**: gestionado por la CNSP, **sin personalidad jurídica**. Se nutre de: transferencias de los PGE, prestaciones patrimoniales públicas (contribución y tasa), donaciones o legados y rendimientos de depósitos. Se transfiere al operador **trimestralmente**, a cuenta de la liquidación anual.\n- **Contribución postal (art. 31)**: sujetos pasivos los titulares de autorización singular con cifra de negocios SPU **> 50.000 €**; tipo **0,5 %**; devengo el **31 de diciembre**; ingreso en **julio** del año siguiente.\n- **Tasa por autorización singular (art. 32)**: **1.500 €**, destinada íntegramente a la carga financiera injusta.\n\n### Garantías del operador designado (art. 33)\n- Uso exclusivo de la denominación **«Correos»**, del término **«España»** y del emblema de la **cornamusa con la corona**.\n- Ocupación del dominio público para **buzones**; beneficiario de **expropiación forzosa** (trámite de urgencia); cesión de espacios en ferrocarriles, puertos y aeropuertos; distribución de sellos (venta al por menor por la red o por terceros).\n\n### Precios (art. 34-36)\n- **Asequibles, transparentes y no discriminatorios**, según costes reales.\n- Comunicación a la CNSP con **al menos 3 meses** de antelación y memoria justificativa; si no se ajustan, **15 días** de alegaciones. Publicación en las webs de la Comisión y del operador.\n- **Exentos de pago**: **cecogramas** y envíos con ese derecho por la UPU.\n- Descuentos a envíos masivos: transparencia y no discriminación; se extienden a particulares y pymes en condiciones similares. Se admiten pago diferido, franqueo en destino y prepago.\n\n### Régimen de prestación (Título IV)\n- Operador con nacionalidad de un Estado de la UE y al menos un establecimiento permanente en España.\n- **Registro General de Empresas Prestadoras de Servicios Postales** (inscripción de oficio, público):\n\n| Sección | Servicios | Título habilitante |\n|---|---|---|\n| A | No incluidos en el SPU | **Declaración responsable** (previa al inicio, habilita en toda España) |\n| B | Incluidos en el SPU | **Autorización administrativa singular** |\n\n- Hoy las solicitudes se remiten a la **Subdirección General de Régimen Postal** del MITMA.\n- **Requisitos esenciales (art. 40.2)**: inviolabilidad de la correspondencia, protección de datos, seguridad de la red (sustancias peligrosas, salud pública, medio ambiente…) y regímenes de empleo y Seguridad Social.\n- **Autorización singular**: otorgamiento reglado; obligaciones del titular: servicio público impuesto, no perturbar los derechos del operador designado, facilitar información y publicar **informe anual de reclamaciones**. **Silencio positivo a los 3 meses**; cabe recurso contencioso-administrativo.\n\n### Acceso a la red y conflictos (Título V)\n- Acceso conforme a **transparencia** (publicidad previa), **proporcionalidad** y **no discriminación**. El operador designado elabora un **contrato tipo de acceso**, aprobado por la CNSP. Si no hay acuerdo en una negociación, la CNSP fija condiciones **vinculantes**.\n- Otras infraestructuras: código postal, base de datos de direcciones, apartados, buzones, cambios de dirección, reexpedición, devolución.\n- **Conflictos**: principios de audiencia, contradicción e igualdad. Por temeridad o mala fe, multa **hasta el 5 %** de lo reclamado (o del capital social), **mínimo 2.000 €**, más costas.\n\n### Autoridad Nacional de Reglamentación y Consejo Superior Postal (Título VI)\n- **Gobierno**: potestad reglamentaria originaria. **Ministerio**: ordenación normativa y ejecución de la política postal. **CNSP/CNMC**: supervisión y regulación del mercado.\n- **Consejo Superior Postal (art. 51)**: máximo órgano de participación (AAPP, usuarios, prestadores, sindicatos más representativos, asociaciones filatélicas). Lo preside el **Subsecretario de Fomento** (o quien delegue). Funciones consultivas: informa el plan de prestación, el contrato regulador y los criterios de contabilidad analítica.\n\n### Inspección, infracciones y sanciones (Título VII)\n- Inspectores: **agentes de la autoridad**. Entrar en domicilio protegido con oposición requiere autorización escrita del presidente de la Comisión.\n- **Muy graves**: incumplir arts. 5, 6 y 7; prestar sin autorización; obstruir la inspección; 2 o más graves en 1 año. **Graves**: incumplir reiteradamente el suministro de información; 2 o más leves en 1 año. **Leves**: prestar servicios no SPU **sin declaración responsable**, falta de información no grave.\n\n| Infracción | Multa | Prescripción infracción | Prescripción sanción |\n|---|---|---|---|\n| Leve | 200 – 8.000 € | 6 meses | 1 año |\n| Grave | 8.001 – 80.000 € | 2 años | 2 años |\n| Muy grave | 80.001 – 400.000 € | 3 años | 3 años |\n\n- Incumplir grave o reiteradamente el art. 40.2: **inhabilitación 1 año**. Reducción de la sanción al **25 %** si hay conformidad. **Multas coercitivas**: periodicidad mínima mensual, máximo el 25 % de la sanción máxima.\n\n### Comisión Filatélica del Estado y otras disposiciones\n- Órgano colegiado consultivo adscrito al MITMA (DA 4.ª, desarrollado por **RD 1637/2011**): elabora el **programa anual de emisión de sellos** y propone sus temas. La emisión se autoriza por resolución conjunta de los Subsecretarios de Hacienda y Fomento; los estancos venden sellos (Ley 13/1998).\n- DA 5.ª: **Orden Civil del Mérito Postal**, **Medalla al Mérito Filatélico** y **carteros honorarios** (los nombra el Presidente de Correos). DA 6.ª: **sello de excelencia de empresa postal sostenible**. DA 2.ª: seguimiento del SPU como máximo cada 5 años.\n- Tasa anual de inscritos en el Registro para financiar la Comisión: fijada en su día en **400 €**.\n\n## 1.2. Liberalización del sector postal\n- Arranca en Europa en los **años sesenta** (couriers y mensajeros). La CEE elabora el **Libro Verde de 11 de junio de 1992**.\n\n| Directiva | Reserva | Precio a otros operadores | Transposición |\n|---|---|---|---|\n| **97/67/CE** (15/12/1997), 1.ª directiva | Correo interno **hasta 350 g** | **5 veces** la tarifa 1.ª escala | **Ley 24/1998** (+ RD 1829/1999, modificado por RD 503/2007) |\n| **2002/39/CE** (10/06/2002) – fase enero 2003 | Cartas **< 100 g** | **3 veces** | **Ley 53/2002** |\n| 2002/39/CE – fase enero 2006 | Cartas **< 50 g** | **2,5 veces** | Ley 53/2002 |\n| **2008/6/CE** (20/02/2008) | Fin de la reserva el **31/12/2010** | — | **Ley 43/2010** |\n\n- En España la reserva solo afectó al ámbito **interurbano** (el urbano ya estaba liberalizado).\n- Excepción hasta el **31/12/2012** para algunos Estados (Chipre, Grecia, Polonia, Rumanía…). Liberalización completa en la UE: **1 de enero de 2013**.\n\n## 1.3. Plan de Prestación del SPU (2021)\n- Aprobado por Consejo de Ministros el **1/06/2021**, publicado en el BOE el **26/06/2021** y en vigor al día siguiente.\n- Concreta la ley: condiciones en zonas de muy baja densidad, cálculo del coste neto y la carga financiera injusta, control y seguimiento.\n- **Valor declarado**: mínimo **15 €** y máximo **3.000 €** (Correos mantiene **6 €** en sus manuales).\n- Número mínimo de **buzones, oficinas y puntos de admisión masiva** según habitantes del municipio.\n- Sellos caducados o falsos: se aplican criterios de **insuficiencia de franqueo** más sanción.\n- **Reexpedición** disponible en un **máximo de 5 días** desde su contratación.\n- Consultas, quejas y reclamaciones: respuesta en **20 días** por el mismo medio; **1 mes** para quejas y reclamaciones de envíos nacionales; plazo UPU en internacionales.\n- **Indemnizaciones** (pago en máximo 1 mes): carta certificada nacional **10 a 12 veces** la tarifa; paquete nacional **4 a 6 veces**; VD el **100 %** del valor declarado (proporcional si hay deterioro); internacionales según UPU.\n- Calidad: máximo **4 quejas y reclamaciones por cada 100.000 envíos** SPU. Tiempo medio de espera en oficina objetivo: **8 minutos**.\n\n| Plazo | Cartas ordinarias | Cartas certificadas | Paquetes |\n|---|---|---|---|\n| D+3 | 93 % | 93 % | 80 % |\n| D+5 | 99 % | 99 % | 95 % |\n\n## 2. Organización y estrategia\n\n### 2.1. Grupo Correos\n- Fecha de nacimiento: **1716**. Lo forman la **SECTSA, S.M.E.** y sus filiales **Correos Nexea**, **Correos Express** y **Correos Telecom**.\n- Sociedad Estatal desde **2001**, capital público 100 %. Por la **Orden HAP/583/2012** (efectiva el 7/06/2012) sus acciones pasan de la Dirección General de Patrimonio a la **SEPI**, que tiene el **100 %**.\n- Valores: **seguridad, confianza y cercanía**; señas de identidad: innovación, trabajo en equipo y proactividad.\n- Sociedad mercantil regida por el derecho privado salvo en materia presupuestaria, contable, de control financiero y de contratación.\n\n| Empresa | Especialidad | Datos clave |\n|---|---|---|\n| **Correos** (matriz) | Operador designado del SPU | 100 % de las filiales; **35 %** de las chinas **KCG eCommerce Solutions** y **K-Parcel** |\n| **Correos Nexea** | Gestión documental y comunicaciones multicanal | Nombre desde **2011**; plataforma **Nexo** (burofax, email, carta, SMS, telegrama, Mi Buzón) |\n| **Correos Express** | Paquetería urgente **B2B y B2C** | Denominación actual desde el **7/02/2017**; **51 %** de Correos Express Portugal (2019) |\n| **Correos Telecom** | Infraestructuras de telecomunicación y soporte tecnológico | Fibra oscura (incluida 5G), alquiler IPv4, nodos FTTH en oficinas (2018), telefonía móvil (2021) y venta en oficinas desde 2022 |\n\n### 2.2. Adaptación a los cambios\n- Evolución: **Dirección General de Correos y Telecomunicación (1939)** → Dirección General de Correos y Telégrafos (1985) → **Organismo Autónomo (1992)** → **Entidad Pública Empresarial (1998)** → **Sociedad Estatal Correos y Telégrafos S.A. (2001)**.\n- En **1994** se eliminan las **franquicias postales** (fin de la gratuidad de los envíos oficiales).\n- La EPE fue el primer operador designado (Ley 24/1998). El **art. 58 de la Ley 14/2000** la transforma en sociedad anónima.\n- Actividad desde el **3 de julio de 2001** (escritura del 29/06/2001). Capital inicial **611.521.000 €** en 611.521 acciones de 1.000 €.\n- Los funcionarios conservaron su condición; el nuevo personal, régimen laboral ordinario.\n- Mercado: Correos lidera el segmento **SPT** con una cuota del **90 %** (2021); los envíos ordinarios son el 77 % del volumen. En el segmento **CEP**, Correos y CEX suman el **18,1 %**.\n\n### 2.3. Estrategia de actuación y diversificación\n- **Portugal**: CEX compra el **51 % de Rangel Expresso** por **11 millones €**; **11 delegaciones** en Portugal y 58 en España.\n- **Asia**: colaboración con **Alibaba** desde **2015**, con Tmall Global en 2016 y acuerdo con **AliExpress y Cainiao** en 2019. Alianza con **Kerry Logistics** y **Global Freight Systems**: centro en **Dongguan** con capacidad de **medio millón de paquetes al día**. Piloto con **Iberojet** (2021) en la ruta Hong Kong–Madrid y **Correos Cargo**.\n- **Paquetería**: Paq Today (en el día), Paq Premium (24/48 h), Paq Estándar, Paquete Azul, Paq Retorno, **Paq Ligero** (desde 2019, **hasta 2.000 g**), Correos Frío, Paq Mochila, Paq Bicicleta, Paq Peregrino. Internacional: Paq Premium Internacional (más de 190 países), Paq Light Internacional (hasta 2 kg, sin firma), Paq Return Internacional. Oficina extraterritorial en EE. UU.\n- **CorreosLabs**: centro de innovación en **Las Tablas (Madrid)** con **40 puestos de coworking**; nueva sede anunciada en Pamplona (2022). **Reto Lehnica**: un año de financiación, espacio y mentoring; edición 2022 **Lehnica Changer** (startups de hasta 5 años, **15.000 €** por piloto).\n- **Plan Estratégico 2020-2023** (consultoría **Deloitte**): **9 objetivos básicos** y **59 líneas de trabajo**. Plan 2021-2024: reforzar el papel como proveedor de servicios públicos y diversificar.\n\n### 2.4. Órganos de administración y gobierno\n- Objeto social (art. 2 de los Estatutos): servicios postales, servicios financieros y giros, recepción de escritos a las AAPP, notificaciones, telegrama, télex, burofax, propuesta de emisión de sellos…\n- Órganos sociales: **Junta General de Accionistas** y **Consejo de Administración**. Estatutos modificados en 2015 (Ley 31/2014).\n\n| Órgano | Composición y funciones |\n|---|---|\n| Consejo de Administración | **12 a 15 miembros**, mandato máximo **5 años**, reelegibles; se reúne normalmente cada mes |\n| Presidente | Presidente ejecutivo de la compañía (art. 57 de los Estatutos) |\n| Comisión Ejecutiva | **Presidente + 4 consejeros**; todas las facultades delegables |\n| Comisión de Auditoría y Control | **3 consejeros**; sin funciones ejecutivas |\n| Comité de Dirección | Asiste al Presidente; se reúne **semanalmente** |\n\n- Consejos de las filiales: Correos Express **6-12**, Correos Telecom **4-8**, Correos Nexea **4-12** (cargos sin retribución).\n- Direcciones: Secretaría General y del Consejo, Auditoría y Control, Comunicación y Marketing, Operaciones, Personas y Relaciones Laborales, Financiera (incluye red de oficinas retail y el **COS**), Organización, Tecnología e Innovación y Estrategia.\n\n### 2.5. Estructura territorial\n- Desde **mayo de 2021**, **7 áreas territoriales** que sustituyen a las direcciones zonales:\n\n| Área | Sede | Ámbito |\n|---|---|---|\n| Noroeste (Zona 1) | Santiago de Compostela | 13 provincias: Castilla y León (salvo Soria), Galicia y Asturias |\n| Norte (Zona 2) | Bilbao | 10: País Vasco, Navarra, La Rioja, Cantabria, Aragón y Soria |\n| Noreste (Zona 3) | Barcelona | 4 provincias catalanas |\n| Centro (Zona 4) | Madrid | 8: Madrid, Castilla-La Mancha y Extremadura |\n| Este (Zona 5) | Valencia | 5: C. Valenciana, Murcia y Baleares |\n| Sur (Zona 6) | Sevilla | 8 provincias andaluzas, Ceuta y Melilla |\n| Insular (Zona 7) | Santa Cruz de Tenerife | 2 provincias canarias |\n\n- Unidades por área: Gerencia de Productos y Servicios (oficinas), Gerencia de Producción (centros de tratamiento), Gerencia de Personas y Relaciones Laborales.\n- Clasificación profesional (**III Convenio Colectivo, 2011**): **5 grupos profesionales** (I Titulado Superior … V Servicios Generales), **áreas funcionales** (Logística, Red, Comercialización, Corporativa y de Apoyo) y **puestos tipo**.\n- Cifras: 1.747 unidades de reparto, **18 centros de tratamiento automatizado**, 8.298 puntos de atención (5.909 rurales y **2.389 oficinas**), 13.200 vehículos, 1.157 eléctricos y 2.852 terminales Citypaq.\n\n## 3. Organismos reguladores\n### 3.1. Subdirección General de Régimen Postal (MITMA)\n- Define las políticas de desarrollo del SPU, elabora disposiciones generales, resuelve quejas y denuncias del SPU, inspecciona y sanciona, autoriza, cobra tasas y gestiona el Registro General. Da apoyo al **Consejo Superior Postal**, al **Consejo de la Orden Civil del Mérito Postal** y a la **Comisión Filatélica del Estado**. Sus funciones se recogen en el **RD 645/2020**.\n\n### 3.2. CNMC\n- Creada por la **Ley 3/2013, de 4 de junio** (39 artículos). Asume las funciones de la Comisión Nacional de la Energía, de la Competencia, del Mercado de Telecomunicaciones, del **Sector Postal**, el Comité de Regulación Ferroviaria, el Consejo Estatal de Medios Audiovisuales y la Comisión de Regulación Económica Aeroportuaria.\n- Personalidad jurídica propia, **independiente del Gobierno**, sometida a control parlamentario y judicial. Sede en **Madrid** y otra en Barcelona.\n- Funciones postales: circulares (vinculantes al publicarse en el BOE), verificar la contabilidad analítica, el coste neto y la carga financiera injusta, gestionar el fondo de financiación, verificar precios, autorizar excepciones a la entrega en buzón domiciliario y garantizar el acceso a la red. La representa la **ERGP**.\n\n### 3.3. MITMA\n- Informa a los usuarios, conoce de controversias y quejas del SPU (informa a la CNMC **como mínimo cada seis meses**), otorga autorizaciones, recibe declaraciones responsables y gestiona el Registro.\n- Órganos consultivos: **Consejo Superior Postal** (regulado por el **RD 1188/2011**) y **Comisión Filatélica** (RD 1637/2011).\n- En la UE: Consejo Europeo, Parlamento, Comisión (DG GROW, Comité de la Directiva Postal, CEN, ERGP), Consejo de la UE, Tribunal de Justicia y Tribunal de Cuentas.\n\n## 4. Organizaciones internacionales\n| Organización | Datos clave |\n|---|---|\n| **IPC** | Fundada en **1989**; 25 miembros; cooperativa de derecho holandés, sede estatutaria en Ámsterdam y oficina en Bruselas; filiales UNIPOST e IPC Technology |\n| **EPG** | Fundado en **1996** por 9 países; reclamaciones en **48 h** (sistema **Rugby**); estándares en España D+1 a D+4; sustituido por **Interconnect** desde 2021 |\n| **UPU** | **1874**, sede en **Berna**; organismo de la ONU desde **1948**; **192** miembros; España miembro desde **1950**; Consejo de Operaciones Postales de 40 Estados |\n| **Interconnect** | 34 operadores; niveles Premium (con firma, hasta 30 kg), Estándar y Económico (sin seguimiento, hasta 2 kg) |\n| **PostEurop** | Creada en **1993**, sede en Bruselas; 55 miembros en 53 países |\n| **UPAEP** | Creada en **1911**, sede en **Montevideo**; 28 países |\n| **Kahala Posts Group** | Lanzado en **2002** por seis administraciones; correo exprés y paquetes |\n| **CEPT** | **1959**, 19 países fundadores; hoy 48; reúne a los reguladores postales europeos |\n| **EuroMed (PUMed)** | Roma, **15/03/2011**, 14 operadores; hoy 23; premió a Correos en 2018 |\n| **PRIME** | 1997, proyecto de la IPC; modelo de **pago por rendimiento**; sistema GCSS |\n| **Cooperativa EMS** | Correo urgente de la UPU; 185 operadores |\n\n## Claves para el examen\n- Ley 43/2010: en vigor el **1/01/2011**, **68 artículos**, deroga la Ley 24/1998 y transpone la Directiva **2008/6/CE**.\n- SPU: cartas hasta **2 kg**, paquetes hasta **20 kg**, con certificado y valor declarado; el **giro** es servicio complementario.\n- Correos es operador designado durante **15 años**, con contrato regulador **quinquenal**; exento de tributos salvo el **Impuesto sobre Sociedades**.\n- Reclamaciones al operador: **1 mes**; ante la CNSP/CNMC: presentar en 1 mes y resolver en **3 meses**.\n- Precios comunicados con **3 meses** de antelación; los **cecogramas** están exentos de pago.\n- Registro: **Sección A** (declaración responsable, no SPU) y **Sección B** (autorización singular, SPU); silencio positivo a los **3 meses**; tasa de **1.500 €**; contribución postal del **0,5 %** si se superan **50.000 €**.\n- Multas: leves 200–8.000 €, graves 8.001–80.000 €, muy graves 80.001–400.000 €; prescripción de infracciones: 6 meses / 2 / 3 años.\n- Directivas: 97/67 (**350 g**, 5 veces), 2002/39 (100 g y después **50 g**), 2008/6 (fin de la reserva); liberalización completa el **1/01/2013**.\n- Plan 2021: VD **15–3.000 €**; carta certificada 10–12 veces la tarifa; paquete 4–6 veces; D+3 al 93 % en cartas y al **80 %** en paquetes; espera de 8 minutos; 4 quejas por cada 100.000 envíos.\n- La **SEPI** posee el 100 % de Correos desde 2012; la SECTSA empezó a operar el **3/07/2001**.\n- Consejo de Administración de **12 a 15** miembros (5 años); Comisión Ejecutiva: presidente + 4.\n- 7 áreas territoriales desde mayo de 2021; UPU en 1874 (Berna), con España como miembro desde 1950.", "preguntas": [{"p": "¿En qué fecha entró en vigor la Ley 43/2010, de 30 de diciembre, del servicio postal universal?", "o": ["31 de diciembre de 2010", "1 de enero de 2011", "30 de diciembre de 2010", "1 de enero de 2012"], "c": 1, "e": "Se publicó en el BOE el 31 de diciembre de 2010 y entró en vigor el 1 de enero de 2011.", "pag": 1105}, {"p": "Según el artículo 4 de la Ley 43/2010, quedan excluidos de su ámbito de aplicación:", "o": ["Los servicios de giro postal y los envíos de publicidad directa", "Los envíos certificados y los envíos con valor declarado", "Los servicios en régimen de autoprestación y los envíos sin dirección postal", "Los paquetes de más de 20 kg y las cartas de más de 2 kg"], "c": 2, "e": "El art. 4 excluye los servicios en régimen de autoprestación y los envíos sin dirección postal del destinatario.", "pag": 1106}, {"p": "¿Hasta qué peso se incluyen en el ámbito del SPU las cartas y tarjetas postales y los paquetes postales, respectivamente?", "o": ["2 kg y 20 kg", "2 kg y 30 kg", "1 kg y 20 kg", "2 kg y 10 kg"], "c": 0, "e": "El art. 21 incluye las cartas y tarjetas postales de hasta 2 kg y los paquetes postales de hasta 20 kg.", "pag": 1114}, {"p": "Las reclamaciones de los usuarios ante los operadores postales deben resolverse y notificarse en un plazo máximo de:", "o": ["Quince días desde su presentación", "Tres meses desde su presentación", "Veinte días hábiles desde su presentación", "Un mes desde su presentación"], "c": 3, "e": "El art. 10.2 fija un plazo máximo de un mes desde la presentación de la reclamación.", "pag": 1111}, {"p": "Cuando un usuario somete una controversia del ámbito del SPU a la Comisión Nacional del Sector Postal (hoy CNMC), ¿qué plazo máximo hay para resolverla?", "o": ["Un mes desde su presentación", "Tres meses desde su presentación", "Seis meses desde su presentación", "Dos meses desde su presentación"], "c": 1, "e": "La reclamación se presenta en el plazo de un mes y debe resolverse en un máximo de tres meses desde su presentación.", "pag": 1112}, {"p": "Según el artículo 14 de la Ley 43/2010, los escritos dirigidos a las Administraciones Públicas pueden presentarse con los mismos efectos que en el registro del órgano:", "o": ["A través de cualquier operador con autorización singular", "A través de cualquier operador inscrito en el Registro General", "Únicamente en las oficinas del operador designado para el SPU", "Únicamente en la sede electrónica de la Administración destinataria"], "c": 2, "e": "El art. 14 reserva este derecho únicamente a las oficinas del operador designado para prestar el SPU.", "pag": 1113}, {"p": "El operador designado está exento de los tributos que gravan su actividad vinculada al SPU, excepto:", "o": ["El Impuesto sobre Sociedades", "El Impuesto sobre el Valor Añadido", "El Impuesto sobre Bienes Inmuebles", "El Impuesto sobre Actividades Económicas"], "c": 0, "e": "El art. 22.2 lo exime de los tributos ligados al SPU salvo el Impuesto sobre Sociedades.", "pag": 1117}, {"p": "El operador designado debe comunicar los precios nuevos o modificados de los servicios con obligaciones de servicio público con una antelación mínima de:", "o": ["Quince días", "Un mes", "Seis meses", "Tres meses"], "c": 3, "e": "El art. 34.2 exige comunicarlos a la Comisión con al menos tres meses de antelación y con memoria justificativa.", "pag": 1121}, {"p": "Si no se ha dictado y notificado resolución expresa sobre una solicitud de autorización administrativa singular, esta podrá entenderse estimada pasados:", "o": ["Dos meses", "Tres meses", "Seis meses", "Un mes"], "c": 1, "e": "El art. 44.3 establece que, pasados tres meses sin resolución expresa, la solicitud puede entenderse estimada.", "pag": 1125}, {"p": "En la resolución de conflictos entre operadores, si se aprecia temeridad o mala fe, la multa puede llegar al 5 % de lo reclamado, con un mínimo de:", "o": ["1.000 euros", "1.500 euros", "2.000 euros", "3.000 euros"], "c": 2, "e": "El art. 48 prevé una multa de hasta el 5 % con un mínimo de 2.000 euros, más las costas.", "pag": 1126}, {"p": "Según el artículo 62 de la Ley 43/2010, las infracciones graves se sancionan con multa de:", "o": ["8.001 a 80.000 euros", "200 a 8.000 euros", "80.001 a 400.000 euros", "8.001 a 100.000 euros"], "c": 0, "e": "Las leves van de 200 a 8.000 €, las graves de 8.001 a 80.000 € y las muy graves de 80.001 a 400.000 €.", "pag": 1128}, {"p": "¿Cuál es el plazo de prescripción de las infracciones leves según la Ley 43/2010?", "o": ["Un año", "Tres meses", "Dos años", "Seis meses"], "c": 3, "e": "Las infracciones muy graves prescriben a los 3 años, las graves a los 2 y las leves a los 6 meses.", "pag": 1191}, {"p": "La cuota de la tasa por la concesión de autorizaciones administrativas singulares es de:", "o": ["400 euros", "1.500 euros", "2.000 euros", "50.000 euros"], "c": 1, "e": "Según el art. 32, la cuota a ingresar es de 1.500 euros.", "pag": 1183}, {"p": "¿Quién preside el Consejo Superior Postal?", "o": ["El Ministro de Hacienda", "El Presidente de la CNMC", "El Subsecretario de Fomento o la persona en quien delegue", "El Presidente de Correos"], "c": 2, "e": "El art. 51 dispone que lo preside el Subsecretario de Fomento o la persona en quien delegue.", "pag": 1188}, {"p": "La Directiva 97/67/CE reservaba al operador del servicio universal el correo interno de hasta:", "o": ["350 gramos", "100 gramos", "50 gramos", "500 gramos"], "c": 0, "e": "La primera directiva postal reservó el correo interno de hasta 350 g; los demás operadores debían cobrar cinco veces la tarifa.", "pag": 1129}, {"p": "¿En qué fecha se completó la liberalización postal en la Unión Europea?", "o": ["31 de diciembre de 2010", "1 de enero de 2011", "1 de enero de 2006", "1 de enero de 2013"], "c": 3, "e": "Por la excepción concedida a varios Estados hasta el 31/12/2012, la liberalización se completó el 1 de enero de 2013.", "pag": 1130}, {"p": "Según el Plan de Prestación del SPU de 2021, los envíos con valor declarado pueden asegurarse por un importe:", "o": ["Mínimo de 6 euros y máximo de 3.000 euros", "Mínimo de 15 euros y máximo de 3.000 euros", "Mínimo de 15 euros y máximo de 6.000 euros", "Mínimo de 10 euros y máximo de 1.500 euros"], "c": 1, "e": "El Plan fija un mínimo de 15 € y un máximo de 3.000 €, aunque Correos mantiene 6 € en sus manuales.", "pag": 1131}, {"p": "Según el Plan de Prestación, la indemnización por pérdida de una carta certificada nacional será:", "o": ["De cuatro a seis veces la tarifa abonada", "El 100 % de la tarifa abonada", "De diez a doce veces la tarifa total abonada", "De seis a diez veces la tarifa abonada"], "c": 2, "e": "Para la carta certificada nacional, la indemnización no será inferior a diez veces ni superior a doce veces la tarifa total abonada.", "pag": 1132}, {"p": "¿Qué porcentaje de paquetes nacionales debe entregarse en D+3 según el Plan de Prestación?", "o": ["80 %", "93 %", "95 %", "99 %"], "c": 0, "e": "El objetivo en D+3 es el 80 % de los paquetes (el 93 % para las cartas ordinarias y certificadas).", "pag": 1132}, {"p": "¿Qué entidad posee el 100 % de las acciones de la Sociedad Estatal Correos y Telégrafos desde 2012?", "o": ["La Dirección General de Patrimonio del Estado", "El Ministerio de Transportes, Movilidad y Agenda Urbana", "La Comisión Nacional de los Mercados y la Competencia", "La Sociedad Estatal de Participaciones Industriales (SEPI)"], "c": 3, "e": "Por la Orden HAP/583/2012, las acciones pasaron de la Dirección General de Patrimonio a la SEPI, que posee el 100 %.", "pag": 1133}, {"p": "Correos Express Portugal nace cuando Correos Express adquiere el 51 % de la compañía portuguesa:", "o": ["CTT Expresso", "Rangel Expresso", "Kerry Logistics", "Global Freight Systems"], "c": 1, "e": "Correos Express compró el 51 % de Rangel Expresso por 11 millones de euros.", "pag": 1138}, {"p": "¿En qué fecha comenzó su actividad la Sociedad Estatal Correos y Telégrafos S.A., al inscribirse en el Registro Mercantil?", "o": ["29 de junio de 2001", "1 de enero de 2001", "3 de julio de 2001", "13 de julio de 1998"], "c": 2, "e": "Su actividad comenzó el 3 de julio de 2001, cuando se inscribió la escritura de constitución del 29 de junio de 2001.", "pag": 1137}, {"p": "El Plan Estratégico 2020-2023 de Correos, una vez revisado, se apoya en:", "o": ["Nueve objetivos básicos y 59 líneas de trabajo", "Siete objetivos básicos y 59 líneas de trabajo", "Nueve objetivos básicos y 95 líneas de trabajo", "Doce objetivos básicos y 40 líneas de trabajo"], "c": 0, "e": "El plan, elaborado con Deloitte, se sustenta en nueve objetivos básicos y 59 líneas de trabajo.", "pag": 1145}, {"p": "El Paq Ligero, ofrecido desde 2019 para el comercio editorial y electrónico, admite envíos de hasta:", "o": ["1.000 gramos", "5.000 gramos", "3.000 gramos", "2.000 gramos"], "c": 3, "e": "El Paq Ligero está pensado para envíos de dimensiones reducidas y bajo valor o peso, hasta 2.000 gramos.", "pag": 1139}, {"p": "Según los Estatutos, el Consejo de Administración de la SECTSA está compuesto por:", "o": ["Entre 6 y 12 miembros, con un mandato máximo de 4 años", "Entre 12 y 15 miembros, con un mandato máximo de 5 años", "Entre 12 y 15 miembros, con un mandato máximo de 4 años", "Entre 4 y 12 miembros, con un mandato máximo de 5 años"], "c": 1, "e": "Lo forman entre 12 y 15 miembros con un mandato máximo de 5 años; pueden ser reelegidos.", "pag": 1146}, {"p": "La Comisión Ejecutiva de Correos está integrada por:", "o": ["El presidente y tres miembros del Consejo", "Tres miembros del Consejo, sin funciones ejecutivas", "El presidente y cuatro miembros del Consejo de Administración", "El presidente y todos los directores corporativos"], "c": 2, "e": "La Comisión Ejecutiva la forman el presidente y cuatro miembros del Consejo; la de Auditoría tiene tres consejeros.", "pag": 1147}, {"p": "Señale la afirmación INCORRECTA sobre la estructura territorial de Correos implantada en mayo de 2021:", "o": ["El Área Norte tiene su sede en Santiago de Compostela", "El Área Insular tiene su sede en Santa Cruz de Tenerife", "El Área Noreste agrupa las 4 provincias catalanas", "El Área Sur incluye Andalucía, Ceuta y Melilla"], "c": 0, "e": "El Área Norte tiene su sede en Bilbao; Santiago de Compostela es la sede del Área Noroeste.", "pag": 1153}, {"p": "Señale qué organismo NO está entre aquellos cuyas funciones asumió la CNMC:", "o": ["Comisión Nacional del Sector Postal", "Comisión del Mercado de Telecomunicaciones", "Comisión Nacional de la Energía", "Consejo Superior Postal"], "c": 3, "e": "El Consejo Superior Postal sigue existiendo como órgano consultivo; los otros tres quedaron integrados en la CNMC.", "pag": 1158}, {"p": "El Ministerio informará a la CNMC de lo actuado en controversias, quejas y denuncias del SPU con una periodicidad mínima de:", "o": ["Tres meses", "Seis meses", "Un año", "Un mes"], "c": 1, "e": "El MITMA informa a la CNMC de las actuaciones realizadas con una periodicidad mínima de seis meses.", "pag": 1160}, {"p": "Respecto a la Unión Postal Universal (UPU), es correcto que:", "o": ["Se fundó en 1911 y tiene su sede en Montevideo", "Se fundó en 1989 y tiene su sede en Bruselas", "Se estableció en 1874, tiene su sede en Berna y España es miembro desde 1950", "Se estableció en 1948 como organismo autónomo con sede en Ginebra"], "c": 2, "e": "La UPU se estableció en 1874 con sede en Berna; España es miembro desde 1950.", "pag": 1164}, {"p": "¿Cuántas disposiciones adicionales tiene la Ley 43/2010?", "o": ["Diez", "Siete", "Ocho", "Doce"], "c": 0, "e": "Tiene un preámbulo, siete títulos, 68 artículos y 10 disposiciones adicionales.", "pag": 1105}, {"p": "¿Qué norma deroga y sustituye la Ley 43/2010?", "o": ["La Ley 23/2007, de creación de la CNSP", "La Ley 24/1998, del Servicio Postal Universal", "La Ley 3/2013, de creación de la CNMC", "La Ley 14/2000, de Medidas Fiscales"], "c": 1, "e": "La Ley 43/2010 deroga y sustituye a la Ley 24/1998, de 13 de julio.", "pag": 1105}, {"p": "Según el artículo 2 de la Ley 43/2010, los servicios postales son:", "o": ["Servicios públicos esenciales prestados en régimen de monopolio", "Servicios de interés general reservados al operador designado", "Servicios de interés económico general prestados en libre competencia", "Servicios financieros de interés general sujetos a autorización"], "c": 2, "e": "El art. 2 los define como servicios de interés económico general que se prestan en régimen de libre competencia.", "pag": 1106}, {"p": "Según la Ley 43/2010, ¿cuál de estos envíos NO tiene la consideración de envío de correspondencia?", "o": ["Una carta manuscrita", "Una tarjeta postal con texto escrito", "Una comunicación escrita en soporte físico", "Un catálogo"], "c": 3, "e": "La publicidad directa, los libros, los catálogos, los diarios y las publicaciones periódicas no son envíos de correspondencia.", "pag": 1107}, {"p": "Los sellos de correos, como medio de franqueo con efecto liberatorio, solo puede utilizarlos:", "o": ["El operador designado", "Cualquier operador con autorización singular", "Cualquier operador inscrito en la Sección A", "Las expendedurías de tabaco y timbre"], "c": 0, "e": "El art. 3.7 señala que solo el operador designado puede utilizar los sellos de correos con efecto liberatorio.", "pag": 1107}, {"p": "¿Cuántas delegaciones aportó Correos Express Portugal, que se suman a las de Correos Express España?", "o": ["58", "11", "200", "51"], "c": 1, "e": "Correos Express Portugal cuenta con 11 delegaciones, que se suman a las 58 de Correos Express España.", "pag": 1138}, {"p": "Según la definición de la ley, ¿cuál de estos elementos NO figura entre los puntos de acceso a la red postal?", "o": ["Los centros de admisión masiva", "Las oficinas y estafetas", "Los centros de tratamiento automatizado", "Los buzones a disposición del público"], "c": 2, "e": "Son puntos de acceso los centros de admisión masiva, las oficinas, las estafetas y los buzones a disposición del público.", "pag": 1108}, {"p": "¿Cuántos operadores componen la cooperativa EMS (Express Mail Service)?", "o": ["34", "155", "192", "185"], "c": 3, "e": "La cooperativa EMS está formada actualmente por 185 operadores.", "pag": 1169}, {"p": "Según el artículo 6, los envíos postales solo pueden ser detenidos, interceptados y, en su caso, abiertos por:", "o": ["Resolución motivada de la autoridad judicial", "Orden escrita del inspector de la CNMC", "Resolución del Ministerio de Transportes", "Decisión del responsable de la oficina"], "c": 0, "e": "Solo pueden detenerse o abrirse por resolución motivada de la autoridad judicial conforme a la ley.", "pag": 1109}, {"p": "La intervención de envíos por el personal de inspección postal, cuando hay sospechas fundadas, se limita a:", "o": ["La apertura del envío en presencia del destinatario", "El reconocimiento externo, visual o mediante máquinas", "La lectura del contenido con permiso del remitente", "La retención del envío un máximo de diez días"], "c": 1, "e": "Se limita al reconocimiento externo, visual o mediante máquinas, y las imágenes tomadas se destruyen de inmediato.", "pag": 1110}, {"p": "¿Qué ley orgánica de protección de datos está hoy en vigor, según el texto?", "o": ["La LO 15/1999, de 13 de diciembre", "La Ley 30/1992, de 26 de noviembre", "La LO 3/2018, de 5 de diciembre", "La Ley 51/2003, de 2 de diciembre"], "c": 2, "e": "La LO 3/2018 (LOPDGDD) derogó la LO 15/1999.", "pag": 1110}, {"p": "¿Cuál de las siguientes conductas NO se cita como incumplimiento del deber de fidelidad del artículo 6?", "o": ["La apertura ilegal", "La retención indebida", "El intencionado curso anormal", "La reexpedición pedida por el destinatario"], "c": 3, "e": "El art. 6 cita la detención contraria a derecho, el curso anormal intencionado, la apertura ilegal, la sustracción, la destrucción, la retención indebida y la ocultación.", "pag": 1109}, {"p": "Según el artículo 13, a efectos postales los envíos son de titularidad:", "o": ["Del remitente, hasta que llegan a poder del destinatario", "Del destinatario, desde el momento de su admisión", "Del operador postal, mientras circulan por su red", "Del Estado, hasta que se produce su entrega"], "c": 0, "e": "Son del remitente mientras no lleguen a poder del destinatario.", "pag": 1112}, {"p": "¿Dónde se encuentra CorreosLabs, el centro de innovación de Correos?", "o": ["En Pamplona", "En Las Tablas (Madrid)", "En Barcelona", "En Santiago de Compostela"], "c": 1, "e": "Es un entorno de trabajo en Las Tablas (Madrid) con 40 puestos de coworking; la sede de Pamplona solo se anunció como proyecto.", "pag": 1142}, {"p": "Según el artículo 17, el destinatario puede rehusar sus envíos postales:", "o": ["En los 15 días siguientes a su entrega", "Solo si se trata de envíos certificados", "Antes de abrirlos", "Después de abrirlos, si el contenido no coincide"], "c": 2, "e": "El destinatario puede rehusarlos antes de abrirlos; el operador lo deja por escrito e informa al remitente.", "pag": 1113}, {"p": "¿En qué año se fundó la International Post Corporation (IPC)?", "o": ["1996", "1874", "1993", "1989"], "c": 3, "e": "La IPC se fundó en 1989 a iniciativa de varios directores generales de Correos.", "pag": 1162}, {"p": "En caso de pérdida de un envío con valor declarado, el artículo 12 prevé indemnizar al usuario con:", "o": ["Una cantidad proporcional a la declarada por el remitente", "Una cantidad predeterminada por el operador postal", "El doble de la tarifa abonada por el envío", "Una cantidad que fija la CNMC en cada caso"], "c": 0, "e": "En los certificados se paga una cantidad predeterminada; en el valor declarado, una cantidad proporcional a la declarada.", "pag": 1112}, {"p": "¿Dónde tiene su sede la UPAEP (Unión Postal de las Américas, España y Portugal)?", "o": ["En Berna", "En Montevideo", "En Bruselas", "En Madrid"], "c": 1, "e": "La UPAEP se creó en 1911 y tiene su sede en Montevideo (Uruguay).", "pag": 1166}, {"p": "En la prestación del SPU, el principio de continuidad consiste en:", "o": ["Dar el mismo trato a usuarios en condiciones similares", "Prestar el servicio sin diferenciar por razones ideológicas", "No interrumpir ni suspender el servicio salvo fuerza mayor y previa comunicación a la CNSP", "Adaptar el servicio a las necesidades de los usuarios"], "c": 2, "e": "La continuidad supone no interrumpir ni suspender el servicio salvo fuerza mayor y previa comunicación a la CNSP, que puede denegarla.", "pag": 1115}, {"p": "¿Qué naturaleza jurídica tiene el contrato regulador de la prestación del SPU?", "o": ["Contrato privado mercantil", "Convenio de colaboración interadministrativo", "Contrato de concesión de servicio público", "Contrato administrativo especial"], "c": 3, "e": "El art. 22.3 señala que el contrato regulador tiene naturaleza de contrato administrativo especial.", "pag": 1115}, {"p": "Las obligaciones adicionales de servicio público que el Gobierno imponga al operador designado:", "o": ["Deben ser objeto de compensación", "Las asume el operador sin contraprestación", "Se financian con un recargo a los usuarios", "Requieren la aprobación previa de la UPU"], "c": 0, "e": "El art. 22.5 dispone que su imposición debe ser objeto de compensación.", "pag": 1116}, {"p": "¿Cuál de estas aportaciones NO se cita como fuente del Fondo de financiación del SPU?", "o": ["Las transferencias consignadas en los PGE", "Las multas impuestas por infracciones postales", "Las donaciones o legados de personas naturales o jurídicas", "Los rendimientos de los depósitos del fondo"], "c": 1, "e": "El fondo se nutre de transferencias de los PGE, prestaciones patrimoniales públicas, donaciones o legados y rendimientos de depósitos.", "pag": 1119}, {"p": "¿Con qué periodicidad debe transferir la CNSP al operador designado las cantidades disponibles en el Fondo de financiación?", "o": [ ción, ¿qué porcentaje de paquetes debe entregarse en D+5?", "o": ["80 %", "93 %", "95 %", "99 %"], "c": 2, "e": "En D+5 el objetivo es el 99 % de las cartas y el 95 % de los paquetes.", "pag": 1132}, {"p": "El incumplimiento grave o reiterado del artículo 40.2 conlleva la inhabilitación para la actividad postal durante:", "o": ["Seis meses", "Dos años", "Tres años", "Un año"], "c": 3, "e": "El art. 62 prevé la inhabilitación del infractor por un plazo de un año.", "pag": 1190}, {"p": "¿Desde qué año colabora Correos con Alibaba, propietario de AliExpress?", "o": ["2015", "2016", "2019", "2021"], "c": 0, "e": "Correos colabora con Alibaba desde 2015; en 2016 se amplió el acuerdo con Tmall Global.", "pag": 1138}, {"p": "¿Cuántos centros de tratamiento automatizado tiene Correos según los datos de expansión territorial?", "o": ["18", "91", "1.747", "58"], "c": 0, "e": "Correos cuenta con 18 centros de tratamiento automatizado.", "pag": 1156}, {"p": "¿Qué área territorial de Correos tiene su sede en Valencia?", "o": ["Área Noreste", "Área Centro", "Área Este", "Área Sur"], "c": 2, "e": "El Área Este (antigua Zona 5) tiene su sede en Valencia y agrupa la Comunidad Valenciana, Murcia y Baleares.", "pag": 1153}, {"p": "La Ley 43/2010 se dicta al amparo de la competencia exclusiva del Estado en materia de correos, prevista en el artículo:", "o": ["149.1.14.ª de la Constitución", "18.3 de la Constitución", "55.2 de la Constitución", "149.1.21.ª de la Constitución"], "c": 3, "e": "La disposición final cuarta invoca el art. 149.1.21.ª CE; el 149.1.14.ª (Hacienda) solo se añade para el art. 30.", "pag": 1193}, {"p": "¿Qué real decreto desarrolla la Comisión Filatélica del Estado y regula las emisiones de sellos?", "o": ["RD 1637/2011, de 14 de noviembre", "RD 1188/2011, de 19 de agosto", "RD 645/2020", "RD 1829/1999, de 3 de diciembre"], "c": 0, "e": "La Comisión Filatélica se desarrolla en el RD 1637/2011, de 14 de noviembre.", "pag": 1128}, {"p": "¿En qué fecha elaboró la CEE umental del Grupo a llamarse Nexea Gestión Documental S.A., S.M.E.?", "o": ["2001", "2017", "2019", "2011"], "c": 3, "e": "En 2011 pasó a denominarse Nexea Gestión Documental SA, SME.", "pag": 1134}, {"p": "¿Desde qué fecha tiene Correos Express su denominación actual?", "o": ["7 de febrero de 2017", "3 de julio de 2001", "1 de enero de 2011", "7 de junio de 2012"], "c": 0, "e": "Adoptó su denominación actual el 7 de febrero de 2017.", "pag": 1135}, {"p": "¿En qué año empezó Correos Telecom a comercializar espacios en oficinas de Correos para instalar nodos de cabecera FTTH?", "o": ["2015", "2018", "2021", "2022"], "c": 1, "e": "En 2018 empezó a comercializar esos espacios para los nodos de despliegues FTTH.", "pag": 1136}, {"p": "¿En qué año se eliminaron las franquicias postales, con lo que terminó la gratuidad de los envíos de los organismos oficiales?", "o": ["1985", "1992", "1994", "1998"], "c": 2, "e": "Las franquicias postales se eliminaron en 1994.", "pag": 1136}, {"p": "¿Cuál fue el capital social inicial de la Sociedad Estatal Correos y Telégrafos S.A.?", "o": ["611.521 euros", "61.152.100 euros", "6.115.210.000 euros", "611.521.000 euros"], "c": 3, "e": "Se fijó en 611.521.000 euros, dividido en 611.521 acciones de 1.000 euros.", "pag": 1137}, {"p": "Según el informe de la CNMC citado, ¿qué cuota tenía Correos en el segmento SPT (correo tradicional) en 2021?", "o": ["90 %", "77 %", "18,1 %", "51 %"], "c": 0, "e": "Correos lidera el segmento SPT con una cuota del 90 %.", "pag": 1137}, {"p": "¿Qué capacidad tiene la infraestructura de admisión y clasificación de Dongguan creada con socios logísticos chinos?", "o": ["Cien mil paquetes al día", "Medio millón de paquetes al día", "Un millón de paquetes al día", "Cuatro mil millones de paquetes al año"], "c": 1, "e": "Tiene capacidad para gestionar hasta medio millón de paquetes al día.", "pag": 1139}, {"p": "En el Reto Lehnica Changer (2022), ¿qué contrapartida económica aporta Correos al proyecto piloto de cada startup?", "o": ["5.000 euros", "10.000 euros", "15.000 euros", "50.000 euros"], "c": 2, "e": "Correos aporta 15.000 euros a cada proyecto piloto, además de mentorización y acceso a CorreosLabs.", "pag": 1143}, {"p": "¿Con qué frecuencia se reúne el Comité de Dirección de Correos?", "o": ["Mensualmente", "Trimestralmente", "Diariamente", "Semanalmente"], "c": 3, "e": "El Comité de Dirección se reúne semanalmente a instancia del Presidente.", "pag": 1147}, {"p": "¿Cuántos miembros puede tener el consejo de administración de Correos Telecom?", "o": ["De 4 a 8", "De 6 a 12", "De 4 a 12", "De 12 a 15"], "c": 0, "e": "Correos Telecom tiene de 4 a 8 consejeros; Correos Express, de 6 a 12; y Correos Nexea, de 4 a 12.", "pag": 1147}, {"p": "En la clasificación profesional del III Convenio Colectivo (2011), el grupo profesional IV corresponde a:", "o": ["Las jefaturas intermedias", "El personal operativo", "Los servicios generales", "Los titulados medios"], "c": 1, "e": "Los grupos son: I Titulado Superior, II Titulado Medio, III Jefaturas Intermedias, IV Personal operativo y V Servicios Generales.", "pag": 1155}]}, {"letra": "N", "titulo": "Normas de cumplimiento (I). Igualdad, violencia de género, protocolo contra el acoso, seguridad de la información y protección de datos", "paginas": "1195-1314", "resumen": "## 1. Igualdad: contexto y marco normativo\n\n### Situación de partida\n- **Igualdad social**: ausencia de discriminación por género, nacionalidad, edad, raza o religión. **Igualdad laboral**: derecho a ser respetado en el ámbito del trabajo.\n- Brechas detectadas: las mujeres tienen **mayor tasa de paro** y **salarios inferiores**.\n- Datos (INE 2021, aproximados): **brecha salarial del 11 %**; solo el **34 %** de mujeres en puestos de responsabilidad, aunque son cerca del **57 %** de titulados universitarios.\n\n### Normas internacionales y europeas\n| Norma | Dato clave |\n|---|---|\n| Declaración Universal de DD. HH. | 1948 |\n| Convención contra la discriminación de la mujer (ONU) | Aprobada 1979, ratificada por España en 1983 |\n| Conferencias mundiales | Nairobi 1985, Beijing 1995 y revisiones quinquenales |\n| Tratado de Ámsterdam | 1 de mayo de 1999 |\n| Directiva 2002/73/CE | Igualdad en empleo, formación y promoción (modifica la 76/207/CEE) |\n| Directiva 2004/113/CE | Igualdad en acceso a bienes y servicios |\n| Estrategia para la igualdad / Carta de la mujer | 2010-2015 / 2010 |\n\n### Constitución española de 1978\n- **Art. 1.1**: igualdad como valor superior del ordenamiento.\n- **Art. 9.2**: los poderes públicos promueven que la igualdad sea real y efectiva.\n- **Art. 14**: igualdad ante la ley sin discriminación.\n- **Art. 23.2**: acceso en igualdad a funciones y cargos públicos.\n- **Art. 149.1**: competencia exclusiva del Estado sobre las condiciones básicas de igualdad.\n\n### Ley 39/1999 de conciliación\n- Reparto de papeles: **Estado** (reformas legales), **agentes sociales** (negociación colectiva), **familias** (asumir cambios) y **empresas** (flexibilidad, reducción de jornada, jornada intensiva, teletrabajo...).\n\n## 2. Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva\n\n### Objeto y ámbito\n- **Art. 1**: hacer efectivo el derecho de igualdad de trato y oportunidades, sobre todo eliminando la discriminación de la mujer.\n- Obliga a **toda persona física o jurídica que actúe en España**, sea cual sea su nacionalidad, domicilio o residencia.\n- Novedad principal: la **prevención** de conductas discriminatorias y las políticas activas.\n- Igualdad en el empleo (art. 5): acceso (también por cuenta propia), formación, promoción, condiciones de trabajo (retribución y despido) y afiliación sindical/empresarial.\n- No es discriminación la diferencia de trato cuando la característica ligada al sexo sea **requisito esencial y determinante** y el objetivo legítimo.\n\n### Conceptos clave\n| Concepto | Artículo | Idea |\n|---|---|---|\n| Discriminación directa | 6 | Trato menos favorable por el sexo; incluye embarazo y maternidad |\n| Discriminación indirecta | 6 | Criterio aparentemente **neutro** que perjudica a un sexo, salvo justificación objetiva |\n| Acoso sexual | 7 | Conducta verbal o física de **naturaleza sexual** contra la dignidad |\n| Acoso por razón de sexo | 7 | Conducta en función del sexo que atenta contra la dignidad |\n| Indemnidad frente a represalias | 9 | Prohibido el trato adverso por presentar quejas o denuncias |\n| Acciones positivas | 11 | Medidas razonables y proporcionadas mientras dure la desigualdad |\n| Tutela judicial efectiva | 12 | Incluso finalizada la relación; la **persona acosada es la única legitimada** |\n\n- Tipos de **acciones positivas**: **equiparadoras** (compensar discriminaciones), **promocionales** (contrarrestar imágenes sexistas y falta de reconocimiento) y **transformadoras** (cambiar estructuras, sistema educativo, roles).\n\n### Poderes públicos, planes e informes\n- Criterios de actuación (art. 14): transversalidad, presencia equilibrada, erradicación de la violencia de género, atención a colectivos vulnerables, protección de la maternidad, conciliación y **lenguaje no sexista**.\n- **Art. 17**: Plan Estratégico de Igualdad de Oportunidades (Gobierno, periódico).\n- **Art. 18**: informe periódico del que se da cuenta a las **Cortes Generales**.\n- **Art. 19**: los proyectos que van al Consejo de Ministros llevan **informe de impacto de género**.\n- **Art. 20**: estadísticas con la **variable sexo** de forma sistemática; solo excepcionalmente puede justificarse su incumplimiento con informe motivado.\n- **Art. 21-22**: cooperación AGE-CC. AA. en la **Conferencia Sectorial de Igualdad**; las corporaciones locales pueden aprobar **Planes Municipales de organización del tiempo**.\n- **Art. 33-35**: condiciones especiales de igualdad en contratos; el **Consejo de Ministros** fija **anualmente** qué contratos de la AGE las incluyen obligatoriamente; preferencia en la adjudicación ante empate.\n\n### Planes de igualdad en las empresas\n- **Art. 45**: medidas contra la discriminación, negociadas con la representación de los trabajadores.\n- **RD 6/2019**: obligación de plan de igualdad para empresas de **50 o más trabajadores**; para el resto es voluntario.\n- **Art. 46**: plan = conjunto ordenado de medidas tras un **diagnóstico de situación**.\n- El diagnóstico (en la comisión negociadora) abarca, al menos: selección y contratación, clasificación, formación, promoción, condiciones de trabajo (con **auditoría salarial**), corresponsabilidad, infrarrepresentación femenina, retribuciones y prevención del acoso.\n- **Registro de Planes de Igualdad**: inscripción obligatoria (Dirección General de Trabajo y autoridades autonómicas).\n- **Art. 48**: las empresas deben prevenir el acoso (códigos de buenas prácticas, campañas, formación).\n- **Art. 49**: fomento de planes voluntarios en **pymes**.\n\n### Distintivo de igualdad (art. 50)\n- Lo crea el Ministerio de Trabajo; puede usarse en el tráfico comercial y con fines publicitarios.\n- Criterios: presencia equilibrada en dirección, planes de igualdad, **publicidad no sexista**.\n- El **Ministerio de Igualdad** controla su mantenimiento y puede **retirarlo**.\n- Es **honorífico**: **sin dotación económica**.\n\n### Medidas en la Administración General del Estado\n- Presencia equilibrada en órganos directivos, tribunales de selección, comisiones de valoración y consejos de administración (salvo razones fundadas y motivadas).\n- **Art. 55**: convocatorias selectivas con informe de impacto de género (salvo urgencia).\n- **Art. 59**: vacaciones en fecha distinta si coinciden con IT por embarazo, parto o lactancia, aunque haya acabado el año.\n- **Art. 60.1**: preferencia **durante un año** en cursos de formación tras maternidad/paternidad o excedencia por cuidado.\n- **Art. 60.2**: reserva de **al menos el 40 %** de plazas en cursos para facilitar el acceso de empleadas a puestos directivos.\n- **Art. 62**: protocolo frente al acoso (compromiso, instrucción al personal, tratamiento reservado, identificación de responsables).\n- **Art. 63**: información **al menos anual** desagregada por sexo.\n- **Art. 64**: Plan de Igualdad de la AGE **al inicio de cada legislatura**, evaluado **anualmente** por el Consejo de Ministros.\n\n### Órganos (título VIII)\n| Órgano | Regulación | Función |\n|---|---|---|\n| Comisión Interministerial de Igualdad | RD 1370/2007 (art. 76) | Coordinar políticas de los ministerios |\n| Unidades de Igualdad | RD 259/2019 (art. 77) | En cada ministerio: estadísticas, estudios, impacto de género |\n| Consejo de Participación de la Mujer | RD 1791/2009 (art. 78) | Órgano colegiado de consulta y asesoramiento |\n\n- **III Plan Estratégico 2022-2025**, cuatro ejes: Buen Gobierno; Economía para la vida; Vidas libres de violencia machista; ejercicio efectivo de derechos.\n\n## 3. Inclusión y diversidad en Correos\n\n- **52 %** de empleadas en el Grupo en 2021; \"más del **53 %**\" de efectivos mujeres según la Agenda de diversidad.\n- Tras el **RD 901/2020** (planes de igualdad) y el **RD 902/2020** (igualdad retributiva), Correos negocia el **II Plan de igualdad** y encarga registro retributivo y auditoría salarial (resultado favorable).\n- Objetivos del II Plan: igualdad en acceso y promoción, mujeres en puestos de responsabilidad, corresponsabilidad, calendario y **Comisión de Seguimiento**; prevé actualizar el protocolo contra el acoso a otras identidades de género.\n- **Lenguaje inclusivo**: guías para evitar sesgos de **afinidad**, **confirmación** y **halo**, y estereotipos.\n- Violencia de género: adhesión a la **Red de empresas por una sociedad libre de violencia de género**; guía **\"Correos te ayuda\"**.\n- **Agenda de diversidad e inclusión**: **cinco dimensiones** (LGBTIQ+, discapacidad, cultural, generacional y género) y **siete ejes** de trabajo (comunicación, empresa saludable, formación, sostenibilidad/ODS, cultura inclusiva, talento sin etiquetas, desarrollo sin desigualdades).\n\n## 4. LO 1/2004, de 28 de diciembre, de protección integral contra la violencia de género\n\n### Antecedentes\n- Se inspira en textos internacionales: Convención de 1979, Declaración ONU de 1993, Pekín 1995, resolución OMS WHA49.25 de 1996, **Programa Daphne II**.\n- **LO 10/2022** de garantía integral de la libertad sexual: equipara víctimas de violencia sexual a las de violencia de género o terrorismo y elimina la distinción abuso/agresión (todo acto sin consentimiento es **agresión**).\n\n### Derechos de las víctimas\n- **Art. 18 – Información**: plena y accesible (lengua de signos y otros formatos para personas con discapacidad).\n- **Art. 19 – Asistencia social integral**: atención, emergencia, apoyo, acogida y recuperación; principios de **atención permanente, actuación urgente, especialización y multidisciplinariedad**; alcanza también a los **menores** a cargo.\n- **Art. 20 – Asistencia jurídica gratuita**: asesoramiento inmediatamente previo a la denuncia y defensa por abogado y procurador; una misma dirección letrada; también para causahabientes no partícipes. La condición de víctima se adquiere con la denuncia o querella y se pierde con sentencia absolutoria o sobreseimiento (sin devolver lo recibido). Puede personarse como acusación particular **en cualquier momento**.\n\n### Derechos laborales y de Seguridad Social (arts. 21-23)\n- Reducción o reordenación del tiempo de trabajo, movilidad geográfica, cambio de centro, suspensión con reserva y extinción del contrato; la suspensión y extinción dan lugar a **situación legal de desempleo**.\n- Contratos de interinidad para sustituirlas: **bonificación del 100 %** de cuotas empresariales por contingencias comunes (toda la suspensión o **6 meses** en movilidad/cambio de centro).\n- Ausencias justificadas si lo determinan servicios sociales o de salud.\n- Autónomas que cesen: suspensión de cotización **6 meses**, considerados cotizados, situación asimilada al alta.\n- **Acreditación (art. 23)**: sentencia condenatoria, orden de protección, resolución judicial cautelar, informe del Ministerio Fiscal o informe de servicios sociales/especializados/de acogida.\n\n### Funcionarias (arts. 24-26)\n- Reducción/reordenación, movilidad geográfica y **excedencia**.\n- Acuerdo de la Conferencia Sectorial (2018) de movilidad interadministrativa: puesto provisional y reserva en origen. Si el traslado es **inferior a seis meses** o no hay vacante: **comisión de servicio**.\n\n### Derechos económicos (arts. 27-28)\n| Situación | Ayuda de pago único |\n|---|---|\n| Rentas ≤ **75 % del SMI** (sin pagas extra) y difícil empleabilidad | **6 meses** de subsidio por desempleo |\n| Discapacidad ≥ 33 % | **12 meses** |\n| Responsabilidades familiares | **18 meses** |\n| Responsabilidades familiares + discapacidad ≥ 33 % (víctima o familiar) | **24 meses** |\n- Financiada por los PGE; compatible con la Ley 35/1995.\n- Colectivo prioritario en **viviendas protegidas** y residencias; escolarización inmediata de los hijos.\n\n## 5. Plan de igualdad de Correos (III Convenio Colectivo)\n\n- Mujeres mayoría desde 2016: **52 %** de la plantilla y **46 %** de mandos intermedios; en 2020, **52,29 %** de **52.822** efectivos.\n- **III Convenio** (Resolución de **10 de junio de 2011**): **art. 27** Plan de Igualdad; **art. 28** protocolo contra el acoso; **art. 23** Comisión de Igualdad.\n- Fases según la Ley: definición, **diagnóstico**, objetivos y **aplicación, control y seguimiento** (Comisión de Igualdad paritaria).\n\n### Permisos, excedencias y reducciones\n| Medida | Dato |\n|---|---|\n| Hospitalización en vacaciones | Superior a **5 días** interrumpe vacaciones |\n| Nacimiento y cuidado del menor | **16 semanas** (desde 1-1-2021) |\n| Lactancia | 1 hora de ausencia, hijo **menor de 12 meses** |\n| Hijos con discapacidad | **2 horas** de flexibilidad diaria |\n| Adopción internacional | Permiso hasta **2 meses** (solo retribuciones básicas) |\n| Guarda legal | Reducción por hijos **menores de 12 años** |\n| Familiar 1.er grado enfermedad muy grave | Reducción hasta el **50 %**, retribuida, máximo **1 mes** |\n| Excedencia cuidado de hijo | Hasta **3 años**; reserva de puesto **2 años** |\n| Excedencia cuidado familiar | Hasta **3 años** (hasta 2.º grado) |\n| Prematuros u hospitalizados | Hasta **2 horas** diarias retribuidas |\n| Fallecimiento de cónyuge o hijos | Permiso no retribuido hasta **1 mes** |\n\n### Otras áreas del plan\n- **Contratación**: paridad de tribunales, igualdad del tiempo parcial y voluntariedad.\n- **Promoción**: participación femenina en dirección, derecho preferente de víctimas de violencia de género.\n- **Formación**: tribunales equilibrados, lenguaje no sexista, la excedencia por cuidado computa para **antigüedad**; formación durante permisos.\n- **Acoso**: protocolo; confidencialidad y no represalia; el **acoso sexual es falta muy grave**, dentro o fuera de las instalaciones.\n- **Víctimas de violencia de género**: reducción de jornada de **media hora a dos tercios** con reducción proporcional del salario; faltas justificadas; suspensión; **excedencia sin tiempo mínimo de servicios**, con **retribuciones íntegras los dos primeros meses**; traslado rápido.\n- **Publicidad**: sin mensajes sexistas; guías de lenguaje.\n- **Negociación colectiva**: paridad en comisiones paritarias.\n- **Maternidad**: cambio de puesto o tareas según el protocolo para embarazo, lactancia o parto reciente.\n- **Acción social**: ayudas de salud (no cubiertas por SS o **MUFACE**), escuelas infantiles (hijos **hasta 3 años**), ayudas por hijos con discapacidad **≥ 33 %**, estudios universitarios, préstamos sin intereses.\n- **Comisión de Igualdad** (paritaria): vigila, negocia, interpreta, elabora **informe anual** y propone medidas.\n\n## 6. Protocolo contra el acoso\n\n- Tres clases: **acoso sexual** (prioridad absoluta, cese inmediato), **acoso por razón de sexo** (cese y obtención de información) y **acoso moral o laboral** (desde soluciones conciliadoras hasta disciplinarias).\n- Se aplica a todo el personal laboral; al funcionario **salvo el régimen disciplinario**.\n- Acoso laboral: presión psicológica **sistemática y prolongada**; requiere **intencionalidad y reiteración**. No lo son los conflictos puntuales ni la tensión por supervisión; puede ser descendente o **ascendente**.\n- El condicionamiento por sexo de un derecho es acoso por razón de sexo y discriminación.\n\n### Procedimiento\n- Denuncia ante superiores o la **Dirección de RR. HH.** (puede adelantarse verbalmente, pero debe formalizarse **por escrito**). Órgano: Dirección de RR. HH. a través de la **Unidad de Instrucción**.\n- El Director de Zona o Jefe de Unidad la remite a RR. HH.\n- Tras una primera investigación: **archivo**, medidas organizativas/psicosociales/mediación, **información reservada** o petición de informes; si hay indicios, **expediente disciplinario** y medidas cautelares.\n- Acoso sexual: **sobre cerrado** con la leyenda \"Contenido confidencial. Abrir solo por el Centro Directivo\"; recomendable incluir teléfono.\n- Mediación: el acuerdo se refleja en **acta** firmada.\n- **Denuncias falsas**: falta grave o muy grave; **muy grave** con notoria temeridad.\n- **Asistencia médica**: se informa a la **Subdirección de Promoción de la Salud**.\n- **Observatorio antiacoso**: Sociedad Estatal y sindicatos firmantes; sigue la conflictividad, analiza causas y es informado de expedientes.\n\n## 7. Seguridad de la información\n\n### Secreto e inviolabilidad (RD 1829/1999)\n- **Art. 6 – Secreto**: prohibido dar cualquier dato sobre existencia, clase, circunstancias exteriores, remitente, destinatario o direcciones, salvo petición de estos, representantes o **resolución judicial**. Los **contenedores** no están amparados.\n- **Art. 7 – Inviolabilidad**: es violación la detención arbitraria, curso anormal intencionado, apertura, sustracción, destrucción, retención u ocultación.\n- Intervención solo por inspección postal de la **CNMC** ante sospechas fundadas; limitada a reconocimiento externo; imágenes destruidas de inmediato.\n- Garantías (art. 5): secreto, honor e intimidad, neutralidad y confidencialidad, igualdad de trato y no discriminación. Recogidas después en la **Ley 43/2010** (arts. 5 y 6).\n\n### Marco de protección de datos\n- Derecho fundamental: **art. 18 CE** (18.4 limita el uso de la informática).\n- **RGPD (UE) 2016/679**: en vigor **25-5-2016**, aplicación plena **25-5-2018**.\n- **LOPDGDD 3/2018**, de 5 de diciembre: en vigor al día siguiente; no se aplica a fallecidos (salvo art. 3) ni a materias clasificadas.\n- Definiciones del art. 4 RGPD: dato personal, tratamiento, seudonimización, fichero, **responsable** (decide fines y medios), **encargado** (trata por cuenta del responsable), consentimiento, violación de seguridad, datos genéticos, biométricos y de salud.\n- Datos de fallecidos: familiares y herederos pueden pedir acceso, rectificación o supresión salvo prohibición expresa del fallecido.\n\n### Principios (art. 5 RGPD)\n- Licitud, lealtad y transparencia; limitación de la finalidad; **minimización**; exactitud; limitación del plazo de conservación; integridad y confidencialidad; **responsabilidad proactiva**.\n- Licitud (art. 6): consentimiento, contrato, obligación legal, intereses vitales, interés público, interés legítimo (no para autoridades públicas).\n- Consentimiento: libre, específico, informado e inequívoco; **silencio, casillas premarcadas o inacción no valen**; revocable tan fácil como se da.\n- Menores: RGPD **16 años** (los Estados pueden bajarlo hasta **13**); LOPDGDD **mayores de 14 años**.\n- Categorías especiales (art. 9): prohibidas salvo excepciones (consentimiento explícito, derecho laboral, intereses vitales, datos hechos públicos...).\n\n### Derechos de las personas\n- Información, acceso, rectificación, supresión (**olvido**), limitación, portabilidad, oposición y no ser objeto de decisiones automatizadas.\n- Ejercicio **gratuito**, salvo acceso repetido **más de una vez en seis meses** sin causa legítima o medio de coste excesivo.\n- Si los datos no se obtienen del interesado, información **a más tardar en un mes**.\n- Portabilidad: formato estructurado, de uso común y lectura mecánica.\n- Limitaciones (art. 23): seguridad del Estado, defensa, seguridad pública, etc.\n\n### Derechos digitales (Título X LOPDGDD, arts. 79-97)\n- Neutralidad, acceso universal, seguridad y educación digital, protección de menores, rectificación y actualización en medios digitales.\n- Ámbito laboral: intimidad en dispositivos (art. 87), **desconexión digital** (art. 88), videovigilancia (art. 89, **nunca en vestuarios, aseos o comedores**; sonido solo por riesgos relevantes), geolocalización (art. 90).\n- Olvido en buscadores y redes sociales, portabilidad en redes, **testamento digital** (art. 96).\n\n### Delegado de Protección de Datos (arts. 37-39 RGPD)\n- Obligatorio en organismos públicos (salvo tribunales), observación sistemática a gran escala o categorías especiales a gran escala.\n- Un grupo empresarial puede nombrar **uno solo** si es accesible. Puede ser de plantilla o externo.\n- No recibe instrucciones, no puede ser destituido por sus funciones y rinde cuentas al **más alto nivel jerárquico**.\n- Funciones: informar, supervisar, asesorar en evaluaciones de impacto, cooperar y ser punto de contacto con la autoridad de control.\n- **LO 7/2021**: datos tratados con fines penales por autoridades competentes.\n\n## 8. Protección de datos en Correos\n\n- Secreto profesional también tras finalizar la relación laboral. **Comité de Seguridad Corporativo**; Sistema de Gestión de Seguridad de la Información y de Continuidad de Negocio.\n- Puestos: **atención al cliente** (contenedores, mostrador sin papeles, conversaciones, monitor orientado), **administración** (destructora, mesa despejada, recoger impresiones, armarios con llave) y **trabajos externos** (carros, vehículos cerrados, cofre de la moto cerrado).\n\n### Medidas técnicas\n- Bloqueo del equipo: **CTRL + ALT + SUPR + ENTER**; salvapantallas con contraseña; apagar en ausencias largas.\n- Nada de software sin licencia; borrado seguro; destructoras, no contenedores de reciclaje.\n| Nivel | Datos |\n|---|---|\n| Básico | Datos de carácter personal |\n| Medio | Infracciones administrativas o penales, servicios financieros, Hacienda |\n| Alto | Ideología, religión, origen racial, vida sexual, salud, fines policiales sin consentimiento |\n\n### Contraseñas e intranet\n- Personales e intransferibles; cambio **al menos una vez al año**; mínimo **diez caracteres** con letras, números y especiales. Ataques: **fuerza bruta** y **diccionario**.\n- **Conecta** (intranet): el usuario responde de lo que difunde; Correos puede suprimir contenidos sin aviso.\n\n### Teletrabajo y decálogo\n- Tres pilares: **conexión de red, terminales y correo electrónico**. Preferir cable; si no, **WPA2/3 AES**; 3G/4G antes que wifi pública; tapar cámara; **BitLocker**; **OneDrive** para archivos confidenciales; no usar GitHub, Trello...; no copiar del escritorio virtual (VDI/VDA).\n- Decálogo: sin wifi pública, conexión segura, contraseñas robustas, actualizaciones, desconfiar de emails/SMS, no adjuntos sospechosos, pasar el ratón por los enlaces, borrar cookies, no publicar datos personales en redes.\n\n### Políticas de datos\n- **Empleados**: responsable la Sociedad Estatal (CIF A-83052407, C/ Conde de Peñalver 19, Madrid); DPD en **dpdgrupocorreos@correos.com**; derechos ante RR. HH. por correo postal o email.\n- **Clientes**: Correos es **encargado** cuando los datos del destinatario los facilita un remitente sujeto a la normativa y **responsable** si lo hace una persona no sujeta. El **remitente** garantiza veracidad y consentimiento. Datos bloqueados y eliminados **generalmente a los 5 años**. En **Paq Premium Internacional** se comunican datos a la **Cooperativa EMS**.\n\n## 9. Ejemplo: admisión de cartas certificadas\n| Modalidad | Información sobre datos / archivo |\n|---|---|\n| Unitaria en oficina | IRIS, firma en tableta, **cláusula 3**; copia impresa o por email consultable en **Mercurio** |\n| Rurales y oficinas auxiliares | Único caso del preimpreso **M11** + anexo de admisión; originales a la Oficina Técnica, **serie documental 02** |\n| Datos pregrabados online | Código web capturado en IRIS; cláusula 3 |\n| Admisión múltiple sin contrato | Formulario con información al reverso; originales a serie 02 |\n| Con contrato sin prerregistro (cartas) | Albarán **GANES** por duplicado; un original a la Administración Postal de Zona |\n| Con contrato con prerregistro | Captura de códigos; sin archivo en papel |\n\n## Claves para el examen\n- **RD 6/2019**: plan de igualdad obligatorio con **50 o más** trabajadores.\n- Distintivo de igualdad: **honorífico**, sin dotación económica; lo retira el Ministerio de Igualdad.\n- AGE: **40 %** de plazas en cursos para empleadas; preferencia de **un año** tras permisos.\n- LO 1/2004: ayuda de **6/12/18/24 meses** de subsidio; umbral **75 % SMI**; bonificación **100 %** de cuotas.\n- Correos-violencia de género: reducción de **media hora a dos tercios**; excedencia con **2 meses** íntegros.\n- Excedencia por hijo: **3 años**, reserva **2 años**; reducción por familiar grave **50 %**, máximo **1 mes**.\n- **Acoso sexual = falta muy grave**; denuncia en sobre cerrado \"Abrir solo por el Centro Directivo\".\n- Denuncia falsa: grave o muy grave (muy grave con **notoria temeridad**).\n- Intervención de envíos: solo inspección de la **CNMC**, reconocimiento externo.\n- RGPD vigor 25-5-2016, aplicación **25-5-2018**; consentimiento de menores **14 años** (LOPDGDD).\n- Contraseñas: **10 caracteres**, cambio **anual**; bloqueo CTRL+ALT+SUPR+ENTER.\n- M11 solo en rurales y oficinas auxiliares; archivo en **serie documental 02**.", "preguntas": [{"p": "Según el Real Decreto 6/2019, ¿qué empresas están obligadas a elaborar e implantar un plan de igualdad?", "o": ["Las
