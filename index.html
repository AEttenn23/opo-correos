 "La plantilla InterConnect mide 353 x 250 x 30 mm y el envío debe pesar menos de un kilo.", "pag": 759}, {"p": "Respecto a las funciones del jefe de la unidad de reparto, señale la afirmación INCORRECTA:", "o": ["Las tareas de control son delegables", "Debe mantener actualizada la documentación de la unidad", "Puede delegar las tareas de planificación y dirección", "Debe procurar que la unidad tenga equipo básico"], "c": 2, "e": "Solo son delegables las funciones de control; planificación y dirección recaen exclusivamente en el jefe.", "pag": 761}, {"p": "¿Qué capacidad máxima de carga, incluido el agente de reparto, tiene el nuevo vehículo de reparto motorizado?", "o": ["150 kg", "180 kg", "250 kg", "200 kg"], "c": 3, "e": "Su capacidad máxima de carga, incluyendo al agente, es de 200 kg.", "pag": 768}, {"p": "En las valijas para servicios rurales, ¿qué color de precinto se utiliza cuando la valija se envía desde el SS. RR. al centro de reparto u oficina de la que depende?", "o": ["Verde", "Azul", "Amarillo", "Rojo"], "c": 0, "e": "Verde para envíos desde los SS. RR. al centro y azul desde el centro al SS. RR.", "pag": 769}, {"p": "¿Cuál es la capacidad máxima de carga de la transpaleta manual utilizada en las unidades de reparto?", "o": ["1500 kg", "2200 kg", "2500 kg", "1800 kg"], "c": 1, "e": "La transpaleta manual cuenta con una capacidad máxima de carga de 2200 kg.", "pag": 771}, {"p": "En un centro de reparto con 15 secciones, ¿cómo se organiza la descarga?", "o": ["La realiza todo el personal de la unidad", "Turno específico de 15 a 30 minutos antes de la entrada", "Turno específico 15 minutos antes de la entrada del resto", "Turno específico 30 minutos antes de la entrada"], "c": 2, "e": "En centros de 9 a 22 secciones existe un turno específico de descarga 15 minutos antes de la entrada del resto.", "pag": 778}, {"p": "El código de barras de las etiquetas de los palés de Amazon comienza por \"Gaylord\" o \"Pallet\" seguido de:", "o": ["13 dígitos", "23 dígitos", "10 dígitos", "16 dígitos"], "c": 3, "e": "El código comienza por Gaylord o Pallet seguido de 16 dígitos.", "pag": 779}, {"p": "Un envío estacionado depositado en el archivo físico asignado en SGIE permanece en espera de información un máximo de:", "o": ["5 días (120 horas)", "3 días (72 horas)", "7 días naturales", "10 días naturales"], "c": 0, "e": "Permanece un máximo de cinco días (120 horas) en espera de recibir información.", "pag": 781}, {"p": "Con el servicio Correos Modify, el destinatario puede modificar la dirección postal de entrega:", "o": ["A cualquier punto del territorio nacional", "Dentro de la misma provincia", "Dentro de la misma localidad únicamente", "Solo a una oficina de la misma localidad"], "c": 1, "e": "Permite modificar la dirección postal de entrega dentro de la misma provincia.", "pag": 781}, {"p": "¿Cuál es la cantidad máxima en metálico que puede contener el sobre de un giro para pago a domicilio?", "o": ["299,99 €", "999,99 €", "499,99 €", "2.499,99 €"], "c": 2, "e": "La cantidad máxima en metálico para pago en domicilio es de 499,99 €.", "pag": 783}, {"p": "Las agrupaciones de varios giros para un mismo destinatario se identifican porque su código termina en:", "o": ["SED", "GRP", "AGM", "AGR"], "c": 3, "e": "Las agrupaciones se identifican porque su código termina en AGR.", "pag": 783}, {"p": "Cuando se levanta acta por expolio de valores declarados:", "o": ["Debe imprimirse, firmarla dos empleados y archivarse un año", "Basta con generarla en SGIE sin imprimir", "Se imprime y la firma solo el jefe de unidad, archivándose seis meses", "Se remite por escrito a la unidad supervisora sin archivo"], "c": 0, "e": "Es la única excepción: se imprime, la firman dos empleados y se archiva durante un año en la unidad.", "pag": 784}, {"p": "Para el recuento estadístico, ¿cuál es el nivel de llenado de referencia de las bandejas tipo A y tipo B?", "o": ["A 300 y B 100 envíos", "A 340 y B 80 envíos", "A 250 y B 80 envíos", "A 340 y B 120 envíos"], "c": 1, "e": "El nivel de llenado es tipo A 340 envíos y tipo B 80 envíos.", "pag": 784}, {"p": "El volcado diario de información en SIE en el turno de mañana debe realizarse antes de las:", "o": ["10 horas", "12 horas", "11 horas", "13 horas"], "c": 2, "e": "Debe hacerse antes de las 11 horas en turno de mañana o de las 18 horas en turno de tarde.", "pag": 785}, {"p": "Si fuese necesario priorizar la entrega de envíos ordinarios, ¿cuál va en primer lugar?", "o": ["Carta básica con fecha", "Paq Ligero", "Impresos con compromiso de entrega", "Avisos de llegada de notificaciones"], "c": 3, "e": "El orden empieza por los avisos de llegada de notificaciones, seguidos de carta básica con fecha.", "pag": 786}, {"p": "Si hay envíos sujetos a reenvío postal para otra unidad y su número es superior a cinco, se deben:", "o": ["Introducir en un sobre colector, si dimensiones y modalidad lo permiten", "Etiquetar individualmente siempre", "Entregar en mano al cartero de la sección", "Devolver a la oficina de origen"], "c": 0, "e": "Con cinco o menos se etiquetan individualmente; con más de cinco se introducen en sobre colector si es posible.", "pag": 793}, {"p": "Los envíos internacionales LY y LZ tienen un peso máximo de:", "o": ["1 kg", "2 kg", "3 kg", "500 g"], "c": 1, "e": "Su peso máximo es de 2 kg y se entregan sin firma salvo importes aduaneros.", "pag": 796}, {"p": "En la PDA, la notificación en segundo intento que obligatoriamente debe intentarse ese día aparece:", "o": ["Con fondo blanco (D+2)", "Con fondo verde (D+3)", "Con fondo rojo (D+3)", "Con fondo gris (D+1)"], "c": 2, "e": "La notificación que obligatoriamente debe intentarse ese día se identifica con fondo rojo (D+3).", "pag": 798}, {"p": "¿A quién se puede entregar un envío de giro en el domicilio si el destinatario no está?", "o": ["A cualquier persona mayor de 14 años", "A cualquier persona que se identifique", "A un vecino autorizado verbalmente", "A una persona que resida en el domicilio y sea mayor de edad"], "c": 3, "e": "Los registrados pueden entregarse a mayores de 14 años, pero para Western Union o Giro debe ser mayor de edad.", "pag": 804}, {"p": "¿Cuál es el importe máximo a cobrar en un envío contra reembolso, con carácter general?", "o": ["2.499,99 €", "499,99 €", "2.999,99 €", "1.999,99 €"], "c": 0, "e": "El importe a cobrar será como máximo de 2.499,99 €, salvo devolución por giro ordinario a domicilio (499,99 €).", "pag": 812}, {"p": "En las notificaciones administrativas reguladas por la Ley 39/2015, la diferencia horaria mínima entre intentos es de:", "o": ["Una hora", "Tres horas", "Dos horas", "Seis horas"], "c": 1, "e": "La diferencia mínima horaria entre intentos es de tres horas, uno antes de las 15:00 y otro después o viceversa.", "pag": 813}, {"p": "Las notificaciones judiciales o no reguladas por la Ley 39/2015 se identifican con códigos de barras que empiezan por:", "o": ["NA, NE o ND", "NT, NV o N3", "NC, NF o NJ", "90, NA o NE"], "c": 2, "e": "Las judiciales se identifican con NC, NF o NJ; las administrativas con NA, NE, ND, NT, NV, N3, 90.", "pag": 813}, {"p": "Las notificaciones de la Agencia Tributaria (código 90) con resultado \"Desconocido\" en el primer intento:", "o": ["Pasan a lista siete días", "Se depositan en buzón", "Tienen segundo intento en turno de tarde", "Se devuelven sin segundo intento"], "c": 3, "e": "Se procede a su devolución sin que haya segundo intento de entrega.", "pag": 815}, {"p": "Según los plazos estandarizados del cuadro de mando de notificaciones, desde la admisión hasta el primer intento de entrega hay:", "o": ["Seis días naturales", "Tres días hábiles", "Diez días naturales", "Cinco días hábiles"], "c": 0, "e": "El plazo es de seis días naturales desde la admisión hasta el primer intento.", "pag": 819}, {"p": "¿Qué aplicación informática se utiliza para el control y gestión de las rutas de recogida de buzones?", "o": ["Hera", "Marabú II", "Talos", "Tauro"], "c": 1, "e": "Marabú II es la aplicación para el control y gestión de las rutas de recogida de buzones.", "pag": 824}, {"p": "Tras depositar un envío en Citypaq, el destinatario recibe un SMS informando de un plazo de retirada de:", "o": ["3 días", "7 días", "5 días", "15 días"], "c": 2, "e": "El destinatario recibirá un SMS informando del plazo de 5 días para su retirada.", "pag": 854}, {"p": "En la gestión de estacionados, un cliente remitente SIN contrato:", "o": ["Puede devolver o destruir el envío", "Puede cambiar la modalidad de entrega", "Puede modificar el documento de identificación", "Solo puede modificar o aclarar datos de la dirección de destino"], "c": 3, "e": "Los clientes sin contrato solo podrán modificar o aclarar datos de la dirección de destino.", "pag": 857}, {"p": "¿Durante cuánto tiempo se conserva la documentación electoral (serie 600) en el archivo de la unidad?", "o": ["Cinco años", "Cuatro años", "18 meses", "Seis meses"], "c": 0, "e": "La serie 600 (documentación electoral) tiene un plazo de cinco años.", "pag": 871}, {"p": "¿Cuál es el recorrido máximo diario de un enlace rural en motocicleta (MO)?", "o": ["30 km", "35 km", "15 km", "200 km"], "c": 1, "e": "El recorrido máximo es de 35 km para enlaces en motocicleta (30 ciclomotor, 15 a pie, 200 automóvil).", "pag": 873}, {"p": "¿Qué norma hace una clara distinción entre los conceptos de distribución y entrega?", "o": ["Ley 43/2010", "RD 1829/1999", "Ley 39/2015", "RD 503/2007"], "c": 0, "e": "Aunque a veces se usan como sinónimos, la Ley 43/2010 distingue claramente ambos conceptos.", "pag": 758}, {"p": "Las URO que distribuyen todo tipo de productos por no existir USE/URP en la localidad se denominan:", "o": ["Unidades de Reparto (UR)", "Unidades de Distribución (UD)", "Unidades de Servicios Rurales (USR)", "Centros de Distribución Postal (CDP)"], "c": 1, "e": "Se denominan Unidades de Distribución (UD) y de ellas pueden depender servicios rurales.", "pag": 759}, {"p": "¿Cuál de los siguientes es un objetivo del modelo de gestión de la URO?", "o": ["Repartir cada área al menos tres días por semana", "Clasificar manualmente toda la correspondencia", "Conseguir cero stocks en todas las fases del proceso", "Concentrar el reparto en un único turno semanal"], "c": 2, "e": "Entre sus objetivos está conseguir cero stocks en todas las fases del proceso de distribución.", "pag": 759}, {"p": "En la URO, la zona de control de productos registrados-puestos SGIE se sitúa:", "o": ["Junto a la zona de descarga de contenedores", "Cerca de la salida, junto a la zona de devolución", "En la entrada, junto a la zona de consolidación", "Alejada del tránsito de cargas, junto al puesto del responsable"], "c": 3, "e": "Se sitúa en una zona alejada del tránsito habitual de las cargas, por regla general junto al puesto del responsable.", "pag": 761}, {"p": "¿Qué sistema proporciona el esquema de división de recargos ante la ausencia del personal de reparto habitual?", "o": ["Margarita", "Marabú II", "Minerva", "Talos"], "c": 0, "e": "El sistema Margarita proporciona el esquema de distribución de tareas en caso de ausencia del personal habitual.", "pag": 762}, {"p": "Señale la afirmación INCORRECTA sobre las USE/URP:", "o": ["Su zona de influencia se estructura en sectores", "De ellas dependen servicios rurales de su zona", "Su zona de influencia abarca varios códigos postales", "Establecen tantas salidas diarias como sean necesarias"], "c": 1, "e": "El texto indica expresamente que de las USE/URP no dependen servicios rurales.", "pag": 763}, {"p": "¿A qué velocidad está limitado el nuevo vehículo de reparto motorizado?", "o": ["15 km/h", "25 km/h", "20 km/h", "30 km/h"], "c": 2, "e": "Su velocidad está limitada a 20 km/h, aunque puede alcanzar los 25 km/h.", "pag": 768}, {"p": "En el bolsillo transparente de la parte superior de la bolsa de alcance debe indicarse:", "o": ["Los datos del repartidor, su sección y turno", "La fecha y hora de preparación de la bolsa", "El código postal de la sección de reparto", "El número de buzón de alcance al que va destinada"], "c": 3, "e": "En el bolsillo superior se indica el número de buzón de alcance; en el lateral, los datos del repartidor, sección y turno.", "pag": 769}, {"p": "En las valijas de clientes con contrato, ¿qué color de precinto se usa para las valijas enviadas desde las sucursales a la central?", "o": ["Rojo", "Amarillo", "Verde", "Azul"], "c": 0, "e": "Los precintos amarillos son de la central a las delegaciones y los rojos de las sucursales a la central.", "pag": 770}, {"p": "¿Cuántas bolsas de alcance permiten alojar los buzones de depósito o de ayuda en ruta?", "o": ["Hasta tres", "Hasta dos", "Solo una", "Hasta cuatro"], "c": 1, "e": "Los buzones de depósito o alcance permiten alojar hasta dos bolsas de alcance.", "pag": 770}, {"p": "Configurado con cuatro baldas, el carro expositor de bandejas admite:", "o": ["12 bandejas de tipo A", "6 bandejas de tipo C", "16 bandejas de tipo A", "20 bandejas de tipo B"], "c": 2, "e": "Con cuatro baldas admite 16 bandejas tipo A; con tres, 12 de tipo A o B o seis de tipo C.", "pag": 771}, {"p": "Para que el apilador manual sea útil, la unidad debe recibir a diario como mínimo:", "o": ["Dos carros transportadores", "Cinco carros transportadores", "Un palé completo", "Tres carros transportadores"], "c": 3, "e": "Una de las circunstancias es que la unidad reciba a diario tres carros transportadores como mínimo.", "pag": 771}, {"p": "El casillero CNN-50 (5x5), usado para correspondencia no normalizada, cuenta con:", "o": ["25 casillas", "35 casillas", "15 casillas", "40 casillas"], "c": 0, "e": "El CNN-50 (5x5) cuenta con 25 casillas de 30 x 25 cm.", "pag": 772}, {"p": "¿Qué casillero se utiliza para la clasificación de avisos de recibo?", "o": ["CP8, de 10 baldas", "CD-14, de 40 casillas", "CN-50, de 35 casillas", "CNN-50, de 25 casillas"], "c": 1, "e": "El casillero de avisos de recibo CD-14 está formado por 40 casillas.", "pag": 773}, {"p": "Como norma general, el mobiliario postal se suministra a las unidades de distribución:", "o": ["Desde los almacenes provinciales", "Desde los almacenes zonales", "Directamente desde el proveedor", "Desde el centro de tratamiento"], "c": 2, "e": "El equipamiento postal llega desde los almacenes provinciales o zonales; el mobiliario, directamente desde el proveedor.", "pag": 775}, {"p": "Respecto a los cascos de moto, el Plan Limbo contempla:", "o": ["Su higienización y reparación", "Solo su higienización", "Su reparación en dotaciones informáticas", "Solo su destrucción"], "c": 3, "e": "El Plan Limbo solo contempla su destrucción, porque sus almohadillas interiores son un EPI personal.", "pag": 775}, {"p": "Los EPI del personal eventual que se envían a higienizar van acompañados del registro:", "o": ["PR0013-I003-R01", "I.RI.2010", "PR0010-I001-R03", "GI03"], "c": 0, "e": "Irá acompañado del registro de higienización de EPI PR0013-I003-R01.", "pag": 776}, {"p": "En los centros con más de 22 secciones, el turno específico de descarga se realiza:", "o": ["15 minutos antes de la entrada", "De 15 a 30 minutos antes de la entrada", "45 minutos antes de la entrada", "Una hora antes de la entrada"], "c": 1, "e": "En centros con más de 22 secciones existe un turno de descarga de 15 a 30 minutos antes de la entrada.", "pag": 778}, {"p": "El encargado de la recepción firma y comprueba la hora de llegada de la ruta en el documento:", "o": ["SICER", "ARDI", "VAYA", "DTA"], "c": 2, "e": "El encargado firma y comprueba la hora de llegada en el VAYA que le entrega el conductor.", "pag": 778}, {"p": "La trazabilidad de los palés de Amazon leídos en SGIE se puede consultar en:", "o": ["Marabú II", "IRIS", "Tauro", "Minerva"], "c": 3, "e": "La trazabilidad de los palés se puede ver en Minerva.", "pag": 779}, {"p": "En la estructura del código del giro EDnnnnnnnnSXX, la letra S identifica:", "o": ["El tipo de admisión (V = ventanilla)", "El tipo de giro (OR = ordinario)", "El identificador fijo del producto", "El dígito de control del envío"], "c": 0, "e": "S es la letra que identifica el tipo de admisión: V = ventanilla.", "pag": 783}, {"p": "Si al generar un acta en SGIE se elige la opción \"Guardar y confirmar\":", "o": ["Puede eliminarse en las 24 horas siguientes", "No se puede modificar posteriormente", "Queda como borrador modificable", "Debe imprimirse y firmarse por dos empleados"], "c": 1, "e": "Con borrador se puede modificar o eliminar después; con \"Guardar y confirmar\" no se puede modificar.", "pag": 784}, {"p": "Señale qué bandejas NO pueden completarse con módulos SIE en el recuento estadístico:", "o": ["Las bandejas tipo A de carta normalizada", "Las bandejas tipo B de carta no normalizada", "Las que contienen envíos clasificados a sección por el CTA", "Las que no están llenas al llegar a la unidad"], "c": 2, "e": "No pueden completarse las que contengan envíos clasificados a sección por el CTA ni las de correspondencia local o provincial.", "pag": 785}, {"p": "Los repartidores clasifican el correo normalizado en la mesa casillero en unidades de hasta:", "o": ["14 secciones", "20 secciones", "30 secciones", "24 secciones"], "c": 3, "e": "Se clasifica en la mesa casillero en unidades de hasta 24 secciones, o en CN50 en unidades de 25 o más.", "pag": 786}, {"p": "¿Qué porcentaje aproximado del correo llega leído en los CTA y directamente a secciones de reparto?", "o": ["95 %", "75 %", "85 %", "99 %"], "c": 0, "e": "Prácticamente el 95 % del correo llega leído en los CTA y directamente a secciones.", "pag": 787}, {"p": "Si hubiese que priorizar la entrega de envíos registrados, ¿cuál va en primer lugar?", "o": ["Paq Premium", "Valija", "Registrados con fecha", "Valores declarados"], "c": 1, "e": "El orden de prioridad de registrados empieza por la valija.", "pag": 789}, {"p": "La recogida de información de campañas PRI se lleva a cabo mediante la aplicación integrada en la PDA llamada:", "o": ["Hera", "Tauro", "ARDI", "SICER"], "c": 2, "e": "Se realiza a través de ARDI (Aplicación de Recogida de Información), integrada en la PDA.", "pag": 789}, {"p": "Si un código postal erróneo afecta a un importante número de envíos mal encaminados:", "o": ["Se tacha y corrige el código en cada envío", "Se devuelven todos al remitente", "Se pasan a lista en la oficina de referencia", "Se introducen en bandejas directas sin corregir cada envío"], "c": 3, "e": "Se introducen en bandejas directas al destino correcto sin corregir cada envío, comunicándolo a la unidad admisoria.", "pag": 790}, {"p": "Una notificación administrativa sin etiqueta preimpresa recibe una etiqueta cuyo código de barras empieza por:", "o": ["NA", "NC", "CD", "ND"], "c": 0, "e": "Se le adhiere una etiqueta con código de barras que empiece por NA.", "pag": 791}, {"p": "En el preembarriado, ¿cuál es el criterio general de embarriado de la mesa casillero?", "o": ["Por orden de recorrido de la sección", "Por orden alfabético de calles", "Por nombre de empresa", "Por número de portal de mayor a menor"], "c": 1, "e": "El criterio general es por orden alfabético de calles.", "pag": 792}, {"p": "Si un envío ordinario es demasiado voluminoso para depositarlo en el buzón, se deja en la unidad y se confecciona un aviso de llegada modelo:", "o": ["M4", "M4C", "M4-O", "M4E"], "c": 2, "e": "Se confecciona un aviso de llegada del modelo de oficinas (M4-O) que se deposita en el casillero.", "pag": 794}, {"p": "Sobre el depósito de paquetería no voluminosa en el buzón de alcance, señale la afirmación INCORRECTA:", "o": ["No deben incluirse envíos de telefonía", "Es una opción alternativa cuando faltan medios", "Debe ser supervisada por el responsable", "Es una decisión que toma el repartidor de forma individual"], "c": 3, "e": "No es una decisión individual del repartidor, sino que debe ser supervisada por el responsable.", "pag": 795}, {"p": "Tras iniciar sesión en la PDA, ¿qué aplicación se pulsa en la pantalla principal para asignar los envíos?", "o": ["Talos", "Tauro", "Hera", "MILLA"], "c": 0, "e": "Una vez iniciada la sesión, en la pantalla principal se pulsa en Talos.", "pag": 796}, {"p": "La aplicación integrada en Talos que permite ordenar el reparto con criterios geográficos es:", "o": ["Minerva", "Tauro", "Margarita", "ARDI"], "c": 1, "e": "Puede utilizarse la aplicación Tauro, integrada en Talos, que ordena el reparto con criterios geográficos.", "pag": 797}, {"p": "Los envíos con \"Devolución por orden del remitente\" se reetiquetan con las etiquetas:", "o": ["LI/L3", "CN15/CN29", "DX/DQ", "PK/PQ"], "c": 2, "e": "Se sacan las etiquetas DX/DQ a través de SGIE>>Entrada>>Reetiquetar envíos.", "pag": 797}, {"p": "Los envíos registrados que se queden sin repartir por falta de capacidad deben darse de alta en SGIE antes de las:", "o": ["9:00", "13:00", "15:00", "11:00"], "c": 3, "e": "El alta debe realizarse antes de las 11:00, antes de la consolidación de los datos de SIE.", "pag": 798}, {"p": "¿Cuál de los siguientes elementos NO figura entre los que se recogen bajo firma antes del reparto?", "o": ["La PDA", "Las llaves del buzón 1", "La tarjeta de combustible", "El título de transporte"], "c": 0, "e": "La PDA figura entre los útiles normales; bajo firma se recogen llaves, tarjeta de combustible y título de transporte.", "pag": 799}, {"p": "Se consideran entornos especiales las viviendas aisladas situadas a más de:", "o": ["100 m de la vía pública", "250 m de la vía pública", "500 m de la vía pública", "1 km de la vía pública"], "c": 1, "e": "Son entornos especiales las viviendas aisladas o diseminadas situadas a más de 250 m de la vía pública.", "pag": 801}, {"p": "En entornos de nueva construcción sin datos suficientes, el sistema de reparto provisional se establece durante:", "o": ["Seis meses", "Un año", "Dos años", "Tres años"], "c": 2, "e": "Provisionalmente, durante un plazo de dos años, se establecerá un sistema de reparto similar.", "pag": 802}, {"p": "¿Con qué periodicidad informa Correos a la CNMC de los entornos especiales?", "o": ["Mensualmente", "Semestralmente", "Anualmente", "Trimestralmente"], "c": 3, "e": "De estos entornos especiales Correos informa trimestralmente a la CNMC.", "pag": 802}, {"p": "Una carta dirigida a una persona fallecida:", "o": ["Se deposita en la oficina y se consulta al remitente", "Se entrega directamente a los herederos", "Se destruye sin más trámite", "Se deposita en el buzón domiciliario"], "c": 0, "e": "Si es carta, se deposita en la oficina y se consulta al remitente si se le devuelve o se entrega a los herederos.", "pag": 803}, {"p": "¿Qué productos de paquetería NO se entregan bajo firma?", "o": ["Paq Estándar y Paq Premium", "Paq Ligero y Paq Light Internacional", "Paquete Azul y EMS", "Paq Today y Paq Premium"], "c": 1, "e": "Se exceptúan de la entrega bajo firma el Paq Light Internacional y el Paq Ligero.", "pag": 803}, {"p": "En la entrega a sociedades civiles privadas o comunidades de vecinos, en lugar del sello de empresa se indica:", "o": ["\"Sin representante\"", "\"Entrega provisional\"", "\"Carece de Sello\"", "\"Persona jurídica\""], "c": 2, "e": "En estos casos no es necesario recoger el sello y se debe indicar \"Carece de Sello\".", "pag": 805}, {"p": "El aviso de llegada específico para envíos con documentación electoral para el voto por correo es el:", "o": ["M4O", "M4C", "M4", "M4E"], "c": 3, "e": "M4E es el aviso de llegada específico para documentación electoral del voto por correo.", "pag": 806}, {"p": "En inmuebles en propiedad horizontal, el casillero reservado para la devolución de envíos lleva el número:", "o": ["1, con la inscripción \"Correos\"", "0, con la inscripción \"Devoluciones\"", "2, con la inscripción \"Correos\"", "El último, con la inscripción \"Retorno\""], "c": 0, "e": "Hay un casillero más identificado con el número 1 y la inscripción \"Correos\"; los domiciliarios se numeran a partir del 2.", "pag": 809}, {"p": "Si un envío con entrega exclusiva al destinatario no puede entregarse por no cumplir los requisitos, se devuelve como:", "o": ["\"Rehusado\"", "\"Desconocido\"", "\"Dirección incorrecta\"", "\"Ausente\""], "c": 1, "e": "Si no se cumplen las condiciones, se devuelve el envío como \"Desconocido\".", "pag": 811}, {"p": "En la entrega de giros, el destinatario debe firmar el impreso de libranza SEDI denominado:", "o": ["M4", "CN15", "GI03", "TFP3"], "c": 2, "e": "El destinatario debe firmar el impreso de libranza SEDI (GI03) incluido en el sobre.", "pag": 812}, {"p": "La notificación ND (sin lista y depósito en buzón), si el segundo intento resulta fallido:", "o": ["Pasa a lista durante siete días naturales", "Tiene un tercer intento en turno de tarde", "Se devuelve directamente al remitente", "Se deposita en el buzón domiciliario separando el aviso de recibo"], "c": 3, "e": "La ND no pasa a lista: se deposita en el buzón tras el segundo intento fallido, separando el aviso de recibo.", "pag": 815}, {"p": "¿Qué porcentaje de su jornada pasa en la calle el repartidor del turno de tarde de notificaciones?", "o": ["99 %", "75 %", "90 %", "85 %"], "c": 0, "e": "El repartidor de tarde no embarria, por lo que el 99 % de su jornada laboral es en la calle.", "pag": 816}, {"p": "Cuando la validación del plazo entre intentos en la PDA es de tipo restrictivo:", "o": ["Solo informa del incumplimiento y permite continuar", "No permite el segundo intento si no se cumplen las condiciones legales", "Permite el intento únicamente con autorización del jefe", "Pasa automáticamente el envío a lista"], "c": 1, "e": "En la restrictiva, si no se cumplen las condiciones, la PDA emite un mensaje y no permite realizar el segundo intento.", "pag": 817}, {"p": "Para el control del primer intento con volumen medio, cada sección del casillero \"Cumplimiento plazos\" tiene:", "o": ["Cinco separaciones (lunes a viernes)", "Siete separaciones (lunes a domingo)", "Seis separaciones (lunes a viernes más \"críticos\")", "Tres separaciones (Día 1, Día 2, Día 3)"], "c": 2, "e": "Cada sección cuenta con seis separaciones, una por día de lunes a viernes más el separador de críticos.", "pag": 819}, {"p": "La entrega con recogida (Paq Retorno Premium) está disponible para:", "o": ["Paq Ligero, Paq Estándar y Paq Today", "Paquete Azul, Paq Premium y EMS", "Paq Light Internacional y Paq Ligero", "Paq Estándar, Paq Premium y Paq Today"], "c": 3, "e": "Está disponible para Paq Estándar, Paq Premium y Paq Today.", "pag": 822}, {"p": "En una expedición con entrega completa que tenga importes asociados:", "o": ["No puede entregarse parcialmente", "Puede entregarse parcialmente con autorización", "Se entrega bulto a bulto con firmas distintas", "Se liquida con causas diferentes por envío"], "c": 0, "e": "El cliente puede autorizar entrega parcial, pero si la expedición tiene importes asociados no podrá entregarse parcialmente.", "pag": 824}, {"p": "En la recogida con Marabú II, ¿qué código lee primero el conductor?", "o": ["El código de la ruta", "El código de operario", "El código de inicio de ruta", "El código interior del primer buzón"], "c": 1, "e": "El orden de lectura es: código de operario, código de la ruta y código de inicio de ruta.", "pag": 825}, {"p": "La aplicación Hera, que permite la admisión de envíos prerregistrados durante el reparto, se implantó en las elecciones autonómicas de 2020 de:", "o": ["Cataluña y Andalucía", "Madrid y Castilla y León", "País Vasco y Galicia", "Galicia y Asturias"], "c": 2, "e": "Hera se implantó en las elecciones autonómicas del País Vasco y Galicia de 2020.", "pag": 827}, {"p": "En la pantalla de liquidación de SGIE, ¿qué color indica una sección sin liquidar?", "o": ["Rojo", "Azul", "Morado", "Verde"], "c": 3, "e": "Verde: sin liquidar; rojo: liquidada; azul: relaciones provisionales; morado: pendientes de confirmar.", "pag": 835}, {"p": "Entre las incidencias que impiden el cierre definitivo de la unidad figuran los envíos de alta en la unidad durante más de:", "o": ["72 horas", "24 horas", "48 horas", "120 horas"], "c": 0, "e": "Una de las incidencias más frecuentes es tener envíos de alta en la unidad más de 72 horas.", "pag": 839}, {"p": "El responsable de la unidad informa al responsable del turno de tarde de las incidencias mediante el impreso:", "o": ["PR0013-I003-R01", "I.RI.2010", "GI03", "M4-O"], "c": 1, "e": "Con el impreso de incidencias de turno (I.RI.2010) el responsable informa al turno de tarde.", "pag": 840}, {"p": "¿Cuál es el número máximo de mensajes del buzón electrónico de SGIE que pueden imprimirse de una vez?", "o": ["10", "25", "20", "50"], "c": 2, "e": "El número máximo de mensajes que se pueden imprimir de una vez y que salen en una misma pantalla son 20.", "pag": 841}, {"p": "Desde \"Entrada>>Impresión de avisos\" de SGIE se imprimen avisos M4-O para los libros con un peso superior a:", "o": ["800 g", "1 kg", "300 g", "500 g"], "c": 3, "e": "Se imprimen para libros de más de 500 g y publicaciones periódicas de más de 800 g.", "pag": 843}, {"p": "Los envíos con importes admitidos por UAM siempre tienen un código de:", "o": ["23 dígitos", "13 dígitos", "16 dígitos", "20 dígitos"], "c": 0, "e": "Siempre tendrán un código de 23 dígitos con el que se graban los distintos procesos.", "pag": 844}, {"p": "En el Reenvío Postal, el testigo de control es:", "o": ["Una cartulina naranja plastificada de 33 x 16 cm", "Una etiqueta naranja adhesiva y redonda \"R\" de 15 mm", "Una etiqueta azul adhesiva \"RP\" de 20 mm", "Una cartulina blanca con bolsa de 26 x 13 cm"], "c": 1, "e": "El testigo de control es una etiqueta naranja, adhesiva y redonda \"R\" de 15 mm de diámetro.", "pag": 846}, {"p": "En los reenvíos definitivos, el servicio se sigue prestando a envíos que lleguen tras la fecha contratada salvo que se supere esta en más de:", "o": ["7 días naturales", "30 días naturales", "15 días naturales", "10 días hábiles"], "c": 2, "e": "Se sigue prestando el servicio salvo que se supere en más de 15 días naturales la fecha final contratada.", "pag": 848}, {"p": "En el número secuencial del sobre colector del Buzón de Vacaciones, de los tres últimos dígitos, el primero es un 1 si la unidad es:", "o": ["Una URO", "Una oficina de referencia", "Un servicio rural", "Una USE/URP"], "c": 3, "e": "El primero de los tres últimos dígitos es 0 si la unidad es una URO o 1 si es una USE/URP.", "pag": 848}, {"p": "Los envíos Citypaq PW y PM corresponden a:", "o": ["Paq Premium con entrega en Citypaq en 48 horas", "Paq Estándar con entrega en Citypaq en 72 horas", "Paq Ligero con entrega en Citypaq en 48 horas", "Paq Today con entrega en Citypaq en 24 horas"], "c": 0, "e": "PW y PM son Paq Premium con entrega en Citypaq (48 horas); PO y PY, Paq Estándar (72 horas).", "pag": 852}, {"p": "En el servicio de Valijas, la modalidad \"bitoque\" consiste en:", "o": ["Entrega y recogida simultánea", "Entrega a primera hora y recogida a última hora", "Entrega y recogida con firma del cliente", "Dos entregas diarias sin recogida"], "c": 1, "e": "Unitoque es entrega y recogida simultánea; bitoque, entrega a primera hora y recogida a última, ambas sin firma.", "pag": 856}, {"p": "En envíos con EED y PEE, si el DOI introducido en la PDA no coincide con el del prerregistro tras los intentos permitidos, ¿cuántos intentos permite el sistema antes de bloquear la entrega?", "o": ["Dos", "Cinco", "Tres", "Uno"], "c": 2, "e": "Si no coincide en los tres intentos que permite el sistema, la entrega se bloquea y pasa a pendiente de estacionar.", "pag": 858}, {"p": "Al confirmar la devolución de un envío estacionado, SGIE genera un nuevo envío de devolución:", "o": ["Con los mismos valores añadidos del envío de ida", "Con el mismo código de producto que el de ida", "Con el mismo código postal de destino", "Sin los valores añadidos que tuviera el envío de ida"], "c": 3, "e": "Se genera un nuevo envío de devolución sin los valores añadidos que pudiera tener el envío de ida.", "pag": 862}, {"p": "¿En qué aplicación de la PDA registra el repartidor el kilometraje de inicio y fin de trayecto?", "o": ["MILLA", "FLOTA", "Talos", "Hera"], "c": 0, "e": "Cada repartidor registrará el kilometraje en la aplicación MILLA de la PDA.", "pag": 865}, {"p": "¿Durante cuánto tiempo se conservan las hojas de firmas de asistencia (serie 700)?", "o": ["Cinco años", "Cuatro años", "18 meses", "Seis meses"], "c": 1, "e": "La serie 700 (hojas de firmas de asistencia) tiene un plazo de cuatro años.", "pag": 871}]}, {"letra": "J", "titulo": "Procesos operativos de distribución y entrega (II). Procedimientos en oficinas", "paginas": "875-940", "resumen": "## 12. Cuestiones generales de la entrega en oficina\n\n### Qué se entrega en oficina\n- **Envíos sin entrega domiciliaria**: libros de **más de 500 g**, publicaciones periódicas de **más de 800 g**, ordinarios voluminosos sin entrega domiciliaria, paquetería con entrega en **oficina elegida** u **oficina de referencia**, envíos de dinero internacionales sujetos a **PBC** y giros inmediatos nacionales.\n- Correspondencia **avisada** por las URO o USE/URP.\n- Envíos a **apartados** y a **Lista** con oficina especificada.\n\n### Procedencia de los envíos\n| Origen | Características |\n|---|---|\n| URO y USE/URP | Correspondencia avisada por conducción o directa (local compartido). Los envíos con importes (bajo valor con IVA, tasas aduaneras, reembolsos) llegan diferenciados |\n| Centro de tratamiento (CTA, área UPR) | Paquetes que recoge el destinatario; aviso impreso o **SMS** |\n| Buzón electrónico de SGIE | Productos telegráficos para imprimir; las **oficinas mixtas** reciben además Burofax, telegramas y avisos de servicio (**AA**) para reparto |\n| Correos Express | **Paq 24** con oficina elegida; atención **prioritaria** al empleado de CEX, firma en su dispositivo y alta en SGIE en canal **Lista** |\n\n## 13. Envíos ordinarios: recepción, almacenamiento y entrega\n- Llegan **sin despacho**. Los **urgentes no registrados** se respaldan con el **sello de fechas** del día de entrada.\n- Las **cartas ordinarias urgentes** llevan código grabado en IRIS: su entrega se registra en **SGIE**.\n\n### Almacenes de ordinarios\n| Almacén | Contenido | Orden | Entrega |\n|---|---|---|---|\n| **Avisados** | Envíos con aviso **M4** dejado en buzón; respaldados uno a uno (motivo, fecha, NIP y firma del cartero) | Sección y fecha de aviso | Aviso + identificación, **sin firma**; M4 se destruye de forma controlada |\n| **No domiciliaria** | Libros >500 g y publicaciones >800 g; aviso **M4-O** desde SGIE>>Entrada>>Impresión de Avisos | Número de control de SGIE; etiqueta **ORD** + mes + día + nº correlativo de 3 dígitos | Aviso + identificación, sin firma |\n| **Lista** | Personas sin residencia fija; si hay varias oficinas y no se especifica, va a la **principal** | **Semanas** y orden **alfabético** | Identificación (DNI, tarjeta de residencia, pasaporte o carnet de conducir), sin firma |\n| **Apartados** | Envíos con número de apartado | Casilleros (particulares, franqueo en destino, 24/7) | El cliente abre el casillero |\n| **No embuzonables** | Ordinarios que no caben en el buzón | Número de control SGIE (etiqueta de hueco) | Aviso + identificación; el aviso va a \"Papelote\" |\n\n### Apartados (ordinarios)\n- El titular puede pedir **por escrito** que los ordinarios con dirección de domicilio se depositen en su apartado; llegan separados por número, **en legajos** y con el número en el primer envío. Si no, se devuelven a la unidad de reparto. Copia de la autorización en la oficina.\n- Si no caben en el casillero se deja un **testigo** (aviso de plástico) y se entregan en mano.\n- **Franqueo en destino**: sin casillero; contenedores por número de apartado. Al retirar se hace el albarán **FD1** en IRIS>>Admisión>>Albaranes>>Albarán manual.\n  - Sin contrato: cobro con periodicidad variable según volumen.\n  - Con contrato: albarán admitido en IRIS con nº cliente y contrato; facturación **mensual**.\n- Cartas urgentes ordinarias nacionales a apartado o Lista: alta en **D+0** y liquidación como entregadas en oficina en D+0; no necesitan sello de fechas; las relaciones solo se generan, sin imprimir.\n\n### No embuzonables\n- Código de hueco del M4-O: **ORD + Codired Oficina + Año + Mes + Día + secuencial de 3 dígitos**; fecha límite de recogida **15 días naturales**.\n\n### Entornos especiales\n- Zonas sin viales, edificios inaccesibles, casilleros concentrados no instalados o resolución del **órgano regulador**: la ordinaria se entrega en la oficina de referencia.\n\n## 14. Envíos registrados: recepción, grabación y almacenamiento\n\n### Vías de llegada\n- **URO y USE/URP**: tras intento fallido con aviso **M-4**; separados por secciones y fechas de aviso, con los reembolsos aparte. Recepción automática con **\"Recepción de avisados\"** de SGIE, excepto los **electorales (VE, DE, DN)**, que llegan en despachos, y los **Paq Premium, Estándar y Ligero**, que se dan de alta manualmente. Después se cierra el despacho en **\"Recepción y Control de despachos\"**.\n- **Electorales**: despachos agrupados en el **Mapón**; solo se recepcionan con mapón **preimpreso** y no recepcionados en otra unidad.\n- **Centros de tratamiento (CTA/CTP)**: llegan sin despacho; salvo cartas y cartas reembolso, figuran en el **Cuadro de Mando de Envíos (CME)** hasta su alta.\n- **Correos Express**: Paq 24 a oficina elegida, admitidos solo por la red de CEX; alta en Entradas>>Alta en almacén, que genera el **SMS**.\n\n### Almacenes de registrados\nAvisados, Paquetería no domiciliaria y Lista, Apartados postales, Estacionados y Archivo.\n\n#### Almacén de avisados\n- Orden por fecha de aviso y sección. Separar como mínimo:\n  - **Notificaciones y acuerdos especiales: 7 días** de permanencia.\n  - Resto de registrados: **15 días**.\n  - Reembolsos y bajo valor sujetos a IVA.\n  - Órdenes de envío de dinero (hoy no se archivan: con **SEDI** se pagan en IRIS desde cualquier oficina con el nº del M4).\n- No se generan avisos; el cliente firma en la **tableta digitalizadora**.\n\n#### Paquetería no domiciliaria y Lista\n- Avisos (SMS, email o físico) de Paq Premium oficina elegida (**PL**), Paq Estándar oficina de referencia (**PR**) u oficina elegida (**PS**): en **D+0**.\n- Si el envío cabe en más de un canal se elige manualmente; con **\"Fijar\"** se mantiene el canal.\n- SGIE asigna un **código correlativo de ubicación** (sin distinguir a cobrar/pagar); etiqueta impresa o anotación a mano. Orden por fecha de grabación y secuencial, de arriba abajo y de izquierda a derecha.\n- **Petición de entrega a domicilio** (solo capitales de provincia u oficinas determinadas): SGIE>>Salida>>Liquidación>>Petición Entrega a Domicilio; se genera factura que se cobra en la entrega.\n- Lista: no necesita aviso. Registrados a Lista: identidad (pasaporte, DNI, carnet de conducir o tarjeta de residencia), firma en tableta, autorizado **por escrito**.\n- Paq 24 de CEX: alta con el código de **23 dígitos** en canal Lista. Si no hay datos: \"El envío no está admitido. Contacte con la unidad de admisión\" → Incidencias>>Carga envíos Correos Express.\n\n#### Apartados postales\n- Se imprime aviso en forma de **relación** cada vez que se asigna un nuevo registrado (Alta almacén>>Listado Automático o a Petición).\n- **SMS gratuito** al titular si consta su móvil.\n- El titular puede autorizar **por escrito** que registrados, telegráficos y financieros con solo domicilio vayan al apartado, salvo **notificaciones administrativas** (salvo reenvío postal).\n- **Apartados 24/7**: Paq Estándar y Paq Premium nacionales sin valores añadidos se depositan con **albarán**; si no se firma, entrega en la fecha/hora de puesta a disposición; con SMS, en la fecha/hora del SMS.\n- **Notificaciones a apartado**: 1.er intento con fecha y hora de alta; tras **3 días naturales**, 2.º intento con **3 horas de diferencia** y en turno distinto, SMS a las **10 o 17 h**. A los **10 días naturales** (3 + 7) SGIE avisa para declararla sobrante.\n\n#### Almacén de estacionados\n- Servicio de gestión de estacionados: plazo máximo **120 horas** a la espera de instrucciones del remitente.\n- Causas a la llegada: rotura, falta de contenido, falta de datos, falta o diferencia de importes, expediciones incompletas, código postal erróneo (check **\"Estacionados\"**).\n- Devolución: reetiquetado con códigos **DQ, DX, DA y DH** (manual: Reetiquetado de envíos; automática: Salida de almacén). Control con \"Situación de Almacén\".\n- El administrador puede desestacionar por error o si viene el destinatario, excepto envíos con **digitalización de documentación**.\n\n#### Almacén de archivo\n- Registrados devueltos no entregables al remitente; marcados con **A** en el listado de sobrantes; nacionales e internacionales separados.\n\n### Informe de faltas y actas\n- Faltas: SGIE>>Despachos>>Recepción y control de despachos (parte superior: no leídos = faltas; inferior: **duplicados**). Sin despacho: gestión de faltantes del CME.\n- Acta para despachos generados hace **más de 48 horas** no recibidos o con faltas: Incidencias>>Generación de actas. Se conservan precintos, sacas y sobres.\n- Sin papel, salvo **expolio de valor declarado** o envíos de CT sin despacho: acta impresa firmada por **dos empleados**, archivada **un año**.\n- El acta debe **confirmarse**; si solo se guarda, puede eliminarse o modificarse.\n\n## 15. Cuestiones generales en la entrega de registrados\n- Al destinatario o autorizado, identificado y bajo firma. Si no puede firmar, firma un **testigo**; nunca el empleado.\n- Documentos válidos: DNI, pasaporte, permiso de conducir, tarjeta de residencia o documento del país con foto. En Paq Premium/Estándar nacionales, el **SMS o email sustituye** al aviso.\n- Sin autorización posible en **entrega exclusiva al destinatario**.\n\n| Autorización | Requisitos |\n|---|---|\n| **Concreta** (reverso del M4) | Nombre del autorizado, nº y validez del DOI, firma del destinatario, sello si es persona jurídica; se muestra copia del DOI del destinatario (no se archiva) y DOI del autorizado |\n| **Genérica** (escrito en papel) | Nombre y dirección del autorizante; nombre, dirección y DOI del autorizado; tipo de envíos; fecha y firma. Solo se archiva el escrito; revocable por escrito en cualquier momento |\n\n## 16. Condiciones específicas\n- **Fallecidos**: a herederos con certificado de defunción y acreditación; si son varios, autorizan todos por escrito. Las **cartas** quedan a la espera de lo que diga el remitente.\n- **Quiebra/concurso**: a los **síndicos** o designados.\n- **Notificaciones a personas jurídicas**: representante o empleado, con identidad, firma, fecha y sello (sin sello: comunidades de vecinos, de bienes, sociedades civiles). **Organismos públicos**: sello obligatorio salvo notificaciones judiciales de la **Sala Tercera del Tribunal Supremo**.\n- **Menores**: recogen si tienen **14 años o más** con DOI; si no, un familiar acreditado.\n- **Dominios web**: solo con contrato; carpeta **\"Documentos entrega dominios web\"** en orden alfabético; sin ese documento no se entrega.\n\n## 17. Entrega de envíos registrados\n- Ruta: SGIE>>Liquidación>>Liquidación>>**Entregado en oficina**; nombre, apellidos, DOI y firma en tableta. En notificaciones: **Código de usuario y Contraseña**.\n- Si rechaza la tableta: botón **\"Firmar Papel\"** (fecha, DOI, firma) y Liquidación>>Firma Papel.\n- Autorizado: M-4 archivado con la documentación; la copia del DNI del autorizante no se archiva.\n- **Entrega múltiple**: check, Nombre y Domicilio; una sola firma. Remesas de **más de 500 envíos**: mejor no imprimir la relación.\n- Aviso de recibo: fecha, receptor, DOI, relación con el destinatario y firma; el empleado pone **NIP, firma y sello de fechas**.\n\n## 18. Otros procedimientos de entrega\n\n### 18.1 Oficinas con PDA\n- Permisos en **SIGUA** y SGIE; aplicación **Talina** (botón \"Marco\" → usuario → \"Talina\"). Captura con el botón del lateral izquierdo.\n- No se entregan con PDA: envíos con **reembolso**, con **escaneo de documentación** y no dados de alta en la unidad.\n\n### 18.2 Entrega exclusiva al destinatario (EED)\n| Modalidad | Funcionamiento |\n|---|---|\n| EED | Verifica DOI con el prerregistro de IRIS; **3 intentos**, luego \"Pendiente de estacionar\". Tras **120 h** sin resolver, devolución |\n| EED + PEE | Pantalla \"Asignación de receptor\"; errores de formato sin límite de intentos; número que no coincide: 3 intentos |\n| EED + escaneo y validación | Hasta 3 intentos; escaneo de originales, ambas caras, recto, sin documentos no solicitados |\n| EED + PEE + digitalización | 3 intentos; digitalización en **GESCAN** y firma |\n\n- Escaneo con validación: **Plataforma ICAR**; reconoce DNI español, pasaporte, documento de identidad europeo y NIE.\n- Requisitos: PEE, EED contratados y campo **\"NIF de destinatario\"** en el prerregistro.\n\n### 18.3 Derechos de aduana\n- Envíos de fuera de la UE o de Melilla, Ceuta y Canarias (antes etiqueta **DTA**).\n- **Bajo valor (≤150 €)**: factura simplificada (completa en SGIE); despacha Correos, **sin autodespacho**.\n- **Alto valor (>150 €)**: despacho con Correos o por formulario web tras estacionarse en el **ADT**.\n- **Canarias**: documento interno de liquidación (**DIL**); al destinatario, factura de Correos y de la mercancía; Correos custodia factura y DIL firmado. El DUA original llega por correo ordinario. Discrepancias: CAU y responsable **VEXCAN**. Remesas en el mismo acto.\n\n### 18.4 Tasa de devolución\n- Importe de la tarifa del envío **sin valores añadidos**; clientes con contrato, albarán de entrega.\n\n### 18.5 Entrega con recogida\n- Se liquida \"Entregado en oficina\", firma y luego envío de vuelta con etiqueta **LI** (logística inversa). Si no coincide el código o falta la mercancía: \"No entregado: falta envío de vuelta\" y estacionado.\n\n### 18.6 Buzón de Vacaciones\n- Los **7 primeros dígitos** del código son el **CODIRED**. SMS un día antes y en la fecha de fin. Entrega a domicilio como certificado; si falla, **15 días** en oficina.\n\n### 18.7 Contrarreembolso\n- **Nacional** sin importes: CAU; a los **5 días hábiles**, \"Devuelto a cliente sin información\". Importes distintos: correo a la unidad de admisión, que responde en **24 horas**; sin respuesta en 5 días hábiles, 2.ª petición; a los **10 días hábiles**, devolución con \"Incidencia de importe de reembolso\".\n- El importe de la cubierta **no se modifica**; vale el del sistema.\n- **Internacional**: CAU (gravados por aduana) o barajas.internacional@correos.com; 5 días hábiles.\n- Puede autorizarse a comprobar el contenido (no cartas ni valor declarado); una vez cobrado no se rehúsa.\n- Liquidación mediante **código de control de cobros**: los giros de reembolsos se generan automáticamente al confirmar en IRIS. Libranzas internacionales → Subdirección de Servicios Financieros.\n\n### 18.8–18.10\n- **Expediciones**: \"Entrega múltiple\"; completa o parcial como relación con mismo remitente, producto y destinatario.\n- **Sobrantes**: Regularización de envíos>>Cambio situación envíos; no aplicable a **notificaciones**.\n\n## 19. Productos telegráficos y fax\n- Llegan por buzón electrónico o rutas de reparto. Los **faxes de dispositivos particulares no se entregan**.\n- Con PEF o PEE se asigna receptor; telegrama **\"AA\"** al remitente (entrega física) o email (electrónica).\n- Burofax: máximo **72 horas** en pendiente antes de bloquear el cierre de caja; impreso sin acción pasa a pendiente a las 72 h y bloquea tras otras 72 h.\n\n## 20. Pago de envíos de dinero\n- IRIS: Envío dinero>>Pago envío dinero. Se pagan giros a apartados (grabados en SGIE canal \"Apartado\"), **inmediatos y UPU IFS** (con **localizador**) y ordinarios avisados.\n- No se paga si un juez ordenó **embargo o suspensión**. Western Union: solo al destinatario mayor de edad.\n- Documentos válidos: DNI/NIF, permiso de residencia, tarjeta de asilo, pasaporte (excepcional para españoles), documento de identidad europeo, NIP y **NIS**. No válidos: permiso de conducir (salvo excepciones con autorización de PBC), **libreta marítima y carné consular**.\n\n| Giro | Clave |\n|---|---|\n| Avisado | Aviso o código del envío; cualquier oficina informatizada |\n| Inmediato | Nacional, en metálico, con localizador |\n| UPU electrónico | Internacional; **número secreto** de 6 a 10 caracteres; por nombre exige fecha exacta y país |\n| Caja Mágica | Pago informando número o identificador |\n\n- Ventana **PBC**: DOI, digitalización en **GESCAN**; receptor siempre persona física; justificante archivado en **Ágora**.\n- **Giros oficiales**: CIF de Correos **A83052407**, autorizado con NIP. **Menores**: padres o tutores, medidas reforzadas. **Reclusos**: los entrega reparto; el funcionario firma la relación; caducidad DOI **01/01/9999**, tipo \"Pasaporte\".\n- **Correos Cash**: retirada por app; SEDI genera localizador de giro inmediato; **no sujeto a PBC** (fondos de cuenta corriente); tique **EPELSA**.\n\n## 21. Western Union\n- Solo personas físicas mayores de edad, con DOI y **MTCN**. Impreso **amarillo** \"Formulario rápido. Pago\"; cantidad aproximada **±10 %**.\n- Origen siempre extranjero (salvo impuesto en otro agente). En **Wupos**: \"Recibir dinero\" o **F6**. No admite terceros ni autorizaciones; firman cliente y empleado; escaneo con GESCAN.\n\n## 22. Liquidación\n- Antes de fin de jornada, con documentación: reembolsos (listado SGIE), giros (justificantes firmados), aduanas (**DTA**), tasas de devolución.\n- Verificación con **\"Cuadre de la Unidad\"** y **\"Cuadre de caja\"**; tras cerrar caja se genera el **código de control de cobros**.\n- Conceptos: reembolsos, tramitaciones aduaneras, **factaje**, devolución de paquetería, entrega a domicilio y giros pagados.\n- Las unidades de reparto liquidan con su código; si no coincide, no se acepta. Incidencias al confirmar en IRIS → **CAU sin confirmar**.\n\n## 23. Devoluciones\n- Sobrantes al acabar el plazo; rehusados, desconocidos, fallecidos sin herederos o ausentes sin señas se devuelven **inmediatamente**. Sin remitente → archivo.\n\n### Ordinarios\n- **15 días naturales** en avisados, no embuzonables, no domiciliaria y Lista; apartados hasta baja o no renovación; archivo según dirección de área.\n\n### Registrados\n- Listado diario: SGIE>>Control/Consultas>>Sobrantes almacén (**D** devolver / **A** archivo); \"Liquidación automática\". Paq Ligero, Estándar y Premium: devolución **unitaria**.\n- Notificaciones N3: tercer intento tarde (con USE/URP \"Tercer intento de entrega\"; sin ella \"Sobrante\"); tercer intento buzón: **7 días naturales**; casillas **9** y **13** del aviso de recibo.\n- **Telegráficos**: **30 días naturales**; destrucción controlada.\n- **Citypaq**: 15 días; DQ al remitente o al CTP de Chamartín (funciones asumidas por otros centros de Madrid).\n- Control de almacenes al menos **cada 15 días** (\"Cuadre de almacén\").\n\n### Rotulación\n| Tipo | Rotulación |\n|---|---|\n| Nacionales | Sello **\"Devuelto\"** o \"D\" sin tapar el código de barras, o etiqueta sobrante SGIE; firma y NIP en rehusado, desconocido y ausente |\n| Notificaciones | \"Devuelto\" o \"D\" + datos en el aviso de recibo |\n| Paquetería (Paq…) | Etiqueta nueva (CEX, DH, DA, DX, DQ) sobre la vieja |\n| Internacionales | Etiqueta **CN15** y sello **\"Retour\"**, firma y NIP |\n- Se cursan al CT en **D+1**.\n\n## 24. Envíos caducados\n- **RD 1829/1999, art. 25**: sobrantes en depósito **máximo seis meses**; después, caducados.\n- Comisión presidida por el director de zona; al menos **una vez al semestre**, en un único día; aviso a la **Secretaría General** con **15 días** de antelación.\n- Sin valor declarado y carácter personal: destrucción ilegible. Sin carácter personal: pueden abrirse; nunca donación. **Valor declarado**: enajenación tras **3 años**. Paq Estándar/Premium a petición: \"Pendiente de destrucción\". Residuos según **ISO 14001:2004**.\n\n## 25. Fraudes en reembolsos\n- Tras entregar: se exige denuncia; el director cambia a \"Alta en almacén\", fax a Relaciones Institucionales (**RICO 25549**) y emails. El importe nunca se devuelve: **Partidas Pendientes** durante **7 días naturales**. Solo diligencias policiales/judiciales previas al pago pueden paralizarlo.\n\n## 26. Entregas controladas\n- Circulación vigilada: delitos de los arts. **301 a 304** (blanqueo) y **368 a 373** (drogas) del Código Penal (LO 10/1995).\n- Flujo: solicitud al área de seguridad → director de zona (copia al coordinador de seguridad) → director de oficina (por **teléfono o en persona**).\n- Detenciones **fuera de la oficina**; las entregas las hacen los empleados.\n\n## Claves para el examen\n- Sin entrega domiciliaria: libros **>500 g** y publicaciones **>800 g**.\n- Notificaciones en avisados: **7 días**; resto de registrados y ordinarios: **15 días naturales**; telegráficos: **30 días**.\n- Estacionados: máximo **120 horas**; reetiquetado **DQ, DX, DA, DH**.\n- Actas por despachos de **más de 48 horas**; acta en papel archivada **un año**.\n- Menores recogen desde **14 años**; organismos públicos sin sello solo en la **Sala Tercera del TS**.\n- EED: **3 intentos**; validación con **Plataforma ICAR** (no admite carné de conducir).\n- Bajo valor aduanero **≤150 €**, sin autodespacho; Canarias: **DIL**.\n- Reembolsos: unidad de admisión responde en **24 h**; devoluciones a los **5 / 10 días hábiles**.\n- UPU electrónico: número secreto de **6-10 caracteres**; giros no válidos con libreta marítima o carné consular.\n- Western Union: **MTCN**, ±10 %, tecla **F6**, sin autorizados.\n- Caducados: depósito **6 meses**; valor declarado **3 años**; aviso a Secretaría General con **15 días**.\n- Fraude: **Partidas Pendientes 7 días**; internacionales devueltos con **CN15** y \"Retour\".", "preguntas": [{"p": "¿A partir de qué peso los libros no tienen entrega domiciliaria y se entregan en oficina?", "o": ["Más de 500 g", "Más de 300 g", "Más de 800 g", "Más de 1 kg"], "c": 0, "e": "Los libros de más de 500 g no tienen entrega domiciliaria.", "pag": 879}, {"p": "La etiqueta de ubicación de los envíos ordinarios del almacén de no domiciliaria lleva un código que comienza por:", "o": ["NDO", "AVS", "ORD", "LST"], "c": 2, "e": "El código empieza por ORD seguido de mes, día y número correlativo de tres dígitos.", "pag": 881}, {"p": "¿Qué fecha límite de recogida figura en el aviso M4-O de los envíos no embuzonables?", "o": ["7 días naturales", "15 días naturales", "10 días hábiles", "30 días naturales"], "c": 1, "e": "El aviso M4-O indica una fecha límite de recogida de 15 días naturales.", "pag": 884}, {"p": "Al retirar la correspondencia de un apartado de franqueo en destino, ¿qué albarán de entrega se confecciona en IRIS?", "o": ["M4-O", "CN15", "DIL", "FD1"], "c": 3, "e": "Se confecciona el albarán de entrega FD1 en IRIS>>Admisión>>Albaranes>>Albarán manual.", "pag": 883}, {"p": "En el almacén de avisados, ¿qué plazo de permanencia tienen las notificaciones y acuerdos especiales?", "o": ["Quince días", "Diez días", "Siete días", "Tres días"], "c": 2, "e": "Las notificaciones y acuerdos especiales tienen un plazo de permanencia de siete días.", "pag": 888}, {"p": "¿Cuál es el plazo máximo de permanencia en el almacén de estacionados a la espera de instrucciones del remitente?", "o": ["120 horas", "72 horas", "48 horas", "96 horas"], "c": 0, "e": "Se dan de alta en estacionados por un plazo máximo de 120 horas.", "pag": 893}, {"p": "Los envíos estacionados que deben devolverse a origen se reetiquetan con códigos que comienzan por:", "o": ["CN, CP, RR y DQ", "LI, DX, DA y PS", "PL, PR, PS y DH", "DQ, DX, DA y DH"], "c": 3, "e": "Se reetiquetan con código de barras que comienza por DQ, DX, DA y DH.", "pag": 894}, {"p": "Una notificación dirigida a un apartado postal y no entregada, ¿tras cuántos días naturales desde su alta hace que SGIE avise para declararla sobrante?", "o": ["7 días", "10 días", "15 días", "3 días"], "c": 1, "e": "Tras 10 días naturales (tres de intento y siete de permanencia) SGIE avisa para declararla sobrante.", "pag": 893}, {"p": "Se genera acta con los despachos destinados a la unidad que no se han recibido y se generaron hace más de:", "o": ["24 horas", "48 horas", "72 horas", "120 horas"], "c": 1, "e": "El acta recoge los despachos generados hace más de 48 horas que no se han recibido.", "pag": 895}, {"p": "¿Desde qué edad pueden los menores recoger sus envíos en la oficina presentando un documento de identificación válido?", "o": ["14 años", "12 años", "16 años", "18 años"], "c": 0, "e": "Pueden recogerlos si tienen 14 años o más y presentan documento válido.", "pag": 899}, {"p": "En la entrega de notificaciones a organismos públicos, ¿en qué caso NO se estampa el sello del organismo?", "o": ["Notificaciones de la Agencia Tributaria", "Notificaciones a comunidades de vecinos", "Notificaciones judiciales de la Sala Tercera del Tribunal Supremo", "Notificaciones de la Seguridad Social"], "c": 2, "e": "Debe estamparse el sello salvo en las notificaciones judiciales de la Sala Tercera del Tribunal Supremo.", "pag": 899}, {"p": "¿Cómo se denomina la aplicación informática que se usa en las PDA de oficina?", "o": ["SIGUA", "GESCAN", "Wupos", "Talina"], "c": 3, "e": "La aplicación de las PDA de oficina se denomina Talina.", "pag": 903}, {"p": "En la modalidad EED, si el número de DOI no coincide con el prerregistro tras los intentos permitidos, el envío pasa a:", "o": ["\"Pendiente de estacionar\" tras tres intentos", "\"Devuelto a origen\" tras dos intentos", "\"Sobrante\" tras cinco intentos", "\"Sin asignar\" tras tres intentos"], "c": 0, "e": "Se permiten tres intentos; después la entrega se bloquea y pasa a 'Pendiente de estacionar'.", "pag": 903}, {"p": "¿Cuál de estos documentos NO es reconocido por el software de la Plataforma ICAR en el escaneo con validación?", "o": ["NIE", "Carné de conducir", "Documento de identidad europeo", "Pasaporte"], "c": 1, "e": "Reconoce DNI español, pasaporte, documento europeo y NIE; se valida que no sea carné de conducir.", "pag": 905}, {"p": "En los envíos de bajo valor procedentes de fuera de la UE, ¿cuál es el umbral y quién presenta el despacho de importación?", "o": ["Igual o inferior a 150 €; puede hacerlo el destinatario", "Igual o inferior a 22 €; lo presenta Correos", "Igual o inferior a 300 €; lo presenta el remitente", "Igual o inferior a 150 €; lo presenta Correos"], "c": 3, "e": "Bajo valor es igual o inferior a 150 € y Correos presenta el despacho; no cabe autodespacho.", "pag": 906}, {"p": "¿Qué documentación aduanera deben llevar los envíos con tratamiento aduanero que llegan a las oficinas de Canarias?", "o": ["Etiqueta CN15", "Albarán FD1", "Documento interno de liquidación (DIL)", "Formulario rápido de pago"], "c": 2, "e": "Deben llevar el documento interno de liquidación (DIL).", "pag": 907}, {"p": "En la etiqueta de los sobres colectores del Buzón de Vacaciones, los primeros siete dígitos del código del buzón corresponden a:", "o": ["El CODIRED de la oficina de alta", "El código postal del titular", "El NIP del empleado", "El número de contrato"], "c": 0, "e": "Los primeros siete dígitos son el CODIRED de la oficina en la que se ha dado de alta.", "pag": 909}, {"p": "Ante una divergencia de importes en un reembolso nacional, ¿en qué plazo máximo debe responder la unidad de admisión?", "o": ["48 horas", "5 días hábiles", "24 horas", "10 días hábiles"], "c": 2, "e": "La unidad de admisión responderá en un plazo máximo de 24 horas.", "pag": 911}, {"p": "Para el pago de un giro UPU electrónico debe exigirse un número secreto que, por regla general, tiene:", "o": ["Entre 4 y 6 caracteres", "Entre 6 y 10 caracteres", "Exactamente 10 dígitos", "23 dígitos"], "c": 1, "e": "El número secreto es un código alfanumérico de entre seis y 10 caracteres.", "pag": 917}, {"p": "¿Cuál de los siguientes documentos NO es válido para cobrar un giro en oficina?", "o": ["Tarjeta de Asilo Político", "Documento de identidad europeo", "Permiso de residencia", "Carné consular"], "c": 3, "e": "No son válidos el permiso de conducir (salvo excepciones), la libreta marítima ni el carné consular.", "pag": 916}, {"p": "Al dar de alta a un recluso en la BBDD PBC, ¿qué fecha de caducidad del DOI se indica?", "o": ["31/12/2099", "01/01/2000", "La fecha de nacimiento", "01/01/9999"], "c": 3, "e": "Se indica 01/01/9999, ya que el NIS no tiene fecha de vencimiento.", "pag": 919}, {"p": "¿Por qué las retiradas de efectivo de Correos Cash no están sujetas a controles de prevención de blanqueo de capitales?", "o": ["Porque los fondos proceden de una cuenta corriente y el ordenante es el banco", "Porque el importe máximo es inferior a 150 €", "Porque solo se pagan a mayores de edad", "Porque se archivan en Ágora automáticamente"], "c": 0, "e": "No están sujetas porque los fondos proceden de una cuenta corriente y el ordenante es el propio banco.", "pag": 920}, {"p": "En el formulario de pago de Western Union, la cantidad aproximada a recibir se indica con un margen de:", "o": ["+/-5 %", "+/-10 %", "+/-15 %", "+/-20 %"], "c": 1, "e": "El formulario recoge la cantidad aproximada (+/-10 %) a recibir en euros.", "pag": 922}, {"p": "¿Cuál es el tiempo máximo que un burofax puede estar en situación de pendiente en el buzón electrónico sin impedir el cierre de la caja de SGIE?", "o": ["48 horas", "24 horas", "72 horas", "120 horas"], "c": 2, "e": "El tiempo máximo en pendiente es de 72 horas; después se impide el cierre de caja.", "pag": 914}, {"p": "Si al confirmar en IRIS el código de control de cobros algunos importes no se vuelcan correctamente, ¿qué se hace?", "o": ["Se confirma el código y se corrige al día siguiente", "Se anula el código y se genera otro manualmente", "Se traslada la incidencia al CAU sin confirmar el código", "Se comunica a VEXCAN y se confirma el código"], "c": 2, "e": "La incidencia se traslada al CAU sin confirmarse el código.", "pag": 925}, {"p": "¿Cuál es el plazo de permanencia en oficina de burofax y telegramas no retirados?", "o": ["15 días naturales desde el aviso", "30 días naturales desde el día siguiente al aviso", "7 días naturales desde el alta", "10 días hábiles desde el aviso"], "c": 1, "e": "Tienen un plazo de 30 días naturales desde el día siguiente a la fecha del aviso.", "pag": 928}, {"p": "Según el art. 25 del RD 1829/1999, ¿cuánto tiempo máximo permanecen en depósito los envíos sobrantes antes de considerarse caducados?", "o": ["Seis meses", "Tres meses", "Un año", "Tres años"], "c": 0, "e": "Permanecen en depósito durante un plazo máximo de seis meses desde su declaración.", "pag": 932}, {"p": "En un posible fraude en reembolso, ¿durante cuánto tiempo se contabiliza el importe en Partidas Pendientes del Balance de Tesorería?", "o": ["Quince días naturales", "Cinco días hábiles", "Diez días hábiles", "Siete días naturales"], "c": 3, "e": "Se contabiliza en Partidas Pendientes durante siete días naturales.", "pag": 935}, {"p": "Al devolver envíos internacionales ordinarios y registrados se adhiere la etiqueta:", "o": ["CN15 con el sello \"Retour\"", "CN15 con el sello \"Devuelto\"", "CN22 con el sello \"Retour\"", "DQ con una \"D\" mayúscula"], "c": 0, "e": "Se adhiere la etiqueta CN15 y se usa el sello 'Retour' en lugar de 'Devuelto' o 'D'.", "pag": 930}, {"p": "En el protocolo de entregas controladas, ¿cómo traslada el coordinador de seguridad la información al director de la oficina?", "o": ["Por correo electrónico cifrado", "Telefónicamente o de forma presencial", "Mediante escrito oficial por valija", "A través de una incidencia en el CAU"], "c": 1, "e": "Para garantizar la confidencialidad se comunica telefónicamente o de forma presencial.", "pag": 936}, {"p": "En la oficina se entregan, por no tener entrega domiciliaria, las publicaciones periódicas de más de:", "o": ["500 g", "1 kg", "800 g", "2 kg"], "c": 2, "e": "Las publicaciones periódicas de más de 800 g no tienen entrega domiciliaria.", "pag": 879}, {"p": "Los Paq 24 admitidos por Correos Express con oficina de entrega elegida, una vez entregados en la oficina, se dan de alta en SGIE en el canal:", "o": ["Avisados", "No domiciliaria", "Lista", "Apartados"], "c": 2, "e": "Se da de alta en SGIE en el canal de lista para su entrega.", "pag": 879}, {"p": "¿Con qué se respaldan los envíos urgentes no registrados antes de almacenarlos?", "o": ["Con el sello de fechas del día de entrada", "Con la firma y NIP del cartero", "Con una etiqueta de ubicación ORD", "Con el aviso de llegada M4-O"], "c": 0, "e": "Se respaldan con el sello de fechas del día de entrada para dejar constancia de su recepción.", "pag": 881}, {"p": "Si en un municipio hay varias oficinas y el remitente de un envío a Lista no especifica cuál, el envío se dirige a:", "o": ["La oficina más próxima al remitente", "La oficina con más apartados", "La oficina principal", "La unidad de reparto de referencia"], "c": 2, "e": "Los envíos se dirigen siempre a la oficina principal.", "pag": 882}, {"p": "¿Cómo se almacenan los envíos ordinarios en el almacén de Lista?", "o": ["Por semanas y en orden alfabético de destinatarios", "Por fecha de aviso y sección", "Por número de control asignado por SGIE", "Por código postal y fecha de llegada"], "c": 0, "e": "Se almacenan por semanas y en orden alfabético de los destinatarios.", "pag": 882}, {"p": "Los envíos ordinarios con dirección de domicilio que el titular autoriza a depositar en su apartado deben llegar a la oficina:", "o": ["Embarriados por calle y en bandejas sin atar", "Mezclados con los avisados y sin separar", "Dentro de un despacho cerrado con mapón", "Separados por número de apartado y atados en legajos"], "c": 3, "e": "Deben llegar separados por número de apartado, atados en legajos y con el número en el primer envío.", "pag": 882}, {"p": "Cuando un envío no cabe en el casillero de un apartado particular o 24/7, se deposita en él:", "o": ["Un aviso de llegada M4-O", "Un albarán de entrega FD1", "Una etiqueta de hueco ORD", "Un testigo (aviso estándar de plástico)"], "c": 3, "e": "Se deposita un testigo (aviso estándar de plástico) y el envío se archiva en la oficina.", "pag": 883}, {"p": "En los apartados de franqueo en destino de clientes con contrato, ¿cómo se factura?", "o": ["Con periodicidad variable según volumen", "En cada retirada, en efectivo", "Trimestralmente por la gerencia", "Mensualmente a través de IRIS"], "c": 3, "e": "Con contrato, la facturación se hace mensualmente a través de IRIS.", "pag": 883}, {"p": "Respecto a las cartas urgentes ordinarias nacionales dirigidas a apartados, señale la afirmación INCORRECTA:", "o": ["Se dan de alta en D+0 en su apartado", "Deben respaldarse con el sello de fechas del día", "Se liquidan en D+0 como entregadas en oficina", "Sus relaciones se generan sin necesidad de imprimirlas"], "c": 1, "e": "No es necesario respaldarlas con el sello de fechas del día.", "pag": 883}, {"p": "¿Qué dato NO forma parte del código único de hueco del aviso M4-O de los no embuzonables?", "o": ["Codired de la oficina", "Año, mes y día", "Secuencial de tres dígitos", "NIP del cartero"], "c": 3, "e": "El código es ORD + Codired Oficina + Año + Mes + Día + Secuencial XXX.", "pag": 884}, {"p": "¿Qué envíos registrados avisados por las unidades de reparto llegan en despachos y no por recepción automática?", "o": ["Los Paq 24 de Correos Express", "Los de procesos electorales (VE, DE, DN)", "Las notificaciones administrativas", "Los reembolsos nacionales"], "c": 1, "e": "Se exceptúan los envíos de procesos electorales (VE, DE, DN), que llegan en despachos.", "pag": 886}, {"p": "¿Qué productos avisados se admiten de forma manual en lugar de por 'Recepción de avisados'?", "o": ["Paq Premium, Paq Estándar y Paq Ligero", "Cartas certificadas y notificaciones", "Burofax y telegramas", "Reembolsos y envíos de bajo valor"], "c": 0, "e": "Los Paq Premium, Paq Estándar y Paq Ligero se admiten de forma manual.", "pag": 886}, {"p": "¿Cómo se llama el documento que agrupa los despachos de envíos electorales?", "o": ["Albarán FD1", "Packing list", "Relación de avisados", "Mapón"], "c": 3, "e": "Los despachos de envíos electorales se agrupan en un documento llamado Mapón.", "pag": 886}, {"p": "¿Qué envíos registrados procedentes de centros de tratamiento NO figuran en el Cuadro de Mando de Envíos (CME)?", "o": ["Los Paq Premium", "Los Paq Estándar", "Las expediciones", "Las cartas y cartas reembolso"], "c": 3, "e": "Excepto las cartas y cartas reembolso, el resto figuran en el CME.", "pag": 887}, {"p": "¿Cuál de los siguientes NO figura entre los almacenes de envíos registrados que deben diferenciar las oficinas?", "o": ["Almacén de estacionados", "Almacén de archivo", "Almacén de no embuzonables", "Almacén de apartados postales"], "c": 2, "e": "Los almacenes de registrados son avisados, paquetería no domiciliaria y lista, apartados, estacionados y archivo.", "pag": 888}, {"p": "¿Qué sigla identifica el Paq Estándar con entrega en oficina de referencia?", "o": ["PR", "PL", "PS", "PE"], "c": 0, "e": "Paq Estándar con entrega en oficina de referencia (PR) u oficina elegida (PS).", "pag": 888}, {"p": "La petición de entrega a domicilio de un envío sin entrega domiciliaria está disponible:", "o": ["En todas las oficinas informatizadas", "Solo en oficinas mixtas", "Solo para clientes con contrato", "Solo en capitales de provincia u oficinas determinadas"], "c": 3, "e": "Está disponible solo en capitales de provincia u oficinas determinadas.", "pag": 889}, {"p": "Los Paq 24 de Correos Express se dan de alta en SGIE mediante captura de un código de:", "o": ["13 dígitos", "23 dígitos", "10 dígitos", "18 dígitos"], "c": 1, "e": "Se dan de alta mediante captura del código de 23 dígitos.", "pag": 890}, {"p": "Si al dar de alta un Paq 24 aparece 'El envío no está admitido', ¿qué opción se utiliza para cargar sus datos?", "o": ["Incidencias>>Carga envíos Correos Express", "Entrada>>Reetiquetar envíos", "Despachos>>Recepción y Control de despachos", "Control/Consultas>>Sobrantes almacén"], "c": 0, "e": "Se cargan los datos desde Incidencias>>Carga envíos Correos Express.", "pag": 892}, {"p": "La autorización del titular para recibir en su apartado los registrados dirigidos a su domicilio excluye:", "o": ["Los envíos telegráficos", "Los envíos financieros", "Los paquetes certificados", "Las notificaciones administrativas"], "c": 3, "e": "Se excluyen las notificaciones administrativas, que deben entregarse a domicilio.", "pag": 892}, {"p": "En las notificaciones a apartado, el segundo aviso SMS automático se envía a las:", "o": ["9 o a las 14 horas", "10 o a las 17 horas", "12 o a las 18 horas", "8 o a las 15 horas"], "c": 1, "e": "Se genera un segundo aviso SMS a las 10 o a las 17 horas.", "pag": 893}, {"p": "¿Cuál de las siguientes NO es una causa de estacionamiento a la llegada a la oficina?", "o": ["Rotura", "Exceso de peso del envío", "Código postal erróneo", "Falta de contenido"], "c": 1, "e": "Las causas son rotura, falta de contenido, falta de datos, falta de importes, expediciones incompletas y código postal erróneo.", "pag": 893}, {"p": "¿Qué envíos estacionados nunca deben desestacionarse salvo que SGIE lo solicite?", "o": ["Los envíos con reembolso", "Los envíos con digitalización de documentación", "Las expediciones parciales", "Los Paq Ligero"], "c": 1, "e": "La excepción son los envíos con digitalización de documentación.", "pag": 894}, {"p": "En el listado de sobrantes, los envíos que pasan a archivo se identifican con la letra:", "o": ["D", "A", "R", "S"], "c": 1, "e": "Se identifican con la letra A en la columna tipo.", "pag": 895}, {"p": "Un acta en papel firmada por los dos empleados que la levantan, ¿durante cuánto tiempo se archiva en la unidad?", "o": ["Seis meses", "Tres años", "Un año", "Quince días"], "c": 2, "e": "Se archiva en la unidad que la genera durante un año.", "pag": 896}, {"p": "Si un acta se guarda en SGIE pero no se confirma:", "o": ["Se envía automáticamente pasadas 48 horas", "Nunca sale de la unidad otulada como 'Documentos entrega dominios web'.", "pag": 900}, {"p": "Al liquidar una notificación en SGIE, ¿qué casillas deben cumplimentarse para dejar constancia de quién la entrega?", "o": ["\"Nombre\" y \"Domicilio\"", "\"NIP\" y \"Sello de fechas\"", "\"Fijar\" y \"Entrega múltiple\"", "\"Código de usuario\" y \"Contraseña\""], "c": 3, "e": "Deben cumplimentarse las casillas 'Código de usuario' y 'Contraseña'.", "pag": 901}, {"p": "Si el cliente rechaza firmar en la tableta pero acepta firmar el aviso de llegada, se utiliza el botón:", "o": ["\"Entrega múltiple\"", "\"Sin asignar\"", "\"Asignar\"", "\"Firmar Papel\""], "c": 3, "e": "Se utiliza el botón 'Firmar Papel' y se archiva el aviso de llegada.", "pag": 901}, {"p": "¿A partir de cuántos envíos en una remesa es aconsejable no imprimir la relación?", "o": ["Más de 100", "Más de 500", "Más de 250", "Más de 1.000"], "c": 1, "e": "Si la remesa es mayor de 500 envíos es aconsejable no imprimir la relación.", "pag": 902}, {"p": "Para usar la PDA en oficina, los usuarios deben tener permisos en SGIE y en:", "o": ["SIGUA", "GESCAN", "Wupos", "Ágora"], "c": 0, "e": "Deben contar con permisos en SIGUA (Sistema de Gestión de Usuarios y Accesos) y en SGIE.", "pag": 903}, {"p": "¿Cuál de estos envíos debe entregarse en un ordenador de sobremesa con SGIE y no con PDA?", "o": ["Envíos dirigidos a Lista", "Cartas certificadas avisadas", "Paq Estándar en oficina elegida", "Envíos con importes asociados con reembolso"], "c": 3, "e": "No pueden entregarse con PDA los envíos con reembolso, con escaneo de documentación o no dados de alta.", "pag": 903}, {"p": "En la modalidad EED + PEE, cuando el tipo de documento no coincide y la estructura numérica es incorrecta, el sistema:", "o": ["Permite tres intentos", "Permite un único intento", "No limita el número de intentos", "Estaciona el envío directamente"], "c": 2, "e": "En ese caso el sistema no limita el número de intentos.", "pag": 904}, {"p": "En el escaneo de documentos d
