de 100 o más trabajadores", "Las de 250 o más trabajadores", "Las de 50 o más trabajadores", "Las de 25 o más trabajadores"], "c": 2, "e": "Con el RD 6/2019 la obligación alcanza a empresas de 50 o más trabajadores; para el resto es voluntario.", "pag": 1207}, {"p": "Según los datos del INE de 2021 citados en el temario, la brecha salarial entre hombres y mujeres es aproximadamente del:", "o": ["34 %", "57 %", "11 %", "21 %"], "c": 2, "e": "El texto indica que, según datos de 2021 del INE, la diferencia salarial es del 11 %.", "pag": 1199}, {"p": "Respecto al distintivo empresarial en materia de igualdad del artículo 50 de la LO 3/2007, señale la afirmación correcta:", "o": ["Es un reconocimiento honorífico sin dotación económica", "Conlleva una subvención anual para la empresa", "Solo pueden obtenerlo empresas de capital público", "No puede utilizarse con fines publicitarios"], "c": 0, "e": "El distintivo es solo honorífico, sin dotación económica, y puede usarse en el tráfico comercial y con fines publicitarios.", "pag": 1208}, {"p": "En las convocatorias de cursos de formación de la AGE, ¿qué porcentaje mínimo de plazas se reserva a empleadas públicas para facilitar su acceso a puestos directivos?", "o": ["50 %", "40 %", "30 %", "25 %"], "c": 1, "e": "El artículo 60.2 de la LO 3/2007 reserva al menos un 40 % de las plazas.", "pag": 1210}, {"p": "Las acciones positivas cuyo objetivo es contrarrestar las imágenes negativas, sexistas y estereotipadas de las mujeres se denominan:", "o": ["Equiparadoras", "Transformadoras", "Compensatorias", "Promocionales"], "c": 3, "e": "Las promocionales buscan contrarrestar imágenes sexistas y la falta de reconocimiento histórico de las mujeres.", "pag": 1203}, {"p": "La situación en que una disposición aparentemente neutra pone a personas de un sexo en desventaja particular respecto al otro se denomina:", "o": ["Discriminación directa", "Discriminación indirecta", "Acoso por razón de sexo", "Indemnidad frente a represalias"], "c": 1, "e": "Es la definición de discriminación indirecta del artículo 6 de la LO 3/2007.", "pag": 1202}, {"p": "Según la LO 1/2004, la ayuda de pago único para víctimas de violencia de género sin responsabilidades familiares ni discapacidad equivale a:", "o": ["Seis meses de subsidio por desempleo", "Doce meses de subsidio por desempleo", "Tres meses de subsidio por desempleo", "Dieciocho meses de subsidio por desempleo"], "c": 0, "e": "El importe general es de seis meses de subsidio; con discapacidad igual o superior al 33 % sería de 12 meses.", "pag": 1226}, {"p": "Para acceder a la ayuda de pago único de la LO 1/2004, la víctima debe carecer de rentas mensuales superiores al:", "o": ["50 % del SMI, incluidas las pagas extraordinarias", "100 % del SMI, excluidas las pagas extraordinarias", "75 % del IPREM, incluidas las pagas extraordinarias", "75 % del SMI, excluida la parte proporcional de dos pagas extraordinarias"], "c": 3, "e": "El requisito es no tener rentas superiores, en cómputo mensual, al 75 % del SMI sin la parte proporcional de dos pagas extra.", "pag": 1226}, {"p": "Si la víctima de violencia de género tiene responsabilidades familiares y un familiar conviviente con discapacidad igual o superior al 33 %, la ayuda puede alcanzar:", "o": ["18 meses de subsidio", "24 meses de subsidio", "12 meses de subsidio", "36 meses de subsidio"], "c": 1, "e": "Con responsabilidades familiares llega a 18 meses, o a 24 si la víctima o un familiar conviviente tiene discapacidad de al menos el 33 %.", "pag": 1226}, {"p": "Las empresas que formalicen contratos de interinidad para sustituir a trabajadoras víctimas de violencia de género que ejerzan la movilidad geográfica tienen una bonificación del 100 % de cuotas empresariales durante:", "o": ["Doce meses", "Seis meses", "Tres meses", "Dos años"], "c": 1, "e": "La bonificación dura todo el periodo de suspensión o seis meses en los supuestos de movilidad geográfica o cambio de centro.", "pag": 1224}, {"p": "En Correos, la reducción de jornada de la trabajadora víctima de violencia de género puede ser de:", "o": ["Un mínimo de una hora y un máximo de la mitad de la jornada", "Un mínimo de media hora y un máximo de dos tercios de la jornada diaria", "Un mínimo de un octavo y un máximo de la mitad de la jornada", "Un mínimo de media hora y un máximo de un tercio de la jornada"], "c": 1, "e": "El III Convenio fija un mínimo de media hora y un máximo de dos tercios, con disminución proporcional del salario.", "pag": 1234}, {"p": "Durante la excedencia por violencia de género prevista en el Plan de Igualdad de Correos se perciben retribuciones íntegras:", "o": ["Los dos primeros meses", "El primer mes", "Los seis primeros meses", "Durante toda la excedencia"], "c": 0, "e": "La excedencia no exige tiempo mínimo de servicios y se cobran íntegras las retribuciones los dos primeros meses.", "pag": 1235}, {"p": "La excedencia para el cuidado de cada hijo en Correos tiene una duración máxima de tres años, con reserva del puesto de trabajo durante:", "o": ["Un año", "Dos años", "Tres años", "Dieciocho meses"], "c": 1, "e": "El empleado tiene derecho a reserva de su puesto durante dos años de los tres posibles.", "pag": 1230}, {"p": "La reducción de jornada retribuida para atender a un familiar de primer grado por enfermedad muy grave puede alcanzar:", "o": ["Hasta el 50 % de la jornada, por un plazo máximo de tres meses", "Hasta un tercio de la jornada, por un plazo máximo de un mes", "Hasta el 75 % de la jornada, por un plazo máximo de un mes", "Hasta el 50 % de la jornada, por un plazo máximo de un mes"], "c": 3, "e": "El III Convenio prevé una reducción de hasta el 50 %, retribuida, durante un máximo de un mes.", "pag": 1230}, {"p": "Los empleados de Correos con hijos con discapacidad tienen derecho a una flexibilidad horaria diaria de:", "o": ["Una hora", "Treinta minutos", "Dos horas", "Tres horas"], "c": 2, "e": "Se reconocen dos horas de flexibilidad diaria para conciliar con los centros de educación especial.", "pag": 1230}, {"p": "A nivel disciplinario, el acoso sexual ejercido sobre un empleado de Correos dentro o fuera de las instalaciones se considera:", "o": ["Falta muy grave", "Falta grave", "Falta leve", "Falta grave o leve según el caso"], "c": 0, "e": "El Plan de Igualdad califica el acoso sexual como falta muy grave, dentro o fuera de las instalaciones.", "pag": 1234}, {"p": "En los supuestos de acoso sexual, la denuncia dirigida a la Dirección de Recursos Humanos puede presentarse en sobre cerrado con la leyenda:", "o": ["\"Confidencial. Abrir solo por la Unidad de Instrucción\"", "\"Reservado. Abrir solo por el Observatorio antiacoso\"", "\"Contenido confidencial. Abrir solo por el Centro Directivo\"", "\"Contenido reservado. Abrir solo por la Comisión de Igualdad\""], "c": 2, "e": "El protocolo indica esa leyenda en la cubierta del sobre cerrado.", "pag": 1311}, {"p": "Según el protocolo contra el acoso, la presentación de una denuncia falsa se considerará siempre falta muy grave cuando:", "o": ["El denunciado sea un mando intermedio", "Exista notoria temeridad y las imputaciones sean absolutamente infundadas", "La denuncia se haya adelantado verbalmente", "Se trate de un supuesto de acoso moral o laboral"], "c": 1, "e": "Con carácter general es grave o muy grave, pero será muy grave con notoria temeridad e imputaciones absolutamente infundadas.", "pag": 1313}, {"p": "¿Quiénes forman parte del Observatorio antiacoso de Correos?", "o": ["La Dirección de Recursos Humanos y la Subdirección de Promoción de la Salud", "La Comisión de Igualdad y el Delegado de Protección de Datos", "La Sociedad Estatal y los sindicatos firmantes del protocolo", "Los Directores de Zona y la Unidad de Instrucción"], "c": 2, "e": "El artículo 10 del protocolo establece que lo forman la Sociedad Estatal y los sindicatos firmantes.", "pag": 1313}, {"p": "¿Quién puede intervenir los envíos postales cuando existan sospechas fundadas de que contienen objetos prohibidos?", "o": ["Cualquier jefe de oficina de Correos", "El Delegado de Protección de Datos de Correos", "El personal de la CNMC que desempeñe funciones de inspección postal", "El Comité de Seguridad Corporativo"], "c": 2, "e": "Solo el personal de la Comisión Nacional de los Mercados y la Competencia con funciones de inspección postal, mediante reconocimiento externo.", "pag": 1242}, {"p": "El Reglamento General de Protección de Datos (UE) 2016/679 resultó de plena aplicación el:", "o": ["25 de mayo de 2016", "25 de mayo de 2018", "5 de diciembre de 2018", "27 de abril de 2016"], "c": 1, "e": "Entró en vigor el 25 de mayo de 2016 y fue de plena aplicación el 25 de mayo de 2018.", "pag": 1243}, {"p": "Según la LOPDGDD, el tratamiento de datos de un menor solo puede fundarse en su propio consentimiento cuando sea:", "o": ["Mayor de 16 años", "Mayor de 13 años", "Mayor de 12 años", "Mayor de 14 años"], "c": 3, "e": "El artículo 7 de la LO 3/2018 fija la edad en mayores de 14 años (el RGPD establece 16 con posibilidad de bajar a 13).", "pag": 1254}, {"p": "Las actuaciones para atender el ejercicio de derechos son gratuitas, salvo en el derecho de acceso cuando se ejerce sin causa legítima más de una vez en el plazo de:", "o": ["Seis meses", "Un año", "Tres meses", "Un mes"], "c": 0, "e": "La excepción a la gratuidad se produce si se accede más de una vez en seis meses sin causa legítima.", "pag": 1258}, {"p": "Cuando los datos personales no se han obtenido del interesado, el responsable debe facilitarle la información dentro de un plazo razonable y, como máximo:", "o": ["Dentro de diez días", "Dentro de tres meses", "Dentro de quince días", "Dentro de un mes"], "c": 3, "e": "El artículo 14.3 del RGPD fija como plazo máximo un mes desde la obtención de los datos.", "pag": 1260}, {"p": "Según los niveles de seguridad aplicables a los ficheros, los datos relativos a servicios financieros o a la Hacienda Pública corresponden al nivel:", "o": ["Medio", "Básico", "Alto", "Crítico"], "c": 0, "e": "El nivel medio incluye infracciones administrativas o penales, servicios financieros y Hacienda Pública.", "pag": 1283}, {"p": "Según las recomendaciones de Correos sobre autenticación personal, la contraseña debe:", "o": ["Tener al menos diez caracteres y cambiarse como mínimo una vez al año", "Tener al menos ocho caracteres y cambiarse cada seis meses", "Tener al menos seis caracteres y cambiarse cada tres meses", "Tener al menos doce caracteres y cambiarse cada dos años"], "c": 0, "e": "Se recomiendan como mínimo diez caracteres y cambiarla al menos una vez al año.", "pag": 1284}, {"p": "En teletrabajo, ¿qué herramienta recomienda Correos para intercambiar archivos confidenciales?", "o": ["OneDrive", "GitHub", "Trello", "Bitbucket"], "c": 0, "e": "Se recomienda OneDrive; GitHub, Bitbucket o Trello son herramientas no privadas que deben evitarse.", "pag": 1286}, {"p": "Respecto a los datos de los destinatarios de los envíos, Correos actúa como encargado del tratamiento cuando:", "o": ["Los datos los facilita una persona no sujeta a las normas de protección de datos", "El destinatario recoge el envío en oficina", "Los datos los facilita un remitente sujeto a las normas de protección de datos", "El envío es de ámbito internacional"], "c": 2, "e": "Es encargado si los datos los aporta un remitente sujeto a la normativa y responsable si los aporta una persona no sujeta a ella.", "pag": 1291}, {"p": "En la admisión de cartas certificadas, el preimpreso M11 solo puede utilizarse en:", "o": ["La admisión múltiple de clientes sin contrato", "La admisión de clientes con contrato con prerregistro", "La admisión con datos pregrabados en la web", "La admisión unitaria por rurales y oficinas auxiliares"], "c": 3, "e": "El texto indica que es el único caso en que se permite usar el M11; los originales se archivan en la serie documental 02.", "pag": 1295}, {"p": "Según el artículo 89 de la LOPDGDD, señale la afirmación INCORRECTA:", "o": ["Los empleadores deben informar previamente y de forma expresa a los trabajadores", "La grabación de sonidos solo se admite cuando resulten relevantes los riesgos para la seguridad", "No se admite la grabación en vestuarios ni aseos", "Se admite la videovigilancia en comedores si se informa previamente a los trabajadores"], "c": 3, "e": "En ningún caso se admite la videovigilancia o grabación de sonidos en lugares de descanso como vestuarios, aseos o comedores.", "pag": 1271}, {"p": "La Convención sobre la eliminación de todas las formas de discriminación contra la mujer fue ratificada por España en:", "o": ["1979", "1985", "1983", "1995"], "c": 2, "e": "Fue aprobada por la ONU en diciembre de 1979 y ratificada por España en 1983.", "pag": 1200}, {"p": "¿Qué artículo de la Constitución establece que corresponde a los poderes públicos promover las condiciones para que la libertad y la igualdad sean reales y efectivas?", "o": ["Artículo 14", "Artículo 1.1", "Artículo 9.2", "Artículo 23.2"], "c": 2, "e": "El artículo 9.2 CE encomienda a los poderes públicos promover la igualdad real y efectiva.", "pag": 1200}, {"p": "Según la Ley 39/1999 de conciliación, ¿a qué actores corresponde impulsar la negociación colectiva?", "o": ["A los agentes sociales: sindicatos y empresarios", "Al Estado mediante reformas legislativas", "A las familias", "A las comunidades autónomas"], "c": 0, "e": "Los agentes sociales, sindicatos y empresarios, son los encargados de impulsar la negociación colectiva.", "pag": 1201}, {"p": "Según la LO 3/2007, sus obligaciones se aplican a:", "o": ["Solo a las personas de nacionalidad española", "Solo a las Administraciones Públicas y empresas públicas", "Toda persona física o jurídica que actúe en España, con independencia de su nacionalidad", "Solo a empresas con domicilio social en España"], "c": 2, "e": "Se aplican a toda persona física o jurídica que actúe en España, independientemente de nacionalidad, domicilio o residencia.", "pag": 1201}, {"p": "¿Cuál es, según el temario, la mayor novedad de la LO 3/2007?", "o": ["La prevención de las conductas discriminatorias", "La creación del Registro de Planes de Igualdad", "La regulación del permiso de paternidad", "La tipificación penal del acoso sexual"], "c": 0, "e": "Su mayor novedad es la prevención de conductas discriminatorias y la previsión de políticas activas.", "pag": 1201}, {"p": "Según el artículo 12 de la LO 3/2007, en los litigios sobre acoso sexual y acoso por razón de sexo estará legitimada:", "o": ["La persona acosada y los sindicatos", "Cualquier persona con interés legítimo", "La persona acosada y el Ministerio Fiscal", "Únicamente la persona acosada"], "c": 3, "e": "La persona acosada será la única legitimada en estos litigios.", "pag": 1203}, {"p": "El trato adverso que sufre una persona como consecuencia de presentar una queja o denuncia por discriminación se regula como:", "o": ["Tutela judicial efectiva (artículo 12)", "Acción positiva (artículo 11)", "Discriminación indirecta (artículo 6)", "Indemnidad frente a represalias (artículo 9)"], "c": 3, "e": "El artículo 9 regula la indemnidad frente a represalias.", "pag": 1202}, {"p": "Según el artículo 18 de la LO 3/2007, el informe periódico del Gobierno sobre la efectividad del principio de igualdad se pone en conocimiento de:", "o": ["El Consejo de Ministros", "El Defensor del Pueblo", "La Conferencia Sectorial de Igualdad", "Las Cortes Generales"], "c": 3, "e": "De este informe se dará cuenta a las Cortes Generales.", "pag": 1205}, {"p": "Según el artículo 19 de la LO 3/2007, los proyectos de disposiciones de carácter general que se sometan al Consejo de Ministros deberán incorporar:", "o": ["Un plan de igualdad negociado con los sindicatos", "Un informe sobre su impacto por razón de género", "Un dictamen del Consejo de Participación de la Mujer", "Una auditoría salarial desagregada por sexo"], "c": 1, "e": "Deben incorporar un informe sobre su impacto por razón de género.", "pag": 1205}, {"p": "¿Qué órgano determina anualmente los contratos de la AGE que deben incluir obligatoriamente medidas para promover la igualdad?", "o": ["El Ministerio de Igualdad", "La Comisión Interministerial de Igualdad", "La Junta Consultiva de Contratación", "El Consejo de Ministros"], "c": 3, "e": "Según el artículo 34, lo determina anualmente el Consejo de Ministros.", "pag": 1206}, {"p": "Señale cuál NO figura entre las materias mínimas del diagnóstico previo del plan de igualdad:", "o": ["Clasificación profesional", "Política de precios y tarifas", "Infrarrepresentación femenina", "Prevención del acoso sexual y por razón de sexo"], "c": 1, "e": "El diagnóstico incluye selección, clasificación, formación, promoción, condiciones, corresponsabilidad, infrarrepresentación, retribuciones y prevención del acoso.", "pag": 1207}, {"p": "¿Qué Ministerio controla que las empresas mantengan las políticas de igualdad y retira, en su caso, el distintivo?", "o": ["El Ministerio de Igualdad", "El Ministerio de Hacienda", "El Ministerio del Interior", "El Ministerio de Justicia"], "c": 0, "e": "El Ministerio de Igualdad controla y retira el distintivo si se incumplen las políticas.", "pag": 1208}, {"p": "Según el artículo 55 de la LO 3/2007, la aprobación de convocatorias de pruebas selectivas para el empleo público debe acompañarse de un informe de impacto de género, salvo:", "o": ["Cuando la convocatoria sea de promoción interna", "Cuando se convoquen menos de diez plazas", "Cuando lo acuerde el tribunal de selección", "En casos de urgencia"], "c": 3, "e": "El informe es obligatorio salvo en casos de urgencia.", "pag": 1209}, {"p": "El Plan para la Igualdad entre mujeres y hombres en la AGE lo aprueba el Gobierno:", "o": ["Cada dos años", "Cada cinco años", "Al final de cada legislatura", "Al inicio de cada legislatura"], "c": 3, "e": "El artículo 64 indica que se aprueba al inicio de cada legislatura y se evalúa anualmente.", "pag": 1211}, {"p": "El Consejo de Participación de la Mujer se define en la LO 3/2007 como:", "o": ["Un órgano de coordinación de los ministerios", "Una unidad administrativa de cada ministerio", "Un órgano colegiado de consulta y asesoramiento", "Un órgano sancionador en materia de igualdad"], "c": 2, "e": "El artículo 78 lo crea como órgano colegiado de consulta y asesoramiento.", "pag": 1212}, {"p": "¿Cuántos ejes de intervención tiene el III Plan Estratégico para la Igualdad Efectiva de Mujeres y Hombres 2022-2025?", "o": ["Cuatro", "Tres", "Cinco", "Siete"], "c": 0, "e": "Se estructura en cuatro ejes: Buen Gobierno, Economía para la vida, Vidas libres de violencia machista y ejercicio efectivo de derechos.", "pag": 1212}, {"p": "Tras la aprobación de los RD 901/2020 y 902/2020, Correos comienza a negociar con las organizaciones sindicales:", "o": ["El III Plan de igualdad", "El IV Convenio Colectivo", "El Plan Concilia", "El II Plan de igualdad"], "c": 3, "e": "Correos comienza a negociar el II Plan de igualdad y encarga una auditoría retributiva.", "pag": 1213}, {"p": "El sesgo que consiste en valorar más positivamente a alguien con características similares a uno mismo se denomina, según las guías de lenguaje inclusivo de Correos:", "o": ["Sesgo de confirmación", "Sesgo de afinidad", "Efecto halo", "Sesgo de estereotipo"], "c": 1, "e": "El sesgo de afinidad es valorar mejor a quien se parece a uno mismo.", "pag": 1214}, {"p": "La Agenda de diversidad e inclusión de Correos actúa sobre:", "o": ["Cinco dimensiones apoyadas en siete ejes de trabajo", "Siete dimensiones apoyadas en cinco ejes de trabajo", "Cuatro dimensiones apoyadas en seis ejes de trabajo", "Cinco dimensiones apoyadas en cinco ejes de trabajo"], "c": 0, "e": "El texto indica cinco dimensiones que se apoyan en siete ejes de trabajo.", "pag": 1215}, {"p": "La Ley Orgánica 10/2022, de garantía integral de la libertad sexual:", "o": ["Mantiene la distinción entre abuso y agresión sexual", "Solo regula aspectos penales, sin efectos laborales", "Equipara a las víctimas de violencia sexual con las de accidentes laborales", "Considera agresión todo acto sexual sin consentimiento, eliminando la distinción con el abuso"], "c": 3, "e": "Pone fin a la distinción entre abuso y agresión y equipara a las víctimas con las de violencia de género o terrorismo.", "pag": 1219}, {"p": "Según el artículo 19 de la LO 1/2004, NO es uno de los principios de organización de los servicios de asistencia social integral:", "o": ["Atención permanente", "Gratuidad universal", "Actuación urgente", "Multidisciplinariedad profesional"], "c": 1, "e": "Los principios son atención permanente, actuación urgente, especialización de prestaciones y multidisciplinariedad profesional.", "pag": 1221}, {"p": "Según la LO 1/2004, el asesoramiento jurídico gratuito a las víctimas se presta:", "o": ["Solo una vez dictada sentencia condenatoria", "En el momento inmediatamente previo a la interposición de la denuncia", "Únicamente tras obtener una orden de protección", "A partir de la admisión a trámite de la querella"], "c": 1, "e": "Tienen derecho a asesoramiento gratuito en el momento inmediatamente previo a la denuncia.", "pag": 1223}, {"p": "El beneficio de justicia gratuita de la víctima de violencia de género se pierde:", "o": ["Si hay sentencia absolutoria, debiendo abonar el coste de lo ya prestado", "Si hay sentencia absolutoria o sobreseimiento, sin obligación de abonar lo ya prestado", "Al finalizar el procedimiento penal, sea cual sea su resultado", "Si la víctima se persona como acusación particular"], "c": 1, "e": "Se pierde con sentencia absolutoria o sobreseimiento, sin abonar el coste de lo prestado hasta entonces.", "pag": 1224}, {"p": "Señale cuál NO es un medio de acreditación de la situación de violencia de género según el artículo 23 de la LO 1/2004:", "o": ["Orden de protección", "Declaración jurada de la propia víctima", "Informe del Ministerio Fiscal", "Informe de los servicios sociales"], "c": 1, "e": "Se acredita por sentencia, orden de protección, resolución judicial cautelar, informe fiscal o de servicios sociales/especializados/de acogida.", "pag": 1225}, {"p": "Si una funcionaria víctima de violencia de género solicita el traslado por un periodo inferior a seis meses, las Administraciones podrán acordar:", "o": ["Una excedencia voluntaria", "Un traslado definitivo inmediato", "Una comisión de servicio temporal o figura similar", "Una suspensión de funciones"], "c": 2, "e": "En ese caso podrá acordarse una comisión de servicio temporal manteniendo la titularidad del puesto en origen.", "pag": 1226}, {"p": "Las ayudas de pago único de la LO 1/2004 son compatibles con las previstas en:", "o": ["La Ley 39/1999 de conciliación", "La Ley 35/1995 de Ayudas a las Víctimas de Delitos Violentos y contra la Libertad Sexual", "La Ley 43/2010 del servicio postal universal", "La Ley 31/1995 de Prevención de Riesgos Laborales"], "c": 1, "e": "Son compatibles con las de la Ley 35/1995 y con otras ayudas autonómicas o locales.", "pag": 1226}, {"p": "Al cierre de 2020, las mujeres representaban en Correos el:", "o": ["46 % de 52.822 efectivos", "52,29 % de 52.822 efectivos", "53 % de 50.000 efectivos", "52,29 % de 48.500 efectivos"], "c": 1, "e": "Al cierre de 2020 eran el 52,29 % de los 52.822 efectivos.", "pag": 1227}, {"p": "¿Qué artículo del III Convenio Colectivo de Correos regula el Plan de Igualdad?", "o": ["Artículo 28", "Artículo 27", "Artículo 23", "Artículo 45"], "c": 1, "e": "El Plan de Igualdad está regulado en el artículo 27 del III Convenio; el 28 regula el protocolo contra el acoso.", "pag": 1227}, {"p": "La aplicación, control y seguimiento del Plan de Igualdad de Correos corresponde a:", "o": ["La Dirección de Recursos Humanos", "La Comisión de Igualdad, compuesta paritariamente", "El Observatorio antiacoso", "La Comisión de Seguimiento del Convenio"], "c": 1, "e": "Corresponde a la Comisión de Igualdad, paritaria entre los firmantes.", "pag": 1228}, {"p": "Si un empleado de Correos es hospitalizado mientras disfruta de sus vacaciones, estas se interrumpen cuando la hospitalización es superior a:", "o": ["Tres días", "Siete días", "Cinco días", "Diez días"], "c": 2, "e": "En caso de hospitalización superior a cinco días se interrumpen las vacaciones.", "pag": 1229}, {"p": "Desde el 1 de enero de 2021, el permiso por nacimiento y cuidado del menor es de:", "o": ["Dieciséis semanas", "Doce semanas", "Diez semanas", "Dieciocho semanas"], "c": 0, "e": "Desde el 1-1-2021 son dieciséis semanas.", "pag": 1230}, {"p": "En adopción internacional con desplazamiento previo al país de origen, los empleados pueden disfrutar de un permiso de hasta:", "o": ["Un mes, con retribuciones íntegras", "Tres meses, sin retribución", "Dos meses, con retribuciones íntegras", "Dos meses, percibiendo solo las retribuciones básicas"], "c": 3, "e": "Permiso de hasta dos meses percibiendo exclusivamente las retribuciones básicas.", "pag": 1230}, {"p": "La excedencia para el cuidado de un familiar en Correos alcanza a familiares hasta:", "o": ["El primer grado de consanguinidad", "El tercer grado de consanguinidad o afinidad", "El cuarto grado de consanguinidad", "El segundo grado de consanguinidad o afinidad"], "c": 3, "e": "Excedencia de hasta tres años para el cuidado de un familiar hasta el segundo grado.", "pag": 1230}, {"p": "En caso de nacimiento de hijos prematuros que deban permanecer hospitalizados, el empleado puede ausentarse del trabajo:", "o": ["Hasta 1 hora diaria sin retribución", "Hasta 2 horas diarias con retribuciones íntegras", "Hasta 3 horas diarias con retribuciones básicas", "Hasta 2 horas diarias sin retribución"], "c": 1, "e": "Hasta un máximo de 2 horas diarias percibiendo las retribuciones íntegras.", "pag": 1231}, {"p": "Por fallecimiento del cónyuge o de los hijos, los empleados de Correos tienen derecho a un permiso:", "o": ["No retribuido de duración no superior a un mes", "Retribuido de quince días", "No retribuido de hasta tres meses", "Retribuido de un mes"], "c": 0, "e": "Se reconoce un permiso no retribuido no superior a un mes.", "pag": 1231}, {"p": "La excedencia por violencia de género en Correos:", "o": ["Exige un año de servicios previos", "Exige una permanencia mínima de seis meses", "Solo puede solicitarse tras una sentencia firme", "No exige un tiempo mínimo de servicios previos"], "c": 3, "e": "No será necesario un tiempo mínimo de servicios previos ni se aplica plazo de permanencia.", "pag": 1235}, {"p": "Las ayudas de acción social de Correos para escuelas infantiles se destinan a hijos del personal de hasta:", "o": ["Seis años", "Cuatro años", "Tres años", "Dos años"], "c": 2, "e": "Subvencionan plazas en escuelas infantiles para hijos de hasta tres años.", "pag": 1237}, {"p": "Las ayudas de acción social para hijos con discapacidad exigen un grado de discapacidad igual o superior al:", "o": ["45 %", "25 %", "65 %", "33 %"], "c": 3, "e": "Se destinan a hijos con discapacidad igual o superior al 33 %.", "pag": 1237}, {"p": "Según el protocolo contra el acoso, ¿ante qué tipo de acoso el primer paso es cesar la conducta, pudiendo aportar desde soluciones conciliadoras hasta acciones disciplinarias?", "o": ["Acoso sexual", "Acoso moral o laboral", "Acoso por razón de sexo", "Acoso discriminatorio"], "c": 1, "e": "En el acoso moral laboral el primer paso es cesar la conducta, con soluciones desde conciliadoras a disciplinarias.", "pag": 1240}, {"p": "Respecto al personal funcionario de Correos, el protocolo contra el acoso:", "o": ["No se aplica en ningún caso", "Se aplica íntegramente, incluido el régimen disciplinario", "Se aplica, excepto en lo relativo al régimen disciplinario y aspectos regulados por normativa administrativa", "Solo se aplica en casos de acoso sexual"], "c": 2, "e": "El artículo 1 lo extiende al personal funcionario salvo régimen disciplinario y aspectos de normativa administrativa.", "pag": 1308}, {"p": "Para identificar correctamente el acoso laboral, el protocolo exige la conjunción de los elementos de:", "o": ["Jerarquía y publicidad", "Gravedad y urgencia", "Intencionalidad y reiteración", "Denuncia escrita y testigos"], "c": 2, "e": "Es precisa la conjunción de intencionalidad y reiteración.", "pag": 1310}, {"p": "¿Qué órgano es competente para analizar las denuncias de acoso en Correos?", "o": ["La Comisión de Igualdad", "El Observatorio antiacoso", "La Dirección de Recursos Humanos a través de la Unidad de Instrucción", "La Subdirección de Promoción de la Salud"], "c": 2, "e": "El artículo 7.1.2 atribuye la competencia a la Dirección de RR. HH. a través de la Unidad de Instrucción.", "pag": 1310}, {"p": "Según el protocolo, si tras la mediación en un caso de disfunción laboral se llega a un acuerdo:", "o": ["Se archiva sin más trámite", "Se comunica al Observatorio antiacoso para su aprobación", "Se abre automáticamente expediente disciplinario", "Se refleja en un acta firmada por las partes, de obligado cumplimiento"], "c": 3, "e": "El acuerdo se refleja en un acta que firman las partes con obligación de cumplirla.", "pag": 1312}, {"p": "Cuando la víctima de acoso solicite ayuda médica, debe informarse a:", "o": ["La Mutua de accidentes de trabajo", "La Comisión de Igualdad", "La Subdirección de Promoción de la Salud", "El Delegado de Protección de Datos"], "c": 2, "e": "El artículo 9 del protocolo indica que se informa a la Subdirección de Promoción de la Salud.", "pag": 1313}, {"p": "Según el artículo 6 del RD 1829/1999, NO están amparados por el secreto de las comunicaciones:", "o": ["Los datos sobre la identidad del remitente", "Las circunstancias exteriores del envío", "Los contenedores que sirven para el transporte de los envíos postales", "Las direcciones del destinatario"], "c": 2, "e": "En ningún caso están amparados los contenedores de transporte de envíos.", "pag": 1242}, {"p": "Señale cuál de las siguientes conductas NO aparece en el artículo 7 del RD 1829/1999 como violación de los envíos postales:", "o": ["La entrega del envío a un autorizado del destinatario", "Su detención arbitraria o contra derecho", "Su intencionado curso anormal", "Su retención indebida u ocultación"], "c": 0, "e": "El artículo 7 cita detención arbitraria, curso anormal intencionado, apertura, sustracción, destrucción, retención indebida u ocultación.", "pag": 1242}, {"p": "La Ley Orgánica 3/2018 (LOPDGDD) entró en vigor:", "o": ["Al día siguiente de su aprobación el 5 de diciembre de 2018", "El 25 de mayo de 2018", "El 1 de enero de 2019", "A los veinte días de su publicación"], "c": 0, "e": "Fue aprobada el 5 de diciembre de 2018 y entró en vigor al día siguiente.", "pag": 1243}, {"p": "Según el artículo 4 del RGPD, la persona física o jurídica que determina los fines y medios del tratamiento es:", "o": ["El encargado del tratamiento", "El destinatario", "El responsable del tratamiento", "El tercero"], "c": 2, "e": "El responsable determina los fines y medios; el encargado trata los datos por cuenta del responsable.", "pag": 1245}, {"p": "El tratamiento de datos de manera que ya no puedan atribuirse a un interesado sin utilizar información adicional que figura por separado se denomina:", "o": ["Limitación del tratamiento", "Elaboración de perfiles", "Minimización", "Seudonimización"], "c": 3, "e": "Es la definición de seudonimización del artículo 4.5 del RGPD.", "pag": 1245}, {"p": "Según el artículo 2 de la LOPDGDD, esta ley NO es de aplicación a:", "o": ["Los tratamientos no automatizados contenidos en un fichero", "Los tratamientos parcialmente automatizados", "Los tratamientos de datos de trabajadores", "Los tratamientos sometidos a la normativa sobre materias clasificadas"], "c": 3, "e": "No se aplica, entre otros, a tratamientos sometidos a la normativa sobre materias clasificadas ni a datos de fallecidos (salvo art. 3).", "pag": 1248}, {"p": "Según el RGPD, el responsable del tratamiento será responsable del cumplimiento de los principios y capaz de demostrarlo, lo que se denomina:", "o": ["Licitud, lealtad y transparencia", "Responsabilidad proactiva", "Limitación del plazo de conservación", "Privacidad por defecto"], "c": 1, "e": "El artículo 5.2 lo denomina responsabilidad proactiva.", "pag": 1250}, {"p": "Según el artículo 7 del RGPD, ¿cuál de las siguientes situaciones SÍ constituye consentimiento válido?", "o": ["El silencio del interesado", "Una casilla ya marcada en la declaración escrita", "La inacción del interesado", "Una declaración verbal que refleje una voluntad libre e inequívoca"], "c": 3, "e": "El silencio, las casillas premarcadas o la inacción no se consideran consentimiento; sí una declaración escrita o verbal.", "pag": 1253}, {"p": "Según el RGPD, los Estados miembros pueden rebajar la edad de consentimiento del menor para servicios de la sociedad de la información, siempre que no sea inferior a:", "o": ["13 años", "14 años", "12 años", "15 años"], "c": 0, "e": "La edad general es 16 años y los Estados pueden fijar una inferior que no baje de 13 años.", "pag": 1254}, {"p": "Según el artículo 9 del RGPD, NO es una categoría especial de datos cuyo tratamiento está prohibido con carácter general:", "o": ["La dirección postal del interesado", "La afiliación sindical", "Los datos biométricos dirigidos a identificar a una persona", "Las convicciones religiosas"], "c": 0, "e": "Son categorías especiales el origen racial, opiniones políticas, religión, afiliación sindical, datos genéticos, biométricos, de salud y vida u orientación sexual.", "pag": 1255}, {"p": "El derecho del interesado a recibir sus datos en un formato estructurado, de uso común y lectura mecánica, y transmitirlos a otro responsable es el derecho de:", "o": ["Acceso", "Portabilidad", "Limitación del tratamiento", "Rectificación"], "c": 1, "e": "El artículo 20 del RGPD regula el derecho a la portabilidad de los datos.", "pag": 1265}, {"p": "Según la LOPDGDD, cuando la supresión deriva del ejercicio del derecho de oposición, el responsable puede conservar:", "o": ["Todos los datos durante cinco años", "Los datos identificativos necesarios para impedir futuros tratamientos de mercadotecnia directa", "Los datos económicos del afectado", "Una copia íntegra de los datos bloqueados sin límite"], "c": 1, "e": "El artículo 15 LOPDGDD permite conservar los datos identificativos necesarios para impedir futuros tratamientos con fines de mercadotecnia directa.", "pag": 1264}, {"p": "¿En qué título de la LOPDGDD se recogen los derechos digitales?", "o": ["Título X", "Título IX", "Título VIII", "Título V"], "c": 0, "e": "Los derechos digitales aparecen en el Título X, Garantía de los derechos digitales.", "pag": 1268}, {"p": "El derecho de los trabajadores a no ser contactados fuera de su tiempo de trabajo para respetar su descanso se regula en el artículo 88 de la LOPDGDD como derecho a:", "o": ["La desconexión digital en el ámbito laboral", "La intimidad en el uso de dispositivos digitales", "La seguridad digital", "La neutralidad de Internet"], "c": 0, "e": "El artículo 88 regula el derecho a la desconexión digital.", "pag": 1271}, {"p": "Según el artículo 38 del RGPD, el delegado de protección de datos rinde cuentas directamente:", "o": ["Al más alto nivel jerárquico del responsable o encargado", "A la Agencia Española de Protección de Datos", "Al Comité de Seguridad Corporativo", "Al departamento de Recursos Humanos"], "c": 0, "e": "Rinde cuentas directamente al más alto nivel jerárquico del responsable o encargado.", "pag": 1277}, {"p": "Según el artículo 37 del RGPD, un grupo empresarial podrá nombrar un único delegado de protección de datos siempre que:", "o": ["Forme parte de la plantilla de la sociedad dominante", "Sea fácilmente accesible desde cada establecimiento", "Lo autorice la autoridad de control", "El grupo tenga menos de 250 trabajadores"], "c": 1, "e": "Un grupo empresarial puede nombrar un único DPD siempre que sea fácilmente accesible desde cada establecimiento.", "pag": 1276}, {"p": "La Ley Orgánica 7/2021 regula la protección de datos personales tratados con fines de:", "o": ["Publicidad y mercadotecnia directa", "Gestión de recursos humanos en el sector público", "Investigación científica y estadística", "Prevención, detección, investigación y enjuiciamiento de infracciones penales"], "c": 3, "e": "La LO 7/2021 se refiere a datos tratados con fines penales por las autoridades competentes.", "pag": 1278}, {"p": "¿Qué órgano constituye Correos como responsable de la gestión de prevención y fortalecimiento de la seguridad de la información?", "o": ["El Comité de Seguridad Corporativo", "El Observatorio antiacoso", "La Comisión de Igualdad", "La Unidad de Instrucción"], "c": 0, "e": "Se constituye un Comité de Seguridad Corporativo para la seguridad de la información.", "pag": 1281}, {"p": "¿Qué combinación de teclas indica el temario para bloquear el ordenador al abandonar el puesto de trabajo?", "o": ["CTRL + SHIFT + ESC", "ALT + F4 + ENTER", "CTRL + ALT + SUPR + ENTER", "WINDOWS + D"], "c": 2, "e": "Basta con pulsar CTRL + ALT + SUPR + ENTER.", "pag": 1283}, {"p": "El método de ataque a contraseñas que consiste en probar combinaciones y se evita aumentando su longitud y complejidad se denomina:", "o": ["Ataque al diccionario", "Phishing", "Fuerza bruta", "Ingeniería social"], "c": 2, "e": "La fuerza bruta prueba combinaciones; se evita con contraseñas más largas y complejas.", "pag": 1284}, {"p": "En teletrabajo, si no es posible conectar el equipo por cable, Correos recomienda una conexión inalámbrica con tecnología:", "o": ["WPA2/3 AES", "WEP", "WPA TKIP", "Wifi abierta con VPN"], "c": 0, "e": "Se recomienda utilizar la tecnología WPA2/3 AES.", "pag": 1285}, {"p": "El programa recomendado en teletrabajo para el cifrado de disco completo es:", "o": ["BitLocker Drive Encryption", "OneDrive", "VDI/VDA", "Mercurio"], "c": 0, "e": "Se recomienda usar BitLocker Drive Encryption para cifrar el disco completo.", "pag": 1286}, {"p": "La dirección de correo del Delegado de Protección de Datos del Grupo Correos es:", "o": ["dpdgrupocorreos@correos.com", "derechos.protecciondatos.correos@correos.com", "seguridad@correos.com", "rrhh.datos@correos.com"], "c": 0, "e": "Correos designó un DPD accesible en dpdgrupocorreos@correos.com.", "pag": 1287}, {"p": "Una vez concluida la relación contractual, los datos de clientes bloqueados por Correos se eliminan generalmente a los:", "o": ["3 años", "10 años", "5 años", "2 años"], "c": 2, "e": "Quedan bloqueados a disposición de jueces y administraciones hasta su eliminación, generalmente a los 5 años.", "pag": 1293}, {"p": "Si el envío es un Paq Premium Internacional, Correos tiene la obligación de comunicar los datos de contenido, destinatario y remitente a:", "o": ["La Comisión Europea", "La Cooperativa EMS", "La Agencia Tributaria", "La CNMC"], "c": 1, "e": "Debe comunicarlos a la Cooperativa EMS por normativa de la UPU y reglamento interno de EMS.", "pag": 1293}, {"p": "En la admisión de clientes con contrato sin prerregistro de cartas certificadas, el albarán de entrega se genera en:", "o": ["IRIS", "Mercurio", "GANES", "Conecta"], "c": 2, "e": "El cliente presenta el albarán generado en GANES por duplicado.", "pag": 1296}]}, {"letra": "O", "titulo": "Normas de cumplimiento (II). Prevención de blanqueo de capitales, compromiso ético y transparencia, responsabilidad social corporativa y sostenibilidad. Riesgos laborales", "paginas": "1315-1366", "resumen": "## 7. Prevención de Blanqueo de Capitales (PBC)\n\n### 7.1. Introducción\n- **Blanqueo de capitales** (a efectos de Correos): enviar o recibir dinero sabiendo que procede de una actividad delictiva y con el fin de ocultar su origen ilícito.\n- **Financiación del terrorismo**: enviar o recibir dinero sabiendo o pretendiendo que se use para cometer delitos de terrorismo.\n\n**Normativa que deben conocer los empleados:**\n\n| Norma | Contenido |\n|---|---|\n| **Ley 12/2003**, de 21 de mayo | Prevención y bloqueo de la financiación del terrorismo |\n| **Orden EHA/2619/2006**, de 28 de julio | Obligaciones PBC de sujetos que hacen cambio de moneda o transferencias con el exterior |\n| **Ley 10/2010**, de 28 de abril | Prevención del blanqueo de capitales y de la financiación del terrorismo |\n| **RD 304/2014**, de 5 de mayo | Reglamento de la Ley 10/2010 |\n| **LO 9/2022**, de 28 de julio | Uso de información financiera para prevenir/investigar infracciones penales; modifica LO 8/1980 y Código Penal |\n\n**Obligaciones legales:**\n- **Identificar** a clientes e intervinientes; identificar al **titular real** si el interviniente no actúa por cuenta propia; en personas jurídicas, determinar su **estructura de propiedad o control**.\n- **Examinar** operaciones posiblemente vinculadas a blanqueo o terrorismo **sea cual sea su cuantía**.\n- Obtener información sobre la índole y propósito del negocio y hacer **seguimiento** de la relación.\n- **Conservar** documentos de identidad y operaciones **10 años** desde la ejecución de la operación.\n- Comunicar al Área de Prevención / Comisión y al Representante ante el **SEPBLAC** (Servicio Ejecutivo de la Comisión de Prevención del Blanqueo de Capitales e Infracciones Monetarias) cualquier indicio o certeza.\n- **No ejecutar operaciones sospechosas** sin consultar antes al SEPBLAC, o comunicarlas inmediatamente después si no es posible abstenerse.\n- **No revelar** al cliente ni a terceros las operaciones comunicadas o en examen especial.\n- Establecer **control interno** y formar a los empleados.\n\n**Infracciones y sanciones (Ley 10/2010):**\n- Infracciones **leves, graves y muy graves**.\n- Entidades: multa de hasta el **5 % de los recursos propios** y revocación de la autorización.\n- Directivos y administradores: hasta **600.000 €**, separación del cargo e inhabilitación máximo **10 años**; en casos leves, **amonestación pública o privada**.\n- En Correos, administradores/directores responden si la infracción les es imputable por **negligencia o dolo**.\n\n**Código Penal:**\n\n| Supuesto | Prisión | Multa |\n|---|---|---|\n| Blanqueo doloso | **6 meses a 6 años** | Triple del valor de los bienes |\n| Negligencia grave | **6 meses a 2 años** | Triple del valor de los bienes |\n\n- Correos es **sujeto obligado** por el **art. 2.1.j de la Ley 10/2010** (\"servicios postales respecto a las actividades de giro y transferencia\").\n\n### 7.2. Procesos operativos vigentes\n- Sistema **SEDI/PBC**: adapta la admisión y pago de giros. Exige registro inicial del cliente en la primera operación mediante la **\"Ficha del cliente\"** (actividad profesional, motivo del giro, tipo y número de documento).\n- Sistemas adaptados a PBC:\n\n| Sistema | Uso |\n|---|---|\n| **IRIS** | Admisión y pago de giros |\n| **SGIE** | Pago de giros a domicilio |\n| **HERA** | Admisión y pago de giros en SSRR |\n\n- Cliente ya registrado: al introducir tipo y número de **DOI** aparece el formulario con los datos previos; el empleado los comprueba y modifica si han variado.\n- La identificación debe ser **previa** a la admisión o pago, con documento válido, y quedar registrada.\n- Archivo según el **Proceso Archivo-Control de Documentos**: **10 años** desde la operación o desde el fin de la relación de negocios.\n\n### 7.3. Manual PBC\n- De **uso obligatorio** para todos los directivos y empleados.\n- En oficinas y unidades de distribución existe la **\"Ficha de prevención de blanqueo de capitales\"** (consulta rápida), accesible en la intranet **Conecta**.\n- **Junio de 2014**: Correos, como agente de **Western Union**, firmó un protocolo de actuación en PBC.\n- **Órganos de la estructura PBC**: Consejo de administración; Comisión de control de PBC; Representante ante el SEPBLAC; Unidad operativa **APBC** (Área de Prevención de Blanqueo de Capitales); responsables de oficinas y unidades de reparto; empleados.\n\n### 7.4. Identificación de los clientes\nIdentificación con documento fehaciente, **previa** a cualquier giro nacional o internacional, **con independencia de modalidad e importe**.\n\n#### 7.4.1. Personas físicas (documento original y en vigor)\n- **Españoles**: **DNI**. El pasaporte solo excepcionalmente (robo, extravío...) con resguardo de denuncia o renovación y solicitud de excepcionalidad al Área de PBC por correo electrónico.\n- **Extranjeros**: tarjeta de residencia o de identidad de extranjero (**NIE**); pasaporte válido con fotografía.\n- **UE, EEE y Suiza**: documento o tarjeta oficial de identidad del país de origen, o pasaporte.\n- **Personal diplomático/consular**: documento del Ministerio de Asuntos Exteriores y de Cooperación.\n- **Tarjeta de Asilo Político** (Tramitación de protección internacional): válida **solo para giro postal, no para Western Union**.\n- **NIP** (autorizados por la Administración) y **NIS** (internos en centros penitenciarios): válidos para españoles y extranjeros.\n- Excepcionalmente, otros documentos gubernamentales con fotografía y garantías de autenticidad, **previa autorización del Área de PBC**, que informa a la siguiente Comisión de Control.\n\n#### 7.4.2. Personas jurídicas\n- Válido cualquier documento público que acredite existencia, denominación, forma jurídica, domicilio, administradores, estatutos, titulares reales y NIF.\n- Españolas: **certificación del Registro Mercantil Provincial** (aportada o por consulta telemática).\n- La persona física que opera se identifica con su DNI y aporta: certificación registral o escritura; **título de representación o poder**; **CIF**.\n- Se escanean el documento del representante, de la persona jurídica y el poder.\n- Obligatorio cumplimentar la **DAE** con los titulares reales, firmada por el representante.\n\n| Tipo de entidad | Documento constitutivo |\n|---|---|\n| S.A. y S.L. | Escritura de constitución |\n| Comunidades de bienes y sociedades civiles | Escritura pública o contrato privado (integrantes, cuota, objeto) |\n| Cooperativas | Escritura de inscripción en el Registro de Sociedades Cooperativas |\n| Fundaciones | Escritura inscrita en el Registro de fundaciones |\n| Asociaciones | Documento de inscripción en el registro de asociaciones |\n\n- **Entidades sin personalidad jurídica**: identificar a todos sus integrantes; si no ejercen actividad económica, basta con su representante.\n\n#### 7.4.3. Documentos no válidos\n- **Permiso de conducir**.\n- **Pasaporte español** (salvo excepción aprobada por el APBC).\n- Cédulas de identidad de países **no UE/EEE**.\n- **Carta Verde** o Certificado de Registro de Ciudadanos de la Unión.\n- **Carnet consular**.\n- **Libreta marítima (Seamansbook)**: solo constata el embarque, no es documento oficial.\n- Quien actúa con autorización o representación de otra persona física se identifica como cliente propio y aporta la autorización/poder y la documentación original del representado.\n- Los documentos se **digitalizan** (soportes ópticos, magnéticos o electrónicos, Ley 10/2010), comprobando la calidad de imagen; valen mientras no caduquen.\n\n### 7.5. Medidas de diligencia debida\nSe aplican cuando hay **indicios** (aunque exista excepción, umbral o exención) o **dudas** sobre los datos.\n- Si pedir información puede alertar al cliente, se puede comunicar al SEPBLAC **sin completar** la diligencia debida.\n- Si no pueden aplicarse durante la relación, Correos **pone fin** a esta (con examen especial si procede); si no es posible terminarla de inmediato, se limitan las operaciones.\n- Se lleva un **registro** de clientes con relación finalizada y sus motivos.\n\n#### 7.5.1. Medidas simplificadas\nPermiten reducir revisiones y seguimiento y no recabar información de la actividad. Se aplican a:\n- Empresas públicas y Administraciones (por su CIF); entidades de derecho público de la UE.\n- Entidades financieras supervisadas de la UE y sus filiales; sociedades **cotizadas** en la UE.\n- **Giros para pago del Servicio Postal** con origen y destino en Correos.\n\n#### 7.5.2. Medidas normales\n- El envío de dinero es **operativa de riesgo alto**: a todos sus clientes se aplican, como mínimo, medidas normales.\n- Incluyen: identificar al **titular real** antes de la operación; conocer por cuenta de quién actúa; en personas jurídicas, estructura de propiedad con la **DAE específica**; conocer propósito de la operación y actividad económica; **seguimiento continuo**.\n- Clientes de riesgo superior o con medidas reforzadas: revisión documental **una vez al año**.\n\n| Medidas normales | Umbral |\n|---|---|\n| Giro nacional e internacional en nombre propio | No superar **3.000 €** (individual o acumulado) **en un trimestre** |\n| Giro internacional con países designados | No superar **1.500 €** acumulados con el último **mes natural** |\n\n#### 7.5.3. Medidas reforzadas\n- Para situaciones de **riesgo elevado**; también a **personas con responsabilidad pública**. La Comisión puede aplicarlas a clientes cuya operativa no encaja con sus antecedentes.\n- La operación **no se realiza** hasta que el cliente acredite el **origen lícito** de los fondos y su actividad.\nCasos:\n- Giro internacional con países de riesgo (incluidos los que exija el **GAFI**, art. 22 RD 304/2014) por **más de 1.500 € en el mes natural**.\n- Giro nacional o internacional que supere **3.000 € en un trimestre natural**.\n- Clientes en requerimientos del SEPBLAC, Juzgados o Policía.\n- Operaciones inusuales o con indicios.\n- Países de riesgo superior al normal, con toma de razón de la Comisión de Control.\n- **Menores de edad**: acompañados de su **tutor legal**, ambos identificados, escaneando documentos y la acreditación de parentesco/representación. Si está **emancipado**, basta la escritura, sin tutor.\n- **Personas de responsabilidad pública** (funciones públicas importantes, familiares de primer grado y allegados): su admisión la autoriza el **Responsable de la Unidad de reparto u Oficina**, que lo traslada al Área de Prevención para la Comisión.\n\n#### 7.5.4. Declaración de Actividad Económica (DAE)\n- Documento que el cliente cumplimenta y firma con los datos de su actividad.\n- Persona física de riesgo elevado o con operaciones inusuales: se le puede pedir (disponible en **Conecta**). Si se niega o da datos falsos, **no se acepta** la operación y se comunica al Área de PBC como sospechosa.\n- Persona jurídica: la trae **cumplimentada** (actividades, titular real, estructura de control, país de residencia y porcentaje de participación).\n- Firman **empleado y declarante**; la supervisa el responsable que autoriza, con su firma y **NIP**.\n\n#### 7.5.5. Documentación justificativa\n- **Envío**: origen lícito (IVA, nóminas...); **pago**: propósito (facturas, contratos...).\n- Giro internacional reforzado con DOI extranjero: acreditar **residencia temporal en España**.\n\n### 7.6. Admisión de clientes\n#### 7.6.1. Clasificación\nFactores: actividad que motiva los envíos; frecuencia y cuantía; origen o destino del dinero.\n\n| Riesgo | Medidas | Admisión |\n|---|---|---|\n| **Bajo** | Simplificadas o normales | Sin autorización específica |\n| **Medio** | Reforzadas | Autorización expresa del director de oficina/Unidad de Reparto o del Área de Prevención (firma de la DAE) |\n| **Alto** | Operaciones inusuales/sospechosas, listas de terroristas, requeridos por Justicia/Policía/Servicio Ejecutivo | **No se admiten** |\n\n#### 7.6.2. Abstención de realizar operaciones\nNo se admiten operaciones de clientes que: se nieguen a identificarse o presenten documentos dudosos; den datos falsos; corten la relación al pedirles información; oculten al titular real; **fraccionen** una transacción; personas jurídicas con estructura de propiedad indeterminada. Si no es posible abstenerse, se ejecuta y se comunica al Área de PBC.\n\n#### 7.6.3. Operaciones sospechosas\n- El empleado se **abstiene** y lo comunica al Área de Prevención, que decide su comunicación al Servicio Ejecutivo.\n- Ejemplos: negativa a identificarse o a la DAE; fraccionamiento; ocultación del cliente real.\n- **ARED**: aplicación de detección automática mediante filtros y alertas y seguimiento continuo.\n- Comunicación al Área: vía **Conecta** (Cómo trabajamos > Normativa > Prevención de Blanqueo > Formulario) o con el **botón rojo \"Avisar operación sospechosa\"** de la aplicación.\n\n| Plazo del Área de PBC | Acción |\n|---|---|\n| **10 días** | Acuse de recibo |\n| **3 meses** desde el acuse | Informar del estado al empleado |\n| **6 meses** máximo | Finalizar análisis y notificar medidas |\n\n- **Lista interna** de clientes comunicados al SEPBLAC para **bloquear su ficha**.\n- **Confidencialidad** total de análisis, comunicaciones e identidad de los empleados.\n\n## 8. El Gobierno Abierto\n- Base constitucional: **art. 9.2 CE** (participación ciudadana) y **art. 105 CE** (acceso a archivos y registros).\n- **Principios**: **colaboración**, **participación**, **transparencia** (información completa, ordenada, clara y accesible) y **rendición de cuentas**.\n\n## 9. Ley 19/2013, de 9 de diciembre, de transparencia\n- Triple alcance: **publicidad activa**, **derecho de acceso** a la información y **buen gobierno**.\n- Crea el **Consejo de Transparencia y Buen Gobierno**.\n\n### 9.1. La Ley 19/2013 en Correos\n- Correos (por pertenecer a la **SEPI**) y Nexea, Correos Telecom y Correos Express (sociedades mercantiles estatales) están sujetas.\n- **Publicidad activa**: información económica e institucional en web, gratuita.\n- **Derecho de acceso**: por solicitud, resuelta en **un mes** desde que la recibe el órgano competente.\n\n## 10. Compromiso ético y transparencia. Política de Compliance\n- Informe de gobierno corporativo según el **RD 1373/2009** (Ley del Patrimonio de las AAPP).\n- **Portal de transparencia** con cuatro bloques: normativa, organizativa, económica y derecho de acceso. Desde **2014**, programa de **prevención de riesgos penales**.\n- **Comité de Cumplimiento**: órgano colegiado que informa **cada seis meses**; impartió formación sobre defensa de la competencia.\n- **SEPI** aprueba cada año el plan de auditoría interna.\n\n### 10.1. Código General de Conducta\n- Aprobado por el Consejo de Administración en **2014**, ratificado por todo el Grupo; de obligado cumplimiento.\n- Ámbito: órganos de administración, comités y direcciones, sociedades vinculadas, empleados y directivos, y **subcontratistas/agentes sin código equivalente**.\n- **Órganos sociales**: diligencia de un ordenado empresario; reserva incluso tras cesar; para cargos en otras empresas, autorización escrita del Órgano de Administración por **mayoría de dos tercios**; transacciones personales con el grupo, autorización por **mayoría**; notificar oportunidades de negocio al Comité de Dirección.\n- **Empleados**: igualdad de trato, rechazo al acoso, promoción por criterios objetivos, Derechos Humanos (Declaración Universal **1948**).\n- **Terceros**: los **conflictos de intereses** se comunican al Comité de Cumplimiento por el Canal de Comunicación y Denuncia.\n- **Administraciones Públicas**: prohibidos regalos y dádivas; prohibidas las **contribuciones a partidos políticos**.\n- Otros: confidencialidad, prohibido software sin licencia, **prohibición de regalos**, subcontratación solo con empresas que cumplan el Código.\n\n### 10.2. Canal de comunicación y denuncia\n- Para empleados y terceros, sobre conductas **presuntamente delictivas**, dirigido al **Comité de Cumplimiento**.\n- Preferentemente mediante formulario web/intranet; uso de **buena fe**; envío por correo postal, electrónico o medio con acuse de recibo.\n- **Confidencialidad**; expediente identificado con referencia, sin datos de los implicados.\n- **Decálogo ético**: cumplimiento ético y legal; igualdad; diversidad; **tolerancia cero**; compromiso social y medioambiental; recursos de la empresa; no regalos; confidencialidad; propiedad intelectual; denuncia **anónima** posible.\n\n### 10.4. Pacto Mundial de Naciones Unidas\n- Adhesión en **2002**. **10 principios**: derechos humanos, negociación colectiva, contra el trabajo forzoso e infantil, no discriminación, medio ambiente (3 principios) y lucha contra la corrupción.\n\n### 10.5. Corporate Excellence\n- Fundación sin ánimo de lucro, **think tank** sobre intangibles (reputación, marca...).\n\n## 11. RSC y Sostenibilidad\n- **Plan de RSC** con tres líneas del **Modelo de alineación con los ODS**: negocio responsable, gestión sostenible y relación con la comunidad.\n- **Agenda 2030**: **17 objetivos y 169 metas**.\n- **ODS prioritarios**: **8, 9, 11, 12 y 13**.\n- **Objetivos 2030**: neutralidad en carbono; **residuo cero**; **50 % de la flota** con tecnologías alternativas; valor local.\n- **Negocio responsable**: servicios de proximidad (Correos Cash, **ORVE**, CityPaq...); **Correos Market**; embalajes **Línea Bosques**; **Envío responsable**; **Correos compensa** (créditos de carbono); **Redondeo con impacto**.\n- **Gestión sostenible**: certificación **UNE-EN ISO 14001:2005**; adhesión al **SMMS**; riesgos climáticos **físicos (adaptación)** y **de transición (mitigación)**; Correos Express con **Vectalia** (ciclomotores eléctricos de **400 kg**); donación de envíos abandonados con **Globechain**.\n- **Comunidad**: proyectos sociales, voluntariado ('Holapueblo') y patrocinios (ADO, ADOP, Federación Española de Balonmano).\n\n## 12. Prevención de Riesgos Penales\n- Programa conforme al **art. 31 bis del Código Penal**; lo aprueba y revisa **anualmente** el **Comité de Cumplimiento**.\n- Exención de la persona jurídica si: modelos de prevención eficaces previos al delito; supervisión por órgano autónomo; los autores eludieron fraudulentamente el modelo; no hubo omisión de supervisión.\n- Requisitos de los modelos: identificar actividades de riesgo, protocolos, gestión de recursos financieros, obligación de informar, **sistema disciplinario**, verificación periódica.\n- Controles **generales** y **específicos**; el Comité informa **semestralmente** al Consejo; el **Área de Cumplimiento** informa al Comité **al menos una vez al trimestre**.\n\n## 13. Prevención de Riesgos Laborales\n### 13.1. Normativa\n- **Ley 31/1995** (LPRL), **RD 39/1997** (Reglamento de Servicios de Prevención) y **Ley 54/2003** (integración de la PRL en la gestión).\n- Mandos intermedios, directores y jefes de cartería informan y vigilan el uso de EPI.\n\n### 13.2. Estructura\n- **Servicio de prevención propio** desde **1999** (ampliado en **2009**).\n- Áreas técnicas: **seguridad en el trabajo** (accidentes), **higiene industrial** (enfermedades profesionales), **ergonomía y psicosociología**; área de **vigilancia de la salud** (medicina del trabajo).\n- Depende de la Subdirección de Salud, dentro de la Dirección de Personas y Relaciones Laborales.\n- **Delegados de Prevención**: representantes de los trabajadores en PRL.\n\n### 13.3. Derechos y deberes\n- **Derechos**: protección, información, vigilancia de la salud, EPI, adaptación del puesto, **interrumpir la actividad ante riesgo grave** sin perjuicio.\n- **Deberes**: velar por su seguridad y la de otros, no modificar dispositivos de seguridad, usar bien equipos y EPI.\n\n### 13.4. Procedimientos y protocolos\n- **Procedimientos** = instrucciones generales; **protocolos** = instrucciones técnicas concretas.\n\n| Código | Procedimiento |\n|---|---|\n| **PR0004** | Investigación de accidentes (causas **inmediatas** y **básicas**) |\n| **PR0005** | Información, consulta y participación (Delegados, **CPSS**, **CESL**) |\n| **PR0006** | Vigilancia de la salud |\n| **PR0011** | Información, formación y competencia (**Fichas de Seguridad y Salud**, validez **2 años**, Portal de Mando) |\n| **PR0013** | Gestión de EPI |\n| **PR0014** | Plan de emergencias (lo elabora el técnico en PRL) |\n| **PR0016** | Trabajadores especialmente sensibles |\n| **PR0017** | Embarazo, lactancia o parto reciente |\n| **PR0020** | Riesgo grave e inminente |\n\n- **EPI**: modalidad **devolución/higienización** (casco, cubrepantalón, chaquetón, ahuyentador de perro) y **depósito** (botas, guantes, chaleco, lumbostato, tapones...).\n- **Plan de emergencias**: **Comité local de emergencias** (se reúne **una vez al mes**), equipos de emergencias y encargado de ascensor.\n- **PR0016**: apto, apto con limitaciones, no apto temporal (con revisión), no apto definitivo (sin revisión y con concurso de traslados).\n- **Protocolos**: carros y jaulas (**PT001**: empujar con ambos brazos, máximo **10 bandejas tipo A o 5 tipo B/C**); carga de moto (carga solo en el cofre cerrado, usar buzón de alcance); agresiones de perros (no mirar a los ojos, no correr, si hay derribo enroscarse y proteger cabeza y cuello); violencia externa; condiciones climatológicas adversas.\n\n## Claves para el examen\n- Conservación de documentos PBC: **10 años**.\n- Sanciones Ley 10/2010: hasta **5 % de recursos propios**; directivos hasta **600.000 €** e inhabilitación máx. **10 años**.\n- Código Penal: **6 meses a 6 años** (negligencia grave: 6 meses a 2 años) y multa del **triple**.\n- Correos es sujeto obligado por el **art. 2.1.j Ley 10/2010**.\n- Sistemas: **IRIS**, **SGIE** (a domicilio), **HERA** (SSRR); detección automática: **ARED**.\n- Pasaporte español y permiso de conducir **no válidos**; asilo político solo para giro postal (no WU).\n- Umbrales: **3.000 €/trimestre**; **1.500 €/mes natural** en países de riesgo.\n- Plazos del Área PBC: **10 días**, **3 meses**, **6 meses**.\n- Ley 19/2013: acceso a la información en **un mes**.\n- Código General de Conducta: **2014**; Pacto Mundial: **2002**; cargos externos: **dos tercios**.\n- Agenda 2030: **17 ODS/169 metas**; prioritarios 8, 9, 11, 12, 13; flota alternativa **50 %**.\n- PRL: servicio propio desde **1999**; Fichas de Seguridad y Salud **2 años**; Comité local de emergencias **mensual**.", "preguntas": [{"p": "¿Durante cuánto tiempo deben conservarse los documentos exigidos por las medidas de diligencia debida en materia de PBC?", "o": ["5 años desde la operación", "6 años desde la operación", "10 años desde la operación", "15 años desde la operación"], "c": 2, "e": "Los documentos se conservan 10 años desde que se ejecuta la operación.", "pag": 1319}, {"p": "En los casos más graves, la Ley 10/2010 prevé para las entidades una multa de hasta:", "o": ["El 5 % de los recursos propios", "El 10 % de los recursos propios", "El 3 % de los recursos propios", "El 15 % de los recursos propios"], "c": 0, "e": "Las sanciones a entidades pueden llegar al 5 % de los recursos propios.", "pag": 1319}, {"p": "¿Cuál es la sanción máxima a directivos y administradores prevista en la Ley 10/2010?", "o": ["Hasta 300.000 €", "Hasta 600.000 €", "Hasta 1.000.000 €", "Hasta 150.000 €"], "c": 1, "e": "Los directivos y administradores pueden ser sancionados con hasta 600.000 €.", "pag": 1319}, {"p": "El Código Penal castiga el blanqueo de capitales doloso con pena de prisión de:", "o": ["Seis meses a dos años y multa del doble del valor", "Un año a cinco años y multa del triple del valor", "Dos a ocho años y multa del duplo del valor", "Seis meses a seis años y multa del triple del valor"], "c": 3, "e": "La pena es de prisión de seis meses a seis años y multa del triple del valor de los bienes.", "pag": 1320}, {"p": "¿En qué artículo de la Ley 10/2010 figura Correos como sujeto obligado?", "o": ["Artículo 2.1.j", "Artículo 2.1.a", "Artículo 22", "Artículo 31 bis"], "c": 0, "e": "Correos es sujeto obligado por el art. 2.1.j (servicios postales respecto a giro y transferencia).", "pag": 1320}, {"p": "¿Qué sistema adaptado a la operativa PBC se utiliza para la admisión y pago de giros en SSRR?", "o": ["IRIS", "SGIE", "HERA", "ARED"], "c": 2, "e": "HERA se usa para la admisión y pago de giros en SSRR.", "pag": 1320}, {"p": "¿Con qué periodicidad debe reunirse el Comité local de emergencias?", "o": ["Una vez a la semana", "Una vez al mes", "Una vez al trimestre", "Una vez al semestre"], "c": 1, "e": "El Comité local de emergencias debe reunirse una vez al mes.", "pag": 1364}, {"p": "¿Qué especialidad técnica de la PRL se ocupa de la prevención de enferm mo", "La regulación de la actividad de cambio de moneda"], "c": 2, "e": "La Ley 12/2003 es de prevención y bloqueo de la financiación del terrorismo.", "pag": 1318}, {"p": "¿Qué norma modifica la Ley Orgánica 8/1980 de Financiación de las CCAA y el Código Penal en relación con el uso de información financiera?", "o": ["Ley 10/2010, de 28 de abril", "Ley 12/2003, de 21 de mayo", "Ley Orgánica 9/2022, de 28 de julio", "Ley Orgánica 10/1995, de 23 de noviembre"], "c": 2, "e": "La LO 9/2022 regula el uso de información financiera y modifica la LO 8/1980 y el Código Penal.", "pag": 1318}, {"p": "¿Qué significan las siglas SEPBLAC?", "o": ["Servicio Ejecutivo de la Comisión de Prevención del Blanqueo de Capitales e Infracciones Monetarias", "Servicio Estatal de Prevención del Blanqueo y Actividades Criminales", "Sistema Electrónico de Prevención del Blanqueo de Capitales", "Secretaría Ejecutiva de Prevención del Blanqueo y Control Aduanero"], "c": 0, "e": "El SEPBLAC es el Servicio Ejecutivo de la Comisión de Prevención del Blanqueo de Capitales e Infracciones Monetarias.", "pag": 1319}, {"p": "¿Cuál es el plazo máximo de inhabilitación que puede imponerse a directivos y administradores según la Ley 10/2010?", "o": ["5 años", "6 años", "10 años", "15 años"], "c": 2, "e": "Se prevé separación del cargo e inhabilitación por un plazo máximo de 10 años.", "pag": 1319}, {"p": "Si el blanqueo de capitales se comete por negligencia grave, la pena de prisión prevista es de:", "o": ["Seis meses a dos años", "Tres meses a un año", "Seis meses a seis años", "Uno a tres años"], "c": 0, "e": "Por negligencia grave la pena es de prisión de seis meses a dos años y multa del triple del valor.", "pag": 1320}, {"p": "En los casos más leves de infracción de la Ley 10/2010, la sanción a directivos puede consistir en:", "o": ["Una multa del 1 % de los recursos propios", "La suspensión de empleo durante un mes", "La revocación de la autorización para operar", "Una amonestación pública o privad ra identificar al personal de representaciones diplomáticas o consulares en España?", "o": ["El carnet consular de su país", "La Carta Verde", "El expedido por el Ministerio del Interior", "El expedido por el Ministerio de Asuntos Exteriores y de Cooperación"], "c": 3, "e": "Es válido el documento que expide el Ministerio de Asuntos Exteriores y de Cooperación.", "pag": 1322}, {"p": "La Tarjeta de Asilo Político (Tramitación de protección internacional) es válida como documento identificativo:", "o": ["Para giro postal y para Western Union", "Solo para Western Union", "Para ninguna operación de giro", "Solo para operaciones de giro postal, no para Western Union"], "c": 3, "e": "Solo para operaciones de giro postal (no para Western Union) se considera válida.", "pag": 1322}, {"p": "¿Qué identifica el NIS, válido como documento identificativo?", "o": ["A los autorizados por la Administración", "A los extranjeros residentes", "A los internos en centros penitenciarios", "A los menores no emancipados"], "c": 2, "e": "El NIS es el número que identifica a los internos en los centros penitenciarios.", "pag": 1322}, {"p": "Para identificar a una persona jurídica de nacionalidad española puede presentarse:", "o": ["La certificación del Registro Mercantil Provincial", "El permiso de actividad municipal", "La última declaración del IVA", "El certificado de la Seguridad Social"], "c": 0, "e": "Pueden presentar la certificación del Registro Mercantil Provincial, aportada o por consulta telemática.", "pag": 1322}, {"p": "¿Qué documento constitutivo debe presentar una Sociedad Cooperativa?", "o": ["El contrato privado de constitución", "El documento de inscripción en el registro de asociaciones", "La escritura inscrita en el Registro de fundaciones", "La escritura de inscripción en el Registro de Sociedades Cooperativas"], "c": 3, "e": "Las Sociedades Cooperativas presentan la escritura de inscripción en el Registro de Sociedades Cooperativas.", "pag": 1323}, {"p": "En una entidad
