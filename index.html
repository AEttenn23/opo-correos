nales: C1, TC, IO, TI (servicio internacional suspendido).\nEstados: Admitido → Cumplimentado → Solicitado envío → Publicado → Enviado → **Confirmado** (SGIE).\n\n## 6. Marketing directo, libros y publicaciones\n- Ruta **Línea económica**: Cecogramas, Libros, Publicorreo, Publicaciones Periódicas y Publibuzón.\n- **Postlibris**: solo red de oficinas (no UAM), DOI y Tarjeta Más Cerca, etiqueta **OR** de Mi Oficina; certificado como Paq Estándar Oficina Elegida.\n\n## 7. Cobro de recibos e impuestos\n- **Caja Mágica**: lee códigos/nubes de puntos de recibos, Correos Cash y Correos Pay (no envíos postales).\n- **Portal de Servicios al Ciudadano** (Trámites CC.AA.): ITP en **Cataluña** (CP 08, 17, 25, 43) y **Andalucía** (CP 04, 11, 14, 18, 21, 23, 29, 41); certificados y pago de tributos en Andalucía.\n- ITP: DNI, ficha técnica, contrato de compraventa y permiso de circulación; consulta DGT; efectivo máximo **999,99 €**; no cancelable una vez continuada.\n\n## 8. Envío de dinero\n- **SEDI** sustituye al giro: \"órdenes de envío\", código de **13 caracteres** (ED + 8 números + 3 caracteres, p. ej. VIN). IRIS admite y paga; **SGIE** gestiona el reparto.\n- Modalidades: Giro Nacional (inmediato, ordinario a domicilio, **OIC**), Giro Oficial y Giro Internacional UPU (IFS). Comunicación privada gratuita de **140 caracteres** (no en el inmediato).\n- Domicilio/apartado: destinatario en base **PBC** con DOI (exentos oficiales, reembolso, internacionales e inmediatos). Digitalizar DOI salvo giros oficiales y Correos Pay. Archivo en **Ágora**.\n- Especiales: reclusos (NIS caduca **01/01/9999**, hoy vía Correos Pay); giros oficiales (CIF **A83052407**); menores acompañados.\n- **Correos Cash**: modalidad OIC; Correos es sujeto obligado PBC. Santander: reintegro = Giro inmediato **SIS** (QR válido **7 días**); ingreso = Giro OIC **VIT** (con PBC).\n- **Cheques**: solo **Banco Mediolanum**; nominativo, barrado, firmado en reverso; IBAN de 24 dígitos; sobre DIN A5; Paq Premium (código 23 dígitos), mismo día.\n- **Correos Pay** (antes T€nvío): básico **2,95 €**, premium **1,95 €**, exentos de IVA, a cargo del pagador; abono en **72 horas**. Código **VTE**; sin control PBC. Premium: cuadernos 57, 60 y 65. Incluye Málaga (**Gestrisam**) y **ZBE Barcelona** (máx. **10 autorizaciones** al año, lunes a viernes no festivos).\n- **CEDICO** (envíos los días 1 y 16) se sustituye por **Ágora**; se mantiene para la ONCE.\n\n## 9. Western Union\n- Aplicación **Wupos** (IRIS>>Llamadas a sistemas externos>>Dinero). ID no es el usuario C ni va por SIGUA; altas en \"Plantilla Western Union\". Primera clave **RESET100**; mínimo **8 caracteres** con un número; bloqueo tras **3 intentos**.\n- Prohibido enviar en nombre de terceros o fraccionar. Más de **3.000 € por trimestre natural**: mensaje R8024. Justificante con **MTCN**; no queda copia en oficina.\n- Pregunta de verificación (4 palabras): no admitida en España. Disponible unos **90 días**; reactivación vía **23340**. Cobro con cantidad ±10 %.\n\n## 10. Tarjetas en IRIS\n- **Prepago**: se opera con el código de **12 dígitos** del embalaje (no el de 16). Bloqueo a menores; móvil obligatorio; prueba de dirección SEPA. Reemplazo por deterioro, pérdida o caducidad (un mes antes). Baja: **14 días** de reflexión, saldo a cero. Solo el titular recarga.\n- **Regalo**: carga entre **20 y 150 €**; anulación solo el mismo día.\n\n## 11. Archivo de documentación\n\n| Serie | Documentos | Caducidad |\n|---|---|---|\n| 01 | Albaranes, M11A, M11i, FRC, TG.1 | 6 meses |\n| 02 | M4 en papel y autorizaciones | 8 meses |\n| 05 | Tarjeta prepago, ticket balanza | 5 años |\n| 08 | Procesos electorales | 5 años |\n| FAX-2 | Burofax | Una semana |\n| — | Documentación clientes envío de dinero | 10 años |\n\n## 12. Clasificación y contenerización\n- Bandejas **A** (pequeña), **B** (mediana) y **C** (grande), sin tapa; **azules** solo para IPC. Usar la más pequeña posible.\n- Normalizadas con sello: tipo A, etiqueta de **buzones**, sin matasellar. Normalizado: etiqueta blanca **E.1**; internacional: etiqueta azul oscuro **E.I.5**; Publibuzón: verde **E3**. Matasellos filatélicos solo a petición, nunca en bandeja de buzones.\n- Registrado: separación por espesor (**7 mm**) y provincias; \"Devolver al centro de control de certificados\"; CEX con albarán.\n- No hay despachos para registrados salvo electorales: **SV, DE, DN, VE**. Todo debe salir en la primera conducción; no grabar pendientes los sábados.\n\n## 13. Procesos electorales\n- Solicitud de voto desde la publicación en el BOE hasta el **décimo día anterior** a la votación.\n- DOI válidos: DNI, pasaporte o carné de conducir con fotografía (originales, aunque caducados). En locales, además tarjetas de residentes UE y de países con reciprocidad.\n- Enfermedad: autorizado ante notario o cónsul con certificado médico. El elector introduce la solicitud en el sobre; pierde el voto presencial.\n- IRIS>>Admisión>>Procesos electorales; CP de destino acaba en **071**; no se cobra bolsa. Voto a la Mesa antes del **tercer día** previo; entrega a las Mesas a las **09:00** y hasta las **20:00**.\n- Recogida con aviso **M4E**; PDA Talina. Despacho \"Urgente Elecciones\"; caja fuerte si no salen.\n\n## 14. Seguridad en la oficina\n- Llaves: responsable el director; si se pierde una, cambiar cerradura. Caja fuerte cerrada con retardo; combinación cambiada al menos **una vez al año**, conocida por **2-3 personas**.\n- Cajón portamonedas y submostradores: máximo **400 €** para cambio.\n- Robo con fuerza: no entrar/salir y avisar al COS. Robo con intimidación: obedecer, no resistir; cerrar puertas al marcharse; denuncia el responsable.\n- Objeto sospechoso: no tocar, aislar, abrir puertas y ventanas, avisar al COS. Envío sospechoso: peso excesivo, manchas de grasa, olor a almendras amargas, cables, sin remite, exceso de franqueo.\n- **COS**: 24 h, 365 días; un responsable y dos suplentes; averías por email **cos@correos.com** (o 91 596 30 06).\n\n## Claves para el examen\n- Usuario IRIS: **C + 6 dígitos**; CP obligatorio en certificadas y ordinarias > **250 g**.\n- Etiquetas: pequeña **10 x 3,8**, mediana **10 x 6**, grande **14,5 x 10**; códigos **CD, VD, RF, VV, CU, ORD, US**.\n- Admisión múltiple obligatoria con **más de 30** envíos y solo nacional.\n- Notificaciones: **2 intentos** y **7 días naturales** en oficina.\n- CN23 a partir de **300 DEG (300 €)**; TARIC de **6 cifras**.\n- Paquetería: códigos de **23** (nacional) y **13** (internacional) caracteres; Paq Premium prepagado **350 g / 1 kg**.\n- Paq Today **15-21 h**; expediciones **3 días**; EPG **30 días**; Paq Light Internacional **2 kg**.\n- Burofax Premium Plus: custodia **60 meses**; ampliable a **120**; telegramas: unidad tasable **10 caracteres**.\n- Correos Pay **2,95 € / 1,95 €**, abono en **72 h**; WU: **3.000 €/trimestre**, clave inicial **RESET100**.\n- Tarjeta Regalo **20-150 €**; Prepago: **14 días** de reflexión.\n- Voto por correo hasta el **décimo día** anterior; CP de destino en **071**.\n- Efectivo de cambio máximo **400 €**; COS **24 h/365 días**.", "preguntas": [{"p": "¿Cómo está compuesto el usuario corporativo para acceder a IRIS?", "o": ["La letra C seguida de seis dígitos", "La letra C seguida de ocho dígitos", "La letra U seguida de seis dígitos", "El NIP del empleado seguido de una letra"], "c": 0, "e": "El usuario corporativo comienza con la letra C seguida de seis dígitos (C123456).", "pag": 523}, {"p": "En la admisión de cartas ordinarias, el código postal es dato obligatorio en las de peso superior a:", "o": ["100 g", "250 g", "500 g", "20 g"], "c": 1, "e": "El CP es obligatorio para las certificadas y para las ordinarias de más de 250 gramos.", "pag": 524}, {"p": "En admisiones unitarias de cartas ordinarias de hasta 30 envíos del mismo peso (inferior a 250 g), IRIS genera una etiqueta de:", "o": ["10 x 6 cm", "14,5 x 10 cm", "10 x 3,8 cm", "10 x 14,5 cm"], "c": 2, "e": "Se franquean con etiquetas pequeñas de 10 x 3,8 cm colocadas en la parte superior derecha.", "pag": 525}, {"p": "Una carta ordinaria con mercancías dirigida a un tercer país lleva una etiqueta grande con código de barras que comienza por:", "o": ["ORD", "CD", "RF", "US"], "c": 3, "e": "Lleva etiqueta grande (14,5 x 10 cm) con código que empieza por US y el formulario CN22 incorporado.", "pag": 526}, {"p": "La admisión múltiple o por relación de cartas certificadas es obligatoria para clientes que presenten:", "o": ["Más de 10 envíos", "Más de 30 envíos", "Más de 50 envíos", "Más de 100 envíos"], "c": 1, "e": "Es obligatoria con más de 30 envíos, recomendable desde tres o cuatro y solo en ámbito nacional.", "pag": 529}, {"p": "En las cartas certificadas internacionales de menos de 250 g, el código de barras de la etiqueta pequeña empieza por:", "o": ["RF", "CD", "VV", "CU"], "c": 0, "e": "Se identifican con la letra R y su código de barras comienza por RF.", "pag": 529}, {"p": "En una carta certificada con valor declarado precintada en caja de madera, el espesor mínimo de la caja es de:", "o": ["5 mm", "6 mm", "8 mm", "10 mm"], "c": 2, "e": "Las cajas de madera deben tener un espesor mínimo de 8 mm.", "pag": 531}, {"p": "En la Carta Certificada Tarifa Plana, el valor declarado puede añadirse con cargo adicional hasta:", "o": ["600 euros", "1.500 euros", "6.000 euros", "3.000 euros"], "c": 3, "e": "Se puede añadir el valor declarado hasta 3000 euros con cargo adicional.", "pag": 532}, {"p": "El contenido de una Carta Certificada Prepagada Premium nunca puede superar:", "o": ["100 g", "250 g", "350 g", "500 g"], "c": 0, "e": "El contenido del envío nunca debe superar los 100 g.", "pag": 533}, {"p": "Una notificación que no se ha podido entregar tras los dos intentos permanece avisada en la oficina:", "o": ["15 días naturales", "7 días naturales", "10 días hábiles", "5 días hábiles"], "c": 1, "e": "Pasa como avisada a la oficina, donde permanece siete días naturales antes de devolverse.", "pag": 533}, {"p": "En las cartas certificadas sujetas a trámites aduaneros, se exige el CN23 cuando el valor del contenido supera:", "o": ["150 DEG", "200 DEG", "300 DEG", "500 DEG"], "c": 2, "e": "Si el valor supera 300 DEG (igualado a 300 €), el impreso será el CN23.", "pag": 535}, {"p": "Señale la afirmación INCORRECTA sobre la admisión por el sistema de procedimiento administrativo:", "o": ["Los escritos se presentan en sobre abierto", "Se hace constar la hora y el minuto de la admisión", "Se aplica a escritos dirigidos a colegios profesionales", "Es el empleado quien cierra el sobre tras sellar el documento"], "c": 3, "e": "Es el remitente quien debe cerrar el sobre en presencia del empleado.", "pag": 537}, {"p": "¿Cuántos caracteres tiene el código de barras de la paquetería de ámbito nacional?", "o": ["23", "13", "20", "15"], "c": 0, "e": "Consta de 23 caracteres en el ámbito nacional y Paq Return Internacional, y de 13 en el internacional.", "pag": 539}, {"p": "Los dos primeros caracteres del código de un Paq Premium con entrega a domicilio son:", "o": ["PQ", "PK", "PL", "PD"], "c": 1, "e": "Según la tabla de códigos, Paq Premium domicilio se identifica con PK.", "pag": 540}, {"p": "En el servicio de Prepagados de Paq Premium, el sobre pequeño admite un peso de hasta:", "o": ["250 g", "500 g", "350 g", "1 kg"], "c": 2, "e": "El sobre pequeño llega hasta 350 g y el grande hasta 1 kg.", "pag": 544}, {"p": "La franja horaria de entrega del Paq Today, tanto centralizado como descentralizado, es:", "o": ["De 9:00 a 14:00 horas", "De 14:00 a 20:00 horas", "De 16:00 a 22:00 horas", "De 15:00 a 21:00 horas"], "c": 3, "e": "La franja de entrega es entre las 15:00 y las 21:00 horas.", "pag": 546}, {"p": "En una expedición en la que faltan bultos prerregistrados, el cliente dispone para depositarlos de un plazo de:", "o": ["Tres días", "Cinco días", "Siete días", "Diez días"], "c": 0, "e": "El cliente tiene tres días; si no, la expedición se cursa sin ellos.", "pag": 547}, {"p": "La devolución de logística inversa eCommerce EPG debe admitirse antes de que transcurran, desde la generación de la etiqueta:", "o": ["15 días", "30 días", "60 días", "90 días"], "c": 1, "e": "Debe hacerse antes de 30 días desde que se generó la etiqueta; si no, IRIS lo da como caducado.", "pag": 549}, {"p": "El Paq Light Internacional está pensado para envíos urgentes de poco valor con un peso máximo de:", "o": ["1 kg", "5 kg", "2 kg", "10 kg"], "c": 2, "e": "Es para envíos urgentes de poco valor y hasta 2 kg que no requieran firma.", "pag": 553}, {"p": "En el EquiPaq 24 de Correos Express pueden enviarse:", "o": ["Hasta tres maletas de 20 kg cada una", "Hasta cuatro maletas de 30 kg cada una", "Hasta seis maletas de 25 kg cada una", "Hasta cinco maletas de 25 kg cada una"], "c": 3, "e": "Se indica el número de maletas, hasta cinco, con un peso máximo de 25 kg por maleta.", "pag": 559}, {"p": "En los embalajes de tarifa plana internacional de Correos Express con destino Chile, el código de identificación requerido es el:", "o": ["RUT", "RUC", "CUIT", "VAT"], "c": 0, "e": "Para Chile se exige el RUT (Rol Único Tributario).", "pag": 561}, {"p": "El Burofax Premium Plus incluye en su precio un plazo de custodia de:", "o": ["12 meses", "60 meses", "120 meses", "36 meses"], "c": 1, "e": "Incluye copia certificada, custodia de 60 meses y PEF o PEE a elección del cliente.", "pag": 565}, {"p": "En los telegramas de régimen internacional, una unidad tasable es cada grupo de caracteres que no exceda de:", "o": ["5 caracteres", "8 caracteres", "10 caracteres", "15 caracteres"], "c": 2, "e": "La unidad tasable no excede de 10 caracteres; si excede, se cuenta una por cada 10 o fracción.", "pag": 569}, {"p": "La comunicación privada gratuita que pueden incluir los giros (excepto el inmediato) tiene un máximo de:", "o": ["100 caracteres", "160 caracteres", "200 caracteres", "140 caracteres"], "c": 3, "e": "Todos los giros, excepto el inmediato, pueden incluir una comunicación privada gratuita de hasta 140 caracteres.", "pag": 581}, {"p": "Señale el requisito INCORRECTO para el ingreso de cheques del Banco Mediolanum en oficina:", "o": ["Puede tratarse de un cheque al portador", "Debe ir barrado con dos líneas diagonales", "Debe ir firmado en el reverso por el titular de la cuenta", "Puede ser de cualquier banco español o con sucursal en España"], "c": 0, "e": "Nunca puede ser al portador; debe ser un cheque nominativo.", "pag": 589}, {"p": "La tarifa del servicio Correos Pay básico, a abonar por quien realiza el pago, es de:", "o": ["1,95 €", "2,95 €", "3,50 €", "2,50 €"], "c": 1, "e": "Correos Pay básico cuesta 2,95 € y Correos Pay premium 1,95 €, exentas de IVA.", "pag": 594}, {"p": "En Western Union, Wupos rechaza la operación cuando, sumada a otras del mismo cliente en el mismo trimestre natural, se superan:", "o": ["1.000 €", "2.500 €", "3.000 €", "6.000 €"], "c": 2, "e": "Al superar 3000 € en el trimestre natural se emite el mensaje R8024-TRXN RECHAZADA.", "pag": 603}, {"p": "La baja de una Tarjeta Correos Prepago con devolución debe solicitarse dentro del periodo de reflexión de:", "o": ["7 días", "30 días", "10 días", "14 días"], "c": 3, "e": "Si se produce en el periodo de 14 días de reflexión, se comprueba DOI y tique de compra en la misma oficina.", "pag": 612}, {"p": "Señale el documento que NO se considera DOI válido para solicitar el voto por correo en elecciones generales:", "o": ["El resguardo de tramitación del DNI", "El pasaporte con fotografía", "El carné de conducir con fotografía", "El DNI original aunque esté caducado"], "c": 0, "e": "El resguardo de tramitación no sirve porque carece de fotografía.", "pag": 629}, {"p": "Ante un robo con intimidación en la oficina, señale la actuación INCORRECTA:", "o": ["Obedecer las órdenes del atracador", "Cerrar las puertas cuando el atracador abandone la oficina", "Ofrecer resistencia para proteger el efectivo", "Comunicarlo al COS y a las fuerzas de seguridad"], "c": 2, "e": "No se debe huir, pedir auxilio ni ofrecer resistencia, sino obedecer al atracador.", "pag": 638}, {"p": "¿Cuál es la última versión de la aplicación IRIS?", "o": ["6.0", "5.0", "7.0", "6.5"], "c": 0, "e": "La última versión es la 6.0, de ahí que se denomine IRIS 6.", "pag": 523}, {"p": "Al marcar en IRIS que una carta contiene mercancía peligrosa, se le adhiere:", "o": ["Una pegatina triangular naranja y se cursa ordinaria", "Una pegatina redonda verde y se cursa registrada", "Una pegatina roja y se cursa por Correos Express", "Una etiqueta amarilla y se cursa urgente"], "c": 1, "e": "Se adhiere la pegatina redonda verde y se cursa registrado, separado del resto.", "pag": 524}, {"p": "En remesas de cartas ordinarias de más de 30 envíos del mismo peso, IRIS:", "o": ["Genera una etiqueta pequeña por cada envío", "Genera una única etiqueta grande para toda la remesa", "No genera etiquetas y calcula el número de envíos a partir del peso total", "Exige grabar los envíos uno a uno con su CP"], "c": 2, "e": "Con la opción 'Admisión masiva, solo envíos del mismo peso' se introduce el peso total y el sistema calcula número e importe.", "pag": 525}, {"p": "Señale la afirmación INCORRECTA sobre el cobro de la bolsa en IRIS:", "o": ["Por defecto aparece marcada la opción sin factura", "El tique por correo electrónico aparece marcado por defecto", "Se puede guardar una bolsa con 'Nuevo Cliente y Guardar'", "Pueden quedar bolsas pendientes de cobro al hacer el cierre de caja"], "c": 3, "e": "No pueden quedar bolsas pendientes cuando va a realizarse el cierre de caja.", "pag": 525}, {"p": "Las cartas ordinarias nacionales admitidas en oficina con más de 250 g llevan una etiqueta:", "o": ["Mediana de 10 x 6 cm con código de barras", "Pequeña de 10 x 3,8 cm sin código", "Grande de 14,5 x 10 cm con CN22", "Mediana de 10 x 6 cm sin código"], "c": 0, "e": "Admisión unitaria con etiqueta mediana con código de barras (10 x 6 cm).", "pag": 525}, {"p": "¿Qué impreso se usaba para los envíos registrados internacion o y:", "o": ["Cuatro lacres con la marca del remitente", "Tres lacres con la marca del remitente", "Dos lacres con la marca del remitente", "Cinco lacres con la marca del remitente"], "c": 3, "e": "Cosido o cruzado con bramante con un solo nudo y cinco lacres con la marca del remitente.", "pag": 531}, {"p": "La Carta Certificada Tarifa Plana Premium incluye en su precio:", "o": ["Prueba de entrega electrónica PEE 5", "Aviso de recibo M35", "Valor declarado hasta 3000 €", "Reembolso hasta 200 €"], "c": 0, "e": "La modalidad Premium incluye la prueba de entrega electrónica PEE 5, por lo que requiere un email.", "pag": 532}, {"p": "Las notificaciones presentadas por un cliente con contrato llevan adherida la etiqueta:", "o": ["NT si es tributaria o NJ si es judicial", "NA si es administrativa o NJ si es judicial", "AR si es administrativa o PEE si es judicial", "CU si es urgente o CD si es ordinaria"], "c": 1, "e": "Deben llevar etiqueta NA de notificación administrativa o NJ de notificación judicial.", "pag": 534}, {"p": "Si el depositante de notificaciones de una Administración pide factura a favor de una empresa distinta del remitente, los envíos se admiten como:", "o": ["Notificación administrativa", "Carta certificada urgente", "Carta certificada con aviso de recibo", "Carta ordinaria con PEE"], "c": 2, "e": "En ese caso se admiten como carta certificada con aviso de recibo, en ningún caso como Notificación.", "pag": 535}, {"p": "¿Qué artículo de la Ley 39/2015 permite presentar en Correos los documentos dirigidos a las Administraciones públicas?", "o": ["Artículo 14", "Artículo 21", "Artículo 38", "Artículo 16"], "c": 3, "e": "El artículo 16 de la Ley 39/2015 indica que pueden presentarse en oficinas de Correos.", "pag": 536}, {"p": "Si el peso volumétrico de un paquete no coincide con el real, el importe se calcula:", "o": ["En función del peso volumétrico", "En función del peso real", "Por la media de ambos pesos", "Siempre por el mayor de los dos lados"], "c":  "Trinidad y Tobago"], "c": 0, "e": "La lista incluye Bolivia, Cabo Verde, Chile, Colombia, Corea del Sur, Ecuador, Islandia, Noruega, Nueva Zelanda, Paraguay, Perú y Trinidad y Tobago.", "pag": 629}, {"p": "Correos traslada la correspondencia electoral a las Mesas el día de la votación a las:", "o": ["08:00 horas", "09:00 horas", "10:00 horas", "12:00 horas"], "c": 1, "e": "La trasladará a las Mesas electorales a las 09:00 h, pudiendo entregar nueva hasta las 20:00 h.", "pag": 630}, {"p": "En la solicitud de voto con formulario autocopiativo de la oficina, el código postal de destino siempre acaba en:", "o": ["001", "070", "071", "999"], "c": 2, "e": "El código postal siempre acaba en 071.", "pag": 630}, {"p": "La combinación de la caja fuerte deben conocerla:", "o": ["Solo el director de la oficina", "Como mínimo tres y como máximo cinco personas", "Todo el personal de la oficina", "Como mínimo dos y como máximo tres personas"], "c": 3, "e": "Las personas que la conocen serán como mínimo dos y como máximo tres.", "pag": 636}, {"p": "La cantidad máxima de efectivo para cambio permitida en el cajón portamonedas es de:", "o": ["400 €", "300 €", "500 €", "600 €"], "c": 0, "e": "No está permitido tener más de 400 € en estos cajones.", "pag": 637}, {"p": "Las averías en los sistemas de seguridad se comunican exclusivamente al COS y siempre por:", "o": ["Teléfono 23340", "Correo electrónico (cos@correos.com)", "Aplicación SIGUA", "Incidencia en el CAU"], "c": 1, "e": "Se comunicará al COS siempre por correo electrónico; si no se dispone, al teléfono 91 596 30 06.", "pag": 640}]}, {"letra": "H", "titulo": "Procesos operativos de tratamiento y transporte", "paginas": "641-752", "resumen": "## 1. Red de centros logísticos\nEl elemento principal de la cadena logística (**Admisión > Tratamiento > Transporte > Distribución**) es la red de centros: **CTA**, **CTP**, **CTL**, **CAM** (centro de admisión masiva), **CTI**, expansión internacional y oficinas de cambio extraterritoriales.\n\n### 1.1. Centro de tratamiento automatizado (CTA)\n- Objetivo: mejorar la calidad en la distribución. **92 equipamientos** automatizados (datos 2019).\n- Existen **18 CTA** repartidos por áreas:\n\n| Área | CTA (provincias atendidas) |\n|---|---|\n| Noroeste | Santiago (A Coruña, Lugo, Orense, Pontevedra), Oviedo (Asturias), Valladolid (Ávila, Burgos, Palencia, Salamanca, Segovia, Valladolid, León, Zamora) |\n| Norte | Bilbao (Vizcaya), Vitoria (Álava, Guipúzcoa, Cantabria, La Rioja), Zaragoza (Huesca, Teruel, Zaragoza, Soria, Navarra) |\n| Noreste | Sant Cugat (Barcelona, Tarragona, Lleida, Girona), Colón (Barcelona ciudad) |\n| Centro | Madrid (Madrid, Toledo, Ciudad Real, Cuenca, Guadalajara, Albacete), Mérida (Cáceres, Badajoz) |\n| Este | Valencia (Castellón, Valencia), Alicante (Alicante, Murcia), Mallorca (Baleares) |\n| Sur | Sevilla (Cádiz, Huelva, Sevilla, Córdoba, Ceuta), Málaga (Melilla, Málaga), Granada (Almería, Granada, Jaén) |\n| Insular | Tenerife (El Hierro, La Gomera, La Palma, Tenerife), Las Palmas (Gran Canaria, Lanzarote, Fuerteventura) |\n\n- Funciones: tratamiento del correo automatizable de entrada/salida; **consolidación** (agrupar envíos en un envase con número de seguimiento) y **desconsolidación** de registrados; plataforma logística zonal.\n\n### 1.2. CTP y 1.3. CTL\n- **CTP**: intercambio a nivel provincial; en general **clasificación manual**; objetivo: encaminar el correo al CTA. Funciones: admisión provincial, tratamiento manual provincial, **UPR provincial**, plataforma logística provincial.\n- **CTL**: similares a los CTP pero solo dentro de una localidad (ej.: **Mahón, Ibiza, Vigo**).\n\n### 1.4. Unidades de admisión masiva (UAM)\n- Canal de relación con **clientes con contrato**: admisión y gestión de incidencias de envíos de clientes, agencias comerciales, consolidadoras y otros operadores.\n- Una UAM por CTA (y algunas por CTP: San Sebastián, Pamplona); UAM Barcelona para **CLI Barcelona**; UAM Madrid 2 para **CAM 2**.\n\n### 1.5. Centros logísticos en Madrid y Barcelona\n- **CTA Madrid**: admisión de Publicorreo, prensa, cartas masivas; tratamiento de cartas, IPC importación/exportación, ecommerce SCG de grandes clientes.\n- **CAM 1 Madrid**: paquetería voluminosa no automatizable y UPR manual.\n- **CAM 2 Madrid**: paquetería, UPR automatizable en SCG/SCP (no tramita certificados ni notificaciones), devoluciones de grandes clientes.\n- **CREL Chamartín** (Centro Regulador de Elementos Logísticos): almacén regulador de todos los CTA; paletiza bandejas vacías, almacena jaulas/carros rotos hasta su reparación, recibe sacas y bandejas de la **Fundación A LA PAR**, centro de control provincial de Notificaciones.\n- **CTA Sant Cugat**: automatizado de cartas y Publicorreo; **CTA Colón**: manual con destino local; **CLI Barcelona**: admisión masiva y paquetería automatizada; **CTP El Prat**: internacional de exportación y vía aérea.\n\n### 1.6. Centro de tratamiento internacional (CTI)\nCuatro centros, todos en **Barajas**:\n- **CTI**: expedición del correo de exportación, IPC de exportación, **Paq Premium Internacional y EPG**.\n- **CCP**: clasificación mecanizada de paquetería internacional y tratamiento **aduanero**.\n- **CI3**: tratamiento automatizado (SCG) de **eCommerce internacional**.\n- **CAM 4**: centro aduanero de exportación de paquetería a **Canarias, Andorra, Ceuta, Melilla** y países no UE.\n\n### 1.7. Expansión internacional. ETOE\n- Oficinas de cambio extraterritorial: **Reino Unido (2015)** y **Países Bajos (2016)**.\n- 2019: centro en **China continental** capaz de procesar **500.000 envíos diarios**.\n- **Proyecto Rampa 7** (Barajas): unos **12.542 m²** para importación; capacidad de **10.000 objetos/hora**; subsistemas de paquetes y bandejas (**59 rampas**), pequeños paquetes ecommerce (**104 rampas**) y sacas; gestión de **ULD**.\n\n## 2. Red de transporte\nCuatro tipos: troncal o interzonal, zonal, provincial y local.\n\n| Red | Ámbito / función |\n|---|---|\n| **Troncal o interzonal** | Nacional; une zonas. Subredes: **estrella** (origen Madrid), **abanico** (origen Barcelona), **periférica/transversal** (sin pasar por Madrid ni Barcelona, aunque algunas rutas hacen escala en Madrid) |\n| **Zonal** | Une el CTA zonal con los CTP de su zona |\n| **Provincial** | Une CTA/CTP con las oficinas de la provincia (tendencia a rutas multiprovinciales) |\n| **Local** | Urbana: recogida de buzones y unión de centros y oficinas de la misma localidad |\n\n## 3. Equipamiento postal en centros de tratamiento\n### 3.1. Elementos logísticos asociados al transporte\n**Bandejas**: elemento principal de contenerización, plástico, forma de tronco piramidal.\n- Colores: nacional **amarillo y azul** (antes amarillo y gris); IPC importación **azul claro y oscuro**; exportación IPC **azul oscuro con tapa negra**.\n- Tapas amarillas y aletas abatibles (**flips**).\n\n| Tipo | Capacidad | Profundidad | Volumen | Uso |\n|---|---|---|---|---|\n| **A** (pequeña) | ~400 envíos (hasta 800) | 152 mm | **13 l** | Normalizados (IRV-FSM), manual y UPR |\n| **B** (mediana) | ~100 envíos | 291,5 mm | **26 l** | No normalizado/flat |\n| **C** (grande) | 3 a 15 envíos | 291,5 mm (565 mm ancho) | **60 l** | Gordo, paquetería menor, SCG |\n\n- A efectos estadísticos: **tipo A = 340 envíos**, **tipo B = 80 envíos**.\n\n**Otros elementos:**\n\n| Elemento | Datos clave |\n|---|---|\n| **Jaulas** | 120x100x180 cm, hasta **128 kg**, **2 m³**; 3 lados cerrados y 3 eslingas; cadena antiestática; red zonal e interzonal |\n| **Carro transportador de bandejas** | Mueve hasta **450 kg**; doble freno; 120x60x175 cm; 1 m³; 54 kg (sin kit) / 62 kg (con kit). Admite 40 A apiladas (100 vacías), 20 B (80), 10 C (40) |\n| **Contenedor plegable reutilizable** | Plegado 100x100x40, extendido 100x100x110 cm; 1 m³; vuelve plegado a Madrid diariamente |\n| **Palés** (1 m³) | Americano plástico 120x100; europeo plástico 120x80; europeo madera 120x80 |\n| **Camarera** (carro portabandejas) | Acero inoxidable; grande (3 bandejas por estante) y pequeño (2) |\n| **Sacas de buzón cilíndrico** | Poliamida blanca; 700 mm alto, 1400 mm perímetro |\n| **Cartones retractiladores** | Bajo/baúl 76x116x90 y alto 80x120x160 cm; 1 m³ |\n| **Bolsa de rafia extragrande** | SCG local/provincial; hasta 4 por carro; 70x55x45 cm |\n\n### 3.2. Mobiliario y equipamiento\n- **Carro expositor**: 4 baldas = 16 bandejas A; 3 baldas = 12 A o B, o 6 C.\n- **Robot retractilador**: necesita **1150 mm** libres alrededor; film de 500 mm (bobina máquina máx. 17 kg; manual máx. 3 kg).\n- **Flejadora**: flejes de polipropileno de **6 a 15 mm**; obligatorio flejar bandejas que viajan **por avión**.\n- **EGE** (estación generadora de etiquetas): etiquetas de bandejas de tratamiento manual.\n- **Canceladora eléctrica de alta producción**: normalizados y C5 de menos de 6 mm; hasta **13.000 cartas/hora**.\n- Portamapas (DIN A3) y casilleros **CN50** (normalizado y AR) y **CNN50** (no normalizado).\n\n### 3.3. Vehículos y transporte interno (VTI)\n- **Apilador eléctrico**: eleva hasta **1 m** y **1600 kg**.\n- **Apilador manual**: hidráulico, espacios pequeños, descarga de furgones.\n- **Carretilla elevadora** (\"toro\"): grandes alturas y cargas; no útil en espacios pequeños.\n- **Transpaleta**: solo **desplaza** la carga (el apilador **eleva**).\n- Al acabar el turno: dejar enchufados, revisar agua de baterías y elementos de seguridad.\n\n## 4. CTA: áreas y procesos de trabajo\nDos áreas: **logística** (entrada/salida, consolidación) y **producción** (tratamiento).\n\n### 4.1. Área logística\nEs la **parte más importante** del centro. Zonas:\n- **Entrada**: muelle de entrada (GPS, precintos electrónicos), almacenes de entrada, **escáner**, **ring de ruptura de cargas**.\n- **Salida**: ring de consolidación, almacenes de salida, muelles de salida.\n- Dos modelos de distribución: **lineal** (entrada y salida diferenciadas) y **concentrado**.\n\n**Procesos de entrada**\n- Control de rutas: **Wialon** (terrestres) y **HORUS** (aéreas y marítimas). Con Wialon se imprime el **VAYA** (hoja de ruta).\n- El precinto lo retira siempre el **personal de logística**, nunca el conductor. Si no coincide, incidencia en HORUS al centro operativo de seguridad.\n- Controles de calidad con **RFID** en muelles.\n- Escáner obligatorio: envíos de **buzones de calle** (sacas leídas con **Marabú 2**) y envíos de **más de 100 g**. No se escanean: los de otro CTA/CTP, avisos de recibo y normalizados, Publibuzón, devueltos, reexpedidos y mal encaminados.\n- Producto sin tratar: se rotula con fecha y turno y se trata primero en el siguiente turno.\n\n**Procesos de salida**\n- Altura máxima de apilado: **10 bandejas A** y **5 B o C**.\n- Rings de clasificación: máximo **22 carros** en grupos de tres, máximo **18 jaulas o palés**, en U cerrada.\n- **Ring provincial**: entre **9 y 21 carros** en grupos de tres.\n- Rotulación obligatoria antes de cargar: centro de origen, fecha, producto y centro de destino.\n- Almacenes de salida: nacional (**turno de tarde**), provincial y local (**turno de noche**).\n- Sistemas de carga: **contenerizada** (el conductor da las últimas instrucciones y cincha) y **a granel**.\n- **Mapas de carga**: uno por ruta (laborables y fines de semana).\n- Contenedores anclados cada **4, 6 u 8 posiciones** (tarea del conductor).\n- Retorno de elementos: carros y bandejas sobrantes a **Madrid**; jaulas a **Madrid y Barcelona**; carros rotos a \"Madrid – Chamartín\"; bandejas rotas \"Fundación. Bandejas Rotas. Madrid\".\n- **Fundación A LA PAR (Plan Limbo)**: lavado de sacas, desinfección y reparación de bandejas.\n\n### 4.2. Área de producción\n#### 4.2.1. Unidad de productos ordinarios (UPO)\nClasifica productos ordinarios (sin trazabilidad) y cartas certificadas y notificaciones normalizadas automatizables. Se llega a tratar un **93 %** del correo de forma automática. Automatización = **indexación** (lectura e impresión de código de barras) + **clasificación**.\n\n| Máquina | Uso | Rendimiento |\n|---|---|---|\n| **FC** (faciadora-canceladora) | Buzones y correo con sellos | **10.000/h** por tolva; **35.000/h** alimentador secundario (bandejas A) |\n| **IRV** | Normalizado; OCR y videocodificación | **40.000/h**, reconocimiento **90 %**; **56** apiladores |\n| **FSM** | Clasificación final por sección | **35.000/h**, **99 %**; hasta **400** casilleros (5 líneas A-E de 80) |\n| **TOP 2000** | No normalizado flat | **7.500/h** por alimentador; 240-320 destinos |\n| **SCG** | Formato gordo | **7.000-8.000/h** |\n\n- **FC**: retira correo por encima de **250x176x6 mm**; apilador 1 para \"POR AVIÓN\"; lo de más de 6 mm sale por el **culling**. Todos los CTA usan canceladoras eléctricas de mediana producción salvo **Oviedo y Tenerife**.\n- **IRV**: código doble (sección de reparto) o único (CP); reverso con CP, centro y máquina, fecha juliana, hora. Videoindexación online/offline (ID TAG); prioridades: **IPC > buzones y oficinas > admisión masiva**. Avisar al jefe si reconocimiento **< 70 %**. **Programa Logos** para devueltos (logo en ángulo superior o inferior izquierdo).\n- Requisitos IRV: normalizado 135-250 x 85-176 mm, espesor 0,15-5 mm, **2-20 g**; **C5** 229x162 mm, **2-50 g**.\n- **Semáforo** (IRV y FSM): azul = mantenimiento funcionando; blanco = operativa parada en espera; verde = normal; naranja = fallo/atasco parcial; rojo = cubierta levantada o emergencia.\n- **FSM**: sin OCR, lee códigos de la IRV; \"cartas blancas\" vuelven a la IRV; casillero **A1** = rechazo fuera de programa; **B1** = rechazos periféricos.\n- **TOP 2000**: ATHS para bandejas B; flat de 140-380 mm, espesor 0,5-20 mm, altura 90-238 mm, peso óptimo hasta **800 g**; contraste > 25 %.\n- **SCG**: peso **30 g-10 kg**; disponible en CTA Madrid, CAM2, CI3, CLI Barcelona, CTA Sevilla, Alicante y Valladolid.\n\n**Clasificación manual (UPO)**: residual; ring primario de hasta **48 destinos**; prioridad 1 a **IPC, buzones y oficinas**, prioridad 2 a **UAM**; las bandejas de manual UPO **no se tapan ni flejan**.\n\n#### 4.2.2. Unidad de productos registrados (UPR)\n- Centraliza el correo registrado y lo graba en **SGIE**. Líneas: básica certificada nacional, productos detallables nacionales, registrados devueltos, detallables internacionales de exportación e internacionales de importación.\n- Se tapan y flejan **solo** las bandejas que van por **vía aérea**; etiquetado con **EGE**.\n- **SCP**: lee el CP de la etiqueta IRIS de **14,5x10 cm**. **POSI2SORTER**: 1 error cada 10.000.\n\n| SCP | Capacidad | Rampas | Destinos |\n|---|---|---|---|\n| Altas prestaciones | 6.000 paquetes/h | 43 | 120 |\n| Medias prestaciones | 2.500 paquetes/h | 13 | 33 |\n\n- Automatizables: máx. **90x60x40 cm**, mín. 15x15x2 cm; peso **200 g a 30 kg**; separación de **25 cm** en la cinta.\n\n## 5. Operaciones internacionales\n### 5.1. Oficina de cambio Madrid Barajas (ESMAD)\n- Tres centros: **CTI**, **CCP** y **CI3** (eCommerce **Asia-Pacífico**). Funciona **24 h/365 días**. Otra en El Prat (ESBCN).\n- Aplicación: **OCA 3**. Importación: lectura del **MRD** (Mail Register Device).\n- **Importación**: CTI recibe todo el correo (patio aire y tierra) y apertura con **SAS**; CCP trata la paquetería (EMS documentos, SCP, **PD** = pequeño dinámico, reembolsos con \"Importes a cobrar\"); CI3 trata certificada, Prime, ordinaria no IPC, Inyección Directa y ETOE (grabación por voz **Whales Talking x Vox**).\n- **Exportación**: sobre todo en el **CTI**; CCP trata paquetería UPU (excepto EMS y EPG); entrega a **handling** en contenedores **ULD**.\n\n### 5.2. IPC de importación\n- Lo recibido en CTI hasta las **16:00** se cursa al CTA Madrid antes de las **16:30**; hora **LAT** hasta las **17:00** (Canarias **15:00**).\n- Flat automatizable: única excepción en bandejas B; gordo con etiqueta IPC.\n\n### 5.3. IPC de exportación\n- En origen solo se formatea, en bandejas A, B o C amarillas y azules.\n- Rotulación: \"CTI BARAJAS IPC NORMALIZADO\" (A), \"TARJETAS POSTALES\" (A), \"IPC NO NORMALIZADO\" (B), \"IPC GORDO\" (C), \"CCRI\".\n- **12 países directos**: Alemania, Austria, Bélgica, Francia, Gran Bretaña, Países Bajos, Irlanda, Italia, Portugal, Suecia, Suiza y EEUU (bandeja azul universal tapa negra).\n- Las cartas tienen prioridad sobre las tarjetas postales.\n\n## 6. Admisión masiva\n- **UAM** (en CTA, CAM, CTP) y **PAM** (en oficinas, clientes con menor volumen).\n- Procedencias: clientes con contrato, **agencias comerciales**, **consolidadoras** y **otros operadores** (RD 1298/2006).\n- Aplicaciones: IRIS para clientes; **PEC** para agencias comerciales; **IRIS (ADO)** para consolidadoras y operadores. Horario general 8:00-15:00; G-0 de 8:00 a 12:00.\n- Anexos del contrato: **A** productos, **B** códigos postales, **C** requisitos mínimos, **D** criterios de presentación.\n\n### 6.1. Albaranes\n- Siempre **por duplicado**. Tipos: **nube de puntos** (GANES), **código de barras** (Mi Oficina, único ya registrado), **manual** (excepcional).\n- No admiten albarán (prerregistro rápido): Paq Ligero, Paq Premium, Paq Estándar, Paq Today, Paq Standard/Premium/Light Internacional y Paquete Postal Internacional Económico.\n- Destinos: **Local**, **D1** (capitales y anexo B), **D2** (resto). Grados: **G1** (por provincias), **G2** (5 dígitos del CP), **G0** (resto).\n\n### 6.2. Admisión de albaranes\n| Total de envíos | Muestra |\n|---|---|\n| 500-5.000 | 25 |\n| 5.000-10.000 | 50 |\n| Más de 10.000 | 100 |\n| Publibuzón, Publicorreo, Publicaciones Periódicas | mínimo 25 |\n\n- Notificaciones: código de 23 posiciones que empieza por **NV** (Mi Oficina) o **NA**. Relación en papel: máximo **500** envíos.\n- Si no se determinan los ámbitos, todos se consideran **D2**.\n- Control cuantitativo: visual (pequeñas), **báscula cuentapiezas** (medianas), **báscula de gran tonelaje** (grandes).\n- Escaneo con **GESCAN**; consolidación en **Ágora** desde las **13:00 h**; conservación mínima de **seis meses**.\n\n### 6.3 a 6.7. Otras admisiones\n- Reembolsos (cartas certificadas y Paquete Azul): **IRIS > Admisión > Albaranes > Alta de reembolsos**.\n- **Depósitos ADO**: máximo un depósito diario por producto SPU.\n- **Agentes turísticos**: albarán ADO; las cargas no se devuelven, se corrigen.\n- **PEC**: exclusivo de agencias colaboradoras; tipos de admisión: depósito (SPU), resúmenes (no SPU) y albaranes de entrega.\n- Alta producción: no se puede franquear **Publicorreo Premium** ni **Paq Premium**; factura si se pide o si el importe supera **400 €**.\n\n### 6.8. Check list\n- Ruta: IRIS > Admisión > Depósito de Muestreo > Nuevo depósito. Un albarán no puede estar en varios depósitos de muestreo.\n- **Escenarios 0 a 4**: 0 sin separar; 1 por peso; 2 peso y ámbito; 3 peso y grado; 4 peso, grado y ámbito.\n- \"%\" negativo = menos envíos calculados que los declarados. Rechazo si la desviación supera el **3 %**.\n- Básculas: tolerancia de **+/- 3 %**; si se supera, se amplía la muestra.\n\n### 6.10. Admisión de paquetería\n- Unitaria: IRIS > Admisión > Paquetes; fichero **Manifiesto** de hasta **1000 envíos**. Prerregistro **detallada** o **rápida**. **TELMA** (PDA) para registrados. **CN23** por duplicado si hay aduanas.\n\n### 6.11. Productos electorales\n- Tarjetas censales en CTA pactados con el INE; correo **CERA** en UAM Madrid; votos de consulados en **CAM 1** Madrid.\n- Propaganda: leyenda \"Envíos postales de propaganda electoral\"; tarifa especial de un envío por elector y hasta **50 g**; tolerancia de **+/- 2 %** del peso; se graba en **SGIE**.\n\n## 7. Códigos postales\n- **Cinco cifras**: las dos primeras indican la provincia (01 Álava a 52 Melilla) y las tres últimas la zona.\n- En capitales, la zona empieza siempre por **0**. Reservados: **070** correspondencia oficial de Correos; **071** organismos oficiales (voto por correo); **080** apartados y listas.\n\n## 8. Correos Logística\n- Logística integral: control de stocks, almacén, pedidos. Soluciones: **B2B**, **ecommerce**, **promocional** e **inversa**.\n- Flujos de almacén: **entrada**, **preparación** (picking) y **salida**.\n- Almacenaje en **bloque** (10 % de margen, sin FIFO), estanterías convencionales, **drive-in**, dinámicas (FIFO; **push-back** LIFO), móviles (hasta 10 m).\n- Carretillas **trilaterales**: hasta **14 m** en pasillos de **1,7 m**; recogepedidos hasta 12 m.\n- **ABC**: A = 20 % artículos/80 % líneas; B = 30 %/15 %; C = 50 %/5 %.\n- **FIFO**, **FEFO**, **LIFO**; almacén ordenado o caótico.\n- El picking puede suponer hasta el **60 %** del coste.\n- **SGA**: espacio +20-30 %, devoluciones -50 %, errores -90-97 %, picking +16-25 %.\n- Códigos: **EAN/GS1**, Posnet, **PDF 417**, 2 de 5, Código 39, **Código 128**; GS1: (01) agrupación, (17) caducidad, (10) lote; RFID y Datamatrix.\n\n## Claves para el examen\n- **18 CTA**; CTI, CCP, CI3 y CAM 4 en Barajas; ETOE en Reino Unido (2015) y Países Bajos (2016).\n- Red troncal: **estrella** (Madrid), **abanico** (Barcelona), **periférica**.\n- Bandejas A/B/C: **13/26/60 l**; estadística A = 340 y B = 80 envíos.\n- Jaula: 128 kg y 2 m³; carro: 450 kg; apilador eléctrico: 1 m y 1600 kg.\n- **Wialon** (terrestre) y **HORUS** (aérea y marítima); VAYA = hoja de ruta.\n- Escáner obligatorio a partir de **100 g** y para buzones de calle.\n- Apilado máximo: 10 A y 5 B/C; ring provincial de 9 a 21 carros.\n- FC 10.000/35.000; IRV 40.000 (90 %); FSM 35.000 (99 %, 400 casilleros); TOP 2000 7.500; SCG 7.000-8.000.\n- SCP: 200 g a 30 kg, máximo 90x60x40 cm.\n- IPC importación: LAT 17:00 (Canarias 15:00).\n- Muestras de 25/50/100; desviación máxima 3 % (electoral 2 %); albaranes 6 meses.\n- CP reservados 070/071/080; ABC 20/80, 30/15, 50/5.", "preguntas": [{"p": "¿Cuántos centros de tratamiento automatizado (CTA) hay distribuidos por la geografía nacional?", "o": ["16", "18", "20", "22"], "c": 1, "e": "El texto indica que los 18 CTA se reparten por las distintas áreas geográficas.", "pag": 644}, {"p": "¿En qué año comenzó a dar servicio la oficina de cambio extraterritorial (ETOE) de Países Bajos?", "o": ["2016", "2015", "2019", "2022"], "c": 0, "e": "La ETOE de Reino Unido abrió en 2015 y la de Países Bajos empezó a dar servicio en 2016.", "pag": 650}, {"p": "Dentro de la red troncal, la subred que conecta Barcelona con los principales centros postales del país se denomina:", "o": ["Red en estrella", "Red periférica", "Red transversal", "Red en abanico"], "c": 3, "e": "La red en abanico tiene origen en Barcelona; la red en estrella tiene origen en Madrid.", "pag": 652}, {"p": "A efectos estadísticos, ¿qué capacidad se asigna a una bandeja tipo B?", "o": ["100 envíos", "340 envíos", "80 envíos", "60 envíos"], "c": 2, "e": "Según los módulos estadísticos, la bandeja A equivale a 340 envíos y la B a 80.", "pag": 657}, {"p": "¿Qué peso permite mover el tren de rodaje del carro transportador de bandejas?", "o": ["Hasta 128 kg", "Hasta 450 kg", "Hasta 300 kg", "Hasta 1.600 kg"], "c": 1, "e": "El carro transportador tiene un tren de rodaje que permite mover hasta 450 kg.", "pag": 658}, {"p": "¿Cuál es la productividad máxima de la canceladora eléctrica de alta producción?", "o": ["13.000 cartas por hora", "10.000 cartas por hora", "35.000 cartas por hora", "40.000 cartas por hora"], "c": 0, "e": "La canceladora eléctrica de alta producción alcanza hasta 13.000 cartas por hora.", "pag": 664}, {"p": "El apilador eléctrico utilizado en los centros de tratamiento permite una elevación de:", "o": ["Hasta 2 metros y 1.000 kg de carga", "Hasta 3 metros y 1.500 kg de carga", "Hasta 1 metro y 450 kg de carga", "Hasta 1 metro y 1.600 kg de carga"], "c": 3, "e": "El apilador eléctrico permite elevar hasta un metro y 1.600 kg de carga.", "pag": 664}, {"p": "¿Con qué aplicación se controlan en el muelle de entrada las rutas aéreas y marítimas?", "o": ["Wialon", "OCA 3", "HORUS", "GESCAN"], "c": 2, "e": "Las rutas terrestres se controlan con Wialon y las aéreas y marítimas con HORUS.", "pag": 669}, {"p": "Señale qué envíos NO se inspeccionan con el escáner a la entrada del CTA:", "o": ["Los procedentes de los buzones de calle", "Los procedentes de otro CTA o CTP", "Los de más de 100 g admitidos en oficina", "Los de más de 100 g de buzones de oficina sin cancelar"], "c": 1, "e": "Los envíos que vienen de otro CTA o CTP no se escanean porque ya fueron escaneados.", "pag": 671}, {"p": "En los rings de consolidación, ¿cuál es la altura máxima de apilado permitida?", "o": ["10 bandejas tipo A y 5 de tipo B y C", "8 bandejas tipo A y 4 de tipo B y C", "12 bandejas tipo A y 6 de tipo B y C", "5 bandejas tipo A y 10 de tipo B y C"], "c": 0, "e": "La altura máxima permitida es de 10 bandejas de tipo A y 5 de tipo B y C.", "pag": 674}, {"p": "¿Cuántos carros forman como mínimo y como máximo cada ring provincial?", "o": ["6 como mínimo y 18 como máximo", "9 como mínimo y 22 como máximo", "12 como mínimo y 24 como máximo", "9 como mínimo y 21 como máximo"], "c": 3, "e": "Cada ring provincial lo forman entre 9 y 21 carros colocados en grupos de tres.", "pag": 675}, {"p": "¿Qué velocidad y reconocimiento medio tiene la máquina IRV?", "o": ["35.000 cartas/hora con un 99 % de reconocimiento", "10.000 cartas/hora con un 93 % de reconocimiento", "40.000 cartas/hora con un 90 % de reconocimiento", "7.500 cartas/hora con un 80 % de reconocimiento"], "c": 2, "e": "Cada IRV lee 40.000 cartas/hora con un reconocimiento medio del 90 %.", "pag": 686}, {"p": "¿Qué peso debe tener un envío en formato C5 para indexarse en la IRV y clasificarse en la FSM?", "o": ["Entre 2 y 20 g", "Entre 2 y 50 g", "Entre 5 y 50 g", "Entre 2 y 100 g"], "c": 1, "e": "El formato C5 admite un peso de entre 2 y 50 g; el normalizado, entre 2 y 20 g.", "pag": 687}, {"p": "En el semáforo de cabecera de la IRV, ¿qué indica el color blanco?", "o": ["Que está operativa, parada y en espera de ser puesta en marcha", "Que está en modo de mantenimiento, pero sigue funcionando", "Que tiene un fallo o atasco que la mantiene parcialmente parada", "Que tiene la cubierta levantada o se ha pulsado la emergencia"], "c": 0, "e": "El blanco indica máquina operativa, parada y a la espera; azul es mantenimiento, naranja es fallo y rojo es cubierta o emergencia.", "pag": 690}, {"p": "¿Cuántos casilleros o apiladores de salida puede tener como máximo una FSM?", "o": ["56", "240", "320", "400"], "c": 3, "e": "Cada FSM consta de hasta 400 casilleros distribuidos en cinco líneas de 80.", "pag": 691}, {"p": "¿Qué velocidad de clasificación alcanza el SCG (Sistema de Clasificación de Gordo)?", "o": ["Entre 2.500 y 6.000 envíos por hora", "Hasta 7.500 envíos por hora", "Entre 7.000 y 8.000 envíos por hora", "Hasta 35.000 envíos por hora"], "c": 2, "e": "El SCG clasifica entre 7.000 y 8.000 envíos por hora.", "pag": 695}, {"p": "En el SCP, ¿cuál es el peso máximo de un paquete para que sea automatizable?", "o": ["10 kg", "30 kg", "20 kg", "40 kg"], "c": 1, "e": "Los paquetes automatizables en el SCP pesan entre 200 g y 30 kg.", "pag": 699}, {"p": "¿Qué aplicación informática se usa para registrar la importación y exportación de envíos internacionales en la oficina de cambio?", "o": ["OCA 3", "SGIE", "IRIS", "Wialon"], "c": 0, "e": "OCA 3 es la aplicación que registra la entrada y salida de envíos internacionales.", "pag": 700}, {"p": "¿Qué centro de la oficina de cambio de Madrid Barajas se ocupa de los envíos eCommerce con origen en Asia-Pacífico?", "o": ["CTI", "CCP", "CAM 4", "CI3"], "c": 3, "e": "La oficina de cambio la forman CTI, CCP y CI3, y este último trata el eCommerce de Asia-Pacífico.", "pag": 700}, {"p": "En el correo internacional prioritario de importación, ¿cuál es la hora LAT o de entrada en el CTA de Madrid con carácter general?", "o": ["Hasta las 16:00 horas", "Hasta las 16:30 horas", "Hasta las 17:00 horas", "Hasta las 15:00 horas"], "c": 2, "e": "La hora LAT es hasta las 17:00 h, salvo los envíos con destino Canarias, que tienen como límite las 15:00 h.", "pag": 708}, {"p": "¿Cuál de los siguientes países figura entre los 12 países directos del correo internacional prioritario de exportación?", "o": ["Grecia", "Suiza", "Polonia", "Dinamarca"], "c": 1, "e": "Suiza figura en la lista de 12 países directos, junto con Alemania, Austria, Bélgica, Francia, Gran Bretaña, Países Bajos, Irlanda, Italia, Portugal, Suecia y EEUU.", "pag": 711}, {"p": "¿Qué tipo de albarán es el único que ya está registrado cuando se presenta?", "o": ["El de código de barras confeccionado con Mi Oficina", "El de nube de puntos confeccionado con GANES", "El confeccionado a mano en casos excepcionales", "El de registro simplificado de IRIS"], "c": 0, "e": "El albarán con código de barras de Mi Oficina es el único caso en que ya está registrado.", "pag": 718}, {"p": "Los envíos clasificados por los cinco dígitos del código postal, en contenedores a destino final y rotulados por código postal y localidad, tienen el grado de preparación:", "o": ["G1", "G0", "D2", "G2"], "c": 3, "e": "G2 corresponde a la clasificación por los cinco dígitos del código postal; G1 es por provincias.", "pag": 718}, {"p": "En el control cualitativo, si un depósito tiene entre 5.000 y 10.000 envíos, ¿qué tamaño de muestra se extrae?", "o": ["25 envíos", "100 envíos", "50 envíos", "75 envíos"], "c": 2, "e": "La muestra es de 25 envíos para 500-5.000, de 50 para 5.000-10.000 y de 100 para más de 10.000.", "pag": 719}, {"p": "¿Durante cuánto tiempo mínimo se conservan archivados los albaranes antes de enviarlos a destruir?", "o": ["Tres meses", "Seis meses", "Un año", "Dos años"], "c": 1, "e": "Los albaranes se archivan por fecha y se conservan como mínimo seis meses.", "pag": 721}, {"p": "En el check list, ¿cuándo se rechaza el depósito de muestreo por la desviación detectada?", "o": ["Si la desviación supera un 3 %", "Si la desviación supera un 2 %", "Si la desviación supera un 5 %", "Si la desviación supera un 10 %"], "c": 0, "e": "Se rechaza si la desviación supera el 3 %, si las deficiencias no tienen arreg las funciones de los centros de tratamiento provincial (CTP):", "o": ["Plataforma logística zonal", "Centro de admisión provincial", "UPR provincial", "Tratamiento provincial del correo manual"], "c": 0, "e": "La plataforma logística zonal es función del CTA; el CTP es plataforma logística provincial.", "pag": 646}, {"p": "¿Qué centro es el almacén regulador de todos los CTA de Correos?", "o": ["El CAM 1 de Madrid", "El CAM 2 de Madrid", "El CLI de Barcelona", "El CREL de Chamartín"], "c": 3, "e": "El Centro Regulador de Elementos Logísticos de Chamartín es el almacén regulador de todos los CTA.", "pag": 648}, {"p": "¿Qué centro de Barajas es el centro aduanero de exportación de paquetería con destino Canarias, Andorra, Ceuta y Melilla?", "o": ["CCP", "CI3", "CAM 4", "CAM 1"], "c": 2, "e": "El CAM 4 es el centro aduanero de exportación de paquetería a Canarias, Andorra, Ceuta, Melilla y países no UE.", "pag": 649}, {"p": "¿Cuántos envíos diarios puede procesar el centro de admisión y clasificación abierto por Correos en China continental?", "o": ["100.000", "500.000", "250.000", "1.000.000"], "c": 1, "e": "En 2019 Correos abrió en China continental un centro capaz de procesar 500.000 envíos diarios.", "pag": 650}, {"p": "Las redes zonales unen, como norma general:", "o": ["El CTA zonal con cada uno de los CTP de la misma zona", "Madrid con los centros postales principales del país", "Cada CTA o CTP con las oficinas de la provincia", "Los centros y oficinas de una misma localidad"], "c": 0, "e": "Las redes zonales unen el CTA zonal con los centros de tratamiento provincial de su zona.", "pag": 653}, {"p": "La red periférica o transversal se caracteriza por:", "o": ["Unir Barcelona con los principales centros postales", "Recoger los buzones de una localidad", "Unir el CTA zonal con los CTP de su zona", "Conectar centros de la periferia sin pasar por Madrid ni Barcelona"], "c": 3, "e": "La red periférica conecta centros de la periferia sin pasar por Madrid ni por Barcelona.", "pag": 653}, {"p": "¿Qué redes de transporte son de ámbito urbano y recogen buzones?", "o": ["Las redes provinciales", "Las redes zonales", "Las redes locales", "Las redes interzonales"], "c": 2, "e": "Las redes locales son de ámbito urbano: recogen buzones y unen centros y oficinas de la misma localidad.", "pag": 654}, {"p": "¿De qué color son las bandejas que contienen el correo IPC de importación?", "o": ["Amarillo y azul", "Azul claro y oscuro", "Azul oscuro con tapa negra", "Amarillo y gris"], "c": 1, "e": "Las bandejas de IPC de importación son azul claro y oscuro; las nacionales, amarillo y azul.", "pag": 655}, {"p": "¿Cuál es la capacidad aproximada de una bandeja tipo A, salvo excepciones?", "o": ["400 envíos", "100 envíos", "340 envíos", "15 envíos"], "c": 0, "e": "La bandeja tipo A tiene capacidad para unos 400 envíos, y en algunos casos hasta 800.", "pag": 655}, {"p": "¿Qué volumen tiene una bandeja tipo C?", "o": ["13 l", "26 l", "40 l", "60 l"], "c": 3, "e": "La bandeja tipo C tiene una capacidad de 60 l (la A, 13 l y la B, 26 l).", "pag": 656}, {"p": "¿Hasta qué peso admite una jaula de medidas estándar?", "o": ["54 kg", "62 kg", "128 kg", "450 kg"], "c": 2, "e": "La jaula estándar mide 120x100x180 cm, admite hasta 128 kg y tiene 2 m³ de capacidad.", "pag": 657}, {"p": "¿Cuántas bandejas tipo C llenas apiladas admite la base del carro transportador de bandejas?", "o": ["20 bandejas", "10 bandejas", "40 bandejas", "6 bandejas"], "c": 1, "e": "El carro admite 10 bandejas tipo C apiladas, o 40 si están vacías.", "pag": 658}, {"p": "¿Qué superficie libre necesita alrededor el robot retractilador eléctrico para funcionar?", "o": ["1.150 mm", "500 mm", "1.032 mm", "1.250 mm"], "c": 0, "e": "Para funcionar necesita una superficie libre de 1.150 mm a su alrededor.", "pag": 662}, {"p": "Según las medidas de seguridad, ¿qué bandejas deben ir obligatoriamente flejadas?", "o": ["Todas las bandejas de manual UPO", "Las bandejas con destino provincial", "Las bandejas de correo IPC de importación", "Las que contienen correspondencia que viaja por avión"], "c": 3, "e": "Es obligatorio que las bandejas con correspondencia que viaja por avión vayan flejadas.", "pag": 663}, {"p": "¿Cuál es la diferencia fundamental entre los apiladores y la transpaleta?", "o": ["La transpaleta eleva la carga y el apilador solo la desplaza", "El apilador es siempre manual y la transpaleta eléctrica", "El apilador eleva la carga y la transpaleta solo la desplaza", "La transpaleta se usa solo en grandes centros"], "c": 2, "e": "Con los apiladores se puede elevar la carga, mientras que con la transpaleta solo se puede desplazar.", "pag": 665}, {"p": "En el muelle de entrada, ¿qué documento es el VAYA?", "o": ["El albarán de entrega", "La hoja de ruta", "El manifiesto de paquetería", "La etiqueta del carro"], "c": 1, "e": "Con Wialon se graban los datos de carga y se imprime el VAYA (hoja de ruta).", "pag": 670}, {"p": "En la descarga de vehículos, ¿quién desprecinta el vehículo?", "o": ["El personal de logística", "El conductor del vehículo", "El responsable de seguridad de la zona", "El personal de la UAM"], "c": 0, "e": "El personal de logística desprecinta el vehículo; en ningún caso lo hacen los conductores.", "pag": 670}, {"p": "¿Con qué tecnología se realizan los controles de calidad de entrada y salida en los muelles de carga y descarga?", "o": ["GPS mediante Wialon", "Lectura óptica con OCA 3", "Escáner de rayos X", "RFID (antenas de radiofrecuencia)"], "c": 3, "e": "Los controles de calidad se hacen con RFID instalado en los muelles, que detecta los envíos con chip o tag.", "pag": 670}, {"p": "¿Con qué herramienta se controlan, leyendo su código de barras, las sacas procedentes de los buzones de calle tras escanearlas?", "o": ["HORUS", "GESCAN", "Marabú 2", "TELMA"], "c": 2, "e": "Las sacas de buzones se escanean y se controlan leyendo su código de barras con Marabú 2.", "pag": 671}, {"p": "En los rings de clasificación de salida, el o postal?", "o": ["Las Palmas", "Santa Cruz de Tenerife", "Pontevedra", "Islas Baleares"], "c": 0, "e": "Según la tabla de códigos, el 35 es Las Palmas (el 38 es Santa Cruz de Tenerife).", "pag": 734}, {"p": "En cada provincia, el código reservado 071 se destina a:", "o": ["La correspondencia oficial de Correos", "Los apartados y listas de Correos", "Los envíos de grandes clientes", "La correspondencia de los organismos oficiales"], "c": 3, "e": "El 071 se reserva a la correspondencia de los organismos oficiales, como el voto por correo.", "pag": 733}, {"p": "¿Qué técnica de gestión de stock hace salir primero los productos con fecha de caducidad más cercana?", "o": ["LIFO", "FIFO", "FEFO", "ABC"], "c": 2, "e": "FEFO significa \"el primero en caducar, el primero en salir\".", "pag": 745}, {"p": "En el sistema de almacenaje en bloque, ¿qué margen entre cargas hay que considerar al calcular el espacio?", "o": ["Alrededor de un 20 %", "Alrededor de un 10 %", "Alrededor de un 5 %", "Alrededor de un 30 %"], "c": 1, "e": "Al calcular el espacio necesario hay que considerar alrededor de un 10 % de margen entre cargas.", "pag": 739}, {"p": "¿Hasta qué altura están limitadas las estanterías móviles?", "o": ["Diez metros", "Ocho metros", "Seis metros", "Catorce metros"], "c": 0, "e": "Las estanterías móviles, para artículos de baja rotación, tienen la altura limitada a diez metros.", "pag": 740}, {"p": "¿Qué gestión de flujo permiten las estanterías dinámicas push-back?", "o": ["FIFO", "FEFO", "ABC", "LIFO"], "c": 3, "e": "Las push-back solo admiten una referencia por pasillo y trabajan con gestión LIFO.", "pag": 740}, {"p": "¿Qué porcentaje del total de las operaciones del ciclo logístico del almacén puede llegar a suponer el coste de la preparación de pedidos?", "o": ["30 %", "50 %", "60 %", "80 %"], "c": 2, "e": "En algunos casos el coste de la preparación de pedidos puede llegar al 60 % del total.", "pag": 746}, {"p": "¿En qué porcentaje reduce los errores el sistema de gestión de almacenes (SGA)?", "o": ["Entre un 20 y un 30 %", "Entre un 90 y un 97 %", "Entre un 16 y un 25 %", "Hasta un 50 %"], "c": 1, "e": "El SGA reduce los errores en un 90-97 %.", "pag": 748}, {"p": "Como equipo de manutención para picking, la transpaleta eléctrica admite:", "o": ["Hasta 700 kg, a nivel de suelo y hasta 60 m de distancia", "Hasta 300 kg, a nivel de suelo y hasta 30 m de distancia", "Hasta 1.000 kg, a 2 m de altura y hasta 30 m de distancia", "Hasta 1.500 kg, a 12 m de altura y hasta 60 m de distancia"], "c": 0, "e": "La transpaleta eléctrica llega a 700 kg, a nivel de suelo y hasta 60 m.", "pag": 747}, {"p": "En los códigos lineales GS1 (EAN), ¿qué identificador corresponde a la fecha de caducidad?", "o": ["(01)", "(10)", "(21)", "(17)"], "c": 3, "e": "El (01) identifica la agrupación, el (17) la fecha de caducidad y el (10) el lote.", "pag": 750}, {"p": "¿Qué tipo de código de barras no puede utilizarse en el sector alimentario?", "o": ["Código 128", "UPC/EAN", "Código 39", "Entrelazado 2 de 5"], "c": 2, "e": "El Código 39 se usa para inventarios y seguimiento industrial y no puede utilizarse en el sector alimentario.", "pag": 749}, {"p": "Las apiladoras se utilizan para elevar palés hasta una altura no superior a:", "o": ["Dos metros", "Tres metros", "Cinco metros", "Ocho metros"], "c": 1, "e": "Las apiladoras, manuales o eléctricas, elevan palés hasta un máximo de tres metros.", "pag": 741}]}, {"letra": "I", "titulo": "Procesos operativos de distribución y entrega (I). Procedimientos en USE y URO", "paginas": "753-874", "resumen": "## 1. Distribución y entrega a domicilio\n- El circuito postal (RD 1829/1999) tiene las fases: recogida, admisión, clasificación, tratamiento, curso, transporte, **distribución** y **entrega**.\n- La **Ley 43/2010** las diferencia:\n  - **Distribución**: operaciones en los locales de destino inmediatamente previas a la entrega (desde la llegada de la conducción hasta la salida a reparto).\n  - **Entrega**: depósito del envío en la dirección indicada.\n- Dos tipos de entrega: **a domicilio** (URO o USE) y **en oficina** (UEO, Unidad de entrega en oficina).\n- Las unidades de reparto dependen de la **Subdirección de Red de Distribución**.\n\n## 2. Unidades de reparto\n### 2.1 Unidad de reparto ordinario (URO)\n- Dos tipos:\n  - **UD (Unidades de Distribución)**: reparten todo tipo de productos porque no hay USE en la localidad. Pueden depender de ellas servicios rurales.\n  - **UR (Unidades de Reparto)**: hay USE en la localidad. Solo reparten productos USE como Carta Urgente, Certificada Urgente, AA, Telegrama, Burofax Premium y Paq (Estándar, Premium, Ligero, Paquete Azul, Paq Light Internacional) si caben en la **plantilla InterConnect (353 x 250 x 30 mm)** y pesan **menos de 1 kg**.\n- Se dividen en **distritos** y estos en **secciones** (calles asignadas a un cartero). Las zonas rurales se atienden con servicios rurales.\n- Objetivos: **cero stocks**, cubrir a diario todas las áreas, priorizar según la calidad exigida y garantizar el retorno de información de los registrados.\n\n**Zonas URO**: descarga, entrada y consolidación (primer recuento estadístico), clasificación, control de registrados-SGIE, devolución, almacén de vacíos, despacho del jefe y archivo.\n- El **jefe** dirige, planifica y controla. **Solo el control es delegable**. Planificación y dirección recaen exclusivamente en él.\n\n**Documentación URO**: planos, callejero, plan de contingencia, **lista de embarrie** (puntos de entrega en dirección de avance, punto de corte, incidencias y buzón de alcance), lista de apartados, reenvíos y **División de recargos (sistema Margarita)**.\n\n### 2.2 Unidades de servicios especiales (USE/URP)\n- Especializadas en paquetería y comercio electrónico, y en los urgentes de mayor valor añadido.\n- Hay **97 USE**, que trabajan **más de 14 horas diarias** con tantas salidas como haga falta.\n- Se organizan en **sectores** formados por **zonas de reparto**. **No dependen de ellas servicios rurales**. Abarcan varios códigos postales.\n- Se están convirtiendo en **URP (Unidades de reparto de paquetería)**, con los mismos procedimientos.\n- Cada repartidor elabora la documentación de su zona en formato electrónico. El responsable guarda el original.\n\n## 3. Modelo de referencia y planificación diaria\n- El **modelo de referencia** se hace para un **día medio**. Cuantifica medios y recursos (cómo, dónde, cuándo, con qué).\n- La **planificación diaria** ajusta los recursos al volumen del día.\n\n## 4. Equipamiento y mobiliario\n### 4.1 Equipamiento de reparto\n| Elemento | Datos clave |\n|---|---|\n| Carro de reparto | 4 ruedas, bolsa frontal Publi City, 2 candados, limpieza por **Plan Limbo** |\n| Carro grande | Cerradura con llave, 2 baldas abatibles |\n| Vehículo motorizado nuevo | Carga máx. **200 kg** con agente; limitado a 20 km/h (alcanza 25); autonomía de unos 20 h o 20 km |\n| Cofre de moto | **80 litros**, **7,5 kg** |\n| Bolsa de alcance | Grande y pequeña. Bolsillo superior: nº de buzón de alcance. Lateral: repartidor, sección y turno |\n| Bandolera | Registrados y dinero |\n\n### 4.2 Valijas\n- **SS. RR.**: rojas, dos compartimentos. Precinto **verde** de SS. RR. al centro y **azul** del centro al SS. RR.\n- **Intrazonales/clientes** (amarillo y azul, homogeneizadas desde 2011): para uso interno, **verde** hacia el centro directivo y **azul** desde él. Para clientes con contrato, **amarillo** de la central a las delegaciones y **rojo** de las sucursales a la central.\n\n### 4.3 Buzones\n- **De depósito/alcance**: antes verdes, ahora azules. Uso interno, solo en grandes poblaciones, con capacidad para **2 bolsas de alcance**.\n- **Cilíndrico de una boca**: el más común, sustituye al rectangular de dos bocas.\n\n### 4.4 Auxiliar y 4.5 Casilleros\n| Elemento | Datos |\n|---|---|\n| Carro expositor | 4 baldas: 16 bandejas A. 3 baldas: 12 A/B o 6 C. Lado amarillo hacia el clasificador |\n| Camarera | Grande: 6 A/B o 2 C. Pequeña: 4 A/B o 2 C |\n| Carretilla con pala | Hasta **90 kg** |\n| Transpaleta | **2200 kg** |\n| CNN-50 (5x5) | 25 casillas, no normalizada |\n| CN-50 (7x5 / 3x5) | 35 o 15 casillas, normalizada |\n| CP8 | 10 baldas regulables cada 50 mm, paquetes (sobre todo en el ámbito rural) |\n| CD-14 | Avisos de recibo, 40 casillas |\n| Mesa-casillero | 20 casillas (4 x 5). Panel izquierdo: lista de embarrie. Derecho: mapa de recorrido |\n\n- **Apilador manual**: requiere ruta sin plataforma elevadora, carga en carros transportadores, **mínimo 3 carros diarios**, sin escalones y sin planos inclinados.\n\n### 4.6 y 4.7 Gestión\n- Las carencias se comunican del responsable al **jefe de sector** y de este al **jefe de red de distribución zonal**. El equipamiento sale de los almacenes provinciales o zonales y el mobiliario llega directamente del proveedor.\n- **Plan Limbo**: higieniza bolsas, valijas, carteras, bandoleras, correas y fundas de PDA. De los **cascos** solo contempla la destrucción. Los EPI del personal eventual van con el registro **PR0013-I003-R01**. Las bandejas se rotulan con destino a la **Fundación A la Par, CCP de Chamartín**.\n\n## 5. Procesos de trabajo\n- Tareas colectivas (recepción, clasificación general) e individuales (embarriado, distribución). Los **turnos rotativos** los fija el responsable.\n\n### 5.1 Antes del reparto\n**Descarga**\n- La hora de llegada se firma en el **VAYA**. Si la ruta se retrasa, el responsable avisa por correo electrónico al jefe de sector.\n- Personal de descarga según el número de secciones:\n\n| Secciones | Descarga |\n|---|---|\n| Hasta 8 | Toda la unidad |\n| 9 a 22 | Turno específico **15 min** antes |\n| Más de 22 | Turno de **15 a 30 min** antes |\n\n- Un carro o palé mal encaminado se devuelve al camión.\n\n**Recepción y apertura**\n- Ruta SGIE: Entrada>>Recepción y Control de despachos. Si falta o sobra un despacho, se levanta acta.\n- **Palés de Amazon (DDU)**: el código empieza por \"Gaylord\" o \"Pallet\" seguido de **16 dígitos**. La trazabilidad se consulta en **Minerva**. Causas de recepción: alta en unidad, mal encaminado por Correos o mal direccionado por el cliente. Para repetir la lectura hay que esperar **5 minutos**.\n- **Estacionables** (Paq Estándar, Premium, Ligero, Today). Causas: rotura, falta de contenido, faltan datos, faltan importes, incidencia en Citypaq, falta del envío de vuelta, CP incorrecto, expedición incompleta y **entrega concertada** (en los **5 días** siguientes). Se archivan en sectores E002, E003… durante un máximo de **5 días (120 h)**.\n- Un Paquete Azul o internacional con dirección incorrecta se liquida como \"Pasado a lista por dirección incorrecta\".\n- **Correos Modify** (Paq Estándar y Premium): permite cambiar fecha, franja, entrega en Citypaq u oficina, o la dirección **dentro de la misma provincia**. Se puede usar hasta el alta en la unidad. SGIE pide reetiquetar.\n\n**Envío de dinero (giros)**\n- El destinatario debe constar en la base de datos de **prevención de blanqueo de capitales**.\n- Se agrupan con la función \"Agrupar\" y el código acaba en **AGR**. La etiqueta tiene **13 dígitos**, con estructura **EDnnnnnnnnSXX** (S: V = ventanilla; XX: OR ordinario, TE T€nvío).\n- El sobre lleva como máximo **499,99 €** en metálico, sin cheques. La recepción se firma con usuario corporativo (C123456). La conciliación se hace con **IRIS** y SGIE.\n\n**Actas**\n- Se levantan en SGIE (Incidencias>>Generación de actas) por faltas, extravío, expolio, robo o sobre SEDI manipulado. Se pueden guardar como borrador (modificable) o \"Guardar y confirmar\" (no modificable).\n- Por **expolio de valores declarados** el acta se imprime, la firman **dos empleados** y se archiva **un año**.\n\n**Estadística (SIE)**\n- Llenado de bandeja: **A = 340 envíos** y **B = 80 envíos**. Módulos 1/3, 1/2 y 2/3. No se completan las bandejas clasificadas a sección por el CTA ni las de correspondencia local o provincial.\n- El volcado se hace antes de las **11 h** (turno de mañana) o de las **18 h** (turno de tarde).\n\n**Clasificación general**\n- Se consolida en tres grupos: depósito, pendiente y recibidos del CTA.\n- **Prioridad de ordinarios**: avisos de llegada de notificaciones > carta básica con fecha > Paq Ligero > carta básica sin fecha > impresos con compromiso > resto.\n- Normalizada en mesa-casillero hasta 24 secciones (CN50 a partir de 25). No normalizada en mesa hasta 14 secciones (CNN50 a partir de 15).\n- Alrededor del **95 %** del correo llega leído desde los CTA. Las mesas no se usan como almacén.\n- **Registrados**: carro 1 prioritario (Paq Premium, EPG, EMS, Paquete Azul, valijas…) y carro 2 no prioritario (Paq Estándar, PPIE…). **Prioridad**: valija > Paq Premium, EPG, Paquete Azul, giros, Burofax y telegráficos > depósitos y valores declarados > registrados con fecha > resto > Paq Estándar.\n- **ARDI** es la aplicación de recogida de información de las campañas PRI, integrada en la PDA.\n\n**Mal encaminados**\n- Un CP erróneo se tacha y se corrige. Si el error es masivo, se usa bandeja directa y se avisa a la unidad de origen. En SGIE se liquida como \"Mal direccionado (por el cliente)\" o \"Mal encaminado (por Correos)\". Nunca se mezclan con los devueltos.\n\n**Preembarriado y embarriado**\n- Criterio general: orden alfabético de calles. También por recorrido, mixto o por empresa en los polígonos.\n- **Retención judicial**: todo el correo se entrega al responsable.\n- **Reenvío a otra unidad**: con **5 o menos** envíos se etiquetan uno a uno. Con **más de 5**, van en sobre colector.\n- Ordinario voluminoso que no cabe: aviso **M4-O**. La carta urgente y el Publicorreo Óptimo, Premium y Plus siempre salen a reparto.\n- En la bolsa de alcance **no van registrados**. La paquetería no voluminosa puede ir en ella con supervisión del responsable y sin telefonía ni productos de alto valor.\n- **LY** (Deutsche Post) y **LZ** (Swiss Post): hasta **2 kg**, entrega sin firma.\n- PDA: Login > **Talos** > turno, sección y salida (en rurales tipo II y III no se elige salida). **Tauro** ordena el reparto con criterio geográfico.\n- Los envíos **CEX** salen a reparto el mismo día de su llegada.\n- Notificaciones en 2º intento: **fondo rojo D+3** (último día) y fondo blanco D+1 y D+2.\n- Los registrados que no salen por falta de capacidad se dan de alta antes de las **11:00**.\n\n### 5.2 Durante el reparto\n- Se recogen **bajo firma**: llaves del buzón 1, llaves de ruta, tarjeta de combustible, llaves del vehículo y título de transporte.\n- Si el reparto queda inacabado, al día siguiente se retoma donde se dejó.\n- **Normativa**: entrega al menos de lunes a viernes laborables (art. 24 Ley 43/2010). El empleado nunca firma como testigo.\n- **Entornos especiales** (RD 503/2007): viviendas a **más de 250 m** de la vía pública. Casilleros concentrados si se cumplen al menos 2 de estas condiciones: **10 viviendas o menos por hectárea**, **25 habitantes o menos por hectárea**, **5 envíos o menos a la semana** por domicilio. En zonas nuevas hay un régimen provisional de **2 años** y se informa al regulador en 3 meses. Correos informa a la CNMC cada trimestre.\n\n**Registrados**\n- Se pueden entregar a una persona del domicilio **mayor de 14 años** con DOI. Para Western Union y giros debe ser **mayor de edad**.\n- Importación de fuera de la UE: es obligatorio recoger el **correo electrónico** del destinatario.\n- Las **ND** con 2º intento fallido y los certificados **1-0-B** se depositan en el buzón sin aviso.\n- **Avisos de llegada**: **M4** genérico, **M4E** electoral, **M4O** de oficinas, **M4C** catastro. En el primer intento de las notificaciones no se deja aviso. Se hace un aviso por envío. En la URO solo se deja en el último intento.\n\n**Ordinarios**\n- Casillero nº 1 \"Correos\" para devoluciones. La numeración empieza en el 2.\n\n### 5.2.1 Tratamiento específico\n- **Entrega exclusiva**: solo a persona física **mayor de 14 años** con DNI. Si no, se devuelve como \"Desconocido\". No entra en relaciones.\n- **Reembolso**: máximo **2.499,99 €**, o **499,99 €** si se devuelve al remitente por giro. Solo en metálico.\n- **Giros**: el destinatario abre el sobre en presencia del repartidor y firma la libranza SEDI (**GI03**).\n- **Notificaciones**: dos intentos. El 2º, dentro de los **3 días hábiles** siguientes (el sábado es inhábil).\n\n| Tipo | Códigos | Separación entre intentos |\n|---|---|---|\n| Judiciales / no Ley 39/2015 | NC, NF, NJ | Más de 1 hora y en distinto día |\n| Administrativas Ley 39/2015 | NA, NE, ND, NT, NV, N3, 90 | Mínimo 3 horas, una antes y otra después de las 15:00 |\n\n- **N3**: 7 días en lista y 3er intento por la tarde. **ND**: sin lista, depósito en buzón. **NE**: con lista de 7 días y luego depósito en buzón.\n- No hay 2º intento si es rehusado, la dirección es incorrecta, el destinatario es desconocido o ha fallecido. En las de la **Agencia Tributaria (código 90)**, \"Desconocido\" supone devolución directa.\n- El repartidor de tarde no embarria: el **99 %** de su jornada está en la calle.\n- Lista de oficina: **7 días naturales**.\n- **Plazos estandarizados**: 6 días naturales desde la admisión hasta el 1er intento, 3 días hábiles entre intentos y 10 días naturales desde la admisión hasta el 2º intento. Volumen medio: 5 días de plazo desde la llegada a la unidad.\n- **Entrega con recogida** (Paq Retorno Premium): disponible en Paq Estándar, Premium y Today. Envío de vuelta con código **LI**. Si falta, queda como \"No entregado: falta envío de vuelta\".\n- **Expediciones**: con entrega completa, una sola firma y misma causa de liquidación. Con importes no se permite entrega parcial.\n\n### 5.2.2 Recogida de buzones\n- **Marabú II**: aplicación de control de las rutas de recogida. Sacas en bandejas tipo C. Orden de lectura: operario > ruta > inicio de ruta. Un terminal averiado se comunica al **CAU**.\n- Sin Marabú II, la saca solo se cambia si está deteriorada o sucia.\n\n### 5.2.3 Admisión en distribución\n- Aplicación **Hera** (elecciones del País Vasco y Galicia de 2020). Solo envíos prerregistrados, salvo los votos emitidos (VE).\n\n### 5.2.4 CEX\n- Dos intentos y sin avisos de llegada. Cajas: AUSENTES, DEVUELTOS e incidencias.\n\n### 5.3 Después del reparto\n- Liquidación en PDA con colores: verde entregado, rojo no entregado, blanco sin estado, gris rurales o depósitos en plazo.\n- Colores de SGIE: **verde** sin liquidar, **rojo** liquidada, **azul** relaciones provisionales, **morado** con importes o campañas sin confirmar.\n- Las correcciones se hacen en SGIE>>Liquidación>>Corrección de errores. Si la liquidación no cuadra, se libera en SGIE y se abre un Post.\n- Internacionales devueltos: etiqueta **CN15**. Ordinarios devueltos: sello \"Devuelto\" o una \"D\".\n- Los SICER van al **CCPC**.\n- Incidencias que bloquean el cierre de la unidad: entre otras, envíos de alta **más de 72 horas**. Si no se resuelven, cierre parcial o desbloqueo por el jefe de sector. El impreso de incidencias de turno es el **I.RI.2010**.\n\n## 6. Otros procedimientos\n- **Buzón electrónico SGIE**: la bandera roja se actualiza cada **10 min**. Se imprimen como máximo **20 mensajes** a la vez. Burofax con \"RE\" significa a riesgo del expedidor. Si no se asigna a sección en **72 h**, vuelve a \"Pendiente\".\n- **Avisos M4-O**: Paq Estándar en oficina, libros de más de **500 g** y publicaciones periódicas de más de **800 g**.\n- **Voluminosos**: alta en SGIE como \"Voluminoso no embuzonable\".\n- **Importes a cobrar**: código UAM de **23 dígitos**. Internacionales: etiqueta R-1 (CN29) o etiqueta roja con DTA. Sin respuesta en **5 días**, \"Devuelto al cliente. Sin información\".\n- **Reenvío postal**: testigo de embarriado (cartulina naranja de 33 x 16 cm) y testigo de control (\"R\" de 15 mm). Hojas de etiquetas: 4 para Buzón de Vacaciones y 16 para Reenvío. En el reenvío definitivo se sigue sirviendo hasta **15 días** después del fin. Los registrados siempre van de uno en uno.\n- **Buzón de Vacaciones**: en el número secuencial, el primero de los tres últimos dígitos es 0 para URO y 1 para USE/URP. Los registrados se liquidan como avisados con M4. Si la entrega a domicilio falla, el envío queda **15 días** en oficina.\n- **Citypaq**: código de usuario de **8 letras**. PO/PY Paq Estándar (72 h) y PW/PM Paq Premium (48 h). Sin hueco, se reintenta durante **48 h**. El destinatario tiene **5 días** para retirar. CAU 915963223 / RICO 23223. Las solicitudes de recogida (SR) cubren los no retirados en 120 h.\n- **Valijas**: **unitoque** (entrega y recogida a la vez) y **bitoque** (entrega a primera hora y recogida a última), sin firma.\n\n## 7. Gestión de estacionados\n- Solo en **Paq Premium, Paq Estándar, Paq Ligero y Paq Today**. El remitente tiene **120 horas** para dar instrucciones.\n- Con contrato: puede cambiar dirección, documento y modalidad, o devolver o destruir el envío. Sin contrato: solo los datos de la dirección. Destinatarios: con PIN en Mi Oficina.\n- EED/PEE: si el DOI falla **3 veces**, la entrega se bloquea.\n- Sectores E001, E002… Alta por **asignación directa** (antes del reparto) o **envíos de reparto**.\n- Estados: pendientes de recibir información, pendientes de gestión y gestionados.\n- En la devolución, el nuevo envío pierde los valores añadidos.\n\n## 8. Seguridad en el reparto\n- Kilometraje en la aplicación **MILLA**. Incidencias del vehículo al gestor de **FLOTA**. Nunca se entrega el vehículo en reserva.\n\n## 9. Situaciones especiales\n- Pendientes en sección: el refuerzo sale a reparto y el titular clasifica. Baja del titular: el jefe hace un estudio previo.\n\n## 10. Archivo\n- Caja \"archivo definitivo folio prolongado\" de 39 x 27,5 x 11,6 cm, normalmente con 3 meses de documentos.\n\n| Serie | Contenido | Conservación |\n|---|---|---|\n| 100 | Globales SGIE | 18 meses |\n| 200 | Hojas de reparto individuales | 18 meses |\n| 400 | Telegráfica / Burofax | 6 meses |\n| 500 | Recogidas | 6 meses |\n| 600 | Electoral | 5 años |\n| 700 | Firmas de asistencia | 4 años |\n| Vehículos | — | 1 año |\n\n- Las actas de expolio de valores declarados se guardan 12 meses. El armario archivador tiene 4 cajones.\n\n## 11. Reparto rural\n- Los rurales aportan su vehículo y cobran una compensación por ello.\n- Recorrido máximo diario: **PI 15 km**, **CI 30 km**, **MO 35 km**, **AU 200 km**.\n- Tipos: **I integrado**, **II integrado con lista propia** y **III liquidación diferida** (taloncillo).\n\n## Claves para el examen\n- 97 USE, más de 14 h diarias, sin servicios rurales dependientes.\n- UR: plantilla InterConnect de 353 x 250 x 30 mm y menos de 1 kg.\n- Descarga: hasta 8 secciones, toda la unidad. De 9 a 22, 15 min antes. Más de 22, de 15 a 30 min antes.\n- Bandejas: A 340 y B 80 envíos. Volcado SIE antes de las 11 h o de las 18 h.\n- Giro a domicilio: máximo 499,99 €. Reembolso: máximo 2.499,99 €.\n- Registrados a mayores de 14 años con DOI. Giros y Western Union a mayores de edad.\n- Notificaciones Ley 39/2015: 3 h de separación y franja de las 15:00. Judiciales (NC, NF, NJ): más de 1 h. 2º intento en 3 días hábiles.\n- Plazos: 6 días naturales hasta el 1er intento y 7 días en lista.\n- Estacionados: 120 h (5 días). Solo Paq Premium, Estándar, Ligero y Today.\n- Reenvío: más de 5 envíos, sobre colector. Definitivos: 15 días de margen.\n- Entornos especiales: 250 m; 10 viviendas o 25 habitantes por hectárea; 5 envíos a la semana.\n- Rural: PI 15, CI 30, MO 35 y AU 200 km. Archivo electoral (serie 600): 5 años.", "preguntas": [{"p": "¿Cuántas unidades de servicios especiales existen actualmente según el temario?", "o": ["97", "85", "102", "110"], "c": 0, "e": "El texto indica que existen 97 unidades de servicios especiales en capitales y poblaciones importantes.", "pag": 763}, {"p": "Una UR (con USE en la localidad) puede repartir Paq Estándar si su formato no supera la plantilla InterConnect, que mide:", "o": ["324 x 229 x 25 mm", "353 x 250 x 30 mm", "250 x 176 x 20 mm", "400 x 300 x 50 mm"], "c": 1, "e":
