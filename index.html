 "PR0020"], "c": 0, "e": "El procedimiento de investigación de accidentes de trabajo es el PR0004.", "pag": 1362}, {"p": "¿Qué es el CPSS?", "o": ["Comisión Permanente de Salud y Seguridad, órgano central", "Comité de Prevención del Servicio de Salud, órgano técnico", "Comité Provincial de Seguridad y Salud, órgano paritario y colegiado", "Consejo Provincial de Salud Sindical, órgano consultivo"], "c": 2, "e": "El CPSS es el Comité Provincial de Seguridad y Salud, órgano paritario y colegiado provincial.", "pag": 1362}, {"p": "¿Cuál es el órgano central de participación en seguridad y salud laboral de Correos?", "o": ["El CPSS (Comité Provincial de Seguridad y Salud)", "El Comité local de emergencias", "La CESL (Comisión Estatal de Salud Laboral)", "El Comité de Cumplimiento"], "c": 2, "e": "La CESL es el órgano central de participación en seguridad y salud laboral.", "pag": 1362}, {"p": "¿Cuál de los siguientes EPI puede entregarse en modalidad de depósito?", "o": ["Botas", "Casco", "Cubrepantalón", "Ahuyentador de perro"], "c": 0, "e": "En modalidad depósito se pueden entregar botas, guantes de moto, chaleco, lumbostato, entre otros.", "pag": 1363}, {"p": "Un trabajador declarado 'no apto temporal' en el procedimiento de trabajadores especialmente sensibles:", "o": ["Se desplaza temporalmente a otro puesto, sujeto a revisión", "Se desplaza sin revisión y debe concursar en traslados", "Mantiene su puesto sin realizar algunas tareas", "Pasa a situación de baja por incapacidad"], "c": 0, "e": "El no apto temporal se desplaza temporalmente a otro puesto, quedando sujeto a revisión.", "pag": 1365}, {"p": "¿Qué código tiene el procedimiento de actuación para trabajadoras en situación de embarazo, lactancia o parto reciente?", "o": ["PR0017", "PR0016", "PR0013", "PR0011"], "c": 0, "e": "Es el procedimiento PR0017.", "pag": 1365}, {"p": "¿Qué procedimiento establece un canal de comunicación de riesgos 'graves e inminentes'?", "o": ["PR0014", "PR0006", "PR0020", "PR0004"], "c": 2, "e": "El procedimiento de actuación en caso de riesgo grave e inminente es el PR0020.", "pag": 1365}, {"p": "Según el protocolo frente a agresiones de perros, en caso de derribo hay que:", "o": ["Levantarse rápidamente y salir corriendo", "Enroscarse y colocar las manos en la cabeza y el cuello", "Mirar fijamente a los ojos al perro", "Gritar para alejar al animal"], "c": 1, "e": "En caso de derribo, enroscarse y colocar las manos en la cabeza y el cuello.", "pag": 1366}, {"p": "Según el protocolo de carga de reparto en moto, para no sobrecargar la moto debe:", "o": ["Colocar parte de la carga en el asiento trasero", "Llevar el cofre abierto para más volumen", "Hacerse uso del buzón de alcance", "Repartir en dos turnos sin avisar"], "c": 2, "e": "Para no sobrecargar la moto, hacer uso del buzón de alcance.", "pag": 1366}]}, {"letra": "P", "titulo": "Digitalización y ciberseguridad", "paginas": "1367-1420", "resumen": "## 1. Digitalización\n\n- Las tecnologías digitales son el **principal motor de transformación económica y social**; exigen también un **cambio cultural**.\n- **Sociedad Digital**: propuesta europea para un **Mercado Único Digital Europeo**, orientada a las **pymes** (más **I+D+i**, educación y administraciones modernas).\n\n### 1.1.1. Facilitadores digitales\nHerramientas que permiten desarrollar una actividad en el mundo virtual:\n\n- **Red de banda ancha**: la **clave de la digitalización**; sin ella no son posibles el resto de funcionalidades. Red con elevada capacidad de transporte de información (velocidad de transmisión).\n- **Internet de las cosas (IoT)**: interconexión digital de objetos cotidianos con Internet mediante sensores y software. Correos lo aplica en **Homyhub** y en las **cajas sensorizadas de Paq Frío**.\n  - **RECI** (Red Española de Ciudades Inteligentes) promueve: reducción del gasto público, mejora de la calidad de los servicios y gestión automática y eficiente de infraestructuras urbanas.\n  - Correos se incorpora en **2020** como miembro de pleno derecho al **Clúster Smart City**.\n- **Computación en la nube**: recursos y almacenamiento sin gestión activa del usuario.\n- **Big Data**: análisis de grandes volúmenes de datos **en tiempo real** para decidir y predecir comportamientos. Correos tiene plataforma Big Data e inteligencia geoespacial de **Dotgis**.\n- **Computación cognitiva**: máquinas que simulan procesos del pensamiento humano mediante un modelo computarizado.\n- **Servicios de ubicación**: servicio personalizado según geoposicionamiento (wifi, GPS o del lado del servidor), que transmite a una aplicación **LBS** (*Location Based Services*).\n\n**Claves del Big Data**\n\n| Término | Significado |\n|---|---|\n| **Clustering** (agrupación) | 1) Combinar sistemas que trabajan en paralelo como un recurso unificado; 2) segmentar datos por similitud en grupos y subgrupos |\n| **Huella digital** | Rastro que deja el uso de una identidad en Internet |\n| **Privacidad** | Los datos personales son valiosos para las empresas; el Grupo Correos cumple la normativa de protección de datos |\n| **Datificación** | Los datos como fuente de información y conocimiento |\n| **Open Data** | Datos públicos, accesibles y reutilizables sin restricciones de derechos de autor o patentes |\n| **Query** | Consulta a una base de datos (p. ej., términos en un buscador) |\n| **XML** | Lenguaje de Marcado Extensible: describir, analizar y procesar información entre sistemas |\n\n### 1.1.2. Inhibidores digitales\nImpedimentos en cualquier proceso de digitalización:\n\n- **Resistencia al cambio**, **cultura** tradicional y **falta de agilidad**.\n- **Canibalización**: el nuevo servicio compite con uno anterior similar no adaptado.\n- **Regulación**: suele ir **por detrás** del mercado y la innovación, generando incertidumbre.\n- **Legacy** (soluciones históricas): sistema tecnológico **obsoleto que no puede actualizarse**.\n- **Falta de talento** y **seguridad digital**.\n\n### 1.1.3. Diferenciadores digitales\nLa gestión de facilitadores e inhibidores determina la competitividad. Diferencias empresa digital / tradicional:\n\n| Aspecto | Empresa digital | Empresa tradicional |\n|---|---|---|\n| Eficiencia | **Agilidad cross-funcional** | Eficiencia funcional |\n| Puntos de contacto | Todos digitales | Ocasionales, no integrados |\n| Tecnología | Innovación para nuevas oportunidades | Mejora de eficiencia |\n| Organización | En red, sin escalafones, incluso sin jefes | Jerárquica |\n| Información | La usa para personalizar servicios | Apenas la usa |\n\n- En **2021** Correos anunció la informatización de sus casi **2300 puntos de atención** en zonas rurales.\n- La app de Correos ganó los **Premios Nacionales de Tecnología Siglo XXI en 2020**.\n- Innovación con startups: **reto Lehnica** y **Correoslabs**.\n\n### 1.2. Digitalización documental\n\n- Transformar un documento en papel en digital mediante **escaneado o fotografiado**, guardándolo en formato adecuado (JPG, PDF, BMP…).\n- Utiliza un **gestor documental** con indexación para ordenar, catalogar e identificar imágenes en un **repositorio**.\n\n**Ejemplos en Correos**: Plataforma **Ágora** (gestión documental corporativa: albaranes y formularios), **CEDICO** (Centro de Digitalización de Correos), **GESCAN** (digitalización y captura de documentos e imágenes), **ORVE**, servicio de digitalización para clientes con contrato, programas como Dsigñ-cloud o Allread Machine Learning, y **OCR** en máquinas de clasificación **IRV** o **Top 2000**.\n\n### 1.2.1. Ventajas\n- Menor riesgo de pérdida y menos espacio y gastos de conservación.\n- Las imágenes no pierden nitidez con los años.\n- Consulta más rápida y acceso selectivo; publicación inmediata en Internet.\n- No se deterioran los originales; no hace falta hacer copias.\n\n### 1.2.2. Inconvenientes\n- No todo puede digitalizarse (**derechos de autor**); en repositorios públicos hay menos control y más riesgo de copias ilícitas.\n- **Corrupción de archivos** por virus o mal manejo.\n- Requiere actualizar los equipos (inversión).\n- **Erratas** por confusión de signos tipográficos.\n- La formación del personal debe ir acorde a la tecnología.\n\n### 1.2.3. Procedimiento\n- Primero, decidir qué datos serán necesarios para futuras consultas → asignación de **metadatos** (datos que describen otros datos).\n- Tratar los textos con **OCR** (*Optical Character Recognition*) para que se consulten como texto y no como imagen (búsqueda rápida).\n\n### 1.2.4. Elementos necesarios\n- **Herramientas** (tablet, escáner, smartphone): alta definición, velocidad, conversión de formatos.\n- **Capacidad de almacenamiento**, incluyendo copias de seguridad periódicas.\n- **Sistema de gestión documental**: **DMS** (*Document Management System*).\n\n## 2. Negocios digitales\n\n### 2.1. Concepto y 2.2. Elementos comunes\n- Negocios que usan la tecnología para mejorar sus servicios. Frente a los tradicionales, usan la tecnología para **reducir gastos**, **recopilar datos** y **ofrecer nuevos valores**; integran la transformación digital y ponen la **experiencia del cliente** en el centro.\n\n### 2.3. Negocio digital vs. negocio electrónico\n\n| Negocio digital | Negocio electrónico |\n|---|---|\n| Busca nuevos valores y experiencias diferenciadoras | No modifica modelo, estructura ni valores |\n| Construye experiencia de cliente, procesos y modelo según su estrategia digital | Solo añade presencia electrónica para ganar eficiencia (formularios o pedidos electrónicos) |\n| Ventaja competitiva | No proporciona una experiencia nueva |\n\n### 2.4. Modelos de negocios digitales\n\n| Modelo | Características | Ejemplos |\n|---|---|---|\n| **Freemium** (Free + Premium) | Producto gratis para promocionar otro de pago; fuerte inversión inicial, buenos resultados a largo plazo. Requiere base sólida de clientes, embudo de conversión optimizado e infraestructura para muchos usuarios gratuitos | Adobe, Skype, LinkedIn, Dropbox, iCloud, Flickr; Correos: **Crear App, Crear tienda online, Crear web** |\n| **Código abierto** | Software libre; ingresos por suscripciones premium y servicios asociados | — |\n| **Suscripción** | Pago de cuota; clientes fijos por tiempo limitado, ingresos predecibles (pago por adelantado); exige gran inversión en fidelización | Netflix, Spotify, Amazon Prime |\n| **Marketing de leads** | Dirige usuarios con intereses a portales; lead = cliente potencial | **Correos Add** (captación dinámica de leads mediante formularios) |\n| **Plataformas de compradores online** | Agrupan ofertas de un sector | Booking, Amazon, **Correos Market** |\n| **eLearning** | Campus virtual; streaming | App **Formación Correos** en la PDA (**Mobile Learning**) |\n| **P2P** (red de pares) | Intercambio de productos entre usuarios | Wallapop, Vinted |\n| **Crowdfunding** (micromecenazgo) | Visibilidad a proyectos para obtener recursos; los aportantes pueden participar en beneficios | — |\n\n## 3.1. Navegación\n- Navegar en webs **https** con **candado** (certificado de seguridad; la \"S\" = seguro).\n- Contraseñas seguras: **mínimo 8 caracteres** (mayúsculas, minúsculas y números). **Correos exige mínimo 10 caracteres** con mayúsculas, minúsculas, números y caracteres especiales.\n- Evitar wifi desconocidas; si no hay otra, comprobar que es la oficial y usar **navegación de incógnito**.\n\n### 3.1.1. Activos de información\n- Elementos fundamentales para el funcionamiento y supervivencia de la empresa.\n- Metodología: **inventario actualizado** y designar un **responsable** de cada activo.\n- Tipos: instalaciones, software, hardware, equipamiento auxiliar, comunicaciones, servicios, información/datos y **Recursos Humanos** (incluidos colaboradores externos).\n\n### 3.1.2. Categorías de información\n- **Pública**: sin restricciones de difusión.\n- **Interna**: etiquetada, accesible a todo el personal; no se difunde a terceros sin autorización de la dirección.\n- **Confidencial**: acceso restringido a la dirección y empleados que la necesiten; incluye datos personales y categorías especiales; debe estar marcada y, si sale en soporte digital, **cifrarse**.\n\n### 3.1.3. Control de acceso a Internet en la empresa\n- Software: control de webs, **filtrado por palabras clave** (firewall), tipos de archivo y **examen de caché** (**no es seguro**).\n- **LO 3/2018** (Protección de Datos y garantía de derechos digitales): la empresa puede vigilar sin interferir en la privacidad, debiendo **comunicar por escrito** la vigilancia, **delimitar** lo prohibido y **especificar** los dispositivos de vigilancia.\n\n### 3.1.4. Control parental\nHerramientas para que los menores solo naveguen por páginas seguras.\n\n### 3.1.5. Información verídica\n- **Bulos/Hoaxes**: información falsa deliberada para influir en la opinión; generan alarma social, pueden captar direcciones de correo o difundir malware.\n- **Fake News**: información falsa para engañar, manipular y desprestigiar.\n- Emitir un mensaje falso puede ser delito (Código Penal).\n\n### 3.1.6. Navegación privada\n- **Cookies**: archivos de texto del navegador (seguimiento, sesión, preferencias).\n- La navegación privada borra al cerrarse cookies, historial y textos; no guarda contraseñas y vacía la caché.\n- **No oculta la IP** ni evita que las webs queden en el **router**. El navegador que camufla la IP es **TOR**.\n\n### 3.1.7. Ciberseguridad\n- **Vulnerabilidad**: debilidad del sistema. **Amenaza**: elemento que aprovecha la vulnerabilidad. **Riesgo**: posibilidad de que una amenaza aproveche una vulnerabilidad causando daño (**ISO/IEC 27005**).\n- **INCIBE**: referencia en España; depende del **Ministerio de Asuntos Económicos y Transformación Digital** (Secretaría de Estado de Digitalización e IA).\n- Tres ejes: **disponibilidad**, **confidencialidad** e **integridad** (no manipulada, tal cual se generó).\n- **Amenazas**: naturales, infraestructura auxiliar, sistemas y errores humanos.\n- **Medida organizativa fundamental**: **política de seguridad interna**, disponible, recordada y **firmada al comienzo de la relación laboral**. No sirve para descargar responsabilidad: las consecuencias por negligencia son **para la empresa**.\n- **Medidas técnicas**: contraseñas robustas (cambiar la inicial, complejas, cambio periódico, bloqueo tras varios fallos); antivirus actualizado que el empleado **no pueda desactivar**; actualizaciones automáticas; limitar **usuarios genéricos** y **permisos de administración**; bloqueo por inactividad; restringir **USB**; destructoras; limitar navegación; acceso remoto mediante **VPN**; seguridad en impresión (tarjetas o códigos); control de **BYOD** (*Bring your own device*) con base de datos.\n\n### 3.1.8. Análisis y tratamiento de riesgos\n- Contenido: sistema a proteger, inventario, jerarquía de bienes, amenazas y vulnerabilidades, y relación importancia-riesgo (**\"peso de riesgo\"**).\n- **Evaluación** (determinar sistemas afectados y niveles) y **gestión** del riesgo (controles para reducirlo a niveles aceptables).\n- Técnicas: **Evitar**, **Reducir**, **Transferir** (a terceros), **Retener** (riesgos residuales) y **Aceptar** (por debajo del umbral).\n\n### 3.1.9. Decálogo de seguridad de Correos\nIncluye: no usar wifi públicas, contraseñas robustas sin anotar, software licenciado, no abrir adjuntos sin contactar al remitente, **pasar el ratón sobre los enlaces**, **borrar las cookies** y no publicar datos personales en redes.\n\n### 3.1.10. Ciberdelincuencia\nTipos de ciberataques según **INCIBE** y **OSI**:\n\n- **Ataques a contraseñas**: **fuerza bruta** (combinaciones con datos personales y al azar) y **diccionario** (software automático). Prevención: autenticación multifactor y gestores.\n- **Ingeniería social**:\n  - **Phishing** (email, mensajería, redes), **Vishing** (llamada), **Smishing** (SMS); **Spear phishing**: dirigido a persona u organización concreta.\n  - **Baiting** (cebo, p. ej. USB infectado), **Shoulder surfing** (mirar por encima del hombro; filtros de privacidad), **Dumpster diving** (buscar en la basura), **Spam**, **fraudes online**.\n- **Ataques a conexiones inalámbricas**: **redes trampa** (wifi gemela, con palabras como \"gratis\"; usar **VPN**), **Spoofing** (IP, Web, Email, **DNS**), **ataques a cookies** (robo y envenenamiento), **DDoS** (muchos equipos a la vez; **Botnet**), **inyección SQL**, **Portscan**, **Man in the middle**, **Sniffing**.\n- **Malware**:\n\n| Tipo | Descripción |\n|---|---|\n| Spyware | Recopila información sin consentimiento |\n| Troyano | Se disfraza de programa legítimo; da acceso remoto (troyanos bancarios) |\n| Backdoor | Puerta trasera; forma redes zombi |\n| Keylogger | Spyware que registra lo que se teclea |\n| Stealer | Troyano que roba información privada |\n| Ransomware | Bloquea/cifra y pide **rescate** |\n| Gusano | Se replica en otros ordenadores de la red |\n| Rootkit | Accede ilícitamente y se mantiene **oculto** |\n| Botnet | Red zombi de bots controlados remotamente |\n| Criptojacking | Usa/roba criptomonedas; suele usar **JavaScript** |\n\n- **Otros**: **Pharming** (redirección a webs falsas), **ciberacoso** (Doxing, Fraping, stalking, ciberbullying, sextorsión, grooming), **ciberespionaje**.\n- Prevención: antivirus, SO actualizado, contraseñas seguras, cifrado wifi **WPA/WPA2** (más seguro que WEP).\n- Guía INCIBE contra phishing: sospechar de errores gramaticales, comunicaciones anónimas, urgencia y dominios **@gmail.com/@hotmail.com** (las empresas usan los suyos, p. ej. @correos.es).\n- **Hacker**: experto que investiga y reporta fallos (término mal utilizado).\n\n**Correos frente al phishing**\n- Conducta **DAS**: **Detectar, Avisar y Suprimir**.\n- **Área de Seguridad de la Información** y equipo de **Respuesta ante Incidentes**, en contacto con **CCN-Cert**, **INCIBE** y **AEPD**.\n- Correos **no presta su imagen para sorteos**, **nunca solicita pagos por medios digitales** ni datos personales por email o SMS.\n- **Verificador de email** (desde **2022**): se introduce el email del destinatario y el código alfanumérico recibido. Se recomienda usar la **app de Correos**.\n\n| Caso detectado | Importe |\n|---|---|\n| Chatbot entrega de paquete / sorteo en Facebook | 1,50 € |\n| IVA de aduanas vía **Paysafecard** (PIN de 16 dígitos) | 50 € |\n| Limpieza y desinfección de paquetes (COVID-19) | 1,40 € |\n| Pago por validación y envío | 2,99 € |\n| Smishing derechos de aduanas | 2,99 € (ejemplo real 1,79 €, aleatorio) |\n\n\n## 3.2. Identidad digital\n- Todo lo que identifica a un sujeto en el entorno virtual: información que publica, que comparte y que existe sobre él en Internet.\n- **Identificación** (nombre o email) y **autenticación** (contraseña, reconocimiento facial, huella).\n\n### 3.2.1. Gestión\n- **Brecha digital**: diferencia entre quienes acceden/saben usar las tecnologías y quienes no; genera exclusión social.\n- Se construye de forma **activa**; se pueden tener varias identidades.\n- **Self-presentation**: la identidad digital normalmente no coincide con la real.\n- Características: **social, subjetiva, con valor, referencial, crítica, compuesta, dinámica, contextual, permanentemente accesible y cronológica, inexacta**.\n- Apps que agrupan información de una persona: **123people**, **pipl.com**.\n\n### 3.2.2. Visibilidad, 3.2.3. Reputación y 3.2.4. Privacidad\n- **Visibilidad**: medible (contactos, seguidores, réplicas, comentarios). **Número Dunbar**: unos **150** contactos cognitivos.\n- **Reputación**: opinión que los demás tienen del sujeto; ejemplo **LinkedIn**.\n- **Privacidad**: al darse de alta en una red social se ceden los datos y contenidos, que pueden seguir visibles tras la baja; usar el configurador de privacidad.\n\n### 3.2.5. Riesgos\nSuplantación de identidad, **registro abusivo de nombre de dominio**, fuga de información, publicación de información negativa, uso no consentido de propiedad intelectual y **DDoS**.\n\n### 3.2.6. Protección\n- Evitar wifi públicas (si no, solo **https**).\n- Contraseñas **débiles** vs **robustas** (mín. 8 caracteres; **Correos: 10**).\n- Recomendaciones de la **OSI**: no compartir, robustas, no repetir, cuidar preguntas de seguridad, no almacenar en lugar público, cambiar regularmente, gestor de contraseñas.\n\n- Gestores: **Password** (huella; solo iOS), **1Password** (de pago, prueba de **30 días**), **LastPass** (gratuita sin límite de tiempo), Keeper Security y Dashlane.\n\n- Generadores: **ClaveSegura** (SSL, claves de **4 a 20** caracteres), **RoboForm** (hexadecimal), **Google Chrome**.\n\n### 3.2.7. Autenticación de usuario\n- Formas: huella digital, usuario y contraseña, tarjeta magnética o móvil.\n- **Firma electrónica**: Ley **59/2003** (derogada), hoy **Ley 6/2020**, de 11 de noviembre (servicios electrónicos de confianza). Tipos: **simple**, **avanzada** (identifica al firmante y detecta cambios) y **reconocida/cualificada** (avanzada + certificado reconocido + dispositivo seguro). La reconocida equivale a la **firma manuscrita**.\n- **Certificado digital**: emitido por la **FNMT-RCM**; se solicita en la web, se acredita la identidad en una oficina de registro (Seguridad Social, AEAT o ayuntamientos) y se descarga.\n- **Cl@ve**: código del usuario + PIN por app Cl@ve PIN o SMS, válido **10 minutos**.\n- **Huella dactilar** (desde **2013**), reconocimiento facial y ocular, **2FA** (p. ej., tarjetas de coordenadas).\n\n## Anexo I. Delitos informáticos (LO 10/1995, Código Penal)\n\n| Delito | Artículo | Pena |\n|---|---|---|\n| Descubrimiento de secretos/intimidad | 197 | Prisión **1-4 años** y multa 12-24 meses (agravantes 3-5 años; difusión: 4-5) |\n| Intrusión informática | 197 bis.1 | Prisión **6 meses-2 años** |\n| Interceptación de transmisiones | 197 bis.2 | Prisión **3 meses-2 años** o multa 3-12 meses |\n| Facilitar medios a terceros | 197 ter (organización criminal: 197 quater) | — |\n| Estafa / fraude informático | 248-251 bis | Prisión **6 meses-3 años** |\n| Daños (sabotaje informático) | 263-267 (art. 264) | Prisión **6 meses-3 años** |\n| Propiedad intelectual | 270-272 | Prisión **6 meses-4 años** y multa 12-24 meses |\n| Mercado y consumidores (secreto de empresa) | 278-286 | Prisión **2-4 años** y multa 12-24 meses |\n\n- Persona jurídica: art. 197; funcionario público: art. 198.\n- Perseguir estos delitos exige **denuncia del agraviado** (art. 201), salvo funcionario público o afectación a intereses generales o pluralidad de personas.\n\n## Anexo II. Seguridad de la información en Correos\n- **Comité de Seguridad de la Información**: gestiona la política, normas y procedimientos; vela por el **Comité de Seguridad Corporativo**; diseña un **Sistema de Gestión de la Seguridad de la Información**.\n- La Política de Seguridad es de **obligado cumplimiento** para todo el personal.\n- Normativa: **Reglamento (UE) 2016/679** (RGPD) e **ISO 27001**.\n- **Área de Seguridad de la Información**: determina medidas y recomendaciones para los puestos de trabajo.\n\n## Claves para el examen\n- **Red de banda ancha**: clave de la digitalización. IoT en Correos: **Homyhub** y **Paq Frío**; Clúster Smart City en **2020**.\n- **Legacy** = sistema obsoleto que no puede actualizarse; regulación va por detrás del mercado.\n- Correos: **2300** puntos rurales informatizados (2021); app premiada en **2020**; **CEDICO**, **GESCAN**, **Ágora**; **DMS**; **OCR**.\n- Freemium en Correos: **Crear App/tienda online/web**; leads: **Correos Add**; plataforma: **Correos Market**; eLearning: **Formación Correos**.\n- Contraseñas: mínimo general **8**; en Correos **10** caracteres con especiales.\n- **LO 3/2018**: comunicar por escrito la vigilancia. Examen de caché: método no seguro.\n- Navegación privada no oculta la IP; **TOR** sí la camufla. Riesgo según **ISO/IEC 27005**.\n- **Phishing** (email/redes), **Vishing** (teléfono), **Smishing** (SMS); conducta **DAS**; verificador de email desde **2022**.\n- **Ransomware** pide rescate; **Rootkit** se oculta; **Criptojacking** usa JavaScript; wifi con **WPA/WPA2**.\n- **Número Dunbar ≈ 150**; Cl@ve PIN válido **10 minutos**; huella dactilar desde **2013**; firma electrónica: **Ley 6/2020**.\n- Intrusión informática (197 bis): **6 meses a 2 años**; descubrimiento de secretos (197): **1 a 4 años**.\n- Correos: **RGPD 2016/679** e **ISO 27001**; Paysafecard **50 €**, PIN de **16 dígitos**.", "preguntas": [{"p": "Según el temario, ¿qué facilitador digital es considerado la clave de la digitalización, sin el cual es imposible el resto de funcionalidades?", "o": ["La computación en la nube", "La red de banda ancha", "El Internet de las cosas", "El Big Data"], "c": 1, "e": "El texto la define como la clave de la digitalización.", "pag": 1370}, {"p": "¿En qué año se incorporó Correos como miembro de pleno derecho al Clúster Smart City?", "o": ["2019", "2020", "2021", "2022"], "c": 1, "e": "El operador postal se incorpora en 2020 al Clúster Smart City.", "pag": 1371}, {"p": "¿Cómo se denomina el inhibidor digital que consiste en un sistema tecnológico obsoleto que no puede actualizarse?", "o": ["Canibalización", "Falta de agilidad", "Resistencia al cambio", "Legacy o solución histórica"], "c": 3, "e": "Un sistema legacy o heredado es un sistema obsoleto que no puede actualizarse.", "pag": 1373}, {"p": "En 2021 Correos anunció la informatización de sus puntos de atención al público en zonas rurales. ¿Cuántos eran aproximadamente?", "o": ["Casi 1300", "Casi 2300", "Casi 3200", "Casi 2800"], "c": 1, "e": "El texto habla de casi 2300 puntos de atención en zonas rurales.", "pag": 1374}, {"p": "En cuanto a la eficiencia, la empresa digital se caracteriza por:", "o": ["La eficiencia funcional", "La organización jerárquica", "Los puntos de contacto ocasionales", "La agilidad cross-funcional"], "c": 3, "e": "La empresa digital se caracteriza por la agilidad cross-funcional; la tradicional, por la eficiencia funcional.", "pag": 1373}, {"p": "¿Qué es CEDICO?", "o": ["El Centro de Digitalización de Correos", "El programa de captura de documentos de Correos", "La plataforma de gestión documental corporativa", "El sistema OCR de las máquinas de clasificación"], "c": 0, "e": "CEDICO es el Centro de Digitalización de Correos.", "pag": 1375}, {"p": "El sistema de gestión documental que permite administrar la documentación digital se conoce por las siglas:", "o": ["OCR", "DMS", "LBS", "XML"], "c": 1, "e": "DMS corresponde a Document Management System.", "pag": 1378}, {"p": "Señale cuál NO es una ventaja de la digitalización documental según el temario:", "o": ["Permite digitalizar todos los documentos sin limitación", "Reduce el riesgo de pérdida de documentos", "Las imágenes no pierden nitidez con los años", "No es necesario realizar copias de los documentos"], "c": 0, "e": "Es un inconveniente: no se pueden digitalizar todos los documentos por los derechos de autor.", "pag": 1377}, {"p": "Los planes de ecommerce de Correos Crear App, Crear tienda online o Crear web se basan en el modelo de negocio:", "o": ["Suscripción", "Freemium", "Código abierto", "Marketing de leads"], "c": 1, "e": "Ofrecen un plan básico gratuito ampliable con planes de pago superiores (freemium).", "pag": 1380}, {"p": "¿Qué solución de Correos recopila y utiliza datos de clientes obtenidos mediante formularios en diferentes webs (captación dinámica de leads)?", "o": ["Correos Add", "Correos Market", "Correoslabs", "Formación Correos"], "c": 0, "e": "Con la captación dinámica de leads, Correos Add recopila datos mediante formularios.", "pag": 1380}, {"p": "Wallapop o Vinted son ejemplos del modelo de negocio digital:", "o": ["Plataforma de compradores online", "Crowdfunding", "Suscripción", "P2P o red de pares"], "c": 3, "e": "El modelo P2P se especializa en el intercambio de productos entre usuarios; ejemplos Wallapop o Vinted.", "pag": 1381}, {"p": "¿Cuántos caracteres como mínimo ha establecido Correos para sus contraseñas?", "o": ["8", "12", "10", "6"], "c": 2, "e": "El Área de Seguridad de Correos exige un mínimo de diez caracteres.", "pag": 1382}, {"p": "Si la información confidencial tuviera que salir de las instalaciones en soporte digital, debe:", "o": ["Etiquetarse como interna", "Autorizarse por la dirección y difundirse", "Cifrarse", "Imprimirse previamente"], "c": 2, "e": "El texto indica que, si sale en soporte digital, tiene que cifrarse.", "pag": 1383}, {"p": "Según la LO 3/2018, para vigilar el uso de Internet de sus trabajadores la empresa debe, entre otras premisas:", "o": ["Obtener autorización judicial previa", "Informar verbalmente al comité de empresa", "Comunicar por escrito al empleado que puede vigilar ese uso", "Instalar únicamente filtros por palabras clave"], "c": 2, "e": "Una de las premisas es comunicar por escrito al empleado la posible vigilancia.", "pag": 1384}, {"p": "¿Qué sistema de control de acceso a Internet en la empresa NO se considera seguro?", "o": ["Control de acceso a páginas web", "Filtrado por palabras clave", "Limitación de tipos de archivo", "Examen de archivos alojados en caché"], "c": 3, "e": "El examen de caché no es seguro, ya que el empleado puede conocer los archivos temporales.", "pag": 1384}, {"p": "¿Cómo se denomina el navegador que camufla la dirección IP?", "o": ["TOR", "HTTPS", "VPN", "DNS"], "c": 0, "e": "El texto indica que existe un navegador que camufla la IP denominado TOR.", "pag": 1386}, {"p": "La posibilidad de que una amenaza pueda aprovechar una vulnerabilidad para causar una pérdida o daño de un activo de información es la definición de:", "o": ["Amenaza", "Vulnerabilidad", "Impacto", "Riesgo"], "c": 3, "e": "Es la definición de riesgo (ISO/IEC/27005).", "pag": 1386}, {"p": "El principio de seguridad según el cual la información aparece tal cual fue generada, sin manipulaciones no autorizadas, es la:", "o": ["Disponibilidad", "Confidencialidad", "Integridad", "Trazabilidad"], "c": 2, "e": "La integridad implica que la información no ha sido manipulada ni alterada.", "pag": 1386}, {"p": "La relación importancia-riesgo asociada a cada bien informático en el análisis de riesgos se denomina:", "o": ["Peso de riesgo", "Umbral de riesgo", "Riesgo residual", "Índice de impacto"], "c": 0, "e": "El texto la denomina \"peso de riesgo\".", "pag": 1391}, {"p": "Se habla de Vishing cuando el ataque de suplantación se realiza:", "o": ["A través de SMS", "Por llamada telefónica", "Por correo electrónico", "Mediante redes sociales"], "c": 1, "e": "Vishing se refiere al ataque por llamada telefónica; Smishing, por SMS.", "pag": 1394}, {"p": "La técnica que consiste en buscar información sensible en los contenedores de basura se denomina:", "o": ["Shoulder surfing", "Baiting", "Dumpster Diving", "Sniffing"], "c": 2, "e": "Dumpster Diving es la búsqueda de información en la basura.", "pag": 1394}, {"p": "¿Qué tipo de malware secuestra el acceso a un equipo y su información hasta obtener un rescate?", "o": ["Rootkit", "Keylogger", "Adware", "Ransomware"], "c": 3, "e": "El ransomware bloquea o cifra el acceso hasta obtener un rescate.", "pag": 1397}, {"p": "Para cometer el ciberdelito de criptojacking suele utilizarse el lenguaje de programación:", "o": ["SQL", "XML", "Python", "JavaScript"], "c": 3, "e": "El texto señala que suele utilizarse JavaScript.", "pag": 1398}, {"p": "Ante cualquier sospecha de phishing, el empleado de Correos debe poner en marcha la conducta DAS, que significa:", "o": ["Denunciar, archivar y supervisar", "Detectar, avisar y suprimir", "Detectar, analizar y solucionar", "Desconfiar, avisar y señalar"], "c": 1, "e": "DAS significa detectar, avisar y suprimir.", "pag": 1400}, {"p": "¿En qué año incorporó Correos su herramienta de verificador de email?", "o": ["2020", "2021", "2022", "2023"], "c": 2, "e": "En 2022 Correos incorpora la herramienta de verificación de emails.", "pag": 1400}, {"p": "En el caso de phishing sobre el pago del IVA de aduanas mediante Paysafecard, ¿qué importe se solicitaba?", "o": ["2,99 €", "50 €", "1,50 €", "1,40 €"], "c": 1, "e": "A través de Paysafecard se solicitaba el pago de 50 € con un PIN de 16 dígitos.", "pag": 1403}, {"p": "El número Dunbar, utilizado para medir la visibilidad digital, fija el número de contactos cognitivos que puede mantener el ser humano en aproximadamente:", "o": ["150", "100", "200", "500"], "c": 0, "e": "El número Dunbar lo fija en aproximadamente 150.", "pag": 1408}, {"p": "¿Durante cuánto tiempo es válido el PIN del sistema Cl@ve comunicado por app o SMS?", "o": ["10 minutos", "5 minutos", "15 minutos", "30 minutos"], "c": 0, "e": "El PIN tiene una validez de 10 minutos.", "pag": 1414}, {"p": "Actualmente, la firma electrónica se rige por:", "o": ["La Ley 6/2020, de 11 de noviembre", "La Ley 59/2003, de 19 de diciembre", "La Ley Orgánica 3/2018, de 5 de diciembre", "El Reglamento (UE) 2016/679"], "c": 0, "e": "La Ley 59/2003 fue derogada; hoy rige la Ley 6/2020.", "pag": 1412}, {"p": "El delito de intrusión informática del artículo 197 bis (apartado primero) del Código Penal se castiga con pena de prisión de:", "o": ["Uno a cuatro años", "Tres meses a dos años", "Seis meses a dos años", "Seis meses a tres años"], "c": 2, "e": "El texto indica prisión de seis meses a dos años.", "pag": 1415}, {"p": "¿En qué soluciones de Correos se aplica el Internet de las cosas (IoT) según el temario?", "o": ["En Correos Market y en la app Formación Correos", "En las máquinas de clasificación IRV y Top 2000", "En Correos Add y en la plataforma Ágora", "En Homyhub y en las cajas sensorizadas de Paq Frío"], "c": 3, "e": "Correos aplica el IoT en la técnica de Homyhub y en las cajas sensorizadas de Paq Frío.", "pag": 1371}, {"p": "Señale cuál NO es uno de los objetivos que promueve la Red Española de Ciudades Inteligentes (RECI):", "o": ["Reducción del gasto público", "Mejora de la calidad de los servicios", "Aumento de la inversión pública en vivienda", "Gestión automática y eficiente de las infraestructuras urbanas"], "c": 2, "e": "La RECI promueve reducir el gasto público, mejorar los servicios y gestionar eficientemente las infraestructuras.", "pag": 1371}, {"p": "¿Qué empresa desarrolló para Correos una plataforma de inteligencia geoespacial dentro de su apuesta por el Big Data?", "o": ["Dotgis", "Allread", "Dsigñ-cloud", "Correoslabs"], "c": 0, "e": "El texto cita la plataforma de inteligencia geoespacial desarrollada por Dotgis para Correos.", "pag": 1371}, {"p": "En el tratamiento y análisis de datos, la técnica de segmentación de la información agrupada por similitud en grupos y subgrupos se denomina:", "o": ["Datificación", "Query", "Open Data", "Clustering"], "c": 3, "e": "El Clustering aplicado al análisis de datos segmenta la información por similitud en grupos y subgrupos.", "pag": 1372}, {"p": "El movimiento que aboga por que determinados datos sean públicos, accesibles y reutilizables sin restricciones de derechos de autor o patentes es:", "o": ["Big Data", "Datificación", "Open Data", "Clustering"], "c": 2, "e": "Open Data (Datos Abiertos) defiende datos accesibles y reutilizables sin restricciones.", "pag": 1372}, {"p": "¿Qué significan las siglas XML?", "o": ["Lenguaje de Marcado Extensible", "Lenguaje de Consulta Estructurado", "Protocolo de Marcado Seguro", "Lenguaje de Datos Externos"], "c": 0, "e": "XML es Extensible Markup Language o Lenguaje de Marcado Extensible.", "pag": 1372}, {"p": "Los servicios de ubicación transmiten la información hacia una aplicación denominada:", "o": ["GPS (Global Positioning System)", "LBS (Location Based Services)", "DMS (Document Management System)", "DNS (Domain Name System)"], "c": 1, "e": "La información se transmite hacia una aplicación LBS que procesa y responde a la solicitud.", "pag": 1372}, {"p": "El inhibidor digital por el que un nuevo servicio compite con otro similar y anterior que no se ha adaptado al entorno digital se denomina:", "o": ["Canibalización", "Legacy", "Resistencia al cambio", "Falta de agilidad"], "c": 0, "e": "La canibalización supone que el nuevo servicio compita con uno similar anterior no adaptado.", "pag": 1373}, {"p": "¿Por qué fue Correos ganador de los Premios Nacionales de Tecnología Siglo XXI en 2020?", "o": ["Por su plataforma Big Data", "Por el verificador de email", "Por la informatización de sus oficinas rurales", "Por la creación de su app"], "c": 3, "e": "Correos fue premiado por la creación de su app, como adaptación a las nuevas formas de comercio.", "pag": 1374}, {"p": "La Plataforma Ágora de Correos se utiliza para:", "o": ["La digitalización y captura de imágenes", "El archivo de albaranes y formularios digitalizados", "La lectura OCR en máquinas de clasificación", "La venta online de productos"], "c": 1, "e": "Ágora es la plataforma de Gestión Documental Corporativa para albaranes y formularios digitalizados.", "pag": 1375}, {"p": "Para poner en marcha un proyecto de digitalización de calidad, ¿qué hay que hacer en primer lugar?", "o": ["Decidir qué datos serán necesarios y obligatorios para futuras consultas", "Tratar todos los documentos con un programa OCR", "Adquirir escáneres de alta definición", "Hacer copias de seguridad de los originales"], "c": 0, "e": "En primer lugar hay que decidir qué datos serán necesarios, ya que de ello depende la asignación de metadatos.", "pag": 1378}, {"p": "¿Qué caracteriza al negocio electrónico frente al negocio digital?", "o": ["Reestructura la organización según su estrategia digital", "Construye nuevas experiencias de cliente diferenciadoras", "Añade presencia electrónica sin modificar el modelo de negocio", "Explora nuevas formas de negocio centradas en el cliente"], "c": 2, "e": "El negocio electrónico no modifica modelo, estructura ni valores; solo incluye la presencia electrónica.", "pag": 1379}, {"p": "Netflix, Spotify o Amazon Prime son ejemplos del modelo de negocio digital:", "o": ["Freemium", "Suscripción o abonado", "Marketing de leads", "Plataforma de compradores online"], "c": 1, "e": "El texto los cita como ejemplos del modelo de suscripción.", "pag": 1380}, {"p": "Correos Market, la tienda online de Correos, es un ejemplo del modelo de negocio digital:", "o": ["Modelo P2P", "Crowdfunding", "Código abierto", "Plataformas de compradores online"], "c": 3, "e": "Las plataformas de compradores online agrupan ofertas; en logística, Amazon o Correos Market.", "pag": 1381}, {"p": "La aplicación Formación Correos, disponible en la PDA del personal, utiliza la técnica de:", "o": ["Streaming en directo", "Crowdlearning", "Mobile Learning", "Peer to Peer"], "c": 2, "e": "Formación Correos utiliza la técnica de Mobile Learning.", "pag": 1381}, {"p": "Según las pautas generales de navegación, una contraseña segura debe tener al menos:", "o": ["Ocho caracteres", "Seis caracteres", "Doce caracteres", "Diez caracteres sin números"], "c": 0, "e": "Con carácter general se recomiendan al menos ocho caracteres entre mayúsculas, minúsculas y números.", "pag": 1382}, {"p": "Cuando una web tiene un certificado de seguridad correctamente instalado, el protocolo cambia a HTTPS. ¿Qué indica la 'S' final?", "o": ["Servidor", "Sesión", "Seguro", "Sistema"], "c": 2, "e": "La 'S' del final se refiere a \"seguro\" y se muestra un candado en el navegador.", "pag": 1382}, {"p": "En la gestión de los activos de información, ¿quién toma las decisiones que puedan afectar a su seguridad?", "o": ["El Comité de Seguridad Corporativo", "El responsable designado de dicho activo", "El administrador del sistema de comunicaciones", "El empleado que utiliza el activo"], "c": 1, "e": "Debe determinarse el responsable del activo, que será quien tome las decisiones que afecten a la seguridad.", "pag": 1383}, {"p": "La información propia de la empresa, etiquetada y accesible a todo su personal, que no puede difundirse a terceros salvo autorización de la dirección, es la información:", "o": ["Interna", "Pública", "Confidencial", "Reservada"], "c": 0, "e": "Así define el temario la información interna.", "pag": 1383}, {"p": "El control de acceso consisten async function flush(){if(!DBREF||writing||!dirty)return;writing=true;dirty=false;

async function initSync(){
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const ref=db.collection('data/users/'+id).doc('progreso');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    DBREF=ref;
    const remote=snap.exists?snap.data():null;
    if(remote&&remote.json&&(remote.updatedAt||0)>(S.updatedAt||0)){
      S=norm(JSON.parse(remote.json));try{localStorage.setItem('opoCorreos',remote.json)}catch(e){}
      syncMode='cloud';rebuild();route();
    }else{syncMode='cloud';dirty=true;flush()}
    paintSync();

}

  // ajustes
  h+=`<div class="sec">Ajustes</div><div class="card stack">
   <div class="row"><label for="exd3"><b class="small">Fecha del examen</b></label><input type="date" id="exd3" value="${S.examDate}" min="2026-12-01" max="2027-03-31"><button class="btn sm soft" id="exok3">Guardar</button></div>
   <p class="sync" id="syncnote">${syncText()}</p>
   <div class="row"><button class="btn sm ghost" id="bk">Copiar copia de seguridad</button><button class="btn sm ghost" id="im">Restaurar copia</button><button class="btn sm ghost" id="rs" style="color:var(--ko)">Borrar progreso</button></div>
   <div id="aj"></div></div>`;
  app.innerHTML=h;
  $('#simok').onclick=()=>{const n=Math.round(+$('#simv').value);if($('#simv').value===''||isNaN(n)||n<0||n>100){toast('Escribe una nota entre 0 y 100');return}S.sims.push({d:today(),pct:n,tid:'manual-'+Date.now(),title:'Simulacro'});dayRec().acts++;checkBadges();save();toast('Nota guardada: '+n+' %');rerender()};
  $('#exok3').onclick=()=>{const v=$('#exd3').value;if(v&&v>today()){S.examDate=v;S.examConfirmed=true;rebuild();save();toast('Plan reajustado al '+fmtL(v));route()}else toast('Elige una fecha posterior a hoy')};
  $('#bk').onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Copia de seguridad copiada. Pégala en una nota')}catch(e){$('#aj').innerHTML='<p class="small muted">Copia este texto y guárdalo:</p><textarea id="bkt" readonly>'+esc(JSON.stringify(S))+'</textarea>';$('#bkt').select()}};
  $('#im').onclick=()=>{$('#aj').innerHTML='<label class="small" for="imt">Pega aquí tu copia de seguridad:</label><textarea id="imt"></textarea><button class="btn sm" id="imok" style="margin-top:8px">Restaurar</button>';$('#imok').onclick=()=>{try{const x=norm(JSON.parse($('#imt').value));S=x;rebuild();save();toast('Progreso restaurado');route()}catch(e){toast('Ese texto no es una copia válida')}}};
  $('#rs').onclick=()=>{$('#aj').innerHTML='<div class="confirm">Se borrará todo tu progreso: racha, XP, resultados y fallos. No se puede deshacer.<div class="row" style="margin-top:8px"><button class="btn sm" id="rsok" style="background:var(--ko)">Sí, borrar todo</button><button class="btn sm ghost" id="rsno">Cancelar</button></div></div>';$('#rsno').onclick=()=>$('#aj').innerHTML='';$('#rsok').onclick=()=>{const ex=S.examDate,ec=S.examConfirmed;S=blank();S.examDate=ex;S.examConfirmed=ec;rebuild();save();toast('Progreso borrado');go('hoy')}};
}

function wrongCard(q,chosen,label){
  return `<div class="card wq"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="pill ko">${esc(label)}</span><span class="small muted">Sesión ${q.l} · pág. ${esc(q.pag)}</span></div><b style="display:block;font-weight:650;line-height:1.4;margin-bottom:8px">${esc(q.p)}</b>${chosen!=null?`<div class="ans ko"><span>Tu respuesta</span>${esc(chosen)}</div>`:''}<div class="ans ok"><span>Correcta</span>${esc(q.o[q.c])}</div><p class="small muted" style="margin:8px 0 0">${esc(q.e)}</p></div>`;
}
function viewTestReview(i){
  const t=S.tests[i];if(!t){go('progreso');return}
  const w=(t.w||[]).filter(x=>QBY[x.id]);
  let h=`<div class="top"><div><div class="sub"><a href="#progreso" style="color:var(--acc);text-decoration:none">‹ Progreso</a> · ${fmtL(t.d)}</div><h1>${esc(t.title)}</h1><div class="sub">${t.ok}/${t.n} aciertos · ${t.n-t.ok} fallos</div></div></div>`;
  if(!t.w)h+=`<div class="card muted">Este test se hizo antes de que se guardara el detalle de los fallos.</div>`;
  else if(!w.length)h+=`<div class="card" style="text-align:center"><b class="c-ok">En este test no fallaste ninguna</b></div>`;
  else h+=`<div class="card row" style="justify-content:space-between"><span class="small">Repite solo estas ${w.length} preguntas</span><button class="btn sm" id="rv-go">Practicar</button></div><div class="stack" style="margin-top:12px">${w.map(x=>wrongCard(QBY[x.id],x.a,'Pregunta '+x.j)).join('')}</div>`;
  app.innerHTML=h;
  const b=$('#rv-go');if(b)b.onclick=()=>startQuiz({mode:'fallos',ls:[...new Set(w.map(x=>QBY[x.id].l))],title:'Fallos de: '+t.title,qs:w.map(x=>QBY[x.id])});
}
function lastWrongText(id){for(let k=S.tests.length-1;k>=0;k--){const f=(S.tests[k].w||[]).find(x=>x.id===id);if(f)return f.a}return null}
function viewFallosList(){
  const ids=fallosIds();
  let h=`<div class="top"><div><div class="sub"><a href="#tests" style="color:var(--acc);text-decoration:none">‹ Tests</a></div><h1>Mis fallos</h1><div class="sub">${ids.length} pregunta${ids.length===1?'':'s'} cuya última respuesta fue incorrecta</div></div>${ids.length?'<button class="btn sm" id="fl-go">Practicarlas</button>':''}</div>`;
  if(!ids.length)h+=`<div class="card" style="text-align:center"><b class="c-ok">No tienes fallos pendientes</b><p class="small muted" style="margin:6px 0 0">Cuando falles una pregunta aparecerá aquí hasta que la aciertes.</p></div>`;
  for(const l of L){const g=ids.filter(id=>QBY[id].l===l);if(!g.length)continue;
    h+=`<div class="sec">Sesión ${l} · ${g.length}</div><div class="stack">${g.map(id=>wrongCard(QBY[id],lastWrongText(id),'Fallada '+S.q[id].ko+(S.q[id].ko===1?' vez':' veces'))).join('')}</div>`}
  app.innerHTML=h;
  const b=$('#fl-go');if(b)b.onclick=()=>startFallos(null);
}
/* ---------- quiz ---------- */
function drawQuiz(){
  const q=QZ;
  if(q.done){return drawScore()}
  const it=q.qs[q.i],a=q.ans[q.i],done=a!=null,answered=q.ans.filter(x=>x!=null).length;
  let h=`<div class="qz"><div class="qhead"><button class="x" id="qx" aria-label="Salir del test">✕</button><div class="bar"><i style="width:${answered/q.qs.length*100}%"></i></div><span class="small muted num">${q.i+1}/${q.qs.length}</span></div>`;
  if(q.confirm)h+=`<div class="confirm">¿Salir del test? Las respuestas dadas cuentan, pero el test no se puntúa como terminado.<div class="row" style="margin-top:8px"><button class="btn sm" id="qx-end">Terminar y ver resultado</button><button class="btn sm" id="qx-yes" style="background:var(--ko)">Salir sin terminar</button><button class="btn sm ghost" id="qx-no">Seguir</button></div></div>`;
  h+=`<div class="card qcard"><div class="qmeta"><span>${esc(q.title)} · Sesión ${it.l}</span><span class="num">${q.okN} aciertos</span></div><h2>${esc(it.p)}</h2>`;
  it.o.forEach((o,k)=>{let c='';if(done){if(k===it.c)c='ok';else if(k===a)c='ko'}
    h+=`<button class="opt ${c}" ${done?'disabled':''} data-k="${k}"><span class="k">${'abcd'[k]}</span><span>${esc(o)}</span></button>`});
  if(done){const ok=a===it.c;h+=`<div class="exp ${ok?'ok':'ko'}"><b>${ok?'Correcto · +10 XP':'Incorrecto · la correcta es la '+'abcd'[it.c]+')'}</b>${esc(it.e)}<div class="small muted" style="margin-top:4px">Temario: página ${esc(it.pag)} del PDF · sesión ${it.l}</div></div>
    <button class="btn full" id="qn">${q.i+1<q.qs.length?'Siguiente':'Ver resultado'}</button>`}
  h+='</div></div>';
  app.innerHTML=h;
  app.querySelectorAll('.opt[data-k]').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  const qn=$('#qn');if(qn){qn.onclick=()=>{if(q.i+1<q.qs.length)nextQ();else{finishQuiz();drawQuiz();window.scrollTo(0,0)}};qn.focus({preventScroll:true})}
  $('#qx').onclick=()=>{if(!answered){QZ=null;history.back();return}q.confirm=true;drawQuiz()};
  const y=$('#qx-yes');if(y){y.onclick=()=>{QZ=null;go('tests')};$('#qx-no').onclick=()=>{q.confirm=false;drawQuiz()};$('#qx-end').onclick=()=>{q.qs=q.qs.slice(0,answered);finishQuiz();drawQuiz()}}
}
function drawScore(){
  const q=QZ,n=q.qs.length,ok=q.okN,pct=n?Math.round(ok/n*100):0;
  const col=pct>=80?'var(--ok)':pct>=50?'var(--acc)':'var(--ko)';
  const msg=pct>=90?'Excelente. Esto ya está casi dominado.':pct>=80?'Superado. Sigue así.':pct>=60?'Vas bien. Repasa los fallos y repite.':'Toca repasar: lee las claves y vuelve a intentarlo.';
  const wrong=q.qs.map((it,j)=>({it,a:q.ans[j],j:j+1})).filter(x=>x.a!==x.it.c);
  let h=`<div class="qz"><div class="card score"><div class="big num" style="color:${col}">${ok}/${n}</div><p style="margin:6px 0 0"><b>${pct}%</b> · ${esc(q.title)}</p><p class="muted small" style="margin:4px 0 0">${msg}</p>
   <div class="gain"><span class="pill num">+${q.xp} XP</span><span class="pill fl num">Racha ${streak()}</span>${q.tasksDone?`<span class="pill ok">${q.tasksDone} tarea${q.tasksDone>1?'s':''} del plan</span>`:''}</div>
   <div class="row" style="justify-content:center"><button class="btn" id="s-again">Repetir</button>${wrong.length?'<button class="btn soft" id="s-wrong">Solo las falladas</button>':''}<button class="btn ghost" id="s-home">Volver a Hoy</button></div>`;
  h+='</div>';
  h+=wrong.length?`<div class="sec">Has fallado ${wrong.length} de ${n}</div><div class="stack">${wrong.map(({it,a,j})=>wrongCard(QBY[it.id],a!=null?it.o[a]:null,'Pregunta '+j)).join('')}</div>`:`<div class="card" style="margin-top:12px;text-align:center"><b class="c-ok">No has fallado ninguna pregunta</b></div>`;
  h+='</div>';
  app.innerHTML=h;
  $('#s-again').onclick=()=>startQuiz({mode:q.mode,l:q.l,ls:q.ls,title:q.title,qs:q.qs.map(x=>QBY[x.id])});
  const sw=$('#s-wrong');if(sw)sw.onclick=()=>startQuiz({mode:'fallos',ls:q.ls,title:'Repaso de fallos',qs:wrong.map(x=>QBY[x.it.id])});
  $('#s-home').onclick=()=>{QZ=null;go('hoy')};
}
/* ---------- avisos y celebración ---------- */
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3200)}
function burst(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cs=getComputedStyle(document.documentElement);const cols=['--acc','--flame','--ok','--frost'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:90},()=>({x:c.width/2,y:c.height*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*11-3,r:Math.random()*5+3,c:cols[Math.floor(Math.random()*4)],a:Math.random()*6}));
  let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.a+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6);x.restore()});if(++f<90)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})();
}
/* ---------- arranque ---------- */
rebuild();indexTasks();processMissed();checkBadges();route();
setTimeout(initSync,0);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){processMissed();if(!QZ)route()}else flush()});
</script>
</body>
