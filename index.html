nte'.", "pag": 928}, {"p": "Una N3 de tercer intento tarde no entregada en oficina, en una localidad con USE/URP, se liquida como:", "o": ["\"Tercer intento de entrega\"", "\"Sobrante (no retirado en oficina)\"", "\"Rehusado\"", "\"Devuelto a cliente sin información\""], "c": 0, "e": "Con USE/URP se liquidan como 'Tercer intento de entrega'.", "pag": 928}, {"p": "¿Con qué periodicidad mínima debe realizarse el control de almacenes de la oficina?", "o": ["Cada mes", "Cada semana", "Cada 15 días", "Cada trimestre"], "c": 2, "e": "Como mínimo, cada 15 días es necesario realizar el control de almacenes.", "pag": 929}, {"p": "Tras rotular los envíos sobrantes, ¿cuándo se cursan al centro de tratamiento?", "o": ["En D+0 el mismo día", "En D+3 desde la liquidación", "En D+1 desde su liquidación como sobrantes", "Al finalizar la semana"], "c": 2, "e": "Se cursan al centro de tratamiento en D+1 desde su liquidación como sobrantes.", "pag": 931}, {"p": "¿Con qué periodicidad mínima debe realizarse el tratamiento de los envíos caducados?", "o": ["Al menos una vez al semestre", "Al menos una vez al año", "Al menos una vez al trimestre", "Al menos una vez al mes"], "c": 0, "e": "La periodicidad la decide la comisión, pero debe realizarse al menos una vez al semestre.", "pag": 932}, {"p": "Los envíos caducados con valor declarado pueden enajenarse transcurrido un plazo de:", "o": ["Tres años", "Seis meses", "Un año", "Cinco años"], "c": 0, "e": "Pueden enajenarse una vez transcurrido el plazo de tres años.", "pag": 933}, {"p": "Tras aportarse la denuncia por posible fraude, el director envía copia por fax a la Dirección de Relaciones Institucionales, cuyo RICO es:", "o": ["25549", "25594", "24559", "25945"], "c": 0, "e": "Se envía por fax a la Dirección de Relaciones Institucionales (RICO 25549).", "pag": 934}, {"p": "Si el cliente aporta la denuncia días después y el envío está 'Entregado' con el código de control de cobros ya confirmado en IRIS:", "o": ["Se devuelve el importe al destinatario", "Se paraliza el pago al remitente", "La oficina no puede realizar ninguna otra actuación", "Se cambia el envío a 'Alta en almacén'"], "c": 2, "e": "El director comunica que ya se ha realizado la orden de pago y que la oficina no puede realizar otra actuación.", "pag": 935}, {"p": "La circulación o entrega vigilada se aplica a remesas relacionadas con delitos de blanqueo de capitales tipificados en los artículos del Código Penal:", "o": ["368 a 373", "301 a 304", "248 a 251", "386 a 389"], "c": 1, "e": "Los artículos 301 a 304 del Código Penal tipifican el blanqueo de capitales.", "pag": 936}, {"p": "En las actuaciones de entrega controlada, ¿quién realiza la entrega de los envíos afectados?", "o": ["Los agentes de la autoridad", "El coordinador de seguridad", "Los empleados de la oficina", "El jefe del área de seguridad"], "c": 2, "e": "Las entregas de los envíos afectados y cualquier otra actuación postal la realizarán los empleados de la oficina.", "pag": 939}]}, {"letra": "K", "titulo": "Herramientas y aplicaciones corporativas. Funciones y utilidad", "paginas": "941-1034", "resumen": "## 1. SIGUA (Sistema de Gestión de Usuarios y Accesos)\n\n- Portal de administración de usuarios de las aplicaciones de Correos: garantiza que solo el personal autorizado entre en los sistemas corporativos (**IRIS, SGIE**, etc.). Se accede desde **Conecta**.\n- Desde SIGUA se gestionan: identidades de empleados y personal externo, asignación de usuarios a responsables de grupos de trabajo, altas y revocaciones de accesos, modificación de datos personales, solicitudes y su aprobación y la gestión de los **CODIRED**.\n\n### Usuario corporativo y contraseña\n- Todo trabajador (funcionario o laboral) recibe al ingresar un **Usuario Corporativo (UC)** personal e intransferible: **\"C\" + seis dígitos** (C000000).\n- **Contraseña inicial** (primer uso del UC):\n  1. Los **ocho dígitos del DNI** (o los ocho primeros del NIE).\n  2. Un **punto (.)**.\n  3. Las **iniciales del apellido en mayúsculas**.\n  4. Los **dos dígitos del día de nacimiento**.\n- El UC de un trabajador se puede averiguar con su **NIP** (número de identificación personal/profesional): por Conecta > Aplicaciones > \"Consulta de Usuario Corporativo\", o en casiqid.correos.es/consultaid y sigua.correos.es.\n- SIGUA recoge usuarios y contraseñas mediante autenticación **Kerberos**.\n\n### Perfiles de SIGUA\n| Perfil | Función |\n|---|---|\n| **Usuario/peticionario** | Solicita una funcionalidad para sí o para otro usuario a su cargo; la revisa su responsable o el propietario del acceso |\n| **RGT** (Responsable de Grupo de Trabajo) | Aprueba o deniega solicitudes de su personal; también puede pedir accesos |\n| **Responsable de CODIRED de distribución** | RGT que además tiene asignado el CODIRED de distribución |\n| **PAI** (Propietario del Activo de Información) | Dueño de un rol; aprueba o no la asignación del activo a un usuario |\n| **AL** (Administrador Local) | Realiza la operación manual si la petición lo requiere |\n| **Solicitantes de Externos** | Da de alta usuarios externos |\n| **AGI** (Administrador del sistema de gestión de identidades) | Acceso total; gestiona y consulta peticiones |\n\n- Para pedir un acceso: **Peticiones > \"Mis Accesos\"**, buscar y seleccionar la función.\n- Tras SIGUA, hay que autorizar al usuario en **SGIE** (unidad de trabajo y uso de PDA): solo el **administrador de la unidad** o cargos superiores, en **Configuración >> Usuarios**, introduciendo el UC y marcando **\"Activo\"** y **\"PDA\"**.\n\n## 2. IRIS (Información de Recursos Informáticos y Sistemas)\n\n### 2.1. Aspectos generales\n- Herramienta para registrar productos y operaciones en **oficinas** y **Unidades de Admisión Masiva**: admisión de envíos, cobro de recibos, venta, Buzón de Vacaciones…\n- El acceso depende del perfil: el **director de oficina** es además **administrador** (apertura y cierre de cajas, alta y baja de usuarios IRIS).\n\n**Elementos complementarios del puesto:**\n- **Balanza**: pesa y emite tiques; se sincroniza con IRIS mediante **Epelsa**; también lotería electrónica **ONCE**.\n- **Etiquetadora Zebra**: etiquetas de franqueo; sustituye a la validadora para validar impresos.\n- **Impresora multifunción** (resguardos, escaneo, distintivo DGT, fax y burofax), **tableta digitalizadora** (firma), **Pinpad** (\"redondeos solidarios\"), **lector óptico**, validador de billetes.\n- **Ordenador ATC**: **virtualizado** (sin disco duro, en la nube) o **no virtualizado** (disco propio).\n\n### 2.2. Acceso a IRIS\n- Usuario (**C + seis números**) y contraseña. Tras \"Aceptar\" aparece usuario, nombre y, entre paréntesis, el **CODIRED** (código de **siete números** que identifica a cada oficina). \"Confirmar\" entra; \"Cancelar\" vuelve.\n- Al inicio: conexión a Epelsa, pantalla de noticias corporativas y confirmación (con contraseña) de la recepción de la **caja monedero** fijada por el responsable.\n\n**Pantalla de inicio – cuatro zonas:**\n1. **Izquierda**: menú principal con **Menú de Admisión (amarillo)** y **Menú de Gestión (azul)**.\n   - Admisión: productos postales, servicios financieros (**Caja Mágica** = cobros por código de barras, envío de dinero, recibos, prepago), otros servicios (apartados, Reenvío, Buzón de Vacaciones) y de terceros (DGT, ONCE, ORVE).\n   - Gestión (sobre todo el responsable): mantenimiento, reimpresión de factura simplificada, facturas, devoluciones, vendedores ONCE, caja.\n2. **Superior**: usuario, oficina, fecha; accesos a calculadora, tarifas, desconexión, buscador de CP.\n3. **Derecha**: **Nuevo cliente** (deja pendiente la operación), **Total bolsa**, **Cliente tarjeta** (titular de la **Tarjeta Más Cerca**, al inicio de la operación), **Gestor de turnos**.\n4. **Central** (la más importante): Mensajes de Servicio, Información comercial y **Llamadas a sistemas externos** (Correos Express, ORVE, Estadística, Western Union, etc.).\n\n### 2.3. Digitalización del resguardo de admisión\n- El cliente no rellena a mano: datos de remitente y destinatario en la tableta; firma tras comprobarlos. Datos en la nube; el check **\"Digitalización\"** aparece marcado por defecto.\n- Se elige tipo de operación (cliente con o sin contrato) e idioma.\n- **\"Recogido por distribución\"** y **\"Depositado por cliente\"**: no es necesaria la firma del cliente.\n- No es posible digitalizar, por ejemplo, la **admisión de certificados por relación**.\n\n### 2.4. Bolsa de compra\n- Acumula las operaciones de un cliente; IRIS desglosa IVA e impuestos. Se cobra con **\"Cobrar bolsa\"**.\n- Partes: formas de cobro, emisión de factura (pide NIF, CIF, NIE o pasaporte), bolsa, identificar cliente (Tarjeta Más Cerca), **Promociones** (check obligatorio antes de cobrar para aplicar descuentos), Cobrar.\n- El tique es válido como **factura simplificada**; se imprime en la báscula o, si hay incidencia, en la multifunción; puede enviarse por email.\n- Se pueden dejar bolsas pendientes (\"Nuevo cliente\" + \"Guardar\"), pero **al cierre de caja no puede quedar ninguna**.\n\n### 2.5. Ejemplos de admisión\n**Carta certificada con aviso de recibo** (Admisión >> Envíos Postales >> Cartas):\n- Peso (manual o báscula), CP destino, ámbito (por defecto **Península y Baleares**), se deshabilita urbano/interurbano, mercancías peligrosas.\n- El **AR solo se combina con Carta Certificada y Carta Certificada Urgente**.\n- Check **no normalizado** si pesa más de **20 g** y no cumple normalización.\n- Firma en tableta (protección de datos y condiciones). **Ya no se validan los AR**: se imprime una etiqueta con el número de seguimiento para el anverso del AR; el AR va al **reverso** del envío y la etiqueta del código, en el **anverso**.\n\n**Admisión múltiple con carta certificada:**\n| Modalidad | Cuándo | Cómo |\n|---|---|---|\n| **Por rango** | Mismo CP, peso y características; códigos **correlativos** | Indicar \"N.º envíos\" y leer empezando por el **número más bajo** |\n| **Uno a uno** | Distinto CP, peso o características | Datos del primero, opción \"Fijar el dato\", leer y aceptar cada uno |\n- Se genera un formulario con la relación (anverso) y el condicionado (reverso) que firma el cliente; una copia para el cliente y otra para la oficina.\n\n**Paq Estándar** (Admisión >> Envíos Postales >> Paquetes): dimensiones obligatorias (alto x ancho x largo en cm, para el **peso volumétrico**), referencias, servicios adicionales (PEE, reembolso), modalidad de entrega, datos de destinatario/remitente, firma en tableta. Con contrato o prepagado no se cobra nada.\n\n**Apartados postales** – documentación:\n- **Anexo 1a**: suscripción para apartados particulares.\n- **Anexo 1b**: alta de más titulares.\n- **Anexo II**: apartados de franqueo en destino.\n- Impreso de suscripción del **apartado 24/7**.\n- Alta: Inicio >> Admisión >> Apartados >> Contratación. Tipos: **AP** (Apartado Postal), **ES** (Especial), **CI** (Correspondencia Internacional), **FD** (Franqueo en Destino), Buzón Comercio Electrónico y Apartado 24/7.\n- \"Fecha de alta\" y \"Oficina\" no modificables. Por defecto: duración **trimestral** y **un solo suscriptor**.\n- La **fianza** solo se habilita en **FD**, según los envíos previstos.\n- El autorizado solo puede recoger la correspondencia del titular. Es imprescindible el **móvil** del suscriptor (SMS al llegar un registrado).\n- El cliente puede elegir número; si no está libre se asigna automáticamente.\n- Renovación (anuales): domiciliación, contado o pago diferido. Baja: Apartados >> Mantenimiento >> Contratación de apartados.\n\n## 3. SGIE (Sistema de Gestión Integral de Envíos)\n\n- Se usa en unidades de reparto, oficinas y centros de tratamiento para controlar curso, distribución y entrega de **envíos registrados**. En uso desde **2008**. Permite el seguimiento (tracking) en tiempo real.\n- Sustituyó a: **SERADE** (envíos registrados en admisión, distribución y entrega), **SGD** (gestión de despachos), **SIOUX** (información de USE) y **SICOPE** (procesos electorales).\n- Incorpora avisos por SMS. Asigna a cada paquete un código de barras en etiqueta adhesiva.\n- Dos versiones: **unidades de distribución (URO y USE)** y **unidades de entrega en oficina (UEO)**. Acceso con UC (C + seis dígitos) y contraseña.\n\n### 3.1. SGIE en URO y USE\n- Perfiles: **administrador** (jefe de unidad o quien designe: mantenimiento, callejero, todos los procesos) y **usuario** (consultas, actas, entradas y salidas).\n- Con las PDA, SGIE queda para lo que la PDA no asume o cuando falla.\n- **Panel de Alarmas (bandera)**: **roja** = tareas pendientes que pueden impedir el cierre o que deben resolverse en **máximo 48 horas**; **gris** = \"No existen tareas pendientes en la unidad\". Accesos rápidos: Asignar a sección, Liquidación de sección, Cuadro de mando.\n- Alertas: buzón electrónico (pendientes de impresión / no asignados), **actas generadas** (últimos **30 días** sin confirmar), **gestión de estacionados** (Paq Today, Estándar, Premium y Ligero informados o que han agotado **120 horas**), reenvíos y buzones de vacaciones, campañas, avisos de llegada.\n\n**Menú Entrada:**\n- **Asignar a sección reparto**: desde **octubre de 2020** en las URO se hace con la **PDA**. Antes de salir: hoja de entrega, taloncillos (rurales no informatizadas) y hoja de firmas. \"Cerrar Sección\" = **F12**.\n- Cartería **sin papel**: hojas de reparto virtuales; solo se imprime la hoja de firmas. Cartería **con papel**: también hoja de reparto (se pone en verde al imprimir).\n- **Alta en unidad de reparto**: el procedimiento **más importante** (registra la llegada). Hoy se asigna directamente a sección con PDA, salvo rurales **Tipo II** (integrados con lista propia) y **Tipo III** (diferidos). Los SICER ya vienen prerregistrados.\n- **Recepción y control de despachos**: automatizada salvo **documentación electoral**. Los no leídos son **faltas**. Acta de despachos de las **48 horas** anteriores.\n- **Reimpresión de documentos de reparto** (hoja \"Completa\", taloncillos, avisos); destinatarios habituales: indicación **\"Relación\"** para firmar una sola vez.\n- **Impresión de avisos** (Pendientes, Fecha, Individual, Ordinarios) y **buzón electrónico**.\n- **Asignación a sección electoral**: solo con campaña activa; envíos asociados a mesa; producto **VE (voto emitido)** no modificable.\n- Reetiquetar envíos, control de pallets, alta de no registrados (ordinarios no embuzonables), alta de envíos de **Correos Express (CEX)**.\n\n**Menú Liquidación:**\n- Con papel, el responsable cambia la situación de los no entregados; al cerrar se asume la entrega del resto. Con PDA liquida el propio cartero, sin validación posterior.\n| Color | Significado |\n|---|---|\n| **Rojo** | Liquidada, sin salir a reparto o sin altas: cerrada, sin modificaciones |\n| **Verde** | Pendiente de liquidar |\n| **Azul** | Relaciones de habituales provisionales pendientes (hoteles, residencias…) |\n| **Naranja** | Grabada con envíos, sin hoja de reparto impresa (con papel) |\n- Asignación a receptor: con PEE, hora del intento; en giros, documento, tipo y ocupación (normativa **PBC**).\n- Liquidación de envíos de reparto (campos obligatorios en amarillo; \"Fijar\" causa). Corrección de errores: solo **administrador**; los importes no se modifican.\n- **Gestión de estacionados**: posicionar almacén, listados, inventario, salida y reetiquetado.\n\n**Menú Cierre:**\n- **Arqueo de caja**: metálico que debe haber tras liquidar envíos con importes.\n- **Gestión de despachos de salida** (devueltos o mal encaminados): apertura leyendo el código de destino; precinto **obligatorio** para **VD** (valor declarado), **TB** (tarjeta bancaria) y **DB** (documento bancario). El producto se identifica por los **dos primeros caracteres** del código. Etiqueta: origen, fecha, destino, código de despacho y número de precinto.\n- Gestión de conducciones; reimpresión de **mapón** (dos copias: centro y conductor).\n- **Cierre de reparto**: cierres **parciales** y uno **definitivo** diario; el definitivo exige liquidar todas las secciones con importes.\n- Controles de cobro sin confirmar (administrador).\n\n**Otros menús:**\n- **Incidencias**: modificación de envíos, actas generadas a la unidad, generación y mantenimiento de actas.\n- **Control/Consultas**: cuadro de alarmas (**diario**), **despachos pendientes de recepción** (pasados **tres días**, **levantar acta**), notificaciones, consultas.\n- **Configuración**: códigos de admisión SSRR (para **Hera**), destinatarios habituales, desbloqueo de secciones, **callejero**.\n- Otros: Valijas, Propaganda electoral (tarjetas INE), Publicorreo, Recogidas (**OR** órdenes, **SR** solicitudes), **CME** y Citypaq (huecos **TAP**).\n\n### 3.2. SGIE en oficinas (UEO)\n- Mismo acceso; perfiles administrador y usuario.\n- **Recepción de avisados**: global, a \"Almacén avisado por reparto\", salvo electorales (DE, DN, VE), Paq Premium, Estándar y Ligero (alta manual).\n- **Alta almacén**: modo automático por canal (Avisados, Lista o No domiciliaria). Al pulsar \"Fin alta\" se envía **SMS** al destinatario.\n- **Alta de no registrados**: **libros de más de 500 g** y **publicaciones periódicas de más de 800 g**; etiquetas de ubicación que empiezan por **ORD**.\n- **Liquidación**: causas de no entrega (sobrante, rehusado, devuelto a petición del remitente, mal direccionado/encaminado, petición de entrega a domicilio, reexpedición, retención judicial). Las devoluciones acumulan contador; la entrega (causa por defecto \"entregado en oficina\") no. **Entrega múltiple**: una sola firma. Si el cliente no quiere firma digital: **\"Firma papel\"** en el aviso. En pregrabados y notificaciones, el empleado firma con su usuario y contraseña.\n- **Cierre**: apertura diaria de caja SGIE (general y del usuario); sin caja abierta no se liquidan envíos con importes. Al cerrar se genera el **Código de Control de Cobros (CCC)**, que se confirma en IRIS (se generan giros de reembolsos). Controles que impiden cerrar: buzón electrónico sin tratar, segundos avisos sin imprimir, despachos sin asignar, sobrantes sin devolver, estacionados contestados sin gestionar. **Cuadre unidad**: importe a trasladar **a mano** al cierre de IRIS.\n- **Control/Consultas**: sobrantes de almacén, consulta de envíos, **CME** (si sigue sin llegar, se declara **faltante**).\n- **Incidencias**: actas con **dos empleados** (no impide estacionar); carga de envíos **CEX** en oficinas.\n- **Configuración** y **Control de envío de dinero**: puesta al pago de giros (libranzas, etiqueta del sobre) y confirmación de liquidaciones.\n\n## 4. Minerva\n- Trazabilidad en tiempo real y apoyo logístico; tecnología **Cloud AWS y Big Data**. Usuario de SIGUA; acceso en **minerva.correos.es**.\n| Perfil | Acceso | Excepto |\n|---|---|---|\n| CONS-BASICA | Consultas de agrupaciones y envíos | Parametrización y configuración |\n| CONS-AVANZADA | Consultas + Panel de Centros/turno de noche | Panel de distribución, parametrización, administración |\n| JEFE-UNID | Consultas + Panel de distribución | Panel de Centros/noche, parametrización, administración |\n| GESTOR-PROD | Completo | Parametrización y administración |\n| PARAM-PROD | Completo | Administración |\n| ADMIN | Completo | — |\n- **EGA** (Estaciones Generadoras de Agrupación): generar, cerrar, reabrir y migrar agrupaciones. Ventajas: control aduanero, trazabilidad ampliada, menos lecturas.\n\n## 5. PDA\n- Recoge entrega o intento de envíos urgentes y registrados con **Talos** (se sustituye por **CORE**). En oficinas, **Talina**; admisión en las UAM, **Telma**. Necesita **wifi**.\n- Modelos: **Motorola TC55**, sustituido por **Zebra TC56**. Equipo: terminal, funda y bandolera, cuna y puntero.\n\n### 5.1. En unidades de distribución\n- Acceso con la misma contraseña que IRIS y SGIE; en Talos: turno, sección y salida (**1 a 11**).\n- Cuidados: en funda, pantalla hacia el cuerpo, nunca bolígrafo; carga = **verde parpadeando**, cargada = **verde fijo**. Versión de Talos **igual o superior a 1.1x**; incidencias al **CAU**.\n- Asignar a sección: comprobar importes; relaciones (fondo verde); reordenar \"Uno a uno\" o \"Todos\"; nunca asignar la **última posición** en una relación.\n- Entrega: DOI, nombre y apellido; firma con puntero; lengua (castellano, euskera, catalán, gallego, valenciano). **EED**: si el DOI no coincide en **tres intentos**, no se entrega.\n- Ausente: en **USE** la llamada es automática; en **URO**, a criterio del repartidor. Si cuelgan **antes de 10 s**, reintentar **al menos tres veces**; después de 10 s, ausente.\n- Resumen: **verde** entregados, **rojo** no entregados, **blanco** sin tratar. Relaciones en Citypaq: código único de apertura.\n- Solo secciones con importes y campañas quedan pendientes en SGIE (**morado**). Ayudas: último intento en **rojo**, otros en **azul**. Al acabar el turno, **\"Desconectar\"** obligatorio.\n\n### 5.2. En oficinas (Talina)\n- Para picos (elecciones, revisiones catastrales). Admisión solo de: **notificaciones de franqueo pagado, cartas certificadas de franqueo pagado y voto por correo**.\n- Entrega: dado de alta en la unidad, sin escaneo de documentación y **sin importes**. Para imprimir justificante: **ASA Print**.\n\n## 6. Aplicaciones de Correos\n- **Tauro**: integrada en Talos; embarriado y rutas de reparto (\"Comunicar ruta a Talos\").\n- **Milla**: kilometraje y conductor hacia **Flota**; el último vehículo con estrella; el vehículo queda bloqueado hasta el registro final. Perfil del responsable: **Flota-RESPUNIDAD** (vía SIGUA).\n- **Hera**: admisión de **prerregistrados** desde la PDA en el reparto; requiere sesión en **ASA** y codired de admisión. Email opcional para **VE**; si no se aporta, el de la unidad. \"Localizador\" consulta en **MERCURIO**. \"Envío postal\": precios con al menos **peso y CP**. Sin prerregistro no se admite, salvo votos emitidos (manual).\n- **Formación Correos**: cursos reglados y opcionales vía ASA; \"Catálogo\" y \"Matricularme\".\n\n## 7. Aplicaciones móviles\n- **Correos App** (Correos ID): Paqbook (**últimos 20 días**), envíos, Burofax online (**PDF máx. 2 MB**), aduanas (**hasta 150 €**), Citypaq, cita previa (**código de nueve dígitos**), Tarjeta Más Cerca, pagos **solo con tarjeta bancaria**, notificaciones push.\n- **Correos Prepago**: saldo, recarga, envío de dinero, bloqueo; monedero con IBAN para empresas.\n- **App Citypaq**: desde **noviembre de 2022** avisa de su paso a la App de Correos.\n- **Sellos RA** (realidad aumentada), **Mi buzón** (nóminas, IRPF) y **Correos Play** (gamificación).\n\n## 8. SIE (Sistema de Información Estadística)\n- Indicadores diarios de las unidades operativas; integrado con SGIE (los registrados se incluyen automáticamente).\n- **Seis niveles** jerárquicos: Nacional, Zonal (**siete zonas**), Sector de distribución (desaparece el provincial), Unidad Operativa, Grupo y Puesto. Puestos rurales: codired de siete dígitos + cuatro dígitos.\n- Grupos: Distrito, Urbano (solo uno por unidad), Rurales X y Rurales Y (concentradora sin informática).\n- **Recuento**: bandeja **A** (normalizada) = **340** objetos; **B** (no normalizada) = **80**. ¼ A ≈ 85; ½ ≈ 170; ¾ ≈ 255. También módulos lineales o peso.\n- Acceso: Conecta >> Aplicaciones >> SIE. Horarios: **10 h** inicio del recuento; volcado hasta las **11 h** (mañana) o **18 h** (tarde).\n- Balance: **Pendiente anterior + Entrada = Salida + Pendiente de hoy**.\n- **Secciones críticas por pendiente**: más de **1000 ordinarios** o **50 registrados**.\n- Salida: domicilio, ruta directa, a oficina y malo (se resta de la entrada).\n- **SIE oficinas**: responsable el **director**; datos una vez al día, grabados el mismo día o en la **primera hora** del siguiente laborable. Admisión no registrada no se toma en islas menores de Baleares y Canarias, Asturias, Ceuta o Melilla. Acceso: **IRIS >> Llamadas a sistemas externos >> Estadística**.\n\n## Claves para el examen\n- **UC**: \"C\" + seis dígitos; contraseña inicial = 8 dígitos DNI + \".\" + iniciales del apellido + día de nacimiento.\n- **CODIRED**: siete dígitos; alta en SGIE en Configuración >> Usuarios (Activo y PDA).\n- IRIS: menú Admisión **amarillo**, Gestión **azul**; balanza vía **Epelsa**.\n- El AR solo con **Carta Certificada** y **Carta Certificada Urgente**; no normalizado si más de **20 g**.\n- Apartados: por defecto **trimestral** y un suscriptor; fianza solo en **FD**; Anexo II = franqueo en destino.\n- SGIE desde **2008**; sustituye SERADE, SGD, SIOUX y SICOPE; bandera roja = **48 h**; estacionados **120 h**; actas **30 días**.\n- Precinto obligatorio en **VD, TB y DB**; despachos no recibidos en **3 días**: acta.\n- UEO: no registrados = libros **> 500 g** y publicaciones **> 800 g** (etiqueta ORD); actas con **dos empleados**; **CCC** a IRIS.\n- PDA: **Talos** (reparto), **Talina** (oficinas), **Telma** (UAM); EED, **3 intentos**; llamada colgada antes de **10 s**: reintentar 3 veces.\n- Milla → **Flota** (perfil Flota-RESPUNIDAD); Hera requiere **ASA** y codired de admisión.\n- Correos App: Paqbook **20 días**, burofax **2 MB**, aduanas **150 €**, cita **9 dígitos**.\n- SIE: bandeja A **340**, B **80**; secciones críticas **1000 ordinarios / 50 registrados**; volcado **11 h / 18 h**.", "preguntas": [{"p": "¿Cuál es el formato del Usuario Corporativo (UC) de los trabajadores de Correos?", "o": ["La letra «C» seguida de siete dígitos", "Las letras «UC» seguidas de seis dígitos", "El NIP del empleado seguido de la letra «C»", "La letra «C» seguida de seis dígitos"], "c": 3, "e": "El UC es alfanumérico, empieza por «C» y va seguido de seis dígitos.", "pag": 945}, {"p": "La contraseña inicial del Usuario Corporativo se compone, en este orden, de:", "o": ["Ocho dígitos del DNI, un guion, iniciales del nombre en mayúsculas y mes de nacimiento", "Ocho dígitos del DNI, un punto, iniciales del apellido en mayúsculas y día de nacimiento con dos dígitos", "Iniciales del apellido, un punto, ocho dígitos del DNI y año de nacimiento", "Seis dígitos del DNI, un punto, iniciales del apellido y día de nacimiento"], "c": 1, "e": "Así se describe la composición de la contraseña inicial en SIGUA.", "pag": 945}, {"p": "En SIGUA, ¿qué perfil es el propietario de un rol y debe aprobar o no la asignación del activo de información a un usuario?", "o": ["El AGI", "El PAI", "El AL", "El RGT"], "c": 1, "e": "El PAI (Propietario del Activo de Información) aprueba o no la solicitud de asignación del activo.", "pag": 946}, {"p": "Tras la operativa en SIGUA, para que un usuario acceda a su unidad en SGIE y use la PDA, el administrador debe:", "o": ["Entrar en Configuración >> Usuarios, introducir el UC y marcar «Activo» y «PDA»", "Entrar en Peticiones >> Mis Accesos y marcar «Activo»", "Solicitarlo al CAU indicando el NIP del empleado", "Entrar en Cierre >> Usuarios y activar la caja del usuario"], "c": 0, "e": "El alta en SGIE se hace en Configuración >> Usuarios marcando «Activo» y, si la va a usar, «PDA».", "pag": 946}, {"p": "El CODIRED que identifica a cada oficina de Correos es un código de:", "o": ["Seis números", "Cinco números", "Siete números", "Ocho números"], "c": 2, "e": "El CODIRED es un código de siete números que identifica exclusivamente a cada oficina.", "pag": 949}, {"p": "En la pantalla de inicio de IRIS, ¿de qué color se visualiza el desplegable del Menú de Gestión?", "o": ["Amarillo", "Verde", "Rojo", "Azul"], "c": 3, "e": "El Menú de Admisión se ve en amarillo y el de Gestión en azul.", "pag": 950}, {"p": "Según el ejemplo de admisión en IRIS, el aviso de recibo solo puede combinarse con:", "o": ["Carta Certificada y Carta Certificada Urgente", "Carta Certificada y Paq Estándar", "Carta Ordinaria y Carta Certificada", "Carta Certificada Urgente y Burofax"], "c": 0, "e": "Al seleccionar AR, los envíos compatibles son solo Carta Certificada y Carta Certificada Urgente.", "pag": 957}, {"p": "En la admisión de una carta en IRIS, se marca el check «no normalizado» cuando la carta:", "o": ["Pesa más de 50 gramos aunque cumpla la normalización", "Va dirigida fuera de Península y Baleares", "Lleva aviso de recibo y valor declarado", "Pesa más de 20 gramos y no cumple los requisitos de normalización"], "c": 3, "e": "Se marca no normalizado si pesa más de 20 g y no cumple los requisitos de normalización.", "pag": 957}, {"p": "En la admisión múltiple por rango de cartas certificadas, ¿qué requisito NO es necesario?", "o": ["Que tengan el mismo código postal", "Que todos los envíos vayan dirigidos al mismo destinatario", "Que tengan el mismo peso y características", "Que sus códigos sean correlativos"], "c": 1, "e": "La admisión por rango exige mismo CP, peso, características y códigos correlativos, no el mismo destinatario.", "pag": 958}, {"p": "¿En cuál de estos casos NO es posible la digitalización del resguardo de admisión?", "o": ["Admisión de certificados por relación", "Envíos recogidos en domicilio por distribución", "Envíos depositados por el cliente que no permanece en la oficina", "Admisión de un Paq Estándar"], "c": 0, "e": "El texto indica que la digitalización no es posible, por ejemplo, en la admisión de certificados por relación.", "pag": 955}, {"p": "Al dar de alta un apartado en IRIS, ¿qué opciones aparecen marcadas por defecto?", "o": ["Duración anual y un solo suscriptor", "Duración semestral y dos suscriptores", "Duración trimestral y un solo suscriptor", "Duración mensual y un solo suscriptor"], "c": 2, "e": "Por defecto están marcadas la duración trimestral y un solo suscriptor.", "pag": 961}, {"p": "En la contratación de apartados, el importe de la fianza se habilita en el tipo:", "o": ["Franqueo en Destino (FD)", "Apartado Especial (ES)", "Correspondencia Internacional (CI)", "Apartado 24/7"], "c": 0, "e": "La fianza se habilita en el caso de FD, en función de los envíos que el cliente prevé recibir.", "pag": 961}, {"p": "¿En qué año comenzó a utilizarse SGIE?", "o": ["2005", "2008", "2010", "2012"], "c": 1, "e": "El texto indica que SGIE comenzó a utilizarse en 2008.", "pag": 964}, {"p": "SGIE reemplazó a varios sistemas anteriores. Señale el que NO figura entre ellos:", "o": ["SERADE", "SIOUX", "SIE", "SICOPE"], "c": 2, "e": "SGIE sustituyó a SERADE, SGD, SIOUX y SICOPE; el SIE sigue siendo el sistema estadístico.", "pag": 964}, {"p": "En el Panel de Alarmas de SGIE, la bandera roja puede indicar que existe una tarea pendiente que debe resolverse en un plazo máximo de:", "o": ["48 horas", "24 horas", "72 horas", "120 horas"], "c": 0, "e": "La bandera roja indica tareas que pueden impedir el cierre o que precisan resolución en máximo 48 horas.", "pag": 966}, {"p": "La alerta de «Gestión de estacionados» en SGIE se activa, entre otros casos, por envíos de paquetería que han agotado un plazo de:", "o": ["48 horas", "72 horas", "120 horas", "96 horas"], "c": 2, "e": "La alerta incluye envíos informados o que han agotado el plazo de 120 horas.", "pag": 967}, {"p": "En la asignación a sección electoral de SGIE, todos los envíos capturados se graban con el tipo de producto:", "o": ["DE", "DN", "EL (electoral)", "VE (voto emitido)"], "c": 3, "e": "Todos los envíos electorales capturados se graban como voto emitido (VE).", "pag": 974}, {"p": "En la pantalla de liquidación de SGIE, una sección en color naranja indica que:", "o": ["Tiene envíos grabados pero aún no se ha impreso la hoja de reparto", "Está pendiente de liquidar", "Tiene relaciones de habituales provisionales pendientes", "Ya está liquidada y no admite modificaciones"], "c": 0, "e": "Naranja: sección grabada con envíos sin hoja de reparto impresa en unidades con papel.", "pag": 976}, {"p": "En la gestión de despachos de salida, el precinto es obligatorio para los envíos:", "o": ["Valor declarado, reembolso y notificaciones", "Paq Premium, Paq Estándar y Paq Today", "Tarjeta bancaria, burofax y voto emitido", "Valor declarado, tarjeta bancaria y documento bancario"], "c": 3, "e": "El precinto es obligatorio para VD, TB y DB.", "pag": 980}, {"p": "Según el menú Control/Consultas de SGIE, si transcurridos ciertos días desde la confección de un despacho no se han recibido los envíos, hay que levantar acta. ¿Cuántos días?", "o": ["Dos", "Cinco", "Siete", "Tres"], "c": 3, "e": "Si trascurridos tres días desde la confección del despacho no se reciben los envíos, hay que levantar acta.", "pag": 984}, {"p": "En SGIE para oficinas, el alta de envíos no registrados se aplica actualmente a:", "o": ["Libros de más de 800 g y publicaciones periódicas de más de 500 g", "Libros de más de 500 g y publicaciones periódicas de más de 800 g", "Cartas no normalizadas de más de 500 g", "Publicorreo de más de 1 kg"], "c": 1, "e": "Son los envíos de libros de más de 500 g y publicaciones periódicas de más de 800 g.", "pag": 991}, {"p": "En SGIE para oficinas, el acta por recibir un envío en condiciones inadecuadas debe levantarse:", "o": ["Por el director de la oficina en solitario", "Con la presencia del destinatario", "Con la participación de dos empleados", "Por el cartero que entregó el despacho"], "c": 2, "e": "El acta debe levantarse con la participación de dos empleados.", "pag": 996}, {"p": "En Minerva, el perfil MINERVA-PARAM-PROD tiene:", "o": ["Acceso completo sin excepciones", "Solo consultas sobre agrupaciones y envíos", "Acceso completo excepto Administración", "Acceso completo excepto parametrización de negocio y administración"], "c": 2, "e": "MINERVA-PARAM-PROD tiene acceso completo excepto Administración.", "pag": 999}, {"p": "¿Qué aplicación se utiliza para la admisión con PDA en las Unidades de Admisión Masiva (UAM)?", "o": ["Telma", "Talina", "Talos", "Tauro"], "c": 0, "e": "Para la admisión con PDA en las UAM la aplicación utilizada es Telma.", "pag": 1003}, {"p": "En la entrega con PDA de un envío con EED, si el número de DOI introducido no es el esperado, el envío no puede entregarse si no se introduce el correcto en:", "o": ["Dos intentos", "Tres intentos", "Cinco intentos", "Un único intento"], "c": 1, "e": "Si no se introduce el DOI correcto en tres intentos, el envío no puede ser entregado.", "pag": 1009}, {"p": "Con la PDA en oficinas (Talina), ¿cuál de estos envíos prerregistrados NO puede admitirse?", "o": ["Notificaciones de franqueo pagado", "Paquetes Paq Estándar", "Cartas certificadas de franqueo pagado", "Voto por correo"], "c": 1, "e": "Solo se admiten notificaciones y cartas certificadas de franqueo pagado y voto por correo.", "pag": 1013}, {"p": "Los datos de kilometraje y conductor registrados en la aplicación Milla se exportan automáticamente al sistema:", "o": ["Flota", "Tauro", "SIGUA", "Minerva"], "c": 0, "e": "Milla exporta automáticamente los datos al sistema de gestión de la flota de vehículos de Correos (Flota).", "pag": 1016}, {"p": "En la Correos App, Paqbook permite al destinatario seguir los envíos en curso o entregados en los últimos:", "o": ["15 días", "20 días", "30 días", "10 días"], "c": 1, "e": "Paqbook muestra los envíos en proceso o finalizados en los últimos 20 días.", "pag": 1021}, {"p": "Para el recuento de correspondencia en SIE, la capacidad de una bandeja llena de tipo A es de:", "o": ["80 objetos", "255 objetos", "170 objetos", "340 objetos"], "c": 3, "e": "La bandeja tipo A tiene capacidad de 340 objetos y la tipo B de 80.", "pag": 1028}, {"p": "En SIE, una sección se considera crítica por pendiente cuando supera:", "o": ["500 envíos ordinarios o 50 envíos registrados", "1000 envíos ordinarios o 100 envíos registrados", "1000 envíos ordinarios o 50 envíos registrados", "2000 envíos ordinarios o 25 envíos registrados"], "c": 2, "e": "Críticas por pendiente: más de 1000 envíos ordinarios o 50 registrados.", "pag": 1030}, {"p": "¿Desde dónde se accede a SIGUA?", "o": ["Desde IRIS >> Gestión", "Desde el escritorio de SGIE", "Desde Conecta", "Desde la PDA mediante ASA"], "c": 2, "e": "El texto indica que el acceso a SIGUA se hace desde Conecta.", "pag": 945}, {"p": "En SIGUA, el AL o administrador local es el encargado de:", "o": ["Aprobar o denegar las solicitudes de su grupo de trabajo", "Dar de alta a nuevos usuarios de tipo externo", "Gestionar los CODIRED de distribución", "Llevar a cabo una operación manual si la petición lo requiere"], "c": 3, "e": "El AL realiza la operación manual cuando la petición lo requiere.", "pag": 946}, {"p": "¿Qué sistema de autenticación utiliza SIGUA para recoger usuarios y contraseñas?", "o": ["LDAP", "OAuth", "Radius", "Kerberos"], "c": 3, "e": "SIGUA está configurado con el sistema de autenticación Kerberos.", "pag": 946}, {"p": "Para solicitar un acceso desde SIGUA, el usuario debe acudir al apartado:", "o": ["Peticiones, en «Mis Accesos»", "Configuración, en «Usuarios»", "Aplicaciones, en «Consulta de Usuario Corporativo»", "Gestión, en «Mantenimiento»"], "c": 0, "e": "Se solicita desde «Peticiones» en «Mis Accesos», buscando la función a asignar.", "pag": 946}, {"p": "Al eliminarse la validadora en las oficinas, ¿qué elemento se usa para validar impresos de admisión como los de apartados o envíos por albarán?", "o": ["La impresora multifunción", "La tableta digitalizadora", "Las etiquetas de la etiquetadora Zebra", "El tique de la balanza"], "c": 2, "e": "Las etiquetas de Zebra se usan también para validar los impresos de admisión.", "pag": 948}, {"p": "Los puestos de atención al cliente virtualizados se caracterizan por:", "o": ["Tener disco duro propio conectado a la red", "Funcionar sin conexión a la red corporativa", "Usar solo aplicaciones de terceros", "No tener disco duro y trabajar en la nube de un servidor de Correos"], "c": 3, "e": "Los virtualizados no disponen de disco duro y trabajan en la nube del servidor de Correos.", "pag": 949}, {"p": "En el menú Admisión de IRIS, la «Caja Mágica» sirve para:", "o": ["Abrir y cerrar las cajas de los usuarios", "Realizar cobros mediante lectura de códigos de barras", "Gestionar el cambio de la caja monedero", "Vender productos de la tienda de la oficina"], "c": 1, "e": "Caja Mágica: cobros mediante lectura de códigos de barras.", "pag": 951}, {"p": "En IRIS, el botón «Cliente tarjeta» de la parte derecha de la pantalla permite:", "o": ["Cobrar con tarjeta bancaria en el pinpad", "Recargar una tarjeta Correos Prepago", "Identificar al titular de la Tarjeta Más Cerca", "Dar de alta una tarjeta de cliente nueva"], "c": 2, "e": "«Cliente tarjeta» permite identificar al titular de la Tarjeta Más Cerca.", "pag": 953}, {"p": "¿Qué opción de IRIS permite atender a otro cliente dejando pendiente la operación en curso?", "o": ["Nuevo cliente", "Últimos servicios", "Servicios relacionados", "Gestor de turnos"], "c": 0, "e": "«Nuevo cliente» permite atender a otro cliente dejando pendiente la operación.", "pag": 953}, {"p": "En la parte central de IRIS, el apartado «Mensajes de Servicio» muestra:", "o": ["Noticias corporativas del día", "Servicios pendientes como telegramas sin transmitir o apartados por renovar", "Accesos directos con información comercial", "El listado de sistemas externos disponibles"], "c": 1, "e": "Indica servicios pendientes: telegramas sin transmitir, certificaciones o apartados por renovar.", "pag": 954}, {"p": "En la pantalla de cobro de la bolsa, el check «Promociones»:", "o": ["Se marca automáticamente al identificar al cliente", "Solo se usa al emitir factura", "Debe marcarse antes del cobro para aplicar descuentos activados", "Se marca después de cobrar para acumular puntos"], "c": 2, "e": "Antes de cobrar es necesario marcarlo para aplicar la promoción o descuento.", "pag": 956}, {"p": "Respecto a las bolsas de compra pendientes de cobro en IRIS, es correcto que:", "o": ["Al cierre de caja no pueden quedar bolsas pendientes", "Pueden quedar pendientes hasta el día siguiente", "Solo el director puede dejarlas pendientes", "Se cobran automáticamente al cerrar la caja"], "c": 0, "e": "Se pueden guardar bolsas pendientes, pero al cierre de caja no pueden quedar.", "pag": 956}, {"p": "El tique de compra emitido por IRIS, válido como factura simplificada, se genera en papel mediante:", "o": ["La báscula o, en caso de incidencia, la impresora multifunción", "La etiquetadora Zebra", "La tableta digitalizadora", "El datáfono o pinpad"], "c": 0, "e": "Se genera mediante la báscula o, si hay incidencia, por la impresora multifunción.", "pag": 956}, {"p": "En la admisión de un Paq Estándar, las dimensiones se introducen obligatoriamente para calcular:", "o": ["El código postal de destino", "El importe del reembolso", "El ámbito del envío", "El peso volumétrico"], "c": 3, "e": "Alto x ancho x largo en centímetros, para el cálculo del peso volumétrico.", "pag": 959}, {"p": "En la contratación de un apartado postal, el Anexo 1b corresponde a:", "o": ["La suscripción para apartados particulares", "La solicitud de alta de más titulares", "Los apartados de franqueo en destino", "La suscripción del apartado postal 24/7"], "c": 1, "e": "Anexo 1b: solicitud de alta de más titulares.", "pag": 960}, {"p": "¿Qué dato es imprescindible del suscriptor de un apartado para avisarle cuando llegue un envío registrado?", "o": ["El número de teléfono móvil", "El correo electrónico", "El domicilio fiscal", "El número de cuenta bancaria"], "c": 0, "e": "Es imprescindible el móvil del suscriptor para enviarle un SMS.", "pag": 962}, {"p": "En SGIE para unidades de distribución, el perfil de administrador corresponde a:", "o": ["El jefe de la unidad o la persona que este designe", "Cualquier cartero con PDA asignada", "El responsable provincial de distribución", "El técnico del CAU"], "c": 0, "e": "El administrador es el jefe de la unidad o la persona que este designe.", "pag": 965}, {"p": "En el Panel de Alarmas de SGIE, si la bandera aparece en color gris significa que:", "o": ["No existen tareas pendientes en la unidad", "Hay tareas que deben resolverse en 48 horas", "El sistema está desconectado", "Hay actas pendientes de confirmar"], "c": 0, "e": "Gris: la unidad no tiene alarmas («No existen tareas pendientes en la unidad»).", "pag": 967}, {"p": "La alerta «Actas generadas» de SGIE tiene en cuenta las actas no confirmadas generadas en la unidad desde hace:", "o": ["15 días", "7 días", "60 días", "30 días"], "c": 3, "e": "Se tienen en cuenta las actas generadas desde hace 30 días hasta la fecha actual.", "pag": 967}, {"p": "¿Hasta qué fecha se realizaba en las URO la asignación a sección directamente desde SGIE, antes de hacerse con la PDA?", "o": ["Octubre de 2020", "Enero de 2019", "Marzo de 2021", "Octubre de 2018"], "c": 0, "e": "Hasta octubre de 2020 se hacía desde SGIE; ahora se asigna desde la PDA.", "pag": 969}, {"p": "En SGIE, una vez grabados todos los envíos asignados a una sección, se pulsa «Cerrar Sección» con la tecla:", "o": ["F10", "F5", "F12", "F8"], "c": 2, "e": "Se pulsa «Cerrar Sección» (F12).", "pag": 970}, {"p": "Dentro del menú Entrada de SGIE, ¿cuál se considera el procedimiento más importante del proceso?", "o": ["Impresión de avisos", "Control de pallets", "Alta en unidad de reparto", "Reetiquetar envíos"], "c": 2, "e": "El alta en unidad de reparto es el más importante: registra la llegada del producto.", "pag": 970}, {"p": "¿Qué envíos se siguen dando de alta en SGIE >> Entrada >> Alta en Unidad de Reparto para que luego el responsable los asigne a la sección rural?", "o": ["Los de secciones urbanas con PDA", "Los de rurales Tipo II y Tipo III", "Los de USE con lista propia", "Los SICER prerregistrados"], "c": 1, "e": "Excepción: rurales integrados con lista propia (Tipo II) y rurales diferidos (Tipo III).", "pag": 971}, {"p": "La recepción y control de despachos se ha automatizado en la mayoría de productos, salvo en:", "o": ["Los envíos de paquetería", "La documentación electoral", "Las notificaciones", "Los envíos SICER"], "c": 1, "e": "Solo la documentación electoral mantiene el proceso de recepción de despachos.", "pag": 971}, {"p": "El acta de despachos con destino en la unidad no recepcionados muestra la información de los despachos generados en las:", "o": ["48 horas anteriores", "24 horas anteriores", "72 horas anteriores", "120 horas anteriores"], "c": 0, "e": "En esta acta se muestran los despachos generados en las 48 horas anteriores.", "pag": 972}, {"p": "En SGIE, la búsqueda de avisos a imprimir puede hacerse por cuatro criterios. Señale el que NO es uno de ellos:", "o": ["Pendientes", "Por sección", "Individual", "Ordinarios"], "c": 1, "e": "Los criterios son Pendientes, Fecha, Individual y Ordinarios.", "pag": 973}, {"p": "En la pantalla de liquidación de SGIE, una sección en color verde indica que:", "o": ["Ya está liquidada y cerrada", "Está pendiente de liquidar", "No se ha impreso la hoja de reparto", "Tiene habituales provisionales pendientes"], "c": 1, "e": "Verde: la sección se encuentra pendiente de liquidar.", "pag": 975}, {"p": "Si la unidad dispone de PDA, la liquidación de la sección la realiza:", "o": ["El responsable leyendo los no entregados en SGIE", "El administrador mediante Corrección de errores", "El cartero en papel y el responsable la valida", "El propio cartero desde la PDA, sin validación posterior en SGIE"], "c": 3, "e": "Con PDA el cartero liquida directamente, sin validación posterior del responsable.", "pag": 975}, {"p": "En la Corrección de errores de la liquidación de SGIE, es correcto que:", "o": ["Cualquier usuario puede modificar los importes", "Solo los administradores pueden corregir y los importes no se modifican", "Se corrigen las secciones completas de una vez", "Solo puede hacerse antes de imprimir la hoja de reparto"], "c": 1, "e": "Los administradores corrigen liquidando de nuevo; los importes aparecen pero no pueden modificarse.", "pag": 977}, {"p": "En la gestión de despachos de salida, el sistema identifica el producto de los envíos mediante:", "o": ["La lectura del código postal de destino", "El peso registrado en la admisión", "El número de precinto del despacho", "La lectura de los dos primeros caracteres del código"], "c": 3, "e": "SGIE identifica el producto con los dos primeros caracteres del código del envío.", "pag": 981}, {"p": "¿Cuántas copias se reimprimen del mapón de conducción?", "o": ["Dos: una para el centro y otra para el conductor", "Una, para el conductor", "Tres: centro, conductor y destino", "Una por cada envío del despacho"], "c": 0, "e": "Se reimprimen dos copias, una para el centro y otra para el conductor.", "pag": 981}, {"p": "El cierre definitivo de reparto en SGIE solo es posible cuando:", "o": ["Se ha realizado al menos un cierre parcial", "Se han impreso todas las hojas de reparto", "Ha finalizado el turno de tarde", "Se han liquidado todas las secciones con importes que salieron a reparto"], "c": 3, "e": "Solo es posible cuando se hayan liquidado todas las secciones con importes.", "pag": 982}, {"p": "En el menú Configuración de SGIE, «Imprimir códigos de admisión SSRR» genera códigos para los envíos admitidos mediante:", "o": ["Hera", "Talina", "Telma", "Tauro"], "c": 0, "e": "Imprime los códigos de admisión que se adhieren a los envíos admitidos mediante Hera.", "pag": 985}, {"p": "¿En qué menú de SGIE para distribución se encuentra la «Consulta de huecos TAP»?", "o": ["Menú CME", "Menú Recogidas", "Menú Citypaq", "Menú Valijas"], "c": 2, "e": "El menú Citypaq incluye la consulta de huecos TAP.", "pag": 989}, {"p": "En SGIE de oficinas, los envíos recibidos mediante «Recepción de avisados» quedan en la situación:", "o": ["Almacén de estacionados", "Pendiente de lista", "No domiciliaria", "Almacén avisado por reparto"], "c": 3, "e": "Se asignan automáticamente a la oficina como «Almacén avisado por reparto».", "pag": 990}, {"p": "En el «Alta almacén» de SGIE en modo automático, el envío se introduce en su canal. ¿Cuál de estos NO es uno de los canales citados?", "o": ["Avisados", "Lista", "Estacionados", "No domiciliaria"], "c": 2, "e": "Los canales citados son Avisados, Lista o No domiciliaria.", "pag": 990}, {"p": "Tras el alta de envíos no registrados en la oficina, las
